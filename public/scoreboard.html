<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoreboard · GridIron 24</title>
  <meta name="description" content="Live GridIron 24 scoreboard — Detail and Overtime conferences." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Share+Tech+Mono&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=18" />
  <style>
    :root {
      --led: #ffb84a;
      --led-dim: #7a5420;
      --led-green: #3dff8a;
      --board-bezel: #1a1a1a;
      --board-face: #070807;
    }

    body[data-page="scoreboard"] {
      background:
        radial-gradient(ellipse 80% 40% at 50% -5%, rgba(255, 184, 74, 0.07), transparent 55%),
        linear-gradient(180deg, #0a0a0a 0%, #050505 40%, #050505 100%);
    }

    .sb-hero {
      text-align: center;
      padding: 1.35rem 0 1.1rem;
      border-bottom: 1px solid rgba(255, 184, 74, 0.18);
    }
    .sb-hero .eyebrow {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--led);
    }
    .sb-hero h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 24px rgba(255, 184, 74, 0.25);
      animation: sb-title-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .sb-hero .sub {
      margin: 0.45rem 0 0;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9a9a9a;
    }

    .sb-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.15rem 0 1.25rem;
      padding: 0.85rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent),
        #0c0c0c;
    }
    .sb-live {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--led-green);
    }
    .sb-live .dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: var(--led-green);
      box-shadow: 0 0 10px var(--led-green);
      animation: sb-pulse 1.2s ease-in-out infinite;
    }
    .sb-live.is-idle {
      color: #888;
    }
    .sb-live.is-idle .dot {
      background: #666;
      box-shadow: none;
      animation: none;
    }
    .sb-week label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
    }
    .sb-week select {
      appearance: none;
      min-width: 9rem;
      color: var(--led);
      border: 1px solid rgba(255, 184, 74, 0.35);
      padding: 0.55rem 2.2rem 0.55rem 0.85rem;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background:
        linear-gradient(45deg, transparent 50%, var(--led) 50%),
        linear-gradient(135deg, var(--led) 50%, transparent 50%),
        #101010;
      background-position:
        calc(100% - 1.05rem) calc(50% - 0.15rem),
        calc(100% - 0.75rem) calc(50% - 0.15rem),
        0 0;
      background-size: 5px 5px, 5px 5px, 100% 100%;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .sb-week select:focus {
      outline: none;
      border-color: var(--led);
    }

    .sb-boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.15rem;
      margin-bottom: 2rem;
    }

    .board {
      border: 3px solid #2a2a2a;
      background: var(--board-bezel);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.06),
        0 18px 40px rgba(0,0,0,0.55);
      overflow: hidden;
      animation: sb-board-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .board.detail { animation-delay: 0.05s; }
    .board.overtime { animation-delay: 0.12s; }

    .board-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.95rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, #222, #141414);
    }
    .board-top .conf {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .board-top img {
      width: 2.5rem;
      height: auto;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }
    .board-top h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .board.detail .board-top h2 { color: var(--detail); }
    .board.overtime .board-top h2 { color: var(--overtime); }
    .board-top .week-chip {
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--led);
      white-space: nowrap;
    }

    .board-face {
      padding: 0.55rem;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.015) 0 1px,
          transparent 1px 3px
        ),
        var(--board-face);
      min-height: 12rem;
    }

    .game {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.55rem;
      align-items: center;
      padding: 0.7rem 0.65rem;
      border: 1px solid rgba(255, 184, 74, 0.12);
      background: rgba(0, 0, 0, 0.45);
      margin-bottom: 0.45rem;
    }
    .game:last-child { margin-bottom: 0; }
    .game.is-final {
      border-color: rgba(255, 184, 74, 0.28);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }
    .team.home { flex-direction: row-reverse; text-align: right; }
    .team img {
      width: 2.75rem;
      height: 2.75rem;
      object-fit: contain;
      flex: 0 0 auto;
      background: rgba(255,255,255,0.03);
      border-radius: 0.35rem;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.45));
    }
    .team .nm {
      min-width: 0;
      font-family: var(--display);
      font-size: clamp(0.85rem, 1.5vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.15;
      color: #e8e8e8;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .team.is-winner .nm {
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 184, 74, 0.35);
    }
    .team.is-loser {
      opacity: 0.55;
    }

    .digits {
      text-align: center;
      min-width: 6.5rem;
      padding: 0.15rem 0.35rem;
    }
    .digits .pair {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.35rem;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: clamp(1.55rem, 3.2vw, 2.15rem);
      line-height: 1;
      color: var(--led);
      text-shadow: 0 0 14px rgba(255, 184, 74, 0.45);
      font-variant-numeric: tabular-nums;
    }
    .digits .pair .sep {
      color: var(--led-dim);
      font-size: 0.85em;
    }
    .digits .status {
      margin-top: 0.28rem;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--led-dim);
    }
    .digits .status.live { color: var(--led-green); }
    .digits .status.final { color: var(--led); }
    .digits .proj {
      margin-top: 0.2rem;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      color: #6a6a6a;
    }

    .board-empty {
      padding: 2rem 1rem;
      text-align: center;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      color: var(--led-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sb-foot {
      margin: 0 0 1.5rem;
      text-align: center;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #666;
    }

    @keyframes sb-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    @keyframes sb-title-in {
      from { opacity: 0; letter-spacing: 0.22em; transform: translateY(8px); }
      to { opacity: 1; letter-spacing: 0.08em; transform: none; }
    }
    @keyframes sb-board-in {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 900px) {
      .sb-boards { grid-template-columns: 1fr; }
      .board.overtime { animation-delay: 0.05s; }
    }
    @media (max-width: 560px) {
      .game {
        grid-template-columns: 1fr;
        gap: 0.45rem;
        text-align: center;
      }
      .team, .team.home {
        flex-direction: column;
        text-align: center;
      }
      .digits { order: -1; }
      .team img { width: 3.25rem; height: 3.25rem; }
    }
  </style>
</head>
<body data-page="scoreboard">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Connecting…</div>
    </div>
  </header>

  <section class="sb-hero shell">
    <p class="eyebrow">GridIron 24</p>
    <h1>Scoreboard</h1>
    <p class="sub">Live ESPN scoring · Auto-refresh</p>
  </section>

  <main class="shell">
    <div class="sb-controls">
      <div class="sb-live is-idle" id="live-badge" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="live-label">Stand by</span>
      </div>
      <div class="sb-week">
        <label for="week">Matchup period</label>
        <select id="week"></select>
      </div>
    </div>

    <div class="sb-boards" id="boards">
      <div class="board-empty">Powering up scoreboard…</div>
    </div>
    <p class="sb-foot" id="refresh-note">Updates every 30 seconds from ESPN</p>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js?v=8"></script>
  <script>
    const REFRESH_MS = 30_000;
    const PLACEHOLDER = '/assets/team-logo-placeholder.svg';
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    let pollTimer = null;
    let currentWeek = null;
    let currentMatchupPeriod = null;

    function fmtScore(n) {
      const v = Number(n || 0);
      return v.toFixed(1);
    }

    function teamBlock(team, side, winner) {
      const won = winner === side;
      const lost = winner === 'HOME' || winner === 'AWAY' ? !won : false;
      const cls = [
        'team',
        side === 'HOME' ? 'home' : 'away',
        won ? 'is-winner' : '',
        lost ? 'is-loser' : ''
      ].filter(Boolean).join(' ');
      const src = team?.logo || PLACEHOLDER;
      return `
        <div class="${cls}">
          <img src="${esc(src)}" alt="" width="44" height="44" loading="lazy" referrerpolicy="no-referrer" />
          <div class="nm" title="${esc(team?.name || '')}">${esc(team?.name || 'TBD')}</div>
        </div>`;
    }

    function gameRow(m) {
      const winner = String(m.winner || 'UNDECIDED').toUpperCase();
      const decided = winner === 'HOME' || winner === 'AWAY';
      const inProgress = !decided && (Number(m.home?.score || 0) > 0 || Number(m.away?.score || 0) > 0);
      const status = decided ? 'Final' : inProgress ? 'Live' : 'Upcoming';
      const statusCls = decided ? 'final' : inProgress ? 'live' : '';
      return `
        <div class="game ${decided ? 'is-final' : ''}">
          ${teamBlock(m.away, 'AWAY', winner)}
          <div class="digits">
            <div class="pair">
              <span>${fmtScore(m.away?.score)}</span>
              <span class="sep">-</span>
              <span>${fmtScore(m.home?.score)}</span>
            </div>
            <div class="status ${statusCls}">${status}</div>
            <div class="proj">PROJ ${fmtScore(m.away?.projected)}-${fmtScore(m.home?.projected)}</div>
          </div>
          ${teamBlock(m.home, 'HOME', winner)}
        </div>`;
    }

    function board(conf, idx) {
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      if (!conf.ok) {
        return `
          <section class="board ${tone}">
            <div class="board-top">
              <div class="conf"><h2>${esc(conf.name || 'Conference')}</h2></div>
            </div>
            <div class="board-face"><div class="board-empty">${esc(conf.error || 'Unavailable')}</div></div>
          </section>`;
      }
      const logo = conf.logo ? `<img src="${esc(conf.logo)}" alt="">` : '';
      const games = (conf.matchups || []).map(gameRow).join('');
      return `
        <section class="board ${tone}">
          <div class="board-top">
            <div class="conf">
              ${logo}
              <h2>${esc(conf.shortName || conf.name)}</h2>
            </div>
            <div class="week-chip">WK ${esc(conf.week)}</div>
          </div>
          <div class="board-face">
            ${games || '<div class="board-empty">No matchups this week</div>'}
          </div>
        </section>`;
    }

    function fillWeeks(selected) {
      const sel = document.getElementById('week');
      if (sel.options.length) return;
      sel.innerHTML = Array.from({ length: 17 }, (_, i) => {
        const w = i + 1;
        return `<option value="${w}">Week ${w}</option>`;
      }).join('');
      sel.value = String(selected);
    }

    function setLiveState(viewingCurrent) {
      const badge = document.getElementById('live-badge');
      const label = document.getElementById('live-label');
      if (viewingCurrent) {
        badge.classList.remove('is-idle');
        label.textContent = 'Live board';
      } else {
        badge.classList.add('is-idle');
        label.textContent = 'Archive week';
      }
    }

    async function load(week, { quiet = false } = {}) {
      if (!quiet) {
        document.getElementById('boards').innerHTML = '<div class="board-empty">Powering up scoreboard…</div>';
      }
      try {
        const qs = week ? `?week=${encodeURIComponent(week)}` : '';
        const res = await fetch(`/api/schedule${qs}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        currentWeek = Number(data.week);
        currentMatchupPeriod = Number(
          data.conferences?.find((c) => c.ok)?.currentMatchupPeriod || data.week
        );
        fillWeeks(currentWeek);
        document.getElementById('week').value = String(currentWeek);
        document.getElementById('boards').innerHTML = (data.conferences || []).map(board).join('');
        setLiveState(currentWeek === currentMatchupPeriod);
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`);
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="board-empty">${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }

    function startPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        const week = document.getElementById('week').value;
        load(week, { quiet: true });
      }, REFRESH_MS);
    }

    document.getElementById('week').addEventListener('change', (e) => {
      load(e.target.value);
      startPolling();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        load(document.getElementById('week').value || currentWeek, { quiet: true });
      }
    });

    load().then(startPolling);
  </script>
</body>
</html>
