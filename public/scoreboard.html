<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoreboard · GridIron 24</title>
  <meta name="description" content="Live GridIron 24 scoreboard — Detail and Overtime conferences." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=57" />
  <style>
    :root,
    html[data-theme="night"] {
      --led: #ffb84a;
      --led-dim: #7a5420;
      --led-green: #3dff8a;
      --board-bezel: #1a1a1a;
      --board-face: #070807;
      --sb-page-mid: #0a0a0a;
      --sb-page-bg: #050505;
      --sb-wash: rgba(255, 184, 74, 0.07);
      --sb-control-bg: #0c0c0c;
      --sb-control-border: rgba(255, 255, 255, 0.1);
      --sb-title: #d8d8d8;
      --sb-title-glow:
        0 0 8px rgba(200, 200, 200, 0.55),
        0 0 18px rgba(180, 180, 180, 0.4),
        0 0 36px rgba(160, 160, 160, 0.28);
      --sb-muted: #9a9a9a;
      --sb-idle: #888;
      --sb-select-face: #101010;
      --sb-board-border: #2a2a2a;
      --sb-board-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 18px 40px rgba(0,0,0,0.55);
      --sb-board-top: linear-gradient(180deg, #222, #141414);
      --sb-game-bg: rgba(0, 0, 0, 0.45);
      --sb-game-border: rgba(255, 184, 74, 0.12);
      --sb-team: #e8e8e8;
      --sb-score: #ffb84a;
      --sb-leaders-face-top: #101820;
      --sb-leaders-face-bottom: #0a1018;
      --sb-leaders-fade-l: #0a1018;
      --sb-leaders-fade-r: #060606;
      --sb-leaders-item: rgba(255, 255, 255, 0.9);
      --sb-leaders-who: #fff;
    }

    html[data-theme="day"] {
      --led: #c47a12;
      --led-dim: #9a6410;
      --led-green: #15803d;
      --board-bezel: #d5deea;
      --board-face: #eef3f9;
      --sb-page-mid: var(--body-mid);
      --sb-page-bg: var(--bg);
      --sb-wash: rgba(196, 122, 18, 0.08);
      --sb-control-bg: var(--panel);
      --sb-control-border: var(--line);
      --sb-title: var(--text);
      --sb-title-glow: none;
      --sb-muted: var(--muted);
      --sb-idle: var(--muted-2);
      --sb-select-face: var(--panel-2);
      --sb-board-border: rgba(20, 24, 31, 0.16);
      --sb-board-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), 0 14px 28px rgba(20, 24, 31, 0.1);
      --sb-board-top: linear-gradient(180deg, #f7f9fc, #e7eef7);
      --sb-game-bg: rgba(255, 255, 255, 0.72);
      --sb-game-border: rgba(196, 122, 18, 0.28);
      --sb-team: var(--text);
      --sb-score: #a8640a;
      --sb-leaders-face-top: var(--ticker-face-top);
      --sb-leaders-face-bottom: var(--ticker-face-bottom);
      --sb-leaders-fade-l: var(--ticker-fade-left);
      --sb-leaders-fade-r: var(--ticker-fade-right);
      --sb-leaders-item: var(--ticker-item);
      --sb-leaders-who: var(--text);
    }

    body[data-page="scoreboard"] {
      background:
        radial-gradient(ellipse 80% 40% at 50% -5%, var(--sb-wash), transparent 55%),
        linear-gradient(180deg, var(--sb-page-mid) 0%, var(--sb-page-bg) 40%, var(--sb-page-bg) 100%);
    }

    .sb-hero {
      text-align: center;
      margin-top: 0.45rem;
      padding: 0.75rem 0 0.7rem;
      border-bottom: 1px solid rgba(47, 109, 255, 0.22);
      background:
        radial-gradient(ellipse 80% 120% at 50% 0%, rgba(47, 109, 255, 0.18), transparent 55%),
        linear-gradient(180deg, rgba(47, 109, 255, 0.12), rgba(47, 109, 255, 0.03) 70%, transparent);
    }
    .sb-hero .brand-logo {
      display: block;
      width: min(14rem, 52vw);
      height: auto;
      margin: 0 auto 0.55rem;
      filter: var(--logo-shadow-lg);
      animation: sb-title-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .sb-hero h1 {
      margin: 0;
      font-family: var(--page-title);
      font-size: clamp(1.85rem, 5vw, 2.85rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sb-title);
      text-shadow: var(--sb-title-glow);
      animation: sb-title-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.06s both;
    }
    .sb-hero .sub {
      margin: 0.4rem 0 0;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sb-muted);
    }

    .sb-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.15rem 0 0.65rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--sb-control-border);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent),
        var(--sb-control-bg);
    }
    .sb-live {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--led-green);
      position: relative;
    }
    .sb-live .dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: var(--led-green);
      box-shadow: 0 0 10px var(--led-green);
      animation: sb-pulse 1.2s ease-in-out infinite;
    }
    .sb-live.is-idle {
      color: var(--sb-idle);
    }
    .sb-live.is-idle .dot {
      background: var(--sb-idle);
      box-shadow: none;
      animation: none;
    }
    .sb-live.is-refreshing {
      color: var(--led);
    }
    .sb-live.is-refreshing .dot {
      background: transparent;
      box-shadow: none;
      border: 2px solid rgba(255, 184, 74, 0.25);
      border-top-color: var(--led);
      animation: sb-spin 0.7s linear infinite;
    }
    .sb-refresh-bar {
      position: relative;
      height: 3px;
      margin: -0.35rem 0 1rem;
      overflow: hidden;
      background: rgba(255, 184, 74, 0.08);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .sb-refresh-bar.is-on {
      opacity: 1;
    }
    .sb-refresh-bar::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 38%;
      background: linear-gradient(90deg, transparent, var(--led), transparent);
      box-shadow: 0 0 12px rgba(255, 184, 74, 0.55);
      animation: sb-sweep 0.9s ease-in-out infinite;
    }

    .leaders-ticker {
      position: relative;
      display: flex;
      align-items: stretch;
      margin: 0.85rem 0 0.35rem;
      border: 1px solid rgba(47, 109, 255, 0.28);
      border-radius: 999px;
      background:
        linear-gradient(90deg, rgba(47, 109, 255, 0.18), rgba(47, 109, 255, 0.06) 42%, rgba(47, 109, 255, 0.1)),
        linear-gradient(180deg, var(--sb-leaders-face-top) 0%, var(--sb-leaders-face-bottom) 100%);
      box-shadow:
        var(--ticker-shadow),
        inset 0 1px 0 rgba(142, 182, 255, 0.12);
      overflow: hidden;
      min-height: 2.35rem;
    }
    .leaders-label {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.35rem 0.95rem 0.35rem 0.75rem;
      background: #fff;
      z-index: 1;
      position: relative;
    }
    .leaders-label::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(47, 109, 255, 0.2);
    }
    .leaders-label-text {
      font-family: var(--display);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue);
      line-height: 1;
      white-space: nowrap;
      -webkit-text-stroke: 0.35px currentColor;
      text-shadow: 0 0 0.4px currentColor;
    }
    .leaders-viewport {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent, #000 2rem, #000 calc(100% - 2.25rem), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 2rem, #000 calc(100% - 2.25rem), transparent);
    }
    .leaders-viewport::before,
    .leaders-viewport::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2rem;
      z-index: 1;
      pointer-events: none;
    }
    .leaders-viewport::before {
      left: 0;
      background: linear-gradient(90deg, var(--sb-leaders-fade-l), transparent);
    }
    .leaders-viewport::after {
      right: 0;
      background: linear-gradient(270deg, var(--sb-leaders-fade-r), transparent);
    }
    .leaders-track {
      display: inline-flex;
      align-items: center;
      gap: 0;
      width: max-content;
      white-space: nowrap;
      padding: 0;
      min-height: 100%;
      animation: leaders-scroll 55s linear infinite;
      will-change: transform;
    }
    .leaders-item {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0 1.15rem;
      white-space: nowrap;
      font-family: var(--body);
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1;
      color: var(--sb-leaders-item);
      text-decoration: none;
      min-height: 100%;
    }
    .leaders-item .pos {
      font-family: var(--display);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8eb6ff;
      line-height: 1;
    }
    .leaders-item .who {
      color: var(--sb-leaders-who);
      font-weight: 600;
      line-height: 1;
    }
    .leaders-item .pts {
      font-family: "Share Tech Mono", ui-monospace, monospace;
      color: #8eb6ff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .leaders-item .pts.is-proj { color: var(--sb-muted); }
    .leaders-item .meta {
      color: var(--sb-muted);
      font-size: 0.82rem;
      line-height: 1;
    }
    .leaders-sep {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(142, 182, 255, 0.45);
      flex: 0 0 auto;
      align-self: center;
    }
    .leaders-empty {
      display: flex;
      align-items: center;
      padding: 0 1rem;
      color: var(--sb-muted);
      font-size: 0.88rem;
      line-height: 1;
      min-height: 100%;
    }
    @keyframes leaders-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .leaders-track {
        animation: none;
        transform: none;
        flex-wrap: wrap;
        width: auto;
        white-space: normal;
      }
      .leaders-viewport {
        mask-image: none;
        -webkit-mask-image: none;
        overflow: visible;
      }
    }
    @media (max-width: 560px) {
      .leaders-label-text { font-size: 0.78rem; letter-spacing: 0.08em; }
      .leaders-label { padding-left: 0.65rem; padding-right: 0.75rem; }
    }

    .sb-boards.is-refreshing {
      animation: sb-boards-pulse 1s ease-in-out infinite;
    }
    .sb-week label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sb-muted);
    }
    .sb-week select {
      appearance: none;
      min-width: 9rem;
      color: var(--led);
      border: 1px solid rgba(255, 184, 74, 0.35);
      padding: 0.55rem 2.2rem 0.55rem 0.85rem;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background:
        linear-gradient(45deg, transparent 50%, var(--led) 50%),
        linear-gradient(135deg, var(--led) 50%, transparent 50%),
        var(--sb-select-face);
      background-position:
        calc(100% - 1.05rem) calc(50% - 0.15rem),
        calc(100% - 0.75rem) calc(50% - 0.15rem),
        0 0;
      background-size: 5px 5px, 5px 5px, 100% 100%;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .sb-week select:focus {
      outline: none;
      border-color: var(--led);
    }

    .sb-boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.15rem;
      margin-bottom: 2rem;
    }

    .board {
      border: 3px solid var(--sb-board-border);
      background: var(--board-bezel);
      box-shadow: var(--sb-board-shadow);
      overflow: hidden;
      animation: sb-board-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .board.detail { animation-delay: 0.05s; }
    .board.overtime { animation-delay: 0.12s; }

    .board-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.95rem;
      border-bottom: 1px solid var(--line);
      background: var(--sb-board-top);
    }
    .board-top .conf {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .board-top img {
      width: 3.75rem;
      height: auto;
      filter: var(--logo-shadow);
    }
    .board-top h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .board.detail .board-top h2 { color: var(--detail); }
    .board.overtime .board-top h2 { color: var(--overtime); }
    .board-top .week-chip {
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--led);
      white-space: nowrap;
    }

    .board-face {
      padding: 0.55rem;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.015) 0 1px,
          transparent 1px 3px
        ),
        var(--board-face);
      min-height: 12rem;
    }

    .game {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.55rem;
      align-items: center;
      padding: 0.7rem 0.65rem;
      border: 1px solid var(--sb-game-border);
      background: var(--sb-game-bg);
      margin-bottom: 0.45rem;
    }
    .game:last-child { margin-bottom: 0; }
    .game.is-final {
      border-color: rgba(255, 184, 74, 0.28);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }
    .team.home { flex-direction: row-reverse; text-align: right; }
    .team img {
      width: 4.25rem;
      height: 4.25rem;
      object-fit: contain;
      flex: 0 0 auto;
      background: var(--logo-tile-bg);
      border: 1px solid var(--logo-tile-border);
      border-radius: 0.4rem;
      filter: var(--logo-shadow);
    }
    .team .nm {
      min-width: 0;
      font-family: var(--display);
      font-size: clamp(0.95rem, 1.7vw, 1.2rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.15;
      color: var(--sb-team);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .team.is-winner .nm {
      color: var(--sb-team);
      text-shadow: 0 0 12px rgba(255, 184, 74, 0.35);
    }
    html[data-theme="day"] .team.is-winner .nm {
      text-shadow: none;
      color: var(--sb-score);
    }
    .team.is-loser {
      opacity: 0.55;
    }

    .digits {
      text-align: center;
      min-width: 6.5rem;
      padding: 0.15rem 0.35rem;
    }
    .digits .pair {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.35rem;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: clamp(1.55rem, 3.2vw, 2.15rem);
      line-height: 1;
      color: var(--led);
      text-shadow: 0 0 14px rgba(255, 184, 74, 0.45);
      font-variant-numeric: tabular-nums;
    }
    html[data-theme="day"] .digits .pair {
      text-shadow: none;
    }
    .digits .pair .sep {
      color: var(--led-dim);
      font-size: 0.85em;
    }
    .digits .status {
      margin-top: 0.28rem;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--led-dim);
    }
    .digits .status.live { color: var(--led-green); }
    .digits .status.final { color: var(--led); }
    .digits .proj {
      margin-top: 0.2rem;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      color: var(--sb-muted);
    }

    .board-empty {
      padding: 2rem 1rem;
      text-align: center;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      color: var(--led-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sb-foot {
      margin: 0 0 1.5rem;
      text-align: center;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sb-muted);
    }

    @keyframes sb-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    @keyframes sb-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes sb-sweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(320%); }
    }
    @keyframes sb-boards-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }
    @keyframes sb-title-in {
      from { opacity: 0; letter-spacing: 0.22em; transform: translateY(8px); }
      to { opacity: 1; letter-spacing: 0.08em; transform: none; }
    }
    @keyframes sb-board-in {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 900px) {
      .sb-boards { grid-template-columns: 1fr; }
      .board.overtime { animation-delay: 0.05s; }
      .board-top img { width: 3.35rem; }
      .team img { width: 3.85rem; height: 3.85rem; }
      .game {
        grid-template-columns: 1fr;
        gap: 0.5rem;
        text-align: center;
      }
      .team, .team.home {
        flex-direction: column;
        text-align: center;
      }
      .digits {
        order: -1;
        min-width: 0;
        justify-self: center;
      }
    }
    @media (max-width: 560px) {
      .sb-hero .brand-logo { width: min(11rem, 58vw); }
      .team img { width: 4.5rem; height: 4.5rem; }
      .board-top img { width: 3.5rem; }
    }
  </style>
</head>
<body data-page="scoreboard">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Connecting…</div>
    </div>
  </header>

  <section class="sb-hero shell">
    <img class="brand-logo" src="/assets/gridiron24-logo.png?v=3" alt="GridIron 24" width="280" height="280" />
    <h1>Scoreboard</h1>
  </section>

  <div class="shell">
    <div class="leaders-ticker" id="leaders-ticker" aria-label="Fantasy Leaders">
      <div class="leaders-label">
        <span class="leaders-label-text">Fantasy Leaders</span>
      </div>
      <div class="leaders-viewport">
        <div class="leaders-track" id="leaders-track">
          <div class="leaders-empty">Loading fantasy leaders…</div>
        </div>
      </div>
    </div>
  </div>

  <main class="shell">
    <div class="sb-controls">
      <div class="sb-live is-idle" id="live-badge" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="live-label">Stand by</span>
      </div>
      <div class="sb-week">
        <label for="week">Matchup period</label>
        <select id="week"></select>
      </div>
    </div>
    <div class="sb-refresh-bar" id="refresh-bar" aria-hidden="true"></div>

    <div class="sb-boards" id="boards">
      <div class="board-empty">Powering up scoreboard…</div>
    </div>
    <p class="sb-foot" id="refresh-note">Updates every 30 seconds from ESPN</p>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit">Designed and Created by S.Evans of the Patrol Division</span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=33"></script>
  <script>
    const REFRESH_MS = 30_000;
    const PLACEHOLDER = '/assets/team-logo-placeholder.svg';
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    let pollTimer = null;
    let currentWeek = null;
    let currentMatchupPeriod = null;
    let liveMode = false;
    let loading = false;

    function fmtScore(n) {
      const v = Number(n || 0);
      return v.toFixed(1);
    }

    function leadersItemsHtml(data) {
      const players = data.players || [];
      const teams = data.teams || [];
      const items = [];

      for (const p of players.slice(0, 12)) {
        const live = Number(p.points || 0) > 0;
        const pts = live ? p.points : p.projected;
        const ptsCls = live ? 'pts' : 'pts is-proj';
        const ptsLabel = live ? fmtScore(pts) : `PROJ ${fmtScore(pts)}`;
        items.push(`
          <span class="leaders-item">
            <span class="pos">${esc(p.position || '—')}</span>
            <span class="who">${esc(p.name)}</span>
            <span class="${ptsCls}">${ptsLabel}</span>
            <span class="meta">${esc(p.conference)} · ${esc(p.teamName)}</span>
          </span>`);
      }

      if (!players.length) {
        for (const t of teams.slice(0, 8)) {
          const live = Number(t.points || 0) > 0;
          const pts = live ? t.points : t.projected;
          if (!(Number(pts) > 0)) continue;
          const ptsCls = live ? 'pts' : 'pts is-proj';
          const ptsLabel = live ? fmtScore(pts) : `PROJ ${fmtScore(pts)}`;
          items.push(`
            <span class="leaders-item">
              <span class="pos">TEAM</span>
              <span class="who">${esc(t.teamName)}</span>
              <span class="${ptsCls}">${ptsLabel}</span>
              <span class="meta">${esc(t.conference)}</span>
            </span>`);
        }
      }

      if (!items.length) {
        return `<div class="leaders-empty">Week ${esc(data.week || '—')} leaders unlock when ESPN scoring starts</div>`;
      }

      const joined = items.map((html, i) => `${html}${i < items.length - 1 ? '<span class="leaders-sep" aria-hidden="true"></span>' : ''}`).join('');
      return joined + joined;
    }

    function renderLeaders(data) {
      const track = document.getElementById('leaders-track');
      if (!track) return;
      track.innerHTML = leadersItemsHtml(data);
      const count = (data.players || []).length || (data.teams || []).length;
      if (count > 0) {
        track.style.animationDuration = `${Math.max(40, count * 5)}s`;
      }
    }

    async function loadLeaders(week) {
      try {
        const qs = week ? `?week=${encodeURIComponent(week)}` : '';
        const res = await fetch(`/api/fantasy-leaders${qs}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Leaders ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Leaders unavailable');
        renderLeaders(data);
      } catch (err) {
        const track = document.getElementById('leaders-track');
        if (track) {
          track.innerHTML = `<div class="leaders-empty">${esc(err.message || 'Leaders unavailable')}</div>`;
        }
      }
    }

    function setRefreshing(on) {
      loading = on;
      const badge = document.getElementById('live-badge');
      const label = document.getElementById('live-label');
      const bar = document.getElementById('refresh-bar');
      const boards = document.getElementById('boards');
      const note = document.getElementById('refresh-note');
      badge.classList.toggle('is-refreshing', on);
      bar.classList.toggle('is-on', on);
      boards.classList.toggle('is-refreshing', on);
      if (on) {
        label.textContent = 'Refreshing';
        note.textContent = 'Pulling latest scores from ESPN…';
      } else {
        setLiveState(liveMode);
        note.textContent = 'Updates every 30 seconds from ESPN';
      }
    }

    function teamBlock(team, side, winner) {
      const won = winner === side;
      const lost = winner === 'HOME' || winner === 'AWAY' ? !won : false;
      const cls = [
        'team',
        side === 'HOME' ? 'home' : 'away',
        won ? 'is-winner' : '',
        lost ? 'is-loser' : ''
      ].filter(Boolean).join(' ');
      const src = team?.logo || PLACEHOLDER;
      return `
        <div class="${cls}">
          <img src="${esc(src)}" alt="" width="68" height="68" loading="lazy" referrerpolicy="no-referrer" />
          <div class="nm" title="${esc(team?.name || '')}">${esc(team?.name || 'TBD')}</div>
        </div>`;
    }

    function gameRow(m) {
      const winner = String(m.winner || 'UNDECIDED').toUpperCase();
      const decided = winner === 'HOME' || winner === 'AWAY';
      const inProgress = !decided && (Number(m.home?.score || 0) > 0 || Number(m.away?.score || 0) > 0);
      const status = decided ? 'Final' : inProgress ? 'Live' : 'Upcoming';
      const statusCls = decided ? 'final' : inProgress ? 'live' : '';
      return `
        <div class="game ${decided ? 'is-final' : ''}">
          ${teamBlock(m.away, 'AWAY', winner)}
          <div class="digits">
            <div class="pair">
              <span>${fmtScore(m.away?.score)}</span>
              <span class="sep">-</span>
              <span>${fmtScore(m.home?.score)}</span>
            </div>
            <div class="status ${statusCls}">${status}</div>
            <div class="proj">PROJ ${fmtScore(m.away?.projected)}-${fmtScore(m.home?.projected)}</div>
          </div>
          ${teamBlock(m.home, 'HOME', winner)}
        </div>`;
    }

    function board(conf, idx) {
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      if (!conf.ok) {
        return `
          <section class="board ${tone}">
            <div class="board-top">
              <div class="conf"><h2>${esc(conf.name || 'Conference')}</h2></div>
            </div>
            <div class="board-face"><div class="board-empty">${esc(conf.error || 'Unavailable')}</div></div>
          </section>`;
      }
      const logo = conf.logo ? `<img src="${esc(conf.logo)}" alt="" width="60" height="60">` : '';
      const games = (conf.matchups || []).map(gameRow).join('');
      return `
        <section class="board ${tone}">
          <div class="board-top">
            <div class="conf">
              ${logo}
              <h2>${esc(conf.shortName || conf.name)}</h2>
            </div>
            <div class="week-chip">WK ${esc(conf.week)}</div>
          </div>
          <div class="board-face">
            ${games || '<div class="board-empty">No matchups this week</div>'}
          </div>
        </section>`;
    }

    function fillWeeks(selected) {
      const sel = document.getElementById('week');
      if (sel.options.length) return;
      sel.innerHTML = Array.from({ length: 17 }, (_, i) => {
        const w = i + 1;
        return `<option value="${w}">Week ${w}</option>`;
      }).join('');
      sel.value = String(selected);
    }

    function setLiveState(viewingCurrent) {
      liveMode = viewingCurrent;
      if (loading) return;
      const badge = document.getElementById('live-badge');
      const label = document.getElementById('live-label');
      badge.classList.remove('is-refreshing');
      if (viewingCurrent) {
        badge.classList.remove('is-idle');
        label.textContent = 'Live board';
      } else {
        badge.classList.add('is-idle');
        label.textContent = 'Archive week';
      }
    }

    async function load(week, { quiet = false } = {}) {
      if (loading && quiet) return;
      setRefreshing(true);
      if (!quiet) {
        document.getElementById('boards').innerHTML = '<div class="board-empty">Powering up scoreboard…</div>';
      }
      try {
        const qs = week ? `?week=${encodeURIComponent(week)}` : '';
        const res = await fetch(`/api/schedule${qs}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        currentWeek = Number(data.week);
        currentMatchupPeriod = Number(
          data.conferences?.find((c) => c.ok)?.currentMatchupPeriod || data.week
        );
        fillWeeks(currentWeek);
        document.getElementById('week').value = String(currentWeek);
        document.getElementById('boards').innerHTML = (data.conferences || []).map(board).join('');
        setRefreshing(false);
        setLiveState(currentWeek === currentMatchupPeriod);
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`);
        loadLeaders(currentWeek);
      } catch (err) {
        setRefreshing(false);
        document.getElementById('boards').innerHTML = `<div class="board-empty">${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }

    function startPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        const week = document.getElementById('week').value;
        load(week, { quiet: true });
      }, REFRESH_MS);
    }

    document.getElementById('week').addEventListener('change', (e) => {
      load(e.target.value);
      startPolling();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        load(document.getElementById('week').value || currentWeek, { quiet: true });
      }
    });

    load().then(startPolling);
  </script>
</body>
</html>
