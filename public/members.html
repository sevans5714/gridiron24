<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members Lounge · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=82" />
  <style>
    body[data-page="members"] {
      --mo-cyan: #3b82f6;
      --mo-cyan-bright: #60a5fa;
      --mo-cyan-dim: rgba(59, 130, 246, 0.18);
      --mo-cyan-line: rgba(96, 165, 250, 0.38);
      --mo-gold: #c9a227;
      --mo-gold-dim: rgba(201, 162, 39, 0.35);
      --mo-silver: #cbd5e1;
      --mo-slate: #1e3a5f;
      --mo-slate-2: #0f1c2e;
      --mo-ink: #020617;
      --mo-panel: rgba(8, 14, 28, 0.82);
      --mo-panel-2: rgba(12, 22, 42, 0.9);
      --mo-muted: #94a3b8;
      --mo-text: #e8eef8;
      --mo-good: #3dd68c;
      --mo-due: #ff9b6a;
      color: var(--mo-text);
      background:
        radial-gradient(ellipse 42% 28% at 12% 0%, rgba(147, 197, 253, 0.22), transparent 55%),
        radial-gradient(ellipse 42% 28% at 88% 0%, rgba(96, 165, 250, 0.2), transparent 55%),
        radial-gradient(ellipse 70% 50% at 50% 8%, rgba(59, 130, 246, 0.18), transparent 58%),
        radial-gradient(ellipse 55% 40% at 50% 100%, rgba(201, 162, 39, 0.08), transparent 50%),
        linear-gradient(180deg, #01040c 0%, var(--mo-ink) 35%, #040a16 100%);
    }

    body[data-page="members"] .page-hero {
      display: none;
    }

    .lounge-puzzle {
      --puzzle-seam: rgba(96, 165, 250, 0.28);
      --puzzle-face:
        linear-gradient(180deg, rgba(59, 130, 246, 0.1), transparent 42%),
        linear-gradient(180deg, rgba(12, 22, 42, 0.97), rgba(8, 14, 28, 0.94));
      display: grid;
      grid-template-columns: minmax(11rem, 1.05fr) minmax(0, 22rem) minmax(11rem, 1.05fr);
      grid-template-rows: minmax(17rem, 26rem) minmax(20rem, 30rem) auto;
      grid-template-areas:
        "live hero upcoming"
        "chat chat dues"
        "roll roll roll";
      gap: 1px;
      margin: 0.35rem auto 1.5rem;
      max-width: 78rem;
      background: var(--puzzle-seam);
      border: 1px solid var(--puzzle-seam);
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.14),
        0 0 40px rgba(59, 130, 246, 0.14),
        0 24px 48px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      animation: mo-in 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .puzzle-tile {
      min-width: 0;
      min-height: 0;
      background: var(--puzzle-face);
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .puzzle-live { grid-area: live; }
    .puzzle-hero { grid-area: hero; }
    .puzzle-upcoming { grid-area: upcoming; }
    .puzzle-chat { grid-area: chat; }
    .puzzle-dues { grid-area: dues; }
    .puzzle-roll { grid-area: roll; }

    .mo-hero-center {
      position: relative;
      text-align: center;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      align-content: stretch;
      justify-items: center;
      padding: 0.55rem 0.55rem 0.65rem;
      overflow: hidden;
    }
    .mo-hero-center::before {
      content: "";
      position: absolute;
      inset: 8% 8% auto;
      height: 55%;
      background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.28), transparent 70%);
      pointer-events: none;
      filter: blur(8px);
      z-index: 0;
    }
    .mo-hero-center img {
      position: relative;
      display: block;
      width: min(100%, 20rem);
      height: auto;
      max-height: 100%;
      object-fit: contain;
      align-self: center;
      z-index: 1;
      filter:
        drop-shadow(0 0 18px rgba(59, 130, 246, 0.4))
        drop-shadow(0 10px 28px rgba(0, 0, 0, 0.5));
    }
    .mo-hero-center .sports-tabs {
      position: relative;
      z-index: 1;
      justify-content: center;
      padding: 0.35rem 0 0.1rem;
      border: 0;
      background: transparent;
      max-width: 100%;
    }
    .mo-hero-center .sports-meta {
      position: relative;
      z-index: 1;
      justify-content: center;
      margin-top: 0.15rem;
      font-size: 0.68rem;
      flex-wrap: wrap;
    }
    @keyframes mo-in {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: none; }
    }

    body[data-page="members"] .page-main {
      padding-top: 0.35rem;
    }

    .lounge-side {
      display: grid;
      align-content: stretch;
      min-height: 0;
      height: 100%;
    }
    .lounge-card {
      height: 100%;
      border: 0;
      background: transparent;
      backdrop-filter: none;
      padding: 0.95rem 1rem;
      box-shadow: none;
      overflow: auto;
    }
    .lounge-card h2 {
      margin: 0 0 0.45rem;
      font-family: var(--display);
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-cyan-bright);
      text-shadow: 0 0 14px rgba(59, 130, 246, 0.35);
    }
    .lounge-card p {
      margin: 0 0 0.5rem;
      color: var(--mo-muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }

    /* —— Instant Message window (AOL / Yahoo, modern) —— */
    .im-window {
      --im-chrome: #1a3a6b;
      --im-chrome-2: #0d2244;
      --im-inset: #f4f0e6;
      --im-ink: #1a1f2e;
      --im-muted: #6b7280;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      height: 100%;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #243f73 0%, var(--im-chrome) 40%, var(--im-chrome-2) 100%);
      box-shadow: none;
      animation: none;
    }
    .im-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 0.75rem 0.55rem 0.65rem;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.14), transparent 55%),
        linear-gradient(180deg, #3a5f9a, #1e3f72);
      border-bottom: 1px solid rgba(0, 0, 0, 0.35);
      user-select: none;
    }
    .im-titlebar-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }
    .im-title {
      min-width: 0;
    }
    .im-title h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f8fafc;
      text-shadow: 0 1px 0 rgba(0,0,0,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .im-title .sub {
      display: block;
      margin-top: 0.05rem;
      font-size: 0.72rem;
      color: rgba(226, 232, 240, 0.78);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-live {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      flex: 0 0 auto;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.22);
      font-family: var(--display);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #b7f7c8;
    }
    .chat-live .dot {
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: #3dd68c;
      box-shadow: 0 0 8px #3dd68c;
      animation: chat-pulse 1.4s ease-in-out infinite;
    }
    .chat-live.is-idle { color: rgba(226, 232, 240, 0.65); }
    .chat-live.is-idle .dot {
      background: #94a3b8;
      box-shadow: none;
      animation: none;
    }
    @keyframes chat-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .im-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: 0;
      margin: 0.35rem;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.45);
      background: var(--im-inset);
      box-shadow: 0 1px 0 rgba(255,255,255,0.12);
    }
    .im-main {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
    }
    .chat-log {
      overflow-y: auto;
      padding: 0.7rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      scroll-behavior: smooth;
      background:
        linear-gradient(180deg, #faf7f0, #f1ebe0);
      font-family: "Segoe UI", "Trebuchet MS", "Source Sans 3", sans-serif;
      font-size: 0.95rem;
      color: var(--im-ink);
    }
    .chat-empty {
      margin: auto;
      color: var(--im-muted);
      text-align: center;
      padding: 1.5rem 1rem;
      font-family: var(--display);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    .im-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.35rem 0.65rem;
      align-items: baseline;
      padding: 0.18rem 0.2rem;
      border-radius: 3px;
      line-height: 1.35;
    }
    .im-line:hover { background: rgba(26, 58, 107, 0.06); }
    .im-line.mine { background: rgba(59, 130, 246, 0.08); }
    .im-line-main {
      min-width: 0;
      word-break: break-word;
    }
    .im-who {
      cursor: pointer;
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
      font-weight: 800;
    }
    .im-who:hover { text-decoration: underline; }
    .im-who:disabled {
      cursor: default;
      text-decoration: none;
      opacity: 0.85;
    }
    .im-sep { font-weight: 700; color: var(--im-ink); margin-right: 0.15rem; }
    .im-text {
      white-space: pre-wrap;
      color: var(--im-ink);
    }
    .im-text .chat-mention {
      color: #1d4ed8;
      font-weight: 700;
      text-shadow: none;
      background: rgba(59, 130, 246, 0.12);
      padding: 0 0.15rem;
      border-radius: 2px;
    }
    .im-meta {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      color: var(--im-muted);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .im-line:hover .im-meta,
    .im-line:focus-within .im-meta { opacity: 1; }
    .chat-msg-del {
      appearance: none;
      border: 0;
      background: transparent;
      color: #b91c1c;
      font: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
    }
    .chat-msg-del:hover { text-decoration: underline; }

    .chat-compose {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.45rem;
      padding: 0.55rem 0.6rem;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
      background: linear-gradient(180deg, #e8e2d4, #ddd5c4);
    }
    .chat-compose textarea {
      width: 100%;
      min-height: 2.75rem;
      max-height: 6.5rem;
      resize: vertical;
      padding: 0.45rem 0.55rem;
      border: 1px solid #9aa3b2;
      border-radius: 3px;
      background: #fffef9;
      color: var(--im-ink);
      font: inherit;
      font-size: 0.92rem;
      line-height: 1.35;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
    }
    .chat-compose textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }
    .chat-compose button {
      appearance: none;
      align-self: end;
      min-height: 2.75rem;
      min-width: 4.5rem;
      padding: 0.45rem 0.9rem;
      border: 1px solid #1e3a5f;
      border-radius: 4px;
      background: linear-gradient(180deg, #5b8fdb, #2f5fad 55%, #244f96);
      color: #fff;
      font-family: var(--display);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.25) inset,
        0 2px 4px rgba(0,0,0,0.25);
      text-shadow: 0 1px 0 rgba(0,0,0,0.25);
    }
    .chat-compose button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .chat-compose button:hover:not(:disabled) {
      filter: brightness(1.06);
    }

    .chat-mention {
      color: var(--mo-cyan-bright);
      font-weight: 700;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.45);
    }

    .roll-section {
      margin: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
    }
    .roll-section > .section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 0;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid rgba(96, 165, 250, 0.18);
      background: rgba(2, 6, 23, 0.4);
    }
    .roll-section > .section-label h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-cyan-bright);
    }
    .roll-section > .section-label p {
      display: none;
    }

    .pay-panel {
      display: grid;
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    .pay-panel h2 {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-cyan-bright);
    }
    .pay-panel p {
      margin: 0 0 0.45rem;
      color: var(--mo-muted);
      line-height: 1.45;
      font-size: 0.92rem;
    }
    .pay-panel .treasurer {
      color: var(--mo-text);
      font-weight: 600;
    }
    .pay-panel a { color: var(--mo-cyan-bright); }
    .pay-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      margin-top: 0.55rem;
    }
    .btn-venmo {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 2.4rem;
      padding: 0.5rem 0.95rem;
      border: 0;
      background: linear-gradient(180deg, var(--mo-cyan-bright), var(--mo-cyan));
      color: #020617;
      font-family: var(--display);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(59, 130, 246, 0.45);
    }
    .btn-venmo:hover { filter: brightness(1.08); }
    .btn-ghost {
      appearance: none;
      min-height: 2.4rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid rgba(203, 213, 225, 0.28);
      background: transparent;
      color: var(--mo-silver);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-ghost:hover {
      border-color: var(--mo-cyan-bright);
      color: var(--mo-cyan-bright);
    }
    .dues-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.6rem;
      border: 1px solid rgba(43, 61, 81, 0.95);
      background: rgba(0, 0, 0, 0.35);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.88rem;
    }
    .dues-chip.paid { color: var(--mo-good); border-color: rgba(61, 214, 140, 0.4); }
    .dues-chip.due { color: var(--mo-due); border-color: rgba(255, 155, 106, 0.4); }

    .boards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      margin: 0;
      min-height: 0;
    }
    .board {
      border: 0;
      background: transparent;
      backdrop-filter: none;
      min-width: 0;
      box-shadow: none;
    }
    .board-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid rgba(96, 165, 250, 0.2);
      background: rgba(2, 6, 23, 0.35);
      border-left: 0;
    }
    .board-head h2 {
      display: none;
    }
    .board-head .count {
      color: var(--mo-muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      width: 100%;
    }
    .board-head .count strong {
      color: var(--mo-cyan-bright);
      font-weight: 600;
    }
    .league-pill {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.08rem 0.4rem;
      border: 1px solid rgba(96, 165, 250, 0.35);
      font-family: var(--display);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      vertical-align: 0.1rem;
      color: var(--mo-cyan-bright);
    }
    .league-pill.is-aaa {
      border-color: rgba(201, 162, 39, 0.45);
      color: #e8d48b;
    }
    .board-body { padding: 0.35rem 0.55rem 0.65rem; }
    .member-row {
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr) auto;
      gap: 0.55rem;
      align-items: center;
      padding: 0.55rem 0.4rem;
      border-bottom: 1px solid rgba(43, 61, 81, 0.55);
    }
    .member-row:last-child { border-bottom: 0; }
    .member-row.is-open { opacity: 0.62; }
    .member-row .slot {
      color: var(--mo-slate);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-align: right;
      font-family: var(--display);
      letter-spacing: 0.04em;
    }
    .member-row .name-wrap { min-width: 0; }
    .member-row .name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--mo-text);
    }
    .member-row .name-input {
      width: 100%;
      min-width: 0;
      padding: 0.35rem 0.45rem;
      border: 1px solid rgba(30, 58, 95, 0.9);
      background: rgba(2, 6, 23, 0.85);
      color: var(--mo-text);
      font: inherit;
      font-weight: 600;
    }
    .member-row .name-input:focus {
      outline: none;
      border-color: var(--mo-cyan-bright);
    }
    .member-row .meta {
      color: var(--mo-muted);
      font-size: 0.78rem;
      margin-top: 0.15rem;
    }
    .member-row .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: flex-end;
      align-items: center;
    }
    .status-pill {
      font-family: var(--display);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.2rem 0.45rem;
      border: 1px solid rgba(43, 61, 81, 0.9);
    }
    .status-pill.paid { color: var(--mo-good); border-color: rgba(61, 214, 140, 0.45); }
    .status-pill.due { color: var(--mo-due); border-color: rgba(255, 155, 106, 0.45); }
    .status-pill.open { color: var(--mo-muted); }
    .linkish {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--mo-cyan-bright);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.15rem 0.2rem;
      text-decoration: none;
    }
    .linkish:hover { text-decoration: underline; text-underline-offset: 2px; }

    .flash {
      margin: 0 0 1rem;
      padding: 0.65rem 0.8rem;
      border: 1px solid rgba(43, 61, 81, 0.95);
      color: var(--mo-text);
      background: rgba(0, 0, 0, 0.35);
    }
    .flash.ok { border-color: rgba(61, 214, 140, 0.45); color: var(--mo-good); }
    .flash.err { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .flash[hidden] { display: none !important; }

    body[data-page="members"] .site-footer {
      border-top-color: rgba(96, 165, 250, 0.18);
      color: var(--mo-muted);
    }
    body[data-page="members"] .site-footer-author {
      color: var(--mo-cyan-bright);
    }

    .mo-lock {
      display: inline-grid;
      place-items: center;
      width: 0.95rem;
      height: 0.95rem;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--mo-cyan-bright), var(--mo-cyan));
      color: #020617;
      margin-right: 0.35rem;
      vertical-align: -0.1rem;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.55);
    }
    .mo-lock svg { width: 0.55rem; height: 0.55rem; display: block; }

    /* —— Score rails flanking the logo —— */
    .sports-rail {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      max-height: none;
      height: 100%;
      border: 0;
      background: transparent;
      backdrop-filter: none;
      box-shadow: none;
      overflow: hidden;
    }
    .sports-rail.is-left {
      border-left: 3px solid var(--mo-cyan-bright);
    }
    .sports-rail.is-right {
      border-right: 3px solid var(--mo-gold);
    }
    .sports-rail-head {
      padding: 0.55rem 0.7rem 0.45rem;
      border-bottom: 1px solid rgba(96, 165, 250, 0.18);
      background: rgba(2, 6, 23, 0.45);
      font-family: var(--display);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mo-cyan-bright);
      text-align: center;
    }
    .sports-rail.is-right .sports-rail-head {
      color: #e8d48b;
    }

    .sports-meta {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mo-silver);
    }
    .sports-live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border: 1px solid rgba(61, 214, 140, 0.45);
      background: rgba(61, 214, 140, 0.12);
      color: #7dffb5;
      font-weight: 600;
    }
    .sports-live-pill[hidden] { display: none; }
    .sports-live-pill .pulse {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: #3dd68c;
      box-shadow: 0 0 8px #3dd68c;
      animation: mo-pulse 1.4s ease-in-out infinite;
    }
    @keyframes mo-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .sports-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.3rem;
      max-width: 100%;
    }
    .sports-tab {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--mo-muted);
      font-family: var(--display);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.28rem 0.5rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .sports-tab:hover {
      color: var(--mo-text);
      border-color: rgba(96, 165, 250, 0.25);
    }
    .sports-tab.is-on {
      color: #020617;
      background: linear-gradient(180deg, var(--mo-cyan-bright), var(--mo-cyan));
      border-color: transparent;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.4);
    }
    .sports-tab .count {
      margin-left: 0.25rem;
      opacity: 0.75;
      font-weight: 600;
    }
    .sports-tab.is-on .count { opacity: 0.9; }

    .sports-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.4rem;
      padding: 0.5rem;
      overflow-y: auto;
      align-content: start;
      scrollbar-width: thin;
      scrollbar-color: rgba(96, 165, 250, 0.35) transparent;
    }
    .sports-grid.is-flip {
      animation: sports-rail-flip 0.45s ease both;
    }
    @keyframes sports-rail-flip {
      from { opacity: 0; transform: translateY(0.45rem); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sports-empty {
      padding: 1.25rem 0.65rem;
      text-align: center;
      color: var(--mo-muted);
      font-size: 0.85rem;
    }

    .sgame {
      position: relative;
      padding: 0.45rem 0.5rem 0.5rem;
      border: 1px solid rgba(96, 165, 250, 0.2);
      background: linear-gradient(160deg, rgba(30, 58, 95, 0.35), rgba(2, 6, 23, 0.55));
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      animation: mo-card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .sgame:hover {
      border-color: rgba(96, 165, 250, 0.45);
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.16);
      transform: translateY(-1px);
    }
    .sgame.is-live {
      border-color: rgba(61, 214, 140, 0.4);
      box-shadow: inset 0 0 0 1px rgba(61, 214, 140, 0.12);
    }
    .sgame.is-final { opacity: 0.88; }
    @keyframes mo-card-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .sgame-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mo-muted);
    }
    .sgame-league {
      color: var(--mo-gold);
      font-weight: 600;
    }
    .sgame-status.is-live {
      color: #7dffb5;
      font-weight: 700;
    }
    .sgame-row {
      display: grid;
      grid-template-columns: 1.25rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.3rem;
      min-height: 1.2rem;
    }
    .sgame-row + .sgame-row { margin-top: 0.15rem; }
    .sgame-row img {
      width: 1.15rem;
      height: 1.15rem;
      object-fit: contain;
    }
    .sgame-abbr {
      font-family: var(--display);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: var(--mo-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sgame-row.is-winner .sgame-abbr { color: #fff; }
    .sgame-row.is-winner .sgame-score { color: #fff; font-weight: 700; }
    .sgame-score {
      font-family: var(--display);
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: var(--mo-silver);
      min-width: 1.35rem;
      text-align: right;
    }
    .sgame-score.is-blank { color: var(--mo-muted); font-size: 0.8rem; }

    .sgame.is-golf {
      grid-column: auto;
    }
    .sgolf-title {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: var(--mo-text);
    }
    .sgolf-leaders {
      display: grid;
      gap: 0.15rem;
    }
    .sgolf-row {
      display: grid;
      grid-template-columns: 1.6rem minmax(0, 1fr) 2rem 1.6rem;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.72rem;
      color: var(--mo-silver);
    }
    .sgolf-row.is-live { color: #7dffb5; }
    .sgolf-pos {
      font-family: var(--display);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      color: var(--mo-gold);
    }
    .sgolf-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sgolf-score {
      font-family: var(--display);
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--mo-text);
    }
    .sgolf-thru {
      text-align: right;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--mo-muted);
    }

    @media (max-width: 1100px) {
      .lounge-puzzle {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "hero"
          "live"
          "upcoming"
          "chat"
          "dues"
          "roll";
      }
      .sports-rail.is-left,
      .sports-rail.is-right {
        max-height: 14rem;
        border-left: 0;
        border-right: 0;
        border-top: 2px solid var(--mo-cyan-bright);
      }
      .sports-rail.is-right {
        border-top-color: var(--mo-gold);
      }
      .mo-hero-center {
        min-height: 14rem;
      }
      .mo-hero-center img { width: min(100%, 18rem); }
      .lounge-side { height: auto; }
      .lounge-card { height: auto; }
    }

    @media (max-width: 900px) {
      .boards { grid-template-columns: 1fr; }
      .member-row { grid-template-columns: 1.75rem minmax(0, 1fr); }
      .member-row .actions {
        grid-column: 2;
        justify-content: flex-start;
      }
      .im-window {
        height: auto;
        min-height: 22rem;
      }
      .im-body {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-page="members">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Lounge</div>
    </div>
  </header>
  <section class="page-hero shell" hidden>
    <p class="eyebrow">Members lounge</p>
    <h1>Members</h1>
  </section>
  <main class="page-main shell">
    <div class="flash" id="flash" hidden></div>
    <div class="lounge-puzzle" id="sports-board" aria-label="Members lounge">
      <aside class="sports-rail is-left puzzle-tile puzzle-live" aria-label="Live scores">
        <div class="sports-rail-head">Live</div>
        <div class="sports-grid" id="sports-grid-left" aria-live="polite">
          <div class="sports-empty">Loading…</div>
        </div>
      </aside>
      <div class="mo-hero-center puzzle-tile puzzle-hero">
        <img src="/assets/members-lounge.jpg?v=1" alt="GridIron 24 Members Only" width="1024" height="576" />
        <div class="sports-tabs" id="sports-tabs" role="tablist" aria-label="Sport filter"></div>
        <div class="sports-meta">
          <span class="sports-live-pill" id="sports-live-pill" hidden><span class="pulse" aria-hidden="true"></span><span id="sports-live-count">0 live</span></span>
          <span id="sports-updated">Updating…</span>
        </div>
      </div>
      <aside class="sports-rail is-right puzzle-tile puzzle-upcoming" aria-label="Upcoming scores">
        <div class="sports-rail-head">Upcoming</div>
        <div class="sports-grid" id="sports-grid-right" aria-live="polite">
          <div class="sports-empty">Loading…</div>
        </div>
      </aside>
      <section class="im-window puzzle-tile puzzle-chat" id="room" aria-label="Roll Call Room">
        <div class="im-titlebar">
          <div class="im-titlebar-left">
            <div class="im-title">
              <h2>Roll Call Room</h2>
            </div>
          </div>
          <div class="chat-live is-idle" id="chat-live"><span class="dot" aria-hidden="true"></span><span id="chat-live-label">Connecting</span></div>
        </div>
        <div class="im-body">
          <div class="im-main">
            <div class="chat-log" id="chat-log" aria-live="polite"><div class="chat-empty">Signing on to the lounge…</div></div>
            <form class="chat-compose" id="chat-form">
              <textarea id="chat-input" maxlength="1000" rows="2" placeholder="Type a message… click a name to @mention" autocomplete="off"></textarea>
              <button type="submit" id="chat-send">Send</button>
            </form>
          </div>
        </div>
      </section>
      <aside class="lounge-side puzzle-tile puzzle-dues">
        <div class="lounge-card" id="pay-panel"></div>
      </aside>
      <section class="roll-section puzzle-tile puzzle-roll">
        <div class="section-label">
          <h2>The membership roll</h2>
        </div>
        <div class="boards" id="boards"><div class="msg">Loading the roll…</div></div>
      </section>
    </div>
  </main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><img class="site-footer-mark" src="/assets/gridiron24-crest.png?v=4" alt="GridIron 24" width="224" height="224" decoding="async" /><span class="site-footer-by">created by <span class="site-footer-author">S. Evans</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=64"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    let state = null;
    let chatMessages = [];
    let chatViewerId = null;
    let chatPollTimer = null;
    let chatSending = false;
    let onlineUsers = [];
    const pendingMentions = new Map(); // id -> name
    const CHAT_POLL_MS = 2500;

    let sportsData = null;
    let sportsFilter = 'all';
    let sportsPollTimer = null;
    let sportsFlipTimer = null;
    let sportsAuto = true;
    const SPORTS_POLL_MS = 25000;
    const SPORTS_POLL_LIVE_MS = 15000;
    const SPORTS_FLIP_MS = 7000;
    const SPORTS_FLIP_PAUSE_MS = 20000;

    async function readJsonResponse(res, fallbackError) {
      const text = await res.text();
      const trimmed = String(text || '').trim();
      if (!trimmed) {
        throw new Error(fallbackError || `Empty response (${res.status})`);
      }
      try {
        return JSON.parse(trimmed);
      } catch {
        const looksHtml = trimmed.startsWith('<!') || /<html[\s>]/i.test(trimmed);
        throw new Error(
          looksHtml
            ? 'Lounge API returned a web page instead of data. Refresh and try again.'
            : (fallbackError || `Invalid response (${res.status})`)
        );
      }
    }

    function money(n) {
      const v = Number(n || 0);
      return `$${v.toFixed(v % 1 ? 2 : 0)}`;
    }

    function kickShort(iso) {
      if (!iso) return 'TBD';
      try {
        const d = new Date(iso);
        return d.toLocaleString([], {
          weekday: 'short',
          hour: 'numeric',
          minute: '2-digit'
        });
      } catch {
        return 'TBD';
      }
    }

    function sportsStatusLine(g) {
      const bucket = g.status?.bucket || 'upcoming';
      if (bucket === 'live') return g.status?.shortDetail || g.status?.detail || 'LIVE';
      if (bucket === 'final') return 'Final';
      const net = (g.broadcasts || [])[0];
      const kick = kickShort(g.date);
      return net ? `${kick} · ${net}` : kick;
    }

    function flatSportsGames(data, filter) {
      const boards = Array.isArray(data?.leagues) ? data.leagues : [];
      const rows = [];
      for (const board of boards) {
        for (const g of board.games || []) {
          rows.push({ ...g, leagueLabel: board.label || g.league });
        }
      }
      if (!filter || filter === 'all' || filter === 'live') return rows;
      return rows.filter((g) => (g.league || '') === filter);
    }

    function sportsGameHtml(g, i) {
      const bucket = g.status?.bucket || 'upcoming';
      const delay = Math.min(i * 0.03, 0.35);

      if (g.kind === 'golf') {
        const leaders = Array.isArray(g.leaders) ? g.leaders : [];
        const rows = leaders.map((p) => {
          const live = p.state === 'in';
          const thru = p.thru ? (String(p.thru).toUpperCase() === 'F' || p.thru === '18' ? 'F' : p.thru) : '';
          return `<div class="sgolf-row${live ? ' is-live' : ''}">
            <span class="sgolf-pos">${esc(p.position || '—')}</span>
            <span class="sgolf-name" title="${esc(p.name || '')}">${esc(p.shortName || p.name || '—')}</span>
            <span class="sgolf-score">${esc(p.score || '—')}</span>
            <span class="sgolf-thru">${esc(thru)}</span>
          </div>`;
        }).join('');
        return `<article class="sgame is-golf is-${esc(bucket)}" style="animation-delay:${delay}s" title="${esc(g.name || '')}">
          <div class="sgame-top">
            <span class="sgame-league">Golf</span>
            <span class="sgame-status${bucket === 'live' ? ' is-live' : ''}">${esc(sportsStatusLine(g))}</span>
          </div>
          <h3 class="sgolf-title">${esc(g.shortName || g.name || 'Tournament')}</h3>
          <div class="sgolf-leaders">${rows || '<div class="sports-empty" style="padding:0.5rem 0">No leaderboard yet</div>'}</div>
        </article>`;
      }

      const showScore = bucket === 'final' || bucket === 'live';
      const awayWin = bucket === 'final' && Boolean(g.away?.winner);
      const homeWin = bucket === 'final' && Boolean(g.home?.winner);
      const side = (t, win) => {
        if (!t) return '';
        const score = showScore && t.score != null
          ? `<span class="sgame-score">${esc(String(t.score))}</span>`
          : `<span class="sgame-score is-blank">—</span>`;
        const logo = t.logo
          ? `<img src="${esc(t.logo)}" alt="" loading="lazy" width="22" height="22" />`
          : `<span></span>`;
        return `<div class="sgame-row${win ? ' is-winner' : ''}">
          ${logo}
          <span class="sgame-abbr" title="${esc(t.name || t.abbreviation || '')}">${esc(t.abbreviation || t.shortName || '?')}</span>
          ${score}
        </div>`;
      };
      const leagueLabel = g.league === 'llws' ? 'LLWS' : (g.leagueLabel || g.league || '');
      return `<article class="sgame is-${esc(bucket)}" style="animation-delay:${delay}s" title="${esc(g.name || '')}">
        <div class="sgame-top">
          <span class="sgame-league">${esc(leagueLabel)}</span>
          <span class="sgame-status${bucket === 'live' ? ' is-live' : ''}">${esc(sportsStatusLine(g))}</span>
        </div>
        ${side(g.away, awayWin)}
        ${side(g.home, homeWin)}
      </article>`;
    }

    function sportsRotateIds() {
      const boards = Array.isArray(sportsData?.leagues) ? sportsData.leagues : [];
      const withAction = boards.filter((b) =>
        (b.games || []).some((g) => {
          const bucket = g.status?.bucket;
          return bucket === 'live' || bucket === 'upcoming';
        })
      );
      const pool = withAction.length ? withAction : boards.filter((b) => (b.games || []).length);
      return pool.map((b) => b.id).filter(Boolean);
    }

    function markSportsTabs() {
      const root = document.getElementById('sports-tabs');
      if (!root) return;
      root.querySelectorAll('.sports-tab').forEach((btn) => {
        const on = (btn.dataset.filter || '') === sportsFilter;
        btn.classList.toggle('is-on', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }

    function scheduleSportsFlip(delay = SPORTS_FLIP_MS) {
      clearTimeout(sportsFlipTimer);
      if (!sportsAuto || document.hidden) return;
      sportsFlipTimer = setTimeout(() => {
        const ids = sportsRotateIds();
        if (!ids.length) {
          sportsFilter = 'all';
          renderSportsBoard({ rebuildTabs: false });
          scheduleSportsFlip();
          return;
        }
        const idx = ids.indexOf(sportsFilter);
        sportsFilter = ids[(idx + 1 + ids.length) % ids.length];
        renderSportsBoard({ rebuildTabs: false });
        scheduleSportsFlip();
      }, delay);
    }

    function pauseSportsAutoFlip() {
      sportsAuto = false;
      clearTimeout(sportsFlipTimer);
      sportsFlipTimer = setTimeout(() => {
        sportsAuto = true;
        scheduleSportsFlip(SPORTS_FLIP_MS);
      }, SPORTS_FLIP_PAUSE_MS);
    }

    function renderSportsTabs() {
      const root = document.getElementById('sports-tabs');
      if (!root) return;
      const boards = Array.isArray(sportsData?.leagues) ? sportsData.leagues : [];
      const tabs = [
        { id: 'all', label: 'All', count: Number(sportsData?.totals?.games || 0) },
        ...boards.map((b) => ({
          id: b.id,
          label: b.label,
          count: (b.games || []).length
        }))
      ];
      root.innerHTML = tabs.map((t) => `
        <button type="button" class="sports-tab${sportsFilter === t.id ? ' is-on' : ''}"
          role="tab" aria-selected="${sportsFilter === t.id}" data-filter="${esc(t.id)}">
          ${esc(t.label)}<span class="count">${t.count}</span>
        </button>
      `).join('');
      root.querySelectorAll('.sports-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          sportsFilter = btn.dataset.filter || 'all';
          pauseSportsAutoFlip();
          renderSportsBoard({ rebuildTabs: false });
          markSportsTabs();
        });
      });
    }

    function fillSportsRail(el, games, emptyMsg) {
      if (!el) return;
      if (!games.length) {
        el.innerHTML = `<div class="sports-empty">${emptyMsg}</div>`;
        return;
      }
      el.innerHTML = games.map((g, i) => sportsGameHtml(g, i)).join('');
    }

    function renderSportsBoard({ rebuildTabs = true } = {}) {
      const left = document.getElementById('sports-grid-left');
      const right = document.getElementById('sports-grid-right');
      const pill = document.getElementById('sports-live-pill');
      const liveCount = document.getElementById('sports-live-count');
      const updated = document.getElementById('sports-updated');
      if (!left || !right) return;

      if (rebuildTabs) renderSportsTabs();
      else markSportsTabs();

      const liveN = Number(sportsData?.totals?.live || 0);
      if (pill) {
        pill.hidden = liveN < 1;
        if (liveCount) liveCount.textContent = `${liveN} live`;
      }
      if (updated && sportsData?.fetchedAt) {
        const t = new Date(sportsData.fetchedAt);
        updated.textContent = `Updated ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
      }

      const games = flatSportsGames(sportsData, sportsFilter);
      const live = games.filter((g) => g.status?.bucket === 'live');
      const upcoming = games.filter((g) => g.status?.bucket === 'upcoming');
      left.classList.remove('is-flip');
      right.classList.remove('is-flip');
      void left.offsetWidth;
      left.classList.add('is-flip');
      right.classList.add('is-flip');
      fillSportsRail(left, live, 'No games live right now.');
      fillSportsRail(right, upcoming, 'Nothing upcoming on this slate.');
    }

    function scheduleSportsPoll() {
      clearTimeout(sportsPollTimer);
      const live = Number(sportsData?.totals?.live || 0) > 0;
      sportsPollTimer = setTimeout(() => { loadSportsScores(); }, live ? SPORTS_POLL_LIVE_MS : SPORTS_POLL_MS);
    }

    async function loadSportsScores() {
      try {
        const res = await fetch('/api/sports-scores', { cache: 'no-store' });
        if (res.status === 401) return;
        const data = await readJsonResponse(res, 'Scores unavailable');
        if (!res.ok || !data.ok) throw new Error(data.error || 'Scores unavailable');
        const firstLoad = !sportsData;
        sportsData = data;
        if (firstLoad || sportsFilter === 'all') {
          const ids = sportsRotateIds();
          if (ids.length && sportsAuto) sportsFilter = ids[0];
        }
        renderSportsBoard({ rebuildTabs: true });
        if (sportsAuto) scheduleSportsFlip();
      } catch (err) {
        if (!sportsData) {
          const msg = `<div class="sports-empty">${esc(err.message || 'Could not load scores')}</div>`;
          const left = document.getElementById('sports-grid-left');
          const right = document.getElementById('sports-grid-right');
          if (left) left.innerHTML = msg;
          if (right) right.innerHTML = msg;
        }
      } finally {
        scheduleSportsPoll();
      }
    }

    function flash(text, ok = true) {
      const el = document.getElementById('flash');
      if (!text) {
        el.hidden = true;
        el.textContent = '';
        return;
      }
      el.hidden = false;
      el.className = `flash ${ok ? 'ok' : 'err'}`;
      el.textContent = text;
    }

    function duesFor(league) {
      if (!state) return 0;
      return league === 'aaa' ? state.dues.aaa : state.dues.gridiron;
    }

    function venmoUrl({ amount, note }) {
      const user = state?.treasurer?.venmoUsername || 'jaceto53';
      const params = new URLSearchParams({
        txn: 'pay',
        audience: 'private',
        recipients: user,
        amount: String(amount || ''),
        note: note || state?.treasurer?.note || 'League dues'
      });
      return `https://venmo.com/${encodeURIComponent(user)}?${params.toString()}`;
    }

    function copyText(text) {
      if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return Promise.resolve();
    }

    function formatChatBody(text) {
      const names = [...pendingMentions.values(), ...onlineUsers.map((u) => u.name), ...(state?.gridiron || []).map((u) => u.name), ...(state?.aaa || []).map((u) => u.name)]
        .filter(Boolean)
        .sort((a, b) => String(b).length - String(a).length);
      let html = esc(text);
      const seen = new Set();
      for (const name of names) {
        const key = String(name).toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        const escaped = esc(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        html = html.replace(new RegExp(`(^|\\s)(@${escaped})(?=$|[\\s.,!?;:)'"\\]])`, 'gi'), '$1<span class="chat-mention">$2</span>');
      }
      return html;
    }

    function insertMention(user) {
      if (!user?.id || !user?.name) return;
      if (user.id === chatViewerId) return;
      pendingMentions.set(user.id, user.name);
      const input = document.getElementById('chat-input');
      if (!input) return;
      const token = `@${user.name} `;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      const before = input.value.slice(0, start);
      const after = input.value.slice(end);
      const needsSpace = before && !/\s$/.test(before);
      input.value = `${before}${needsSpace ? ' ' : ''}${token}${after}`;
      input.focus();
      const caret = (before + (needsSpace ? ' ' : '') + token).length;
      input.setSelectionRange(caret, caret);
    }

    function fmtChatTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      } catch {
        return '';
      }
    }

    const AIM_COLORS = [
      '#c41e3a', '#d9480f', '#e67700', '#2b8a3e', '#0b7285',
      '#1864ab', '#5f3dc4', '#9c36b5', '#a61e4d', '#087f5b',
      '#364fc7', '#e8590c'
    ];

    function screenColor(id) {
      const s = String(id || 'x');
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return AIM_COLORS[h % AIM_COLORS.length];
    }

    function setChatLive(on) {
      const el = document.getElementById('chat-live');
      const label = document.getElementById('chat-live-label');
      if (!el || !label) return;
      el.classList.toggle('is-idle', !on);
      label.textContent = on ? 'Online' : 'Away';
    }

    function nearBottom(el, px = 80) {
      return el.scrollHeight - el.scrollTop - el.clientHeight < px;
    }

    function renderChat() {
      const log = document.getElementById('chat-log');
      if (!log) return;
      const stick = nearBottom(log) || chatMessages.length <= 1;
      if (!chatMessages.length) {
        log.innerHTML = `<div class="chat-empty">No one’s talking… say something.</div>`;
        return;
      }
      const canModerate = Boolean(state?.canManage);
      log.innerHTML = chatMessages.map((m) => {
        const mine = m.authorId && m.authorId === chatViewerId;
        const canDelete = mine || canModerate;
        const who = m.authorName || 'Member';
        const color = screenColor(m.authorId || who);
        return `<article class="im-line${mine ? ' mine' : ''}" data-id="${esc(m.id)}">
          <div class="im-line-main">
            <button type="button" class="im-who" style="color:${esc(color)}"
              data-mention-id="${esc(m.authorId || '')}" data-mention-name="${esc(who)}"
              ${mine || !m.authorId ? 'disabled' : ''}
              title="${mine || !m.authorId ? '' : `Mention ${esc(who)}`}">${esc(who)}</button><span class="im-sep">:</span>
            <span class="im-text">${formatChatBody(m.body)}</span>
          </div>
          <div class="im-meta">
            <span>${esc(fmtChatTime(m.createdAt))}</span>
            ${canDelete ? `<button type="button" class="chat-msg-del" data-del-chat="${esc(m.id)}">×</button>` : ''}
          </div>
        </article>`;
      }).join('');
      log.querySelectorAll('[data-del-chat]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            const res = await fetch(`/api/members-chat/${encodeURIComponent(btn.dataset.delChat)}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Delete failed');
            chatMessages = chatMessages.filter((m) => m.id !== btn.dataset.delChat);
            renderChat();
          } catch (err) {
            flash(err.message, false);
          }
        });
      });
      log.querySelectorAll('button.im-who[data-mention-id]:not([disabled])').forEach((btn) => {
        btn.addEventListener('click', () => {
          insertMention({ id: btn.dataset.mentionId, name: btn.dataset.mentionName });
        });
      });
      if (stick) log.scrollTop = log.scrollHeight;
    }

    function mergeChat(incoming) {
      if (!incoming?.length) return false;
      const seen = new Set(chatMessages.map((m) => m.id));
      let added = false;
      for (const m of incoming) {
        if (!m?.id || seen.has(m.id)) continue;
        chatMessages.push(m);
        seen.add(m.id);
        added = true;
      }
      if (added) {
        chatMessages.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
        if (chatMessages.length > 200) chatMessages = chatMessages.slice(-200);
      }
      return added;
    }

    async function loadChat({ incremental = false } = {}) {
      const after = incremental && chatMessages.length
        ? chatMessages[chatMessages.length - 1].id
        : '';
      const qs = after ? `?after=${encodeURIComponent(after)}` : '';
      const res = await fetch(`/api/members-chat${qs}`, { cache: 'no-store' });
      if (res.status === 401) {
        setChatLive(false);
        return;
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || 'Chat unavailable');
      chatViewerId = data.viewerId || chatViewerId;
      if (Array.isArray(data.online)) {
        onlineUsers = data.online;
      }
      if (!incremental) {
        chatMessages = Array.isArray(data.messages) ? data.messages.slice() : [];
        renderChat();
      } else if (mergeChat(data.messages)) {
        renderChat();
      }
      setChatLive(true);
    }

    function startChatPoll() {
      clearInterval(chatPollTimer);
      chatPollTimer = setInterval(async () => {
        try {
          await loadChat({ incremental: true });
          window.GridIronNav?.refreshInboxBadge?.();
        } catch {
          setChatLive(false);
        }
      }, CHAT_POLL_MS);
    }

    async function sendChat(text) {
      if (chatSending) return;
      const body = String(text || '').trim();
      if (!body) return;
      chatSending = true;
      const btn = document.getElementById('chat-send');
      const input = document.getElementById('chat-input');
      if (btn) btn.disabled = true;
      const mentions = [...pendingMentions.entries()]
        .filter(([, name]) => body.toLowerCase().includes(`@${String(name).toLowerCase()}`))
        .map(([id]) => id);
      try {
        const res = await fetch('/api/members-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body, mentions })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not send');
        if (data.item) mergeChat([data.item]);
        if (Array.isArray(data.online)) {
          onlineUsers = data.online;
        }
        pendingMentions.clear();
        renderChat();
        if (input) {
          input.value = '';
          input.focus();
        }
        await loadChat({ incremental: true });
      } finally {
        chatSending = false;
        if (btn) btn.disabled = false;
      }
    }

    function wireChatForm() {
      const form = document.getElementById('chat-form');
      const input = document.getElementById('chat-input');
      if (!form || !input) return;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await sendChat(input.value);
        } catch (err) {
          flash(err.message, false);
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    }

    async function patchMember(userId, body) {
      const res = await fetch(`/api/members/${encodeURIComponent(userId)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || 'Update failed');
      return data;
    }

    function renderPayPanel() {
      const el = document.getElementById('pay-panel');
      const me = state.viewer;
      const t = state.treasurer;
      const myLeague = me?.membershipLeague;
      const amount = myLeague ? duesFor(myLeague) : state.dues.gridiron;
      const leagueLabel = myLeague === 'aaa' ? 'AAA' : (myLeague === 'gridiron' ? 'GridIron 24' : 'your league');
      const paid = Boolean(me?.duesPaid);
      const note = `${t.note || 'League dues'} — ${me?.name || 'Member'}${myLeague ? ` (${leagueLabel})` : ''}`;
      const href = venmoUrl({ amount, note });

      el.innerHTML = `
        <div class="pay-panel">
          <h2>League dues</h2>
          <p>
            Season buy-in paid to treasurer
            <span class="treasurer">${esc(t.name)}</span>
            on Venmo
            (<a href="mailto:${esc(t.email)}">${esc(t.email)}</a>).
          </p>
          <p>
            GridIron 24 <strong>${esc(money(state.dues.gridiron))}</strong>
            · AAA <strong>${esc(money(state.dues.aaa))}</strong>
            · <strong>@${esc(t.venmoUsername)}</strong>
          </p>
          ${myLeague
            ? `<div class="dues-chip ${paid ? 'paid' : 'due'}">
                 ${paid ? `Dues marked paid for ${esc(leagueLabel)}` : `You owe ${esc(money(amount))} for ${esc(leagueLabel)}`}
               </div>`
            : `<p>Once you’re assigned to GridIron or AAA, your dues amount shows here.</p>`}
          <div class="pay-actions">
            <a class="btn-venmo" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Pay with Venmo</a>
            <button type="button" class="btn-ghost" id="copy-note">Copy note</button>
          </div>
        </div>`;

      document.getElementById('copy-note')?.addEventListener('click', async () => {
        try {
          await copyText(note);
          flash('Payment note copied.', true);
        } catch {
          flash('Could not copy note.', false);
        }
      });
    }

    function leagueLabel(key) {
      if (key === 'aaa') return 'AAA';
      if (key === 'gridiron') return 'GridIron 24';
      return '';
    }

    function leaguePill(key) {
      if (key === 'aaa') return '<span class="league-pill is-aaa">AAA</span>';
      if (key === 'gridiron') return '<span class="league-pill">GI24</span>';
      return '';
    }

    function memberRow(m, slot) {
      if (m.open) {
        return `
          <div class="member-row is-open">
            <div class="slot">${esc(String(slot))}</div>
            <div class="name-wrap">
              <div class="name">Open</div>
              <div class="meta">Waiting for assignment</div>
            </div>
            <div class="actions"><span class="status-pill open">Open</span></div>
          </div>`;
      }

      const league = m.membershipLeague || m.league || null;
      const amount = duesFor(league);
      const note = `${state.treasurer.note || 'League dues'} — ${m.name} (${leagueLabel(league) || 'HQ'})`;
      const payHref = venmoUrl({ amount, note });
      const canManage = state.canManage;
      const isMe = state.viewer?.id === m.id;

      const nameCell = canManage
        ? `<input class="name-input" data-name-id="${esc(m.id)}" value="${esc(m.name)}" aria-label="Member name" />`
        : `<div class="name">${esc(m.name)}${leaguePill(league)}</div>`;

      const actions = `
        <span class="status-pill ${m.duesPaid ? 'paid' : 'due'}">${m.duesPaid ? 'Paid' : `Due ${esc(money(amount))}`}</span>
        ${canManage
          ? `<button type="button" class="linkish" data-dues="${esc(m.id)}" data-paid="${m.duesPaid ? '0' : '1'}">${m.duesPaid ? 'Mark unpaid' : 'Mark paid'}</button>
             <button type="button" class="linkish" data-remove="${esc(m.id)}">Remove</button>`
          : ''}
        ${(isMe || canManage) && !m.duesPaid
          ? `<a class="linkish" href="${esc(payHref)}" target="_blank" rel="noopener noreferrer">Venmo</a>`
          : ''}
      `;

      return `
        <div class="member-row" data-user-id="${esc(m.id)}">
          <div class="slot">${esc(String(slot))}</div>
          <div class="name-wrap">
            ${nameCell}${canManage ? leaguePill(league) : ''}
            <div class="meta">${esc(m.loginName)}${isMe ? ' · you' : ''}${league ? ` · ${esc(leagueLabel(league))}` : ''}</div>
          </div>
          <div class="actions">${actions}</div>
        </div>`;
    }

    function allMembers() {
      if (Array.isArray(state.members) && state.members.length) return state.members.slice();
      return [...(state.gridiron || []), ...(state.aaa || [])]
        .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
    }

    function renderUnifiedRoll() {
      const members = allMembers();
      const gi = state.gridiron || [];
      const aaa = state.aaa || [];
      const capGi = state.caps?.gridiron || 24;
      const capAaa = state.caps?.aaa || 12;
      const paid = members.filter((m) => m.duesPaid).length;
      const openGi = Math.max(0, capGi - gi.length);
      const openAaa = Math.max(0, capAaa - aaa.length);
      return `
        <section class="board united">
          <div class="board-head">
            <h2>All members</h2>
            <div class="count">
              <strong>${members.length}</strong> in the lounge
              · GI24 ${gi.length}/${capGi}
              · AAA ${aaa.length}/${capAaa}
              · ${paid} paid
              ${openGi || openAaa ? ` · ${openGi + openAaa} open` : ''}
            </div>
          </div>
          <div class="board-body">
            ${members.length
              ? members.map((m, i) => memberRow(m, i + 1)).join('')
              : `<div class="member-row is-open"><div class="name-wrap"><div class="name">No members on the roll yet</div><div class="meta">Assigned members show up here</div></div></div>`}
          </div>
        </section>`;
    }

    function bindBoardActions() {
      document.querySelectorAll('[data-name-id]').forEach((input) => {
        let timer = null;
        const save = async () => {
          const userId = input.dataset.nameId;
          const name = input.value.trim();
          if (!name) {
            flash('Name cannot be empty.', false);
            return;
          }
          try {
            await patchMember(userId, { name });
            flash('Name updated.', true);
            await load({ quiet: true });
          } catch (err) {
            flash(err.message, false);
          }
        };
        input.addEventListener('change', save);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            input.blur();
          }
        });
        input.addEventListener('input', () => {
          clearTimeout(timer);
          timer = setTimeout(() => {}, 400);
        });
      });

      document.querySelectorAll('[data-dues]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            await patchMember(btn.dataset.dues, { duesPaid: btn.dataset.paid === '1' });
            flash(btn.dataset.paid === '1' ? 'Marked paid.' : 'Marked unpaid.', true);
            await load();
          } catch (err) {
            flash(err.message, false);
          }
        });
      });

      document.querySelectorAll('[data-remove]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!window.confirm('Remove this member from the league roll?')) return;
          try {
            await patchMember(btn.dataset.remove, { league: null, clearDues: true });
            flash('Member removed from league roll.', true);
            await load();
          } catch (err) {
            flash(err.message, false);
          }
        });
      });
    }

    function render() {
      renderPayPanel();
      document.getElementById('boards').innerHTML = renderUnifiedRoll();
      bindBoardActions();
    }

    async function load({ quiet = false } = {}) {
      const res = await fetch('/api/members', { cache: 'no-store' });
      if (res.status === 401) {
        window.location.replace('/enter?next=' + encodeURIComponent('/members.html'));
        return;
      }
      const data = await readJsonResponse(res, 'Could not load members');
      if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load members');
      state = data;
      if (data.viewer?.id) chatViewerId = data.viewer.id;
      render();
      if (!quiet) {
        window.GridIronNav?.setSync(`Lounge · ${new Date(data.generatedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      }
    }

    (async () => {
      wireChatForm();
      document.addEventListener('gi:presence', (e) => {
        if (Array.isArray(e.detail?.online)) {
          onlineUsers = e.detail.online;
        }
      });
      loadSportsScores();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearTimeout(sportsFlipTimer);
        } else if (sportsAuto) {
          scheduleSportsFlip(SPORTS_FLIP_MS);
        }
      });
      try {
        await load();
        await loadChat();
        startChatPoll();
        if (location.hash === '#room') {
          document.getElementById('room')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        if (location.hash === '#board') {
          document.getElementById('sports-board')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="msg">${esc(err.message)}</div>`;
        setChatLive(false);
      }
    })();
  </script>
</body>
</html>
