<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members Lounge · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=87" />
  <style>
    body[data-page="members"] {
      --mo-blue: #2f7bff;
      --mo-blue-hot: #7ec8ff;
      --mo-gold: #e8c45a;
      --mo-gold-soft: #f3d98a;
      --mo-silver: #dce6f5;
      --mo-muted: #8fa0b8;
      --mo-text: #f4f7ff;
      --mo-good: #4dff9a;
      --mo-due: #ff9b6a;
      --mo-line: rgba(126, 200, 255, 0.18);
      color: var(--mo-text);
      background:
        radial-gradient(ellipse 70% 42% at 50% -5%, rgba(47, 123, 255, 0.35), transparent 58%),
        radial-gradient(ellipse 35% 28% at 12% 30%, rgba(232, 196, 90, 0.08), transparent 55%),
        radial-gradient(ellipse 40% 30% at 88% 40%, rgba(47, 123, 255, 0.1), transparent 55%),
        linear-gradient(180deg, #01040c 0%, #030a16 40%, #01040c 100%);
      background-attachment: fixed;
    }

    body[data-page="members"] .page-hero { display: none; }
    body[data-page="members"] .page-main.shell {
      padding-top: 0.35rem;
      padding-bottom: 3.5rem;
      width: 100%;
      max-width: min(110rem, 100%);
      margin: 0 auto;
      padding-left: clamp(1.15rem, 2.2vw, 2.5rem);
      padding-right: clamp(1.15rem, 2.2vw, 2.5rem);
    }
    body[data-page="members"] .topbar {
      background: rgba(1, 4, 12, 0.78);
      backdrop-filter: blur(14px);
      border-bottom-color: var(--mo-line);
    }
    body[data-page="members"] .topbar .shell,
    body[data-page="members"] .site-footer.shell {
      max-width: min(110rem, 100%);
      margin: 0 auto;
      padding-left: clamp(1.15rem, 2.2vw, 2.5rem);
      padding-right: clamp(1.15rem, 2.2vw, 2.5rem);
    }
    body[data-page="members"] .site-footer {
      border-top-color: var(--mo-line);
      color: var(--mo-muted);
    }
    body[data-page="members"] .site-footer-author { color: var(--mo-blue-hot); }

    .lounge { display: grid; gap: 0; }

    /* —— Hero mark —— */
    .lounge-hero {
      position: relative;
      text-align: center;
      padding: 0.25rem 0 1.5rem;
    }
    .lounge-hero::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 10%;
      height: 70%;
      background: radial-gradient(ellipse at center, rgba(47, 123, 255, 0.38), transparent 68%);
      filter: blur(22px);
      pointer-events: none;
      z-index: 0;
    }
    .lounge-hero img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      max-width: 92rem;
      height: auto;
      margin: 0 auto;
      filter:
        drop-shadow(0 0 40px rgba(47, 123, 255, 0.4))
        drop-shadow(0 24px 50px rgba(0, 0, 0, 0.7));
    }
    .lounge-tag {
      position: relative;
      z-index: 1;
      margin: 0.75rem 0 0;
      font-family: "Bebas Neue", "Oswald", sans-serif;
      font-size: clamp(1.05rem, 2.2vw, 1.4rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--mo-gold-soft);
    }

    .lounge-controls {
      display: grid;
      gap: 0.65rem;
      justify-items: center;
      padding: 0 0 1.75rem;
      border-bottom: 1px solid var(--mo-line);
    }

    .sports-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-family: "Oswald", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mo-muted);
    }
    .sports-live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #9dffc4;
      font-weight: 600;
      background: none;
      border: 0;
      padding: 0;
      box-shadow: none;
    }
    .sports-live-pill[hidden] { display: none; }
    .sports-live-pill .pulse {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--mo-good);
      box-shadow: 0 0 10px var(--mo-good);
      animation: mo-pulse 1.3s ease-in-out infinite;
    }
    @keyframes mo-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .sports-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.15rem 0.35rem;
    }
    .sports-tab {
      appearance: none;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--mo-muted);
      font-family: "Oswald", sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
    }
    .sports-tab:hover { color: var(--mo-text); }
    .sports-tab.is-on {
      color: var(--mo-blue-hot);
      border-bottom-color: var(--mo-blue);
      background: transparent;
      box-shadow: none;
      font-weight: 700;
    }
    .sports-tab .count { margin-left: 0.25rem; opacity: 0.7; }

    /* —— Scores: open scoreboard —— */
    .lounge-scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem clamp(2rem, 4vw, 4rem);
      padding: 2rem 0 0.5rem;
    }
    .lounge-scorecol > h2 {
      margin: 0 0 0.35rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--mo-line);
      font-family: "Bebas Neue", "Oswald", sans-serif;
      font-size: clamp(1.7rem, 3vw, 2.2rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mo-blue-hot);
    }
    .lounge-scorecol.is-upcoming > h2 { color: var(--mo-gold-soft); }

    .sports-grid {
      display: grid;
      gap: 0;
      overflow: visible;
    }
    .sports-grid.is-flip { animation: sports-flip 0.4s ease both; }
    @keyframes sports-flip {
      from { opacity: 0; transform: translateY(0.35rem); }
      to { opacity: 1; transform: none; }
    }
    .sports-empty {
      padding: 1.25rem 0;
      color: var(--mo-muted);
      font-family: "Oswald", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .sgame {
      padding: 0.85rem 0;
      border: 0;
      border-bottom: 1px solid rgba(126, 200, 255, 0.1);
      background: transparent;
      box-shadow: none;
    }
    .sgame:last-child { border-bottom: 0; }
    .sgame:hover { background: transparent; transform: none; box-shadow: none; }
    .sgame.is-live .sgame-status { color: #9dffc4; }
    .sgame.is-final { opacity: 0.72; }
    .lounge-scorecol.is-upcoming .sgame,
    .lounge-scorecol.is-upcoming .sgame:hover {
      border-left: 0;
      background: transparent;
      box-shadow: none;
    }
    .sgame-top {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mo-muted);
    }
    .sgame-league {
      color: var(--mo-gold);
      font-weight: 700;
      font-family: "Oswald", sans-serif;
    }
    .sgame-status.is-live {
      color: #9dffc4;
      font-weight: 700;
    }
    .sgame-row {
      display: grid;
      grid-template-columns: 1.45rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.45rem;
      min-height: 1.4rem;
    }
    .sgame-row + .sgame-row { margin-top: 0.2rem; }
    .sgame-row img {
      width: 1.35rem;
      height: 1.35rem;
      object-fit: contain;
    }
    .sgame-abbr {
      font-family: "Oswald", sans-serif;
      font-size: 1.12rem;
      letter-spacing: 0.05em;
      color: var(--mo-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sgame-row.is-winner .sgame-abbr,
    .sgame-row.is-winner .sgame-score {
      color: #fff;
      font-weight: 700;
    }
    .sgame-score {
      font-family: "Bebas Neue", "Oswald", sans-serif;
      font-size: 1.55rem;
      font-variant-numeric: tabular-nums;
      color: var(--mo-silver);
      min-width: 1.6rem;
      text-align: right;
      line-height: 1;
    }
    .sgame-score.is-blank {
      color: var(--mo-muted);
      font-size: 1rem;
      font-family: "Oswald", sans-serif;
    }
    .sgame.is-golf { grid-column: auto; }
    .sgolf-title {
      margin: 0 0 0.35rem;
      font-family: "Oswald", sans-serif;
      font-size: 1rem;
      color: var(--mo-text);
    }
    .sgolf-leaders { display: grid; gap: 0.2rem; }
    .sgolf-row {
      display: grid;
      grid-template-columns: 1.6rem minmax(0, 1fr) 2rem 1.6rem;
      gap: 0.25rem;
      align-items: center;
      font-size: 0.8rem;
      color: var(--mo-silver);
    }
    .sgolf-row.is-live { color: #9dffc4; }
    .sgolf-pos { font-family: "Oswald", sans-serif; color: var(--mo-gold); }
    .sgolf-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sgolf-score {
      font-family: "Oswald", sans-serif;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--mo-text);
    }
    .sgolf-thru {
      text-align: right;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--mo-muted);
    }

    /* —— Chat + dues: open, no panels —— */
    .lounge-mid {
      display: grid;
      grid-template-columns: minmax(0, 1.85fr) minmax(15rem, 0.7fr);
      gap: clamp(2rem, 4vw, 3.5rem);
      align-items: start;
      margin-top: 2.25rem;
      padding-top: 2rem;
      border-top: 1px solid var(--mo-line);
    }

    .im-window {
      display: grid;
      gap: 1.1rem;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    .im-titlebar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0;
      background: transparent;
      border: 0;
    }
    .im-titlebar-left { min-width: 0; }
    .im-title h2 {
      margin: 0;
      font-family: "Bebas Neue", "Oswald", sans-serif;
      font-size: clamp(1.7rem, 3vw, 2.25rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-text);
    }
    .im-title .sub {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.85rem;
      color: var(--mo-muted);
      letter-spacing: 0.04em;
    }
    .chat-live {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0;
      border: 0;
      background: transparent;
      font-family: "Oswald", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9dffc4;
    }
    .chat-live .dot {
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: var(--mo-good);
      box-shadow: 0 0 8px var(--mo-good);
      animation: mo-pulse 1.4s ease-in-out infinite;
    }
    .chat-live.is-idle { color: var(--mo-muted); }
    .chat-live.is-idle .dot {
      background: #64748b;
      box-shadow: none;
      animation: none;
    }

    .im-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(11rem, 15rem);
      gap: clamp(1.5rem, 3vw, 2.75rem);
      margin: 0;
      border: 0;
      background: transparent;
      overflow: visible;
    }
    .im-main {
      display: grid;
      gap: 0.85rem;
      min-width: 0;
      padding: 0;
      border: 0;
    }
    .chat-log {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      padding: 0;
      overflow: visible;
      background: transparent;
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 1.05rem;
      color: var(--mo-text);
    }
    .chat-empty {
      margin: 0;
      padding: 0.5rem 0 1rem;
      color: var(--mo-muted);
      font-family: "Oswald", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .im-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.5rem;
      align-items: baseline;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(126, 200, 255, 0.07);
      line-height: 1.45;
      background: transparent;
      box-shadow: none;
    }
    .im-line:hover,
    .im-line.mine {
      background: transparent;
      box-shadow: none;
    }
    .im-line.mine .im-who { color: var(--mo-blue-hot); }
    .im-line-main { min-width: 0; word-break: break-word; }
    .im-who {
      cursor: pointer;
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
      font-weight: 800;
      color: var(--mo-gold-soft);
    }
    .im-who:hover { color: #fff; text-decoration: underline; }
    .im-who:disabled { cursor: default; text-decoration: none; }
    .im-sep { color: var(--mo-muted); margin-right: 0.2rem; font-weight: 700; }
    .im-text { white-space: pre-wrap; color: #d5e0f0; }
    .im-text .chat-mention,
    .chat-mention {
      color: var(--mo-blue-hot);
      font-weight: 700;
      background: none;
      padding: 0;
      text-shadow: none;
    }
    .im-meta {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      color: var(--mo-muted);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .im-line:hover .im-meta,
    .im-line:focus-within .im-meta { opacity: 1; }
    .chat-msg-del {
      appearance: none;
      border: 0;
      background: transparent;
      color: #f87171;
      font: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
    }

    .mention-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.65rem;
    }
    .mention-bar[hidden] { display: none !important; }
    .mention-bar-label {
      font-family: "Oswald", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mo-muted);
    }
    .mention-chip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--mo-blue-hot);
      font-family: "Oswald", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: none;
    }
    .mention-chip:hover { color: #fff; text-decoration: underline; }
    .mention-chip .x { opacity: 0.65; }

    .chat-compose {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: end;
      padding: 0.85rem 0 0;
      border-top: 1px solid var(--mo-line);
      background: transparent;
    }
    .chat-compose textarea {
      width: 100%;
      min-height: 2.85rem;
      max-height: 7rem;
      resize: vertical;
      padding: 0.55rem 0;
      border: 0;
      border-bottom: 1px solid rgba(126, 200, 255, 0.35);
      border-radius: 0;
      background: transparent;
      color: var(--mo-text);
      font: inherit;
      font-size: 1.02rem;
      line-height: 1.4;
      box-shadow: none;
    }
    .chat-compose textarea:focus {
      outline: none;
      border-bottom-color: var(--mo-blue-hot);
    }
    .chat-compose textarea::placeholder { color: rgba(143, 160, 184, 0.75); }
    .chat-compose button {
      appearance: none;
      align-self: end;
      min-height: 2.5rem;
      min-width: 4.75rem;
      padding: 0.4rem 0.9rem;
      border: 0;
      border-bottom: 2px solid var(--mo-blue);
      border-radius: 0;
      background: transparent;
      color: var(--mo-blue-hot);
      font-family: "Oswald", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: none;
    }
    .chat-compose button:disabled { opacity: 0.45; cursor: default; }
    .chat-compose button:hover:not(:disabled) { color: #fff; border-bottom-color: #fff; }

    .im-buddies {
      display: grid;
      gap: 0.65rem;
      align-content: start;
      padding: 0;
      background: transparent;
    }
    .im-buddies-head {
      font-family: "Bebas Neue", "Oswald", sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-text);
      line-height: 1.1;
    }
    .im-buddies-head small {
      display: block;
      margin-top: 0.25rem;
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      text-transform: none;
      color: var(--mo-muted);
      font-weight: 500;
    }
    .presence-list {
      display: grid;
      gap: 0.15rem;
      overflow: visible;
    }
    .presence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      width: 100%;
      padding: 0.4rem 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .presence-row:hover {
      background: transparent;
      transform: none;
      border: 0;
    }
    .presence-row:hover .nm { color: #fff; }
    .presence-row .nm {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--mo-silver);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .presence-row .nm::before {
      content: "";
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: var(--mo-good);
      box-shadow: 0 0 8px rgba(77, 255, 154, 0.85);
      flex: 0 0 auto;
    }
    .presence-row .lg {
      font-family: "Oswald", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-blue-hot);
    }
    .presence-row.is-me { cursor: default; }
    .presence-row.is-me .nm { color: var(--mo-gold-soft); }
    .presence-row.is-me .nm::before {
      background: var(--mo-gold);
      box-shadow: 0 0 8px rgba(232, 196, 90, 0.7);
    }
    .presence-row.is-me .lg { color: var(--mo-gold); }
    .presence-empty {
      color: var(--mo-muted);
      font-size: 0.9rem;
      padding: 0.35rem 0;
      line-height: 1.45;
    }

    .lounge-dues {
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }
    .lounge-dues h2,
    .pay-panel h2 {
      margin: 0 0 0.55rem;
      font-family: "Bebas Neue", "Oswald", sans-serif;
      font-size: clamp(1.7rem, 3vw, 2.25rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-gold-soft);
      text-shadow: none;
    }
    .lounge-dues p,
    .pay-panel p {
      margin: 0 0 0.65rem;
      color: var(--mo-silver);
      line-height: 1.55;
      font-size: 1rem;
    }
    .pay-panel {
      display: grid;
      gap: 0.55rem;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    .pay-panel .treasurer { color: #fff; font-weight: 700; }
    .pay-panel a { color: var(--mo-blue-hot); }
    .pay-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
      margin-top: 0.35rem;
    }
    .btn-venmo {
      appearance: none;
      display: inline-flex;
      align-items: center;
      min-height: 2.4rem;
      padding: 0.35rem 0;
      border: 0;
      border-bottom: 2px solid var(--mo-blue);
      background: transparent;
      color: var(--mo-blue-hot);
      font-family: "Oswald", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: none;
    }
    .btn-venmo:hover { color: #fff; border-bottom-color: #fff; filter: none; }
    .btn-ghost {
      appearance: none;
      min-height: 2.4rem;
      padding: 0.35rem 0;
      border: 0;
      border-bottom: 1px solid rgba(232, 196, 90, 0.45);
      background: transparent;
      color: var(--mo-gold-soft);
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-ghost:hover {
      color: #fff;
      border-bottom-color: #fff;
      background: transparent;
    }
    .dues-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0;
      border: 0;
      background: transparent;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--mo-gold-soft);
    }
    .dues-chip.paid { color: var(--mo-good); border: 0; background: transparent; }
    .dues-chip.due { color: var(--mo-due); border: 0; background: transparent; }

    /* —— Membership roll —— */
    .roll-section {
      margin: 2.5rem 0 0;
      padding: 2rem 0 0;
      border-top: 1px solid var(--mo-line);
      overflow: visible;
    }
    .roll-section > .section-label {
      margin: 0 0 1rem;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .roll-section > .section-label h2 {
      margin: 0;
      font-family: "Bebas Neue", "Oswald", sans-serif;
      font-size: clamp(1.7rem, 3vw, 2.25rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-text);
      text-shadow: none;
    }
    .roll-section > .section-label p { display: none; }

    .boards { display: grid; gap: 0; margin: 0; overflow: visible; }
    .board { border: 0; background: transparent; box-shadow: none; }
    .board-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0 0 0.65rem;
      border-bottom: 1px solid var(--mo-line);
      background: transparent;
    }
    .board-head h2 { display: none; }
    .board-head .count {
      color: var(--mo-muted);
      font-size: 0.95rem;
      width: 100%;
      font-family: "Oswald", sans-serif;
      letter-spacing: 0.06em;
    }
    .board-head .count strong {
      color: var(--mo-blue-hot);
      font-weight: 700;
      font-size: 1.1rem;
    }
    .league-pill {
      display: inline;
      margin-left: 0.35rem;
      padding: 0;
      border: 0;
      font-family: "Oswald", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mo-blue-hot);
      background: transparent;
    }
    .league-pill.is-aaa {
      border: 0;
      color: var(--mo-gold-soft);
      background: transparent;
    }
    .board-body { padding: 0.2rem 0 0.5rem; }
    .member-row {
      display: grid;
      grid-template-columns: 2.25rem minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(126, 200, 255, 0.1);
      background: transparent;
    }
    .member-row:hover { background: transparent; }
    .member-row:last-child { border-bottom: 0; }
    .member-row.is-open { opacity: 0.55; }
    .member-row .slot {
      color: var(--mo-gold);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-align: right;
      font-family: "Bebas Neue", "Oswald", sans-serif;
      font-size: 1.25rem;
      text-shadow: none;
    }
    .member-row .name-wrap { min-width: 0; }
    .member-row .name {
      font-weight: 700;
      font-size: 1.08rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--mo-text);
    }
    .member-row .name-input {
      width: 100%;
      padding: 0.35rem 0;
      border: 0;
      border-bottom: 1px solid rgba(126, 200, 255, 0.35);
      background: transparent;
      color: var(--mo-text);
      font: inherit;
      font-weight: 600;
    }
    .member-row .name-input:focus {
      outline: none;
      border-bottom-color: var(--mo-blue-hot);
      box-shadow: none;
    }
    .member-row .meta {
      color: var(--mo-muted);
      font-size: 0.82rem;
      margin-top: 0.15rem;
    }
    .member-row .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.65rem;
      justify-content: flex-end;
      align-items: center;
    }
    .status-pill {
      font-family: "Oswald", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .status-pill.paid { color: var(--mo-good); border: 0; background: transparent; }
    .status-pill.due { color: var(--mo-due); border: 0; background: transparent; }
    .status-pill.open { color: var(--mo-muted); }
    .linkish {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--mo-blue-hot);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }
    .linkish:hover { text-decoration: underline; color: #fff; }

    .flash {
      margin: 0.75rem 0 1rem;
      padding: 0.65rem 0;
      border: 0;
      border-bottom: 1px solid rgba(126, 200, 255, 0.35);
      color: var(--mo-text);
      background: transparent;
    }
    .flash.ok { border-bottom-color: rgba(77, 255, 154, 0.45); color: var(--mo-good); background: transparent; }
    .flash.err { border-bottom-color: rgba(239, 68, 68, 0.45); color: #fca5a5; background: transparent; }
    .flash[hidden] { display: none !important; }

    .mo-lock {
      display: inline-grid;
      place-items: center;
      width: 0.95rem;
      height: 0.95rem;
      border-radius: 50%;
      background: var(--mo-blue);
      color: #020617;
      margin-right: 0.35rem;
      vertical-align: -0.1rem;
      box-shadow: none;
    }
    .mo-lock svg { width: 0.55rem; height: 0.55rem; display: block; }

    @media (max-width: 900px) {
      .lounge-hero img { width: 100%; }
      .lounge-scores,
      .lounge-mid,
      .im-body {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .member-row { grid-template-columns: 1.85rem minmax(0, 1fr); }
      .member-row .actions {
        grid-column: 2;
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sports-live-pill .pulse,
      .chat-live .dot { animation: none !important; }
    }
  </style>
</head>
<body data-page="members">

    <p class="eyebrow">Members lounge</p>

  <main class="page-main shell">
    <div class="flash" id="flash" hidden></div>
    <div class="lounge" id="sports-board" aria-label="Members lounge">
      <header class="lounge-hero">
        <img src="/assets/members-lounge.jpg?v=4" alt="GridIron 24 Members Only" width="1024" height="576" />
      </header>
      <div class="lounge-controls">
        <div class="sports-tabs" id="sports-tabs" role="tablist" aria-label="Sport filter"></div>
        <div class="sports-meta">
          <span class="sports-live-pill" id="sports-live-pill" hidden><span class="pulse" aria-hidden="true"></span><span id="sports-live-count">0 live</span></span>
          <span id="sports-updated">Updating…</span>
        </div>
      </div>

      <div class="lounge-scores">
        <section class="lounge-scorecol" aria-label="Live scores">
          <h2>Live</h2>
          <div class="sports-grid" id="sports-grid-left" aria-live="polite">
            <div class="sports-empty">Loading…</div>
          </div>
        </section>
        <section class="lounge-scorecol is-upcoming" aria-label="Upcoming scores">
          <h2>Upcoming</h2>
          <div class="sports-grid" id="sports-grid-right" aria-live="polite">
            <div class="sports-empty">Loading…</div>
          </div>
        </section>
      </div>

      <div class="lounge-mid">
        <section class="im-window" id="room" aria-label="Roll Call Room">
          <div class="im-titlebar">
            <div class="im-titlebar-left">
              <div class="im-title">
                <h2>Roll Call Room</h2>
                <span class="sub">Click a name to @mention</span>
              </div>
            </div>
            <div class="chat-live is-idle" id="chat-live"><span class="dot" aria-hidden="true"></span><span id="chat-live-label">Connecting</span></div>
          </div>
          <div class="im-body">
            <div class="im-main">
              <div class="chat-log" id="chat-log" aria-live="polite"><div class="chat-empty">Signing on to the lounge…</div></div>
              <div class="mention-bar" id="mention-bar" hidden></div>
              <form class="chat-compose" id="chat-form">
                <textarea id="chat-input" maxlength="1000" rows="2" placeholder="Type a message… or click someone online to @mention" autocomplete="off"></textarea>
                <button type="submit" id="chat-send">Send</button>
              </form>
            </div>
            <aside class="im-buddies" id="presence-card" aria-label="Online members">
              <div class="im-buddies-head">Online members<small>Click a name to @mention</small></div>
              <div class="presence-list" id="presence-list"><div class="presence-empty">No members online right now.</div></div>
            </aside>

        <aside class="lounge-dues" id="pay-panel"></aside>
      </div>

      <section class="roll-section">
        <div class="section-label">
          <h2>The membership roll</h2>
        </div>
        <div class="boards" id="boards"><div class="msg">Loading the roll…</div></div>
      </section>
    </div>
  </main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><img class="site-footer-mark" src="/assets/gridiron24-crest.png?v=6" alt="GridIron 24" width="224" height="224" decoding="async" /><span class="site-footer-by">Created by <span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=68"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    let state = null;
    let chatMessages = [];
    let chatViewerId = null;
    let chatPollTimer = null;
    let chatSending = false;
    let onlineUsers = [];
    const pendingMentions = new Map(); // id -> name
    const CHAT_POLL_MS = 2500;

    let sportsData = null;
    let sportsFilter = 'all';
    let sportsPollTimer = null;
    let sportsFlipTimer = null;
    let sportsAuto = true;
    const SPORTS_POLL_MS = 25000;
    const SPORTS_POLL_LIVE_MS = 15000;
    const SPORTS_FLIP_MS = 7000;
    const SPORTS_FLIP_PAUSE_MS = 20000;

    async function readJsonResponse(res, fallbackError) {
      const text = await res.text();
      const trimmed = String(text || '').trim();
      if (!trimmed) {
        throw new Error(fallbackError || `Empty response (${res.status})`);
      }
      try {
        return JSON.parse(trimmed);
      } catch {
        const looksHtml = trimmed.startsWith('<!') || /<html[\s>]/i.test(trimmed);
        throw new Error(
          looksHtml
            ? 'Lounge API returned a web page instead of data. Refresh and try again.'
            : (fallbackError || `Invalid response (${res.status})`)
        );
      }
    }

    function money(n) {
      const v = Number(n || 0);
      return `$${v.toFixed(v % 1 ? 2 : 0)}`;
    }

    function kickShort(iso) {
      if (!iso) return 'TBD';
      try {
        const d = new Date(iso);
        return d.toLocaleString([], {
          weekday: 'short',
          hour: 'numeric',
          minute: '2-digit'
        });
      } catch {
        return 'TBD';
      }
    }

    function sportsStatusLine(g) {
      const bucket = g.status?.bucket || 'upcoming';
      if (bucket === 'live') return g.status?.shortDetail || g.status?.detail || 'LIVE';
      if (bucket === 'final') return 'Final';
      const net = (g.broadcasts || [])[0];
      const kick = kickShort(g.date);
      return net ? `${kick} · ${net}` : kick;
    }

    function flatSportsGames(data, filter) {
      const boards = Array.isArray(data?.leagues) ? data.leagues : [];
      const rows = [];
      for (const board of boards) {
        for (const g of board.games || []) {
          rows.push({ ...g, leagueLabel: board.label || g.league });
        }
      }
      if (!filter || filter === 'all' || filter === 'live') return rows;
      return rows.filter((g) => (g.league || '') === filter);
    }

    function sportsGameHtml(g, i) {
      const bucket = g.status?.bucket || 'upcoming';
      const delay = Math.min(i * 0.03, 0.35);

      if (g.kind === 'golf') {
        const leaders = Array.isArray(g.leaders) ? g.leaders : [];
        const rows = leaders.map((p) => {
          const live = p.state === 'in';
          const thru = p.thru ? (String(p.thru).toUpperCase() === 'F' || p.thru === '18' ? 'F' : p.thru) : '';
          return `<div class="sgolf-row${live ? ' is-live' : ''}">
            <span class="sgolf-pos">${esc(p.position || '—')}</span>
            <span class="sgolf-name" title="${esc(p.name || '')}">${esc(p.shortName || p.name || '—')}</span>
            <span class="sgolf-score">${esc(p.score || '—')}</span>
            <span class="sgolf-thru">${esc(thru)}</span>
          </div>`;
        }).join('');
        return `<article class="sgame is-golf is-${esc(bucket)}" style="animation-delay:${delay}s" title="${esc(g.name || '')}">
          <div class="sgame-top">
            <span class="sgame-league">Golf</span>
            <span class="sgame-status${bucket === 'live' ? ' is-live' : ''}">${esc(sportsStatusLine(g))}</span>
          </div>
          <h3 class="sgolf-title">${esc(g.shortName || g.name || 'Tournament')}</h3>
          <div class="sgolf-leaders">${rows || '<div class="sports-empty" style="padding:0.5rem 0">No leaderboard yet</div>'}</div>
        </article>`;
      }

      const showScore = bucket === 'final' || bucket === 'live';
      const awayWin = bucket === 'final' && Boolean(g.away?.winner);
      const homeWin = bucket === 'final' && Boolean(g.home?.winner);
      const side = (t, win) => {
        if (!t) return '';
        const score = showScore && t.score != null
          ? `<span class="sgame-score">${esc(String(t.score))}</span>`
          : `<span class="sgame-score is-blank">—</span>`;
        const logo = t.logo
          ? `<img src="${esc(t.logo)}" alt="" loading="lazy" width="22" height="22" />`
          : `<span></span>`;
        return `<div class="sgame-row${win ? ' is-winner' : ''}">
          ${logo}
          <span class="sgame-abbr" title="${esc(t.name || t.abbreviation || '')}">${esc(t.abbreviation || t.shortName || '?')}</span>
          ${score}
        </div>`;
      };
      const leagueLabel = g.league === 'llws' ? 'LLWS' : (g.leagueLabel || g.league || '');
      return `<article class="sgame is-${esc(bucket)}" style="animation-delay:${delay}s" title="${esc(g.name || '')}">
        <div class="sgame-top">
          <span class="sgame-league">${esc(leagueLabel)}</span>
          <span class="sgame-status${bucket === 'live' ? ' is-live' : ''}">${esc(sportsStatusLine(g))}</span>
        </div>
        ${side(g.away, awayWin)}
        ${side(g.home, homeWin)}
      </article>`;
    }

    function sportsRotateIds() {
      const boards = Array.isArray(sportsData?.leagues) ? sportsData.leagues : [];
      const withAction = boards.filter((b) =>
        (b.games || []).some((g) => {
          const bucket = g.status?.bucket;
          return bucket === 'live' || bucket === 'upcoming';
        })
      );
      const pool = withAction.length ? withAction : boards.filter((b) => (b.games || []).length);
      return pool.map((b) => b.id).filter(Boolean);
    }

    function markSportsTabs() {
      const root = document.getElementById('sports-tabs');
      if (!root) return;
      root.querySelectorAll('.sports-tab').forEach((btn) => {
        const on = (btn.dataset.filter || '') === sportsFilter;
        btn.classList.toggle('is-on', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }

    function scheduleSportsFlip(delay = SPORTS_FLIP_MS) {
      clearTimeout(sportsFlipTimer);
      if (!sportsAuto || document.hidden) return;
      sportsFlipTimer = setTimeout(() => {
        const ids = sportsRotateIds();
        if (!ids.length) {
          sportsFilter = 'all';
          renderSportsBoard({ rebuildTabs: false });
          scheduleSportsFlip();
          return;
        }
        const idx = ids.indexOf(sportsFilter);
        sportsFilter = ids[(idx + 1 + ids.length) % ids.length];
        renderSportsBoard({ rebuildTabs: false });
        scheduleSportsFlip();
      }, delay);
    }

    function pauseSportsAutoFlip() {
      sportsAuto = false;
      clearTimeout(sportsFlipTimer);
      sportsFlipTimer = setTimeout(() => {
        sportsAuto = true;
        scheduleSportsFlip(SPORTS_FLIP_MS);
      }, SPORTS_FLIP_PAUSE_MS);
    }

    function renderSportsTabs() {
      const root = document.getElementById('sports-tabs');
      if (!root) return;
      const boards = Array.isArray(sportsData?.leagues) ? sportsData.leagues : [];
      const tabs = [
        { id: 'all', label: 'All', count: Number(sportsData?.totals?.games || 0) },
        ...boards.map((b) => ({
          id: b.id,
          label: b.label,
          count: (b.games || []).length
        }))
      ];
      root.innerHTML = tabs.map((t) => `
        <button type="button" class="sports-tab${sportsFilter === t.id ? ' is-on' : ''}"
          role="tab" aria-selected="${sportsFilter === t.id}" data-filter="${esc(t.id)}">
          ${esc(t.label)}<span class="count">${t.count}</span>
        </button>
      `).join('');
      root.querySelectorAll('.sports-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          sportsFilter = btn.dataset.filter || 'all';
          pauseSportsAutoFlip();
          renderSportsBoard({ rebuildTabs: false });
          markSportsTabs();
        });
      });
    }

    function fillSportsRail(el, games, emptyMsg) {
      if (!el) return;
      if (!games.length) {
        el.innerHTML = `<div class="sports-empty">${emptyMsg}</div>`;
        return;
      }
      el.innerHTML = games.map((g, i) => sportsGameHtml(g, i)).join('');
    }

    function renderSportsBoard({ rebuildTabs = true } = {}) {
      const left = document.getElementById('sports-grid-left');
      const right = document.getElementById('sports-grid-right');
      const pill = document.getElementById('sports-live-pill');
      const liveCount = document.getElementById('sports-live-count');
      const updated = document.getElementById('sports-updated');
      if (!left || !right) return;

      if (rebuildTabs) renderSportsTabs();
      else markSportsTabs();

      const liveN = Number(sportsData?.totals?.live || 0);
      if (pill) {
        pill.hidden = liveN < 1;
        if (liveCount) liveCount.textContent = `${liveN} live`;
      }
      if (updated && sportsData?.fetchedAt) {
        const t = new Date(sportsData.fetchedAt);
        updated.textContent = `Updated ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
      }

      const games = flatSportsGames(sportsData, sportsFilter);
      const live = games.filter((g) => g.status?.bucket === 'live');
      const upcoming = games.filter((g) => g.status?.bucket === 'upcoming');
      left.classList.remove('is-flip');
      right.classList.remove('is-flip');
      void left.offsetWidth;
      left.classList.add('is-flip');
      right.classList.add('is-flip');
      fillSportsRail(left, live, 'No games live right now.');
      fillSportsRail(right, upcoming, 'Nothing upcoming on this slate.');
    }

    function scheduleSportsPoll() {
      clearTimeout(sportsPollTimer);
      const live = Number(sportsData?.totals?.live || 0) > 0;
      sportsPollTimer = setTimeout(() => { loadSportsScores(); }, live ? SPORTS_POLL_LIVE_MS : SPORTS_POLL_MS);
    }

    async function loadSportsScores() {
      try {
        const res = await fetch('/api/sports-scores', { cache: 'no-store' });
        if (res.status === 401) return;
        const data = await readJsonResponse(res, 'Scores unavailable');
        if (!res.ok || !data.ok) throw new Error(data.error || 'Scores unavailable');
        const firstLoad = !sportsData;
        sportsData = data;
        if (firstLoad || sportsFilter === 'all') {
          const ids = sportsRotateIds();
          if (ids.length && sportsAuto) sportsFilter = ids[0];
        }
        renderSportsBoard({ rebuildTabs: true });
        if (sportsAuto) scheduleSportsFlip();
      } catch (err) {
        if (!sportsData) {
          const msg = `<div class="sports-empty">${esc(err.message || 'Could not load scores')}</div>`;
          const left = document.getElementById('sports-grid-left');
          const right = document.getElementById('sports-grid-right');
          if (left) left.innerHTML = msg;
          if (right) right.innerHTML = msg;
        }
      } finally {
        scheduleSportsPoll();
      }
    }

    function flash(text, ok = true) {
      const el = document.getElementById('flash');
      if (!text) {
        el.hidden = true;
        el.textContent = '';
        return;
      }
      el.hidden = false;
      el.className = `flash ${ok ? 'ok' : 'err'}`;
      el.textContent = text;
    }

    function duesFor(league) {
      if (!state) return 0;
      return league === 'aaa' ? state.dues.aaa : state.dues.gridiron;
    }

    function venmoUrl({ amount, note }) {
      const user = state?.treasurer?.venmoUsername || 'jaceto53';
      const params = new URLSearchParams({
        txn: 'pay',
        audience: 'private',
        recipients: user,
        amount: String(amount || ''),
        note: note || state?.treasurer?.note || 'League dues'
      });
      return `https://venmo.com/${encodeURIComponent(user)}?${params.toString()}`;
    }

    function copyText(text) {
      if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return Promise.resolve();
    }

    function formatChatBody(text) {
      const names = [...pendingMentions.values(), ...onlineUsers.map((u) => u.name), ...(state?.gridiron || []).map((u) => u.name), ...(state?.aaa || []).map((u) => u.name)]
        .filter(Boolean)
        .sort((a, b) => String(b).length - String(a).length);
      let html = esc(text);
      const seen = new Set();
      for (const name of names) {
        const key = String(name).toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        const escaped = esc(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        html = html.replace(new RegExp(`(^|\\s)(@${escaped})(?=$|[\\s.,!?;:)'"\\]])`, 'gi'), '$1<span class="chat-mention">$2</span>');
      }
      return html;
    }

    function insertMention(user) {
      if (!user?.id || !user?.name) return;
      if (user.id === chatViewerId) return;
      pendingMentions.set(user.id, user.name);
      renderMentionBar();
      const input = document.getElementById('chat-input');
      if (!input) return;
      const token = `@${user.name} `;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      const before = input.value.slice(0, start);
      const after = input.value.slice(end);
      const needsSpace = before && !/\s$/.test(before);
      input.value = `${before}${needsSpace ? ' ' : ''}${token}${after}`;
      input.focus();
      const caret = (before + (needsSpace ? ' ' : '') + token).length;
      input.setSelectionRange(caret, caret);
    }

    function clearMention(userId) {
      if (!userId) return;
      const name = pendingMentions.get(userId);
      pendingMentions.delete(userId);
      renderMentionBar();
      const input = document.getElementById('chat-input');
      if (!input || !name) return;
      const re = new RegExp(`(?:^|\\s)@${String(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?=\\s|$)`, 'i');
      input.value = input.value.replace(re, (m) => (m.startsWith(' ') ? ' ' : '')).replace(/\s{2,}/g, ' ').trimStart();
    }

    function renderMentionBar() {
      const el = document.getElementById('mention-bar');
      if (!el) return;
      const items = [...pendingMentions.entries()];
      if (!items.length) {
        el.hidden = true;
        el.innerHTML = '';
        return;
      }
      el.hidden = false;
      el.innerHTML = `
        <span class="mention-bar-label">Mentioning</span>
        ${items.map(([id, name]) => `
          <button type="button" class="mention-chip" data-clear-mention="${esc(id)}" title="Remove @${esc(name)}">
            @${esc(name)}<span class="x" aria-hidden="true">×</span>
          </button>`).join('')}`;
      el.querySelectorAll('[data-clear-mention]').forEach((btn) => {
        btn.addEventListener('click', () => clearMention(btn.dataset.clearMention));
      });
    }

    function renderPresence() {
      const el = document.getElementById('presence-list');
      const head = document.querySelector('.im-buddies-head');
      if (!el) return;
      const people = (onlineUsers || [])
        .slice()
        .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      if (head) {
        head.innerHTML = people.length
          ? `Online members (${people.length})<small>Click a name to @mention</small>`
          : `Online members<small>Click a name to @mention</small>`;
      }
      if (!people.length) {
        el.innerHTML = `<div class="presence-empty">No members online right now.</div>`;
        return;
      }
      el.innerHTML = people.map((m) => {
          const mine = m.id === chatViewerId;
          return `
          <button type="button" class="presence-row${mine ? ' is-me' : ''}" data-mention-id="${esc(m.id)}" data-mention-name="${esc(m.name)}" ${mine ? 'disabled' : ''} title="${mine ? 'You' : `Mention ${esc(m.name)}`}">
            <span class="nm">${esc(m.name)}${mine ? ' (you)' : ''}</span>
            <span class="lg">${mine ? 'You' : '@'}</span>
          </button>`;
        }).join('');
      el.querySelectorAll('[data-mention-id]:not([disabled])').forEach((btn) => {
        btn.addEventListener('click', () => {
          insertMention({ id: btn.dataset.mentionId, name: btn.dataset.mentionName });
        });
      });
    }

    function fmtChatTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      } catch {
        return '';
      }
    }

    const AIM_COLORS = [
      '#c41e3a', '#d9480f', '#e67700', '#2b8a3e', '#0b7285',
      '#1864ab', '#5f3dc4', '#9c36b5', '#a61e4d', '#087f5b',
      '#364fc7', '#e8590c'
    ];

    function screenColor(id) {
      const s = String(id || 'x');
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return AIM_COLORS[h % AIM_COLORS.length];
    }

    function setChatLive(on) {
      const el = document.getElementById('chat-live');
      const label = document.getElementById('chat-live-label');
      if (!el || !label) return;
      el.classList.toggle('is-idle', !on);
      label.textContent = on ? 'Online' : 'Away';
    }

    function nearBottom(el, px = 80) {
      return el.scrollHeight - el.scrollTop - el.clientHeight < px;
    }

    function renderChat() {
      const log = document.getElementById('chat-log');
      if (!log) return;
      const stick = nearBottom(log) || chatMessages.length <= 1;
      if (!chatMessages.length) {
        log.innerHTML = `<div class="chat-empty">No one’s talking… say something.</div>`;
        return;
      }
      const canModerate = Boolean(state?.canManage);
      log.innerHTML = chatMessages.map((m) => {
        const mine = m.authorId && m.authorId === chatViewerId;
        const canDelete = mine || canModerate;
        const who = m.authorName || 'Member';
        const color = screenColor(m.authorId || who);
        return `<article class="im-line${mine ? ' mine' : ''}" data-id="${esc(m.id)}">
          <div class="im-line-main">
            <button type="button" class="im-who" style="color:${esc(color)}"
              data-mention-id="${esc(m.authorId || '')}" data-mention-name="${esc(who)}"
              ${mine || !m.authorId ? 'disabled' : ''}
              title="${mine || !m.authorId ? '' : `Mention ${esc(who)}`}">${esc(who)}</button><span class="im-sep">:</span>
            <span class="im-text">${formatChatBody(m.body)}</span>
          </div>
          <div class="im-meta">
            <span>${esc(fmtChatTime(m.createdAt))}</span>
            ${canDelete ? `<button type="button" class="chat-msg-del" data-del-chat="${esc(m.id)}">×</button>` : ''}
          </div>
        </article>`;
      }).join('');
      log.querySelectorAll('[data-del-chat]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            const res = await fetch(`/api/members-chat/${encodeURIComponent(btn.dataset.delChat)}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Delete failed');
            chatMessages = chatMessages.filter((m) => m.id !== btn.dataset.delChat);
            renderChat();
          } catch (err) {
            flash(err.message, false);
          }
        });
      });
      log.querySelectorAll('button.im-who[data-mention-id]:not([disabled])').forEach((btn) => {
        btn.addEventListener('click', () => {
          insertMention({ id: btn.dataset.mentionId, name: btn.dataset.mentionName });
        });
      });
      if (stick) log.scrollTop = log.scrollHeight;
    }

    function mergeChat(incoming) {
      if (!incoming?.length) return false;
      const seen = new Set(chatMessages.map((m) => m.id));
      let added = false;
      for (const m of incoming) {
        if (!m?.id || seen.has(m.id)) continue;
        chatMessages.push(m);
        seen.add(m.id);
        added = true;
      }
      if (added) {
        chatMessages.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
        if (chatMessages.length > 200) chatMessages = chatMessages.slice(-200);
      }
      return added;
    }

    async function loadChat({ incremental = false } = {}) {
      const after = incremental && chatMessages.length
        ? chatMessages[chatMessages.length - 1].id
        : '';
      const qs = after ? `?after=${encodeURIComponent(after)}` : '';
      const res = await fetch(`/api/members-chat${qs}`, { cache: 'no-store' });
      if (res.status === 401) {
        setChatLive(false);
        return;
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || 'Chat unavailable');
      chatViewerId = data.viewerId || chatViewerId;
      if (Array.isArray(data.online)) {
        onlineUsers = data.online;
        renderPresence();
      }
      if (!incremental) {
        chatMessages = Array.isArray(data.messages) ? data.messages.slice() : [];
        renderChat();
      } else if (mergeChat(data.messages)) {
        renderChat();
      }
      setChatLive(true);
    }

    function startChatPoll() {
      clearInterval(chatPollTimer);
      chatPollTimer = setInterval(async () => {
        try {
          await loadChat({ incremental: true });
          window.GridIronNav?.refreshInboxBadge?.();
        } catch {
          setChatLive(false);
        }
      }, CHAT_POLL_MS);
    }

    async function sendChat(text) {
      if (chatSending) return;
      const body = String(text || '').trim();
      if (!body) return;
      chatSending = true;
      const btn = document.getElementById('chat-send');
      const input = document.getElementById('chat-input');
      if (btn) btn.disabled = true;
      const mentions = [...pendingMentions.entries()]
        .filter(([, name]) => body.toLowerCase().includes(`@${String(name).toLowerCase()}`))
        .map(([id]) => id);
      try {
        const res = await fetch('/api/members-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body, mentions })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not send');
        if (data.item) mergeChat([data.item]);
        if (Array.isArray(data.online)) {
          onlineUsers = data.online;
          renderPresence();
        }
        pendingMentions.clear();
        renderMentionBar();
        renderChat();
        if (input) {
          input.value = '';
          input.focus();
        }
        await loadChat({ incremental: true });
      } finally {
        chatSending = false;
        if (btn) btn.disabled = false;
      }
    }

    function wireChatForm() {
      const form = document.getElementById('chat-form');
      const input = document.getElementById('chat-input');
      if (!form || !input) return;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await sendChat(input.value);
        } catch (err) {
          flash(err.message, false);
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    }

    async function patchMember(userId, body) {
      const res = await fetch(`/api/members/${encodeURIComponent(userId)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || 'Update failed');
      return data;
    }

    function renderPayPanel() {
      const el = document.getElementById('pay-panel');
      const me = state.viewer;
      const t = state.treasurer;
      const myLeague = me?.membershipLeague;
      const amount = myLeague ? duesFor(myLeague) : state.dues.gridiron;
      const leagueLabel = myLeague === 'aaa' ? 'AAA' : (myLeague === 'gridiron' ? 'GridIron 24' : 'your league');
      const paid = Boolean(me?.duesPaid);
      const note = `${t.note || 'League dues'} — ${me?.name || 'Member'}${myLeague ? ` (${leagueLabel})` : ''}`;
      const href = venmoUrl({ amount, note });

      el.innerHTML = `
        <div class="pay-panel">
          <h2>League dues</h2>
          <p>
            Season buy-in paid to treasurer
            <span class="treasurer">${esc(t.name)}</span>
            on Venmo
            (<a href="mailto:${esc(t.email)}">${esc(t.email)}</a>).
          </p>
          <p>
            GridIron 24 <strong>${esc(money(state.dues.gridiron))}</strong>
            · AAA <strong>${esc(money(state.dues.aaa))}</strong>
            · <strong>@${esc(t.venmoUsername)}</strong>
          </p>
          ${myLeague
            ? `<div class="dues-chip ${paid ? 'paid' : 'due'}">
                 ${paid ? `Dues marked paid for ${esc(leagueLabel)}` : `You owe ${esc(money(amount))} for ${esc(leagueLabel)}`}
               </div>`
            : `<p>Once you’re assigned to GridIron or AAA, your dues amount shows here.</p>`}
          <div class="pay-actions">
            <a class="btn-venmo" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Pay with Venmo</a>
            <button type="button" class="btn-ghost" id="copy-note">Copy note</button>
          </div>
        </div>`;

      document.getElementById('copy-note')?.addEventListener('click', async () => {
        try {
          await copyText(note);
          flash('Payment note copied.', true);
        } catch {
          flash('Could not copy note.', false);
        }
      });
    }

    function leagueLabel(key) {
      if (key === 'aaa') return 'AAA';
      if (key === 'gridiron') return 'GridIron 24';
      return '';
    }

    function leaguePill(key) {
      if (key === 'aaa') return '<span class="league-pill is-aaa">AAA</span>';
      if (key === 'gridiron') return '<span class="league-pill">GI24</span>';
      return '';
    }

    function memberRow(m, slot) {
      if (m.open) {
        return `
          <div class="member-row is-open">
            <div class="slot">${esc(String(slot))}</div>
            <div class="name-wrap">
              <div class="name">Open</div>
              <div class="meta">Waiting for assignment</div>
            </div>
            <div class="actions"><span class="status-pill open">Open</span></div>
          </div>`;
      }

      const league = m.membershipLeague || m.league || null;
      const amount = duesFor(league);
      const note = `${state.treasurer.note || 'League dues'} — ${m.name} (${leagueLabel(league) || 'HQ'})`;
      const payHref = venmoUrl({ amount, note });
      const canManage = state.canManage;
      const isMe = state.viewer?.id === m.id;

      const nameCell = canManage
        ? `<input class="name-input" data-name-id="${esc(m.id)}" value="${esc(m.name)}" aria-label="Member name" />`
        : `<div class="name">${esc(m.name)}${leaguePill(league)}</div>`;

      const actions = `
        <span class="status-pill ${m.duesPaid ? 'paid' : 'due'}">${m.duesPaid ? 'Paid' : `Due ${esc(money(amount))}`}</span>
        ${canManage
          ? `<button type="button" class="linkish" data-dues="${esc(m.id)}" data-paid="${m.duesPaid ? '0' : '1'}">${m.duesPaid ? 'Mark unpaid' : 'Mark paid'}</button>
             <button type="button" class="linkish" data-remove="${esc(m.id)}">Remove</button>`
          : ''}
        ${(isMe || canManage) && !m.duesPaid
          ? `<a class="linkish" href="${esc(payHref)}" target="_blank" rel="noopener noreferrer">Venmo</a>`
          : ''}
      `;

      return `
        <div class="member-row" data-user-id="${esc(m.id)}">
          <div class="slot">${esc(String(slot))}</div>
          <div class="name-wrap">
            ${nameCell}${canManage ? leaguePill(league) : ''}
            <div class="meta">${esc(m.loginName)}${isMe ? ' · you' : ''}${league ? ` · ${esc(leagueLabel(league))}` : ''}</div>
          </div>
          <div class="actions">${actions}</div>
        </div>`;
    }

    function allMembers() {
      if (Array.isArray(state.members) && state.members.length) return state.members.slice();
      return [...(state.gridiron || []), ...(state.aaa || [])]
        .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
    }

    function renderUnifiedRoll() {
      const members = allMembers();
      const gi = state.gridiron || [];
      const aaa = state.aaa || [];
      const capGi = state.caps?.gridiron || 24;
      const capAaa = state.caps?.aaa || 12;
      const paid = members.filter((m) => m.duesPaid).length;
      const openGi = Math.max(0, capGi - gi.length);
      const openAaa = Math.max(0, capAaa - aaa.length);
      return `
        <section class="board united">
          <div class="board-head">
            <h2>All members</h2>
            <div class="count">
              <strong>${members.length}</strong> in the lounge
              · GI24 ${gi.length}/${capGi}
              · AAA ${aaa.length}/${capAaa}
              · ${paid} paid
              ${openGi || openAaa ? ` · ${openGi + openAaa} open` : ''}
            </div>
          </div>
          <div class="board-body">
            ${members.length
              ? members.map((m, i) => memberRow(m, i + 1)).join('')
              : `<div class="member-row is-open"><div class="name-wrap"><div class="name">No members on the roll yet</div><div class="meta">Assigned members show up here</div></div></div>`}
          </div>
        </section>`;
    }

    function bindBoardActions() {
      document.querySelectorAll('[data-name-id]').forEach((input) => {
        let timer = null;
        const save = async () => {
          const userId = input.dataset.nameId;
          const name = input.value.trim();
          if (!name) {
            flash('Name cannot be empty.', false);
            return;
          }
          try {
            await patchMember(userId, { name });
            flash('Name updated.', true);
            await load({ quiet: true });
          } catch (err) {
            flash(err.message, false);
          }
        };
        input.addEventListener('change', save);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            input.blur();
          }
        });
        input.addEventListener('input', () => {
          clearTimeout(timer);
          timer = setTimeout(() => {}, 400);
        });
      });

      document.querySelectorAll('[data-dues]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            await patchMember(btn.dataset.dues, { duesPaid: btn.dataset.paid === '1' });
            flash(btn.dataset.paid === '1' ? 'Marked paid.' : 'Marked unpaid.', true);
            await load();
          } catch (err) {
            flash(err.message, false);
          }
        });
      });

      document.querySelectorAll('[data-remove]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!window.confirm('Remove this member from the league roll?')) return;
          try {
            await patchMember(btn.dataset.remove, { league: null, clearDues: true });
            flash('Member removed from league roll.', true);
            await load();
          } catch (err) {
            flash(err.message, false);
          }
        });
      });
    }

    function render() {
      renderPayPanel();
      document.getElementById('boards').innerHTML = renderUnifiedRoll();
      bindBoardActions();
    }

    async function load({ quiet = false } = {}) {
      const res = await fetch('/api/members', { cache: 'no-store' });
      if (res.status === 401) {
        window.location.replace('/enter?next=' + encodeURIComponent('/members.html'));
        return;
      }
      const data = await readJsonResponse(res, 'Could not load members');
      if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load members');
      state = data;
      if (data.viewer?.id) chatViewerId = data.viewer.id;
      render();
      if (!quiet) {
        window.GridIronNav?.setSync(`Lounge · ${new Date(data.generatedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      }
    }

    (async () => {
      wireChatForm();
      document.addEventListener('gi:presence', (e) => {
        if (Array.isArray(e.detail?.online)) {
          onlineUsers = e.detail.online;
          renderPresence();
        }
      });
      loadSportsScores();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearTimeout(sportsFlipTimer);
        } else if (sportsAuto) {
          scheduleSportsFlip(SPORTS_FLIP_MS);
        }
      });
      try {
        await load();
        await loadChat();
        startChatPoll();
        if (location.hash === '#room') {
          document.getElementById('room')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        if (location.hash === '#board') {
          document.getElementById('sports-board')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="msg">${esc(err.message)}</div>`;
        setChatLive(false);
      }
    })();
  </script>
</body>
</html>
