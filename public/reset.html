<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Reset Password · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=65" />
</head>
<body class="auth-page">
  <form class="auth-card" id="form">
    <h1 class="auth-title">Reset Password</h1>
    <div class="status-note err" id="err" role="alert"></div>
    <label class="field-label" for="password">New Password</label>
    <input class="field" id="password" type="password" required minlength="6" autocomplete="new-password" />
    <label class="field-label" for="confirmPassword">Confirm Password</label>
    <input class="field" id="confirmPassword" type="password" required minlength="6" autocomplete="new-password" />
    <button class="btn" type="submit" id="submit">Update Password</button>
    <p class="auth-links"><a href="/enter">Back to sign in</a></p>
  </form>
  <p class="auth-legal">
    <strong>GridIron 24</strong> is an independent fantasy football league headquarters.
    Not affiliated with the NFL, ESPN, or any professional sports league.
  </p>
  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('form');
    const errEl = document.getElementById('err');
    const submit = document.getElementById('submit');

    if (!token) {
      errEl.textContent = 'Reset link is missing or invalid.';
      errEl.classList.add('show');
      submit.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.remove('show');
      submit.disabled = true;
      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            password: document.getElementById('password').value,
            confirmPassword: document.getElementById('confirmPassword').value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not reset password');
        window.location.href = '/enter';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
