<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GridIron 24</title>
  <meta name="description" content="24 Teams. Two Conferences. One Champion." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #06080f;
      --panel: #0c101c;
      --text: #f4f6fb;
      --muted: #8e97ab;
      --line: rgba(255,255,255,0.07);
      --detail: #ff7a18;
      --overtime: #e2232a;
      --blue: #3b82ff;
      --good: #3ecf8e;
      --bad: #ff6b6b;
      --font: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font);
      background: var(--bg);
    }

    .shell {
      width: 100%;
      padding: 0 clamp(1rem, 3.5vw, 3rem);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(6, 8, 15, 0.9);
      backdrop-filter: blur(12px);
    }

    .topbar .shell {
      min-height: 3.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      font-size: 0.95rem;
    }

    .brand img {
      width: 2rem;
      height: 2rem;
      object-fit: contain;
    }

    .sync {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .sync .on { color: var(--good); }

    .hero {
      padding: clamp(2.5rem, 8vh, 5.5rem) 0 clamp(2rem, 5vh, 3.5rem);
      text-align: center;
    }

    .hero img {
      width: min(280px, 58vw);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 24px 48px rgba(0,0,0,0.55));
    }

    .hero p {
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.6vw, 1.05rem);
      font-weight: 500;
    }

    .section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 0.85rem;
    }

    .section-label h2 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .board {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--line);
    }

    .board-head.detail { border-left: 3px solid var(--detail); }
    .board-head.overtime { border-left: 3px solid var(--overtime); }

    .board-head h3 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .board-head.detail h3 { color: var(--detail); }
    .board-head.overtime h3 { color: var(--overtime); }

    .board-head .meta {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .pill {
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.3rem 0.55rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .pill .dot {
      display: inline-block;
      width: 0.35rem;
      height: 0.35rem;
      margin-right: 0.35rem;
      border-radius: 50%;
      background: var(--good);
      vertical-align: middle;
    }

    .pill .dot.off { background: var(--bad); }

    .row {
      display: grid;
      grid-template-columns:
        2rem
        minmax(0, 1.5fr)
        minmax(0, 1fr)
        2.1rem 2.1rem 2.1rem
        minmax(2.8rem, 0.45fr)
        minmax(2.8rem, 0.45fr);
      gap: 0.35rem 0.45rem;
      align-items: center;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }

    .row:last-child { border-bottom: 0; }
    .row.head {
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.02);
    }
    .row.body:hover { background: rgba(255,255,255,0.025); }
    .row.cut { box-shadow: inset 0 -1px 0 rgba(59,130,255,0.45); }
    .num { text-align: right; font-weight: 650; font-size: 0.86rem; }
    .center { text-align: center; }

    .rank {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }

    .team img,
    .fallback {
      width: 1.75rem;
      height: 1.75rem;
      flex: 0 0 1.75rem;
      border-radius: 4px;
      object-fit: contain;
      background: #f3f4f6;
      border: 1px solid var(--line);
    }

    .fallback {
      display: grid;
      place-items: center;
      background: #151a28;
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 800;
    }

    .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .owner {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .pts { color: #b7c0d4; font-weight: 600; }

    .msg {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .msg strong {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--bad);
    }

    .path {
      margin-top: 2.25rem;
      padding-bottom: 2.5rem;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.6rem;
    }

    .step {
      padding: 0.95rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .step span {
      display: block;
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .step strong {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.95rem;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .step.final {
      border-color: rgba(59,130,255,0.35);
      background: rgba(59,130,255,0.08);
    }

    footer {
      padding: 0 0 2rem;
      text-align: center;
      color: #667089;
      font-size: 0.72rem;
    }

    @media (max-width: 960px) {
      .boards { grid-template-columns: 1fr; }
      .steps { grid-template-columns: 1fr 1fr; }
      .step.final { grid-column: 1 / -1; }
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1.7rem minmax(0,1fr) 2rem 2rem minmax(2.5rem,0.4fr);
      }
      .col-owner, .col-t, .col-pa { display: none; }
      .steps { grid-template-columns: 1fr; }
      .step.final { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <div class="brand">
        <img src="/assets/gridiron24-logo.png" alt="" />
        <span>GRIDIRON 24</span>
      </div>
      <div class="sync" id="lastUpdated">Connecting…</div>
    </div>
  </header>

  <section class="hero shell">
    <img src="/assets/gridiron24-logo.png" alt="GridIron 24" />
    <p>24 Teams · Two Conferences · One Champion</p>
  </section>

  <main class="shell">
    <div class="section-label">
      <h2>Standings</h2>
    </div>
    <section class="boards">
      <div class="board" id="detail"></div>
      <div class="board" id="overtime"></div>
    </section>

    <section class="path">
      <div class="section-label"><h2>Road to the Bowl</h2></div>
      <div class="steps">
        <div class="step"><span>WEEKS 1–13</span><strong>Regular Season</strong></div>
        <div class="step"><span>WEEK 14</span><strong>Wild Card</strong></div>
        <div class="step"><span>WEEK 15</span><strong>Semifinals</strong></div>
        <div class="step"><span>WEEK 16</span><strong>Conf. Title</strong></div>
        <div class="step final"><span>WEEK 17</span><strong>GridIron Bowl I</strong></div>
      </div>
    </section>
  </main>

  <footer class="shell">ESPN remains the system of record for league operations and scoring.</footer>

  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    const pts = (n) => Number(n || 0).toFixed(1);

    function teamLogo(team) {
      if (team.logo) {
        return `<img src="${esc(team.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;fallback&quot;>24</div>'">`;
      }
      return `<div class="fallback">24</div>`;
    }

    function board(conf) {
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      if (!conf.ok) {
        return `
          <div class="board-head ${tone}">
            <div><h3>${esc(conf.name)}</h3><div class="meta">ESPN ${conf.leagueId}</div></div>
            <div class="pill"><span class="dot off"></span>OFFLINE</div>
          </div>
          <div class="msg"><strong>ESPN connection failed</strong>${esc(conf.error || 'Unknown error')}</div>`;
      }

      const teams = conf.teams || [];
      if (!teams.length) {
        return `
          <div class="board-head ${tone}">
            <div><h3>${esc(conf.name)}</h3><div class="meta">ESPN ${conf.leagueId}</div></div>
            <div class="pill"><span class="dot"></span>0 TEAMS</div>
          </div>
          <div class="msg">No teams yet.</div>`;
      }

      const rows = teams.map((t, i) => {
        const rank = i + 1;
        return `
          <div class="row body ${rank === 6 ? 'cut' : ''}">
            <div class="rank">${rank}</div>
            <div class="team">${teamLogo(t)}<div class="name" title="${esc(t.name)}">${esc(t.name)}</div></div>
            <div class="owner col-owner" title="${esc(t.owner)}">${esc(t.owner)}</div>
            <div class="num">${t.wins || 0}</div>
            <div class="num">${t.losses || 0}</div>
            <div class="num col-t">${t.ties || 0}</div>
            <div class="num pts">${pts(t.pointsFor)}</div>
            <div class="num pts col-pa">${pts(t.pointsAgainst)}</div>
          </div>`;
      }).join('');

      return `
        <div class="board-head ${tone}">
          <div>
            <h3>${esc(conf.name)}</h3>
            <div class="meta">ESPN ${conf.leagueId} · Week ${conf.currentMatchupPeriod ?? '—'}</div>
          </div>
          <div class="pill"><span class="dot"></span>${conf.teamCount} TEAMS</div>
        </div>
        <div class="row head">
          <div class="center">#</div><div>Team</div><div class="col-owner">Owner</div>
          <div class="num">W</div><div class="num">L</div><div class="num col-t">T</div>
          <div class="num">PF</div><div class="num col-pa">PA</div>
        </div>
        ${rows}`;
    }

    async function load() {
      document.getElementById('detail').innerHTML = '<div class="msg">Loading…</div>';
      document.getElementById('overtime').innerHTML = '<div class="msg">Loading…</div>';
      try {
        const res = await fetch('/api/leagues', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        for (const conf of data.conferences) {
          const el = document.getElementById(conf.key);
          if (el) el.innerHTML = board(conf);
        }
        const t = new Date(data.generatedAt);
        document.getElementById('lastUpdated').innerHTML =
          `<span class="on">●</span> ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
      } catch (err) {
        document.getElementById('lastUpdated').textContent = 'Connection error';
        const msg = `<div class="msg"><strong>Dashboard error</strong>${esc(err.message)}</div>`;
        document.getElementById('detail').innerHTML = msg;
        document.getElementById('overtime').innerHTML = msg;
      }
    }

    load();
    setInterval(load, 60_000);
  </script>
</body>
</html>
