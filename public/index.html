<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GridIron 24</title>
  <meta name="description" content="24 Teams. Two Conferences. One Champion. GridIron 24 fantasy football league headquarters." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=133" />
  <style>
    body.landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 55% at 50% 0%, rgba(47, 109, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 40% 40% at 12% 80%, rgba(255, 122, 24, 0.08), transparent 50%),
        radial-gradient(ellipse 40% 40% at 88% 75%, rgba(226, 35, 42, 0.08), transparent 50%), var(--bg);
    }

    .landing-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 1.1rem;
      padding-bottom: 0.5rem;
      position: relative;
      z-index: 2;
    }

    .landing-top a {
      color: var(--muted);
      text-decoration: none;
      font-family: var(--display);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.45rem 0.2rem;
      border-bottom: 2px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .landing-top a:hover { color: var(--nav-hover); border-bottom-color: var(--blue); }

    .landing-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 1rem;
      padding-bottom: 3rem;
      position: relative;
      min-height: min(72vh, 640px);
    }

    .landing-hero::before {
      content: "";
      position: absolute;
      inset: 8% 10% auto;
      height: 55%;
      background:
        repeating-linear-gradient(
          -12deg,
          transparent 0 14px,
          rgba(255,255,255,0.012) 14px 15px
        );
      pointer-events: none;
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    }

    .wordmark {
      position: relative;
      margin: 0;
      font-family: var(--display);
      font-size: clamp(2.6rem, 9vw, 4.75rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--text);
      animation: crest-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .wordmark span {
      display: block;
      margin-top: 0.18em;
      font-size: 0.38em;
      letter-spacing: 0.32em;
      color: var(--blue);
      font-weight: 600;
    }

    .tag {
      position: relative;
      margin: 1.35rem 0 0;
      max-width: 28rem;
      font-family: var(--display);
      font-size: clamp(1rem, 3.2vw, 1.55rem);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.25;
      color: var(--text);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }
    .tag .t { color: var(--blue); }
    .tag .d {
      color: #c5cedb;
      text-shadow:
        0 0 6px rgba(200, 215, 240, 0.45),
        0 0 14px rgba(170, 190, 220, 0.25);
    }
    .tag .c {
      color: #f2f5fa;
      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #e8eef6 28%,
        #a8b4c4 58%,
        #dde4ee 78%,
        #8e9aab 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 0 6px rgba(230, 240, 255, 0.85))
        drop-shadow(0 0 14px rgba(190, 210, 240, 0.55))
        drop-shadow(0 0 28px rgba(160, 185, 230, 0.35));
    }
    .tag .sep { color: #666; margin: 0 0.35em; font-weight: 500; }

    .lead {
      position: relative;
      margin: 0.75rem 0 0;
      max-width: 26rem;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.45;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
    }

    .cta {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.75rem;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
    }

    .cta a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 10.5rem;
      padding: 0.85rem 1.4rem;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .cta a.primary {
      background: var(--blue);
      color: var(--text);
      border: 1px solid var(--blue);
    }
    .cta a.primary:hover {
      background: #3d79ff;
      transform: translateY(-2px);
    }
    .cta a.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .cta a.ghost:hover {
      border-color: var(--text);
      transform: translateY(-2px);
    }

    .conf-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 6vw, 3.5rem);
      padding: 1.5rem 0 2.25rem;
      border-top: 1px solid var(--line);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
    }
    .conf-strip .side {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .conf-strip img {
      width: clamp(2.75rem, 6vw, 3.5rem);
      height: auto;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
    }
    .conf-strip .label {
      font-family: var(--display);
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .conf-strip .detail { color: var(--detail); }
    .conf-strip .overtime { color: var(--overtime); }
    .conf-strip .vs {
      font-family: var(--display);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
    }

    @keyframes crest-in {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .cta { flex-direction: column; width: min(100%, 18rem); }
      .cta a { width: 100%; }
      .conf-strip { flex-direction: column; gap: 1rem; }
      .conf-strip .vs { display: none; }
    }
  </style>
</head>
<body class="landing" data-page="home">
  <div class="shell landing-top">
    <a href="/enter" id="auth-link">Member Login</a>
  </div>

  <section class="shell landing-hero">
    <h1 class="wordmark">GridIron<span>24</span></h1>
    <p class="tag">
      <span class="t">24 Teams</span><span class="sep">·</span><span class="d">Two Conferences</span><span class="sep">·</span><span class="c">One Champion</span>
    </p>
    <p class="lead">Fantasy football headquarters for Detail and Overtime — standings, schedules, playoffs, and the GridIron Bowl.</p>
    <div class="cta">
      <a class="primary" href="/enter" id="cta-enter">Enter League HQ</a>
      <a class="ghost" href="/register">Create Account</a>
    </div>
  </section>

  <div class="shell conf-strip">
    <div class="side detail">
      <span class="label detail">Detail Conference</span>
    </div>
    <span class="vs">vs</span>
    <div class="side overtime">
      <span class="label overtime">Overtime Conference</span>
    </div>
  </div>

  <script>
    async function hydrateAuth() {
      try {
        const res = await fetch('/api/auth', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.authenticated) return;
        const enter = document.getElementById('cta-enter');
        const link = document.getElementById('auth-link');
        if (enter) {
          enter.href = data.homePath || '/hq';
          enter.textContent = 'Open League HQ';
        }
        if (link) {
          link.href = data.homePath || '/hq';
          link.textContent = 'League HQ';
        }
      } catch {
        /* landing still works without auth check */
      }
    }
    hydrateAuth();
  </script>
</body>
</html>
