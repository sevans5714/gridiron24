<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GridIron 24</title>
  <meta name="description" content="24 Teams. Two Conferences. One Champion. GridIron 24 fantasy football league headquarters." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --panel: #111111;
      --panel-2: #171717;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --line: rgba(255, 255, 255, 0.08);
      --detail: #ff7a18;
      --overtime: #e2232a;
      --blue: #2f6dff;
      --good: #22c55e;
      --bad: #ef4444;
      --display: "Oswald", Impact, sans-serif;
      --body: "Source Sans 3", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--body);
      background: var(--bg);
    }

    .shell {
      width: 100%;
      padding-left: clamp(1rem, 3vw, 2.75rem);
      padding-right: clamp(1rem, 3vw, 2.75rem);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 5, 5, 0.92);
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      min-height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .sync {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .sync .live {
      color: var(--good);
      margin-right: 0.35rem;
    }

    .hero {
      text-align: center;
      padding: 0.55rem 0 0.65rem;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse 60% 90% at 50% 40%, rgba(47, 109, 255, 0.14), transparent 70%),
        linear-gradient(180deg, #0a0a0a 0%, var(--bg) 100%);
    }

    .hero img {
      width: min(340px, 68vw);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.75));
    }

    .ad-line {
      margin: 0.45rem 0 0;
      font-family: var(--display);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.08em;
      font-size: clamp(0.78rem, 3.1vw, 1.65rem);
      white-space: nowrap;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.55);
    }

    .ad-line .detail { color: var(--detail); }
    .ad-line .overtime { color: var(--overtime); }
    .ad-line .champ { color: var(--blue); }
    .ad-line .sep {
      color: #666;
      margin: 0 0.4em;
      font-weight: 500;
    }

    .section {
      padding: 1.75rem 0 0;
    }

    .section-label {
      margin: 0 0 0.75rem;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .board {
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1rem 0.55rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #1a1a1a 0%, var(--panel-2) 100%);
    }

    .board-head.detail { border-left: 4px solid var(--detail); }
    .board-head.overtime { border-left: 4px solid var(--overtime); }

    .conf-logo {
      width: clamp(7.5rem, 18vw, 11rem);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.65)) contrast(1.08) saturate(1.1) brightness(1.03);
    }

    .board-head .meta {
      display: none;
    }

    .status {
      display: none;
    }

    .standings { width: 100%; }

    .row {
      display: grid;
      grid-template-columns:
        2rem
        minmax(0, 1.55fr)
        minmax(0, 1fr)
        2.1rem
        2.1rem
        2.1rem
        minmax(2.8rem, 0.45fr)
        minmax(2.8rem, 0.45fr);
      gap: 0.3rem 0.45rem;
      align-items: center;
      width: 100%;
      padding: 0.55rem 0.9rem;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }

    .row:last-child { border-bottom: 0; }

    .row.head {
      background: #0c0c0c;
      color: var(--muted);
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .row.body:hover { background: rgba(255, 255, 255, 0.03); }
    .row.cut { box-shadow: inset 0 -1px 0 rgba(47, 109, 255, 0.55); }

    .row .num { text-align: right; }
    .row .center { text-align: center; }

    .rank {
      text-align: center;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 700;
      color: #cfcfcf;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }

    .logo,
    .fallback {
      width: 1.7rem;
      height: 1.7rem;
      flex: 0 0 1.7rem;
      border-radius: 2px;
      object-fit: contain;
      border: 1px solid var(--line);
    }

    .logo {
      background: #f3f3f3;
      padding: 1px;
    }

    .fallback {
      display: grid;
      place-items: center;
      background: #1a1a1a;
      color: var(--muted);
      font-family: var(--display);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .owner {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .wl {
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .pts {
      font-family: var(--display);
      font-size: 0.9rem;
      font-weight: 600;
      color: #d0d0d0;
    }

    .msg {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .msg strong {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--bad);
      font-family: var(--display);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .path {
      padding: 1.75rem 0 2.5rem;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.55rem;
    }

    .step {
      padding: 0.85rem 0.75rem;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .step span {
      display: block;
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .step strong {
      display: block;
      margin-top: 0.35rem;
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .step.final {
      border-color: rgba(47, 109, 255, 0.45);
      background: rgba(47, 109, 255, 0.1);
    }

    .step.final strong { color: #8eb6ff; }

    footer {
      padding: 0 0 1.75rem;
      text-align: center;
      color: #6f6f6f;
      font-size: 0.75rem;
    }

    @media (max-width: 980px) {
      .boards { grid-template-columns: 1fr; }
      .steps { grid-template-columns: 1fr 1fr; }
      .step.final { grid-column: 1 / -1; }
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns:
          1.7rem
          minmax(0, 1fr)
          2rem
          2rem
          minmax(2.5rem, 0.4fr);
      }
      .col-owner,
      .col-ties,
      .col-pa { display: none; }
      .steps { grid-template-columns: 1fr; }
      .step.final { grid-column: auto; }
      .conf-logo { width: clamp(6.5rem, 42vw, 9rem); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="sync" id="lastUpdated">Connecting to ESPN…</div>
    </div>
  </header>

  <section class="hero shell">
    <img src="/assets/gridiron24-logo.png" alt="GridIron 24" />
    <p class="ad-line">
      24 Teams<span class="sep">·</span><span class="detail">Two Conferences</span><span class="sep">·</span><span class="champ">One Champion</span>
    </p>
  </section>

  <main class="shell">
    <section class="section">
      <div class="section-label">Standings</div>
      <div class="boards">
        <div class="board" id="detail"></div>
        <div class="board" id="overtime"></div>
      </div>
    </section>

    <section class="path">
      <div class="section-label">Road to the Bowl</div>
      <div class="steps">
        <div class="step"><span>Weeks 1–13</span><strong>Regular Season</strong></div>
        <div class="step"><span>Week 14</span><strong>Wild Card</strong></div>
        <div class="step"><span>Week 15</span><strong>Semifinals</strong></div>
        <div class="step"><span>Week 16</span><strong>Conf. Title</strong></div>
        <div class="step final"><span>Week 17</span><strong>GridIron Bowl I</strong></div>
      </div>
    </section>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>

  <script>
    const escapeHtml = (value = '') => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    function fmtPts(value) {
      return Number(value || 0).toFixed(1);
    }

    function logoMarkup(team) {
      if (team.logo) {
        return `<img class="logo" src="${escapeHtml(team.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;fallback&quot;>24</div>'">`;
      }
      return `<div class="fallback">24</div>`;
    }

    function confLogo(key, name) {
      const src = key === 'detail'
        ? '/assets/detail-conference.png'
        : '/assets/overtime-conference.png';
      return `<img class="conf-logo" src="${src}" alt="${escapeHtml(name)}" width="176" height="176" decoding="async" />`;
    }

    function boardHead(conf) {
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      return `
        <div class="board-head ${tone}">
          ${confLogo(conf.key, conf.name)}
        </div>`;
    }

    function conferenceMarkup(conf) {
      if (!conf.ok) {
        return `
          ${boardHead(conf)}
          <div class="msg">
            <strong>ESPN connection failed</strong>
            ${escapeHtml(conf.error || 'Unknown error')}
          </div>`;
      }

      const teams = conf.teams || [];
      if (!teams.length) {
        return `
          ${boardHead(conf)}
          <div class="msg">No teams have joined this conference yet.</div>`;
      }

      const rows = teams.map((team, index) => {
        const rank = index + 1;
        return `
          <div class="row body ${rank === 6 ? 'cut' : ''}">
            <div class="rank">${rank}</div>
            <div class="team">
              ${logoMarkup(team)}
              <div class="name" title="${escapeHtml(team.name)}">${escapeHtml(team.name)}</div>
            </div>
            <div class="owner col-owner" title="${escapeHtml(team.owner)}">${escapeHtml(team.owner)}</div>
            <div class="num wl">${team.wins || 0}</div>
            <div class="num wl">${team.losses || 0}</div>
            <div class="num wl col-ties">${team.ties || 0}</div>
            <div class="num pts">${fmtPts(team.pointsFor)}</div>
            <div class="num pts col-pa">${fmtPts(team.pointsAgainst)}</div>
          </div>`;
      }).join('');

      return `
        ${boardHead(conf)}
        <div class="standings">
          <div class="row head">
            <div class="center">#</div>
            <div>Team</div>
            <div class="col-owner">Owner</div>
            <div class="num">W</div>
            <div class="num">L</div>
            <div class="num col-ties">T</div>
            <div class="num">PF</div>
            <div class="num col-pa">PA</div>
          </div>
          ${rows}
        </div>`;
    }

    async function load() {
      document.getElementById('detail').innerHTML = '<div class="msg">Loading Detail Conference…</div>';
      document.getElementById('overtime').innerHTML = '<div class="msg">Loading Overtime Conference…</div>';

      try {
        const response = await fetch('/api/leagues', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        const data = await response.json();

        for (const conf of data.conferences) {
          const target = document.getElementById(conf.key);
          if (target) target.innerHTML = conferenceMarkup(conf);
        }

        const time = new Date(data.generatedAt);
        document.getElementById('lastUpdated').innerHTML =
          `<span class="live">●</span>ESPN sync · ${time.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
      } catch (error) {
        document.getElementById('lastUpdated').textContent = 'Connection error';
        const msg = `<div class="msg"><strong>Dashboard error</strong>${escapeHtml(error.message)}</div>`;
        document.getElementById('detail').innerHTML = msg;
        document.getElementById('overtime').innerHTML = msg;
      }
    }

    load();
    setInterval(load, 60_000);
  </script>
</body>
</html>
