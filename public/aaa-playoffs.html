<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playoff Bracket · AAA League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=131" />
  <link rel="icon" href="/favicon.ico?v=131" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=131" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=131" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=177" />
  <style>
    .tree {
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .conf-tree {
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 35%),
        var(--panel);
      overflow: hidden;
      min-width: 0;
      border-top: 3px solid #5b8cff;
      box-shadow: inset 0 0 60px rgba(91, 140, 255, 0.06);
    }

    .conf-head {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
      font-family: var(--display);
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-weight: 600;
      line-height: 1.2;
      color: #9eb8ff;
    }
    .conf-head img {
      width: clamp(4.5rem, 12vw, 6rem);
      height: auto;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .conf-head .wk {
      margin-left: auto;
      color: var(--muted);
      font-family: var(--body);
      font-size: var(--fs-xs);
      letter-spacing: 0.02em;
      font-weight: 500;
      text-transform: none;
      white-space: nowrap;
    }

    .rounds {
      display: grid;
      grid-template-columns: 1.15fr 1fr 0.95fr;
      gap: 0;
      padding: 1.35rem 0.55rem 1.2rem;
      min-height: 30rem;
    }
    .rounds.is-eight {
      grid-template-columns: 1.2fr 1fr 0.95fr;
    }

    .round-col {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 0.65rem;
      padding: 0 0.4rem;
      position: relative;
    }
    .round-col + .round-col { border-left: 1px dashed rgba(255,255,255,0.08); }
    .round-col.finale-col { justify-content: center; gap: 1.1rem; }

    .round-label {
      position: absolute;
      top: -0.2rem;
      left: 0.35rem;
      right: 0.35rem;
      text-align: center;
      font-family: var(--body);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.25;
    }

    .slot {
      border: 1px solid var(--line);
      background:
        linear-gradient(165deg, rgba(255,255,255,0.05), transparent 42%),
        linear-gradient(180deg, var(--panel-2), var(--panel));
      padding: 0.45rem 0.5rem;
      position: relative;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .slot:hover {
      border-color: var(--chip-border-active);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }
    .slot.is-live {
      border-color: rgba(61, 220, 132, 0.4);
      box-shadow: 0 0 0 1px rgba(61, 220, 132, 0.12), 0 0 22px rgba(61, 220, 132, 0.1);
    }
    .slot.is-final {
      border-color: rgba(255, 255, 255, 0.16);
    }
    .slot.bye {
      border-style: dashed;
      opacity: 0.88;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 60%),
        transparent;
    }
    .slot.title-slot,
    .slot.third-slot {
      border: 0;
      background: transparent;
      padding: 0.25rem 0.15rem;
      text-align: center;
      box-shadow: none;
    }
    .slot.title-slot:hover,
    .slot.third-slot:hover {
      box-shadow: none;
      border-color: transparent;
    }

    .trophy-mark {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 0.45rem;
      padding: 0;
      width: 100%;
      max-width: 10.5rem;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .slot.third-slot .trophy-mark {
      max-width: 9rem;
      background: transparent;
    }
    .trophy-mark img {
      width: 100%;
      height: auto;
      display: block;
      background: transparent;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.5));
    }
    .slot.title-slot .sr-only,
    .slot.third-slot .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .slot.winner-line::after {
      content: "";
      position: absolute;
      right: -0.55rem;
      top: 50%;
      width: 0.55rem;
      height: 1px;
      background: rgba(255,255,255,0.28);
    }

    .mu { display: grid; gap: 0.2rem; }
    .mu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-bottom: 0.15rem;
      padding: 0 0.1rem;
    }
    .mu-label {
      font-family: var(--body);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.2;
    }
    .mu-status {
      font-family: var(--body);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1;
    }
    .mu-status.is-live {
      color: #3ddc84;
      text-shadow: 0 0 10px rgba(61, 220, 132, 0.35);
    }
    .mu-status.is-final { color: var(--text); opacity: 0.72; }

    .mu-row {
      display: grid;
      grid-template-columns: 1.35rem minmax(0, 1fr) auto;
      gap: 0.4rem;
      align-items: center;
      min-height: 2.05rem;
      padding: 0.28rem 0.35rem;
      border-radius: 0.35rem;
      background: color-mix(in srgb, var(--panel-2) 88%, transparent);
    }
    .mu-row.is-winner {
      background: linear-gradient(90deg, rgba(61, 220, 132, 0.16), rgba(61, 220, 132, 0.04));
      box-shadow: inset 2px 0 0 #3ddc84;
    }
    .mu-row.is-loser { opacity: 0.48; }
    .mu-row.is-bye { background: color-mix(in srgb, var(--panel) 70%, transparent); }

    .mu-seed {
      font-family: var(--display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-align: center;
      line-height: 1;
    }
    .mu-row.is-winner .mu-seed { color: var(--text); }

    .mu-logo {
      width: 1.7rem;
      height: 1.7rem;
      object-fit: cover;
      object-position: center;
      background: transparent;
      border-radius: 50%;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.28));
      mix-blend-mode: lighten;
    }
    .mu-name {
      min-width: 0;
      overflow: hidden;
      white-space: normal;
    }
    .mu-name .franchise-title,
    .mu-name .franchise-block {
      width: 100%;
      max-width: 100%;
    }
    .mu-score {
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
      min-width: 2.4rem;
      text-align: right;
    }
    .mu-score.is-empty { color: var(--muted); font-size: 0.8rem; }
    .mu-row > .franchise-title,
    .mu-row > .franchise-block {
      min-width: 0;
      overflow: hidden;
    }
    .mu-await {
      padding: 0.55rem 0.4rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.35;
    }
    .mu-await strong {
      display: block;
      margin-bottom: 0.15rem;
      font-family: var(--display);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
    }

    .mid {
      display: grid;
      grid-template-columns: 1fr;
      width: 100%;
      max-width: min(68rem, 100%);
      margin: 1.25rem auto 0;
      gap: 0.85rem;
    }
    .finale-stage-label {
      margin: 0;
      text-align: center;
      font-family: var(--display);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .bowl {
      position: relative;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
      padding: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: visible;
      box-shadow: none;
    }
    .bowl-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.85rem 1rem;
      align-items: center;
      padding: 0.35rem 0.15rem 0.55rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
    }
    .bowl-mark {
      width: clamp(5.5rem, 14vw, 7.5rem);
      margin: 0;
      padding: 0;
      background: transparent;
      flex: 0 0 auto;
    }
    .bowl-mark img {
      width: 100%;
      height: auto;
      max-height: 6.5rem;
      object-fit: contain;
      object-position: center;
      display: block;
      background: transparent;
      filter: drop-shadow(0 10px 24px rgba(20, 80, 200, 0.4));
    }
    .bowl-head-copy { min-width: 0; }
    .bowl-kicker {
      margin: 0 0 0.15rem;
      font-family: var(--body);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8eb6ff;
    }
    .bowl-head-copy h3 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.35rem, 2.4vw, 1.75rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.05;
      color: var(--text);
    }
    .bowl-head-copy p.bowl-sub {
      margin: 0.28rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }
    .bowl-scoreboard {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 1rem 0.9rem 1.05rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 0.65rem 0.85rem;
      align-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      flex: 1 1 auto;
    }
    .bowl-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
      padding: 0.55rem 0.4rem;
      border-radius: 0.2rem;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .bowl-side.is-lead {
      background: rgba(91, 140, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(91, 140, 255, 0.32);
    }
    .bowl-side img,
    .bowl-side img.bowl-logo {
      width: 3.1rem;
      height: 3.1rem;
      object-fit: cover;
      object-position: center;
      flex: 0 0 auto;
      background: transparent;
      border-radius: 50%;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.28));
      mix-blend-mode: lighten;
    }
    .bowl-side .nm {
      font-family: var(--display);
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
      color: var(--text);
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: anywhere;
      display: block;
      text-align: center;
    }
    .bowl-side.is-lead .nm {
      text-shadow: 0 0 14px rgba(91, 140, 255, 0.4);
    }
    .bowl-side .pts {
      font-family: var(--display);
      font-size: clamp(1.55rem, 2.8vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
      min-height: 1.1em;
    }
    .bowl-side .pts:empty::before {
      content: "—";
      color: var(--muted);
      font-size: 0.85em;
    }
    .bowl-mid {
      text-align: center;
      font-family: var(--display);
      min-width: 3.5rem;
      padding: 0 0.1rem;
    }
    .bowl-mid .vs {
      font-size: clamp(1.05rem, 1.8vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8eb6ff;
      line-height: 1;
    }

    html[data-theme="day"] .conf-tree {
      box-shadow: inset 0 0 40px rgba(47, 109, 255, 0.06);
    }
    html[data-theme="day"] .slot {
      background:
        linear-gradient(165deg, rgba(255,255,255,0.65), transparent 42%),
        linear-gradient(180deg, var(--panel-2), var(--panel));
    }
    html[data-theme="day"] .mu-row {
      background: rgba(20, 28, 40, 0.04);
    }
    html[data-theme="day"] .mu-row.is-winner {
      background: linear-gradient(90deg, rgba(22, 163, 74, 0.14), rgba(22, 163, 74, 0.03));
      box-shadow: inset 2px 0 0 #16a34a;
    }
    html[data-theme="day"] .mu-logo,
    html[data-theme="day"] .bowl-side img,
    html[data-theme="day"] .bowl-side img.bowl-logo {
      mix-blend-mode: normal;
      background: transparent;
      filter: drop-shadow(0 2px 6px rgba(20, 28, 40, 0.14));
    }
    html[data-theme="day"] .mu-status.is-live { color: #15803d; text-shadow: none; }
    html[data-theme="day"] .bowl {
      background: transparent;
      box-shadow: none;
    }
    html[data-theme="day"] .bowl-head {
      background: transparent;
      border-bottom-color: rgba(20, 28, 40, 0.1);
    }
    html[data-theme="day"] .finale-stage-label { color: #5a6a80; }
    html[data-theme="day"] .bowl-kicker { color: #2f6dff; }
    html[data-theme="day"] .bowl-mid .vs { color: #2f6dff; }
    html[data-theme="day"] .bowl-scoreboard {
      border-color: transparent;
      background: transparent;
    }
    html[data-theme="day"] .trophy-mark,
    html[data-theme="day"] .bowl-mark {
      background: transparent;
    }

    @media (max-width: 1100px) {
      .rounds { grid-template-columns: 1fr; min-height: 0; }
      .round-col {
        border-left: 0 !important;
        border-top: 1px dashed rgba(255,255,255,0.08);
        padding-top: 1.5rem;
      }
      .round-col:first-child { border-top: 0; }
      .slot.winner-line::after { display: none; }
      .bowl-scoreboard {
        grid-template-columns: 1fr;
        gap: 0.55rem;
      }
      .bowl-mid { order: 0; padding: 0.15rem 0; }
      .bowl-side {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-areas: "logo name pts";
        align-items: center;
        justify-items: start;
        text-align: left;
        gap: 0.25rem 0.75rem;
        width: 100%;
      }
      .bowl-side img.bowl-logo,
      .bowl-side img { grid-area: logo; width: 2.5rem; height: 2.5rem; }
      .bowl-side .nm { grid-area: name; text-align: left; }
      .bowl-side .pts { grid-area: pts; justify-self: end; }
    }
  </style>
</head>
<body data-page="aaa-playoffs">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated"><span class="live">●</span>2026 format</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <h1>Playoff Bracket</h1>
  </section>

  <main class="page-main shell">
    <div class="tree" id="live-tree">
      <div class="msg">Loading AAA bracket…</div>
    </div>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=177"></script>
  <script>
    const PLACEHOLDER = '/assets/team-logo-placeholder.svg';
    const AAA_MARK = '/assets/aaa-league.png?v=7';
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function fmt(n) {
      if (n == null || Number.isNaN(Number(n))) return '—';
      return Number(n).toFixed(1);
    }

    function seedName(s) {
      if (!s) return 'TBD';
      return s.name;
    }

    function statusLabel(status) {
      if (status === 'final') return 'Final';
      if (status === 'live') return 'Live';
      return 'Upcoming';
    }

    function teamRow(side, opts = {}) {
      const winner = opts.winner;
      const decided = winner === 'HOME' || winner === 'AWAY';
      const isAway = opts.role === 'away';
      const isWinner = decided && ((isAway && winner === 'AWAY') || (!isAway && winner === 'HOME'));
      const isLoser = decided && !isWinner;
      const seed = side?.seed || opts.seed || null;
      const score = side?.score;
      const hasScore = score != null && !(Number(score) === 0 && opts.status === 'upcoming');
      const cls = [
        'mu-row',
        opts.bye ? 'is-bye' : '',
        isWinner ? 'is-winner' : '',
        isLoser ? 'is-loser' : ''
      ].filter(Boolean).join(' ');
      return `
        <div class="${cls}">
          <span class="mu-seed">${seed ? `#${esc(seed)}` : '·'}</span>
          <span class="mu-name">${window.GridIronTitle.html(side?.name || opts.fallbackName || 'TBD', { size: 'sm', inline: true })}</span>
          <span class="mu-score${hasScore ? '' : ' is-empty'}">${hasScore ? fmt(score) : '—'}</span>
        </div>`;
    }

    function gameSlot(game, fallback) {
      if (!game?.home && !game?.away) {
        return `
          <div class="slot winner-line">
            <div class="mu">
              <div class="mu-await"><strong>${esc(fallback)}</strong>Awaiting matchup</div>
            </div>
          </div>`;
      }
      const status = game.status || 'upcoming';
      return `
        <div class="slot winner-line${status === 'live' ? ' is-live' : ''}${status === 'final' ? ' is-final' : ''}">
          <div class="mu">
            <div class="mu-head">
              <span class="mu-label">${esc(game.label || fallback)}</span>
              <span class="mu-status ${status === 'live' ? 'is-live' : status === 'final' ? 'is-final' : ''}">${esc(statusLabel(status))}</span>
            </div>
            ${teamRow(game.away, { role: 'away', winner: game.winner, status })}
            ${teamRow(game.home, { role: 'home', winner: game.winner, status })}
          </div>
        </div>`;
    }

    function byeSlot(seed) {
      return `
        <div class="slot bye">
          <div class="mu">
            <div class="mu-head">
              <span class="mu-label">Bye</span>
              <span class="mu-status">Week 14</span>
            </div>
            ${teamRow(seed, { bye: true, seed: seed?.seed, fallbackName: seedName(seed), status: 'upcoming' })}
          </div>
        </div>`;
    }

    function trophyGame(game, alt, slotClass) {
      const hasTeams = Boolean(game?.home || game?.away);
      const status = game?.status || 'upcoming';
      return `
        <div class="slot ${slotClass}">
          <div class="trophy-mark">
            <img src="${AAA_MARK}" alt="${esc(alt)}" />
          </div>
          <span class="sr-only">${esc(alt)}</span>
          ${hasTeams ? `
            <div class="mu">
              <div class="mu-head">
                <span class="mu-label">${esc(game.label || alt)}</span>
                <span class="mu-status ${status === 'live' ? 'is-live' : status === 'final' ? 'is-final' : ''}">${esc(statusLabel(status))}</span>
              </div>
              ${teamRow(game.away, { role: 'away', winner: game.winner, status })}
              ${teamRow(game.home, { role: 'home', winner: game.winner, status })}
            </div>` : ''}
        </div>`;
    }

    function wildCardCol(wc, format) {
      if (format === 'eight') {
        return `
          <div class="round-col">
            <div class="round-label">${esc(wc.label || 'Week 14 · Round of 8')}</div>
            ${(wc.games || []).map((g, i) => gameSlot(g, g?.label || `Game ${i + 1}`)).join('')}
          </div>`;
      }
      if (format === 'five') {
        return `
          <div class="round-col">
            <div class="round-label">${esc(wc.label || 'Week 14 · Wild Card')}</div>
            ${byeSlot(wc.bye1)}
            ${gameSlot(wc.game45, '#4 vs #5')}
            ${gameSlot(wc.game23, '#2 vs #3')}
          </div>`;
      }
      return `
        <div class="round-col">
          <div class="round-label">${esc(wc.label || 'Week 14 · Wild Card')}</div>
          ${byeSlot(wc.bye1)}
          ${gameSlot(wc.game45, '#4 vs #5')}
          ${gameSlot(wc.game36, '#3 vs #6')}
          ${byeSlot(wc.bye2)}
        </div>`;
    }

    function bracketTree(data) {
      const rounds = data.rounds || {};
      const format = rounds.format || 'six';
      const wc = rounds.wildCard || {};
      const semis = rounds.semifinals?.games || [];
      const finals = rounds.finals || {};
      const slots = data.playoffSlots || 6;
      return `
        <section class="conf-tree">
          <div class="conf-head">
            ${data.logo ? `<span class="conf-mark"><img src="${esc(data.logo)}" alt="" /></span>` : ''}
            ${esc(data.name || 'AAA League')}
            <span class="wk">${esc(String(data.teamCount || 12))} teams · top ${esc(String(slots))} in</span>
          </div>
          <div class="rounds${format === 'eight' ? ' is-eight' : ''}">
            ${wildCardCol(wc, format)}
            <div class="round-col">
              <div class="round-label">${esc(rounds.semifinals?.label || 'Week 15 · Semifinals')}</div>
              ${gameSlot(semis[0], 'Semifinal 1')}
              ${gameSlot(semis[1], 'Semifinal 2')}
            </div>
            <div class="round-col finale-col">
              <div class="round-label">${esc(finals.label || 'Week 16 · Title + 3rd')}</div>
              ${trophyGame(finals.title, 'AAA Championship', 'title-slot')}
              ${trophyGame(finals.third, 'Third Place', 'third-slot')}
            </div>
          </div>
        </section>`;
    }

    function superBowlBlock(game) {
      const status = game?.status || 'upcoming';
      const away = game?.away;
      const home = game?.home;
      const aScore = away?.score;
      const hScore = home?.score;
      const scored = aScore != null && hScore != null && status !== 'upcoming';
      const awayLead = scored && Number(aScore) >= Number(hScore);
      const homeLead = scored && Number(hScore) >= Number(aScore);
      return `
        <div class="mid" aria-label="AAA Super Bowl">
          <p class="finale-stage-label">Week 16 · Championship Stage</p>
          <div class="bowl">
            <header class="bowl-head">
              <div class="bowl-mark">
                <img src="${AAA_MARK}" alt="" width="256" height="256" />
              </div>
              <div class="bowl-head-copy">
                <p class="bowl-kicker">Title game</p>
                <h3>AAA Super Bowl</h3>
                <p class="bowl-sub">League champion · Week 16</p>
              </div>
            </header>
            <div class="bowl-scoreboard">
              <div class="bowl-side${awayLead ? ' is-lead' : ''}">
                <div class="nm">${window.GridIronTitle.html(away?.name || 'Finalist', { size: 'sm' })}</div>
                <div class="pts">${scored ? fmt(aScore) : ''}</div>
              </div>
              <div class="bowl-mid"><div class="vs">${esc(statusLabel(status) === 'Upcoming' ? 'VS' : statusLabel(status))}</div></div>
              <div class="bowl-side${homeLead ? ' is-lead' : ''}">
                <div class="nm">${window.GridIronTitle.html(home?.name || 'Finalist', { size: 'sm' })}</div>
                <div class="pts">${scored ? fmt(hScore) : ''}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    async function loadBracket() {
      try {
        const res = await fetch('/api/aaa/playoffs', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        if (!data.ok && !data.rounds) {
          document.getElementById('live-tree').innerHTML = `<div class="msg">${esc(data.error || 'AAA bracket unavailable')}</div>`;
          window.GridIronNav?.setSync('AAA bracket error', false);
          return;
        }
        document.getElementById('live-tree').innerHTML = `
          ${bracketTree(data)}
          ${superBowlBlock(data.superBowl)}
        `;
        const t = new Date(data.generatedAt || Date.now());
        window.GridIronNav?.setSync(`AAA bracket · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('live-tree').innerHTML = `<div class="msg">${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('AAA bracket error', false);
      }
    }

    loadBracket();
    setInterval(loadBracket, 30_000);
  </script>
</body>
</html>
