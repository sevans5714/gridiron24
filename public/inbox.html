<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=131" />
  <link rel="icon" href="/favicon.ico?v=131" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=131" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=131" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=177" />
  <style>
    body[data-page="inbox"] .page-hero {
      padding-top: 1rem;
      padding-bottom: 0.55rem;
      text-align: left;
    }
    body[data-page="inbox"] .page-hero::before,
    body[data-page="inbox"] .page-hero::after { display: none; }
    body[data-page="inbox"] .page-main {
      padding-top: 0.35rem;
      padding-bottom: 3rem;
      max-width: 72rem;
    }
    .inbox-comm-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0 0 0.35rem;
    }
    .inbox-comm-brand img {
      width: 1.7rem;
      height: 1.7rem;
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
    }
    .inbox-comm-brand span {
      margin: 0;
      font-family: var(--display);
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #efd782;
    }
    body[data-page="inbox"] .page-hero h1 {
      margin: 0;
      font-size: clamp(1.85rem, 4vw, 2.35rem);
    }
    .inbox-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 0.85rem;
    }
    .inbox-toolbar .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body data-page="inbox">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="topbar-right">
        <div class="sync" id="lastUpdated">Inbox</div>
      </div>
    </div>
  </header>

  <section class="page-hero shell">
    <div class="inbox-comm-brand">
      <img src="/assets/gridiron24-brand.png?v=3" alt="" width="48" height="48" decoding="async" />
      <span>Communications</span>
    </div>
    <h1>Inbox</h1>
  </section>

  <main class="page-main shell">
    <div class="inbox-toolbar">
      <p class="hint" id="inbox-hint">Loading…</p>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="inbox-mark-all">Mark all read</button>
        <a class="btn btn-ghost" href="/profile.html#inbox">Settings</a>
      </div>
    </div>
    <div id="inbox-list"><div class="msg">Loading inbox…</div></div>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=177"></script>
  <script src="/js/inbox-ui.js?v=18"></script>
  <script>
    const mount = document.getElementById('inbox-list');
    const hint = document.getElementById('inbox-hint');

    async function refresh() {
      const data = await window.GridIronInbox.renderInbox(mount);
      if (!data) {
        hint.textContent = 'Could not load inbox.';
        return;
      }
      const n = Number(data.unread || 0);
      const total = data.messages.length;
      const roleNote = data.canSend
        ? 'Admins can send & reply'
        : 'Receive-only · admins can message you';
      hint.textContent = n
        ? `${n} unread · ${total} total · ${roleNote}`
        : `${total} message${total === 1 ? '' : 's'} · ${roleNote}`;
      window.GridIronNav?.refreshInboxBadge?.();
    }

    document.getElementById('inbox-mark-all').addEventListener('click', async () => {
      await fetch('/api/inbox/read-all', { method: 'POST' });
      await refresh();
    });

    window.GridIronNav?.authReady?.then(async ({ user }) => {
      if (!user) {
        window.location.replace('/enter?next=' + encodeURIComponent('/inbox.html'));
        return;
      }
      window.GridIronInbox.wireInbox(mount, {
        onChange: () => {
          window.GridIronNav?.refreshInboxBadge?.();
          const rows = mount.querySelectorAll('.inbox-row');
          const unread = mount.querySelectorAll('.inbox-row.is-unread').length;
          const total = rows.length;
          hint.textContent = unread
            ? `${unread} unread · ${total} total`
            : `${total} message${total === 1 ? '' : 's'}`;
        }
      });
      await refresh();
    });
  </script>
</body>
</html>
