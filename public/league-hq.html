<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>League HQ · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=129" />
  <link rel="icon" href="/favicon.ico?v=129" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=129" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=129" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=173" />
  <link rel="stylesheet" href="/css/draft-desk.css?v=11" />
  <style>
    body[data-page="league-hq"] .topbar {
      border-bottom: 1px solid color-mix(in srgb, var(--il-c1) 42%, rgba(142, 182, 255, 0.42));
    }
    body[data-page="league-hq"] {
      --il-c1: var(--blue);
      --il-c2: var(--gold);
      background:
        radial-gradient(ellipse 85% 55% at 50% -8%, color-mix(in srgb, var(--il-c1) 22%, transparent), transparent 58%),
        radial-gradient(ellipse 42% 38% at 8% 72%, color-mix(in srgb, var(--il-c1) 12%, transparent), transparent 52%),
        radial-gradient(ellipse 42% 38% at 92% 68%, color-mix(in srgb, var(--il-c2) 11%, transparent), transparent 52%),
        radial-gradient(ellipse 90% 50% at 50% -10%, var(--body-wash), transparent 55%),
        linear-gradient(180deg, var(--body-mid) 0%, var(--bg) 28%, var(--bg) 100%);
    }
    html[data-theme="day"] body[data-page="league-hq"] {
      background:
        radial-gradient(ellipse 85% 55% at 50% -8%, color-mix(in srgb, var(--il-c1) 14%, transparent), transparent 58%),
        radial-gradient(ellipse 42% 38% at 8% 72%, color-mix(in srgb, var(--il-c1) 8%, transparent), transparent 52%),
        radial-gradient(ellipse 42% 38% at 92% 68%, color-mix(in srgb, var(--il-c2) 7%, transparent), transparent 52%),
        radial-gradient(ellipse 90% 50% at 50% -10%, var(--body-wash), transparent 55%),
        linear-gradient(180deg, var(--body-mid) 0%, var(--bg) 28%, var(--bg) 100%);
    }
    body[data-page="league-hq"] .page-main {
      padding-top: 0.35rem;
    }
    body[data-page="league-hq"] .page-hero {
      padding-top: 1.35rem;
      padding-bottom: 1rem;
    }
    body[data-page="league-hq"] .page-hero::before,
    body[data-page="league-hq"] .page-hero::after { display: none; }

    .il-hq-hero {
      position: relative;
      z-index: 5;
      text-align: center;
      margin: 0 0 0.35rem;
      padding: 0.85rem 0 1.5rem;
      overflow: visible;
      border-bottom: 1px solid color-mix(in srgb, var(--il-c1) 40%, transparent);
      background:
        radial-gradient(ellipse 75% 90% at 50% 28%, color-mix(in srgb, var(--il-c1) 22%, transparent), transparent 62%),
        radial-gradient(ellipse 50% 60% at 18% 90%, color-mix(in srgb, var(--il-c1) 10%, transparent), transparent 55%),
        radial-gradient(ellipse 50% 60% at 82% 90%, color-mix(in srgb, var(--il-c2) 10%, transparent), transparent 55%),
        transparent;
    }
    .il-hq-hero img,
    .il-lettermark {
      width: min(14rem, 52vw);
      height: auto;
      display: block;
      margin: 0 auto;
      position: relative;
      z-index: 6;
      filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.78));
    }
    html[data-theme="day"] .il-hq-hero img,
    html[data-theme="day"] .il-lettermark {
      filter: drop-shadow(0 12px 24px rgba(20, 24, 31, 0.2));
    }
    .il-lettermark {
      width: min(9.5rem, 42vw);
      height: min(9.5rem, 42vw);
      display: grid;
      place-items: center;
      border: 2px solid color-mix(in srgb, var(--gold) 70%, transparent);
      background:
        radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--il-c1) 28%, transparent), transparent 62%),
        linear-gradient(180deg, #152238, #0a1220);
      font-family: var(--display);
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      letter-spacing: 0.06em;
      color: var(--gold);
    }
    html[data-theme="day"] .il-lettermark {
      background:
        radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--il-c1) 16%, transparent), transparent 62%),
        linear-gradient(180deg, #ffffff, #eef2f8);
      border-color: color-mix(in srgb, var(--il-c1) 45%, var(--line));
    }
    .il-hq-name {
      margin: 1.05rem 0 0;
      font-family: var(--page-title);
      font-size: clamp(2rem, 5.5vw, 3.1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--text);
    }
    .il-hq-hero .tag {
      margin: 1.15rem 0 0;
      font-family: var(--display);
      font-size: clamp(1.35rem, 3.8vw, 1.95rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.25;
      color: var(--text);
    }
    .il-hq-hero .tag .t { color: var(--il-c1); }
    .il-hq-hero .tag .d { color: var(--gold); }
    .il-hq-hero .tag .c { color: var(--text); }
    html[data-theme="day"] .il-hq-hero .tag .d { color: var(--il-c2); }
    .il-hq-hero .tag .sep { color: var(--muted-2); margin: 0 0.35em; }
    .il-hq-hero.is-live .tag .t {
      color: #4dff9a;
      text-shadow: 0 0 18px rgba(77, 255, 154, 0.55);
    }
    .il-live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.12rem 0.45rem;
      border: 1px solid rgba(77, 255, 154, 0.55);
      background: rgba(77, 255, 154, 0.12);
      color: #4dff9a;
      font-family: var(--display);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      line-height: 1;
    }
    .il-live-pill::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: #4dff9a;
      box-shadow: 0 0 8px #4dff9a;
      animation: il-live-pulse 1.2s ease-in-out infinite;
    }
    @keyframes il-live-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.72); }
    }

    #il-root .page-hero {
      margin-bottom: 1.25rem;
      border-bottom-color: color-mix(in srgb, var(--il-c1, var(--blue)) 28%, transparent);
      background:
        radial-gradient(ellipse 80% 120% at 12% 0%, color-mix(in srgb, var(--il-c1, var(--blue)) 24%, transparent), transparent 55%),
        linear-gradient(180deg, color-mix(in srgb, var(--il-c1, var(--blue)) 14%, transparent), color-mix(in srgb, var(--il-c1, var(--blue)) 3%, transparent) 70%, transparent);
    }
    #il-root .page-hero::before {
      background: var(--il-c1, var(--blue));
    }
    #il-root .page-hero .eyebrow {
      color: var(--il-c1, var(--blue));
    }

    .il-hq-board {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(17rem, 0.78fr);
      gap: 1.75rem 2rem;
      align-items: start;
      margin: 1.5rem 0 2.25rem;
    }
    @media (max-width: 900px) {
      .il-hq-board { grid-template-columns: 1fr; }
    }
    .il-hq-board .il-card {
      margin: 0;
      padding: 0 0 1.25rem;
      border: 1px solid color-mix(in srgb, var(--il-c1) 22%, var(--line));
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 42%), var(--panel);
      overflow: hidden;
    }
    .il-card-head {
      margin: 0 0 0.9rem;
      min-height: 2.85rem;
      padding: 0.55rem 1.2rem;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse 80% 120% at 8% 0%, color-mix(in srgb, var(--il-c1) 16%, transparent), transparent 55%),
        linear-gradient(180deg, color-mix(in srgb, var(--il-c1) 12%, transparent), color-mix(in srgb, var(--il-c1) 4%, transparent));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .il-card-head::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--il-c1);
    }
    .il-card-head h2 {
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font-family: var(--display);
      font-size: clamp(1.45rem, 3vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.1;
    }
    .il-card-head a {
      color: #9ec0ff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
    }
    html[data-theme="day"] .il-card-head a { color: var(--blue); }
    .il-card-head a:hover { color: var(--nav-hover); }
    .il-card > :not(.il-card-head) {
      padding-left: 1.2rem;
      padding-right: 1.2rem;
    }
    .il-hq-side {
      display: grid;
      gap: 1.35rem;
    }
    .il-hq-side .il-card-head h2 {
      font-size: clamp(1.05rem, 2.2vw, 1.28rem);
    }

    .il-standings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.35rem 1.5rem;
    }
    .il-standings.is-one { grid-template-columns: 1fr; }
    @media (max-width: 640px) {
      .il-standings { grid-template-columns: 1fr; }
    }
    @media (min-width: 641px) {
      .il-standings:not(.is-one) .il-conf:last-child {
        padding-left: 1.15rem;
        border-left: 1px solid var(--line);
      }
    }
    .il-conf-head {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.7rem;
      padding-bottom: 0.55rem;
      border-bottom: 2px solid color-mix(in srgb, var(--conf, var(--il-c1)) 55%, var(--line));
    }
    .il-conf-head img {
      width: clamp(2.35rem, 6vw, 3.25rem);
      height: auto;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
    }
    .il-conf-head h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.1;
      color: var(--conf, var(--text));
    }
    .il-mini {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 1.05rem;
    }
    .il-mini th {
      padding: 0.4rem 0.35rem 0.5rem;
      text-align: left;
      font-size: 0.78rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    .il-mini td {
      padding: 0.42rem 0.35rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      color: var(--text);
    }
    .il-mini tr:last-child td { border-bottom: 0; }
    .il-mini .rank {
      width: 1.35rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .il-mini .team {
      font-weight: 600;
      min-width: 0;
    }
    .il-mini .mgr {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 500;
    }
    .il-mini th.num,
    .il-mini td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 0.55rem;
    }
    .il-mini th.num.wl,
    .il-mini td.num.wl {
      width: 3.55rem;
      text-align: center;
      padding-left: 0.2rem;
      padding-right: 0.2rem;
    }
    .il-mini th.num.pf,
    .il-mini td.num.pf { width: 4.85rem; }
    html[data-theme="day"] .il-mini th.num,
    html[data-theme="day"] .il-mini td.num {
      border-left-color: rgba(20, 28, 40, 0.14);
    }
    .il-mini .team a {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      max-width: 100%;
    }
    .il-mini .team-logo-sm {
      width: 1.75rem;
      height: 1.75rem;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .il-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    .il-stat {
      display: grid;
      gap: 0.2rem;
      min-width: 0;
      padding: 0.75rem 0.85rem 0.85rem;
      border: 1px solid var(--line);
      background: var(--panel-2);
    }
    .il-stat span {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .il-stat strong {
      font-family: var(--display);
      font-size: clamp(1.35rem, 3vw, 1.7rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.05;
      color: var(--text);
    }
    .il-stat strong.is-gold { color: var(--gold); }

    .il-desk-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 520px) {
      .il-desk-links { grid-template-columns: 1fr; }
    }
    .il-desk-links a {
      position: relative;
      display: grid;
      gap: 0.2rem;
      min-height: 4.6rem;
      padding: 0.85rem 0.95rem 0.95rem;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--il-c1) 12%, transparent), transparent 58%),
        var(--panel-2);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
    }
    .il-desk-links a::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--tile, var(--il-c1));
    }
    .il-desk-links a:hover {
      border-color: color-mix(in srgb, var(--tile, var(--il-c1)) 45%, var(--line));
    }
    .il-desk-links a em {
      font-style: normal;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--tile, var(--gold));
    }
    .il-desk-links a strong {
      font-family: var(--page-title);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .il-motw-col {
      display: grid;
      gap: 1.15rem;
    }
    .il-motw {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.45rem;
      align-items: center;
      padding: 0.2rem 0 0;
    }
    .il-motw-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      text-align: center;
      min-width: 0;
    }
    .il-motw-side img {
      width: 4.25rem;
      height: 4.25rem;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
    }
    .il-motw-side .nm {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .il-motw-mid {
      text-align: center;
      font-family: var(--display);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .il-motw-mid .vs {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    .il-motw-mid .score {
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .il-motw-mid .live-note {
      margin-top: 0.25rem;
      color: #4dff9a;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }
    .il-hotnot {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem 1.25rem;
    }
    @media (max-width: 520px) {
      .il-hotnot { grid-template-columns: 1fr; }
    }
    .il-hotnot-col {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 0;
      padding-left: 0.75rem;
    }
    .il-hotnot-col .label {
      font-family: var(--display);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .il-hotnot-col.hot {
      border-left: 3px solid #ef4444;
    }
    .il-hotnot-col.hot .label {
      color: #ef4444;
    }
    .il-hotnot-col.cold {
      border-left: 3px solid var(--blue);
    }
    .il-hotnot-col.cold .label {
      color: var(--blue);
    }
    .il-hotnot-team {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }
    .il-hotnot-team img {
      width: 2.6rem;
      height: 2.6rem;
      object-fit: contain;
    }
    .il-hotnot-team .nm {
      font-weight: 700;
      line-height: 1.2;
    }
    .il-hotnot-team .sub {
      color: var(--muted);
      font-size: 0.82rem;
    }
    .il-matchup.is-live {
      border-color: color-mix(in srgb, #4dff9a 40%, var(--line));
      box-shadow: inset 3px 0 0 #4dff9a;
    }
    .il-matchup .live-flag {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 0.15rem;
    }

    .il-banner {
      margin: 0 0 1.15rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .il-banner.is-pending {
      border-color: color-mix(in srgb, var(--detail, #ff7a18) 45%, var(--line));
      background: color-mix(in srgb, var(--detail, #ff7a18) 10%, var(--panel));
    }
    .il-grid {
      display: grid;
      gap: 1.15rem;
    }
    .il-panel {
      margin: 0;
      padding: 0 0 1.2rem;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--il-c1, var(--blue)) 8%, transparent), transparent 42%),
        var(--panel);
      overflow: hidden;
    }
    .il-panel h2 {
      margin: 0 0 0.95rem;
      padding: 0.7rem 1.15rem;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse 80% 120% at 8% 0%, color-mix(in srgb, var(--il-c1, var(--blue)) 16%, transparent), transparent 55%),
        linear-gradient(180deg, color-mix(in srgb, var(--il-c1, var(--blue)) 12%, transparent), color-mix(in srgb, var(--il-c1, var(--blue)) 4%, transparent));
      position: relative;
      font-family: var(--page-title);
      font-size: clamp(1.15rem, 2.4vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .il-panel h2::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--il-c1, var(--blue));
    }
    .il-panel > :not(h2) {
      margin-left: 1.15rem;
      margin-right: 1.15rem;
    }
    .il-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    @media (max-width: 800px) {
      .il-split { grid-template-columns: 1fr; }
    }
    .il-meta {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    #il-root > h1.page-title {
      margin: 0 0 1rem;
      font-family: var(--page-title);
      font-size: var(--fs-xl);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: var(--lh-tight);
    }
    .il-meta strong { color: var(--text); }
    .il-empty {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .il-team-list {
      display: grid;
      gap: 0.35rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .il-team-list li {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      font-size: 0.92rem;
    }
    .il-team-list li:last-child { border-bottom: 0; }
    .il-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      color: var(--blue);
    }
    .il-form {
      display: grid;
      gap: 0.85rem;
      max-width: 36rem;
    }
    .il-form label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.78rem;
      font-weight: 700;

    .il-clock-timer.is-warn { color: #efd782; }
    .il-clock-timer.is-urgent { color: #ff8e8e; }
    .il-clock-timer.is-mine { color: #8fd49a; }
    .il-draft-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.55rem 0 0.45rem;
    }
    .il-draft-filters button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      font-family: var(--display);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.3rem 0.55rem;
      cursor: pointer;
    }
    .il-draft-filters button.is-on { color: var(--text); border-color: var(--blue); background: rgba(47,109,255,0.12); }
    .il-draft-search { width: min(100%, 18rem); }
    .il-pool-row {
      display: grid;
      grid-template-columns: 2rem 2.4rem minmax(0, 1fr) 3.2rem 3.2rem 3.4rem;
      gap: 0.4rem;
      align-items: center;
      width: 100%;
    }
    .il-pool-row img, .il-pool-head {
      width: 2rem; height: 2rem; object-fit: cover; border-radius: 0.2rem; background: #111;
    }
    .il-pool-head.is-blank { display: inline-block; }
    .il-inj {
      display: inline-block;
      margin-left: 0.3rem;
      padding: 0 0.28rem;
      border: 1px solid #ff8e8e;
      color: #ff8e8e;
      font-size: 0.65rem;
      letter-spacing: 0.04em;
    }
    .il-snake {
      overflow: auto;
      border: 1px solid var(--line);
      max-height: min(42vh, 520px);
    }
    .il-snake-board {
      display: grid;
      row-gap: 1px;
      column-gap: 4px;
      min-width: max-content;
      padding: 4px;
      background: #121212;
    }
    .il-snake-head, .il-snake-round, .il-snake-cell {
      background: var(--panel);
      min-width: 6.6rem;
      max-width: 7.4rem;
      padding: 0.35rem 0.3rem;
      font-size: 0.72rem;
    }
    .il-snake-round {
      position: sticky;
      left: 0;
      z-index: 2;
      min-width: 2rem;
      max-width: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-weight: 700;
    }
    .il-snake-head {
      position: sticky;
      top: 0;
      z-index: 3;
      font-family: var(--display);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .il-snake-cell { min-height: 2.8rem; }
    .il-snake-cell.pos-QB { background: #e85d5d; color: #111; }
    .il-snake-cell.pos-RB { background: #5fbf6a; color: #111; }
    .il-snake-cell.pos-WR { background: #5aa8e8; color: #111; }
    .il-snake-cell.pos-TE { background: #f0b24a; color: #111; }
    .il-snake-cell.pos-K { background: #c9a0e8; color: #111; }
    .il-snake-cell.pos-DST { background: #8a9aa8; color: #111; }
    .il-snake-cell.empty { background: color-mix(in srgb, var(--panel) 80%, #000); color: var(--muted); }
    .il-picks {
      display: grid;
      gap: 0.25rem;
      max-height: 28rem;
      overflow: auto;
      font-size: 0.88rem;
    }
    .il-picks .row {
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 1fr) auto;
      gap: 0.45rem;
      padding: 0.3rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }
    .il-roster-list {
      display: grid;
      gap: 0.35rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .il-roster-list li {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      font-size: 0.92rem;
    }
  </style>
</head>
<body data-page="league-hq">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">League HQ</div>
    </div>
  </header>

  <main class="page-main shell" id="il-root">
    <div class="msg">Loading league HQ…</div>
  </main>

  <footer class="shell site-footer" data-platform-footer="gridiron24">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>

  <script src="/js/nav.js?v=173"></script>
  <script src="/js/official-draft-ui.js?v=14"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function parsePath() {
      const path = String(location.pathname || '');
      let m = path.match(/^\/([a-z0-9-]+)\.html$/i);
      if (m) return { slug: m[1].toLowerCase(), section: 'home' };
      m = path.match(/^\/([a-z0-9-]+)\/([a-z0-9-]+)\.html$/i);
      if (m) return { slug: m[1].toLowerCase(), section: m[2].toLowerCase() };
      return { slug: '', section: 'home' };
    }

    function confColor(conf, index = 0) {
      const raw = String(conf?.color || '').trim();
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(raw)) return raw;
      return index === 0 ? '#2f6dff' : '#efd782';
    }

    function applyLeagueTheme(league) {
      const confs = league?.conferences || [];
      const c1 = confColor(confs[0], 0);
      const c2 = confs[1] ? confColor(confs[1], 1) : c1;
      const body = document.body;
      body.style.setProperty('--il-c1', c1);
      body.style.setProperty('--il-c2', c2);
    }

    function pageHead(title, league, sub = '') {
      return `<header class="page-hero">
        <p class="eyebrow">${esc(league.brand?.name || league.slug)}</p>
        <h1>${esc(title)}</h1>
        ${sub ? `<p>${sub}</p>` : ''}
      </header>${statusBanner(league)}`;
    }

    function franchiseById(id) {
      return (hqState.league?.franchises || []).find((f) => f.id === id) || null;
    }

    function heroTagline(league, board) {
      if (board?.live) {
        const n = Number(board.liveGames) || 0;
        const games = n === 1 ? '1 NFL game' : `${n} NFL games`;
        return `<span class="t">LIVE</span><span class="sep">·</span><span class="d">Week ${esc(String(board.week || ''))}</span><span class="sep">·</span><span class="c">Play by Play · ${esc(games)}</span>`;
      }
      const confs = league.conferences || [];
      const nTeams = Number(league.structure?.totalTeams || (league.franchises || []).length || 0);
      const confLabel = confs.length === 2 ? 'Two Conferences' : (confs.length === 1 ? 'One Conference' : `${confs.length || '—'} Conferences`);
      const champ = league.championship?.name || '';
      if (league.brand?.tagline) return `<span class="c">${esc(league.brand.tagline)}</span>`;
      return `<span class="t">${esc(nTeams || '—')} Teams</span><span class="sep">·</span><span class="d">${esc(confLabel)}</span>${
        champ ? `<span class="sep">·</span><span class="c">${esc(champ)}</span>` : ''
      }`;
    }

    function liveStatusLine(board) {
      if (!board) return 'Connecting live scoring…';
      if (board.live) {
        const n = Number(board.liveGames) || 0;
        return `LIVE play-by-play · ${n} NFL ${n === 1 ? 'game' : 'games'} in progress`;
      }
      if (Number(board.finalGames) > 0) return `Week ${esc(String(board.week))} · final`;
      return `Week ${esc(String(board.week))} · live scoring from kickoff, play by play`;
    }

    function setLiveSync() {
      const b = hqState.weekBoard;
      const name = hqState.league?.brand?.name || 'League HQ';
      if (b?.live) {
        const t = b.statsFetchedAt
          ? new Date(b.statsFetchedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })
          : '';
        window.GridIronNav?.setSync(`LIVE · ${b.liveGames || 0} NFL · ${t}`.trim(), true);
        return;
      }
      window.GridIronNav?.setSync(name, true);
    }

    function pickMatchupOfWeek(matchups) {
      const list = matchups || [];
      if (!list.length) return null;
      return list.slice().sort((a, b) => {
        const aLive = Number(a.homeScore || a.home?.total || 0) + Number(a.awayScore || a.away?.total || 0);
        const bLive = Number(b.homeScore || b.home?.total || 0) + Number(b.awayScore || b.away?.total || 0);
        return bLive - aLive;
      })[0];
    }

    function motwBlock(conf, matchup, board) {
      const title = conf?.shortName || conf?.name || 'League';
      const color = confColor(conf, 0);
      if (!matchup) {
        return `<div class="il-motw-block">
          <div class="il-conf-head" style="--conf:${esc(color)}"><h3>${esc(title)}</h3></div>
          <p class="il-empty">Matchups lock after the draft.</p>
        </div>`;
      }
      const awayF = franchiseById(matchup.away?.franchiseId);
      const homeF = franchiseById(matchup.home?.franchiseId);
      const awayScore = Number(matchup.awayScore || matchup.away?.total || 0).toFixed(1);
      const homeScore = Number(matchup.homeScore || matchup.home?.total || 0).toFixed(1);
      return `<div class="il-motw-block">
        <div class="il-conf-head" style="--conf:${esc(color)}"><h3>${esc(title)}</h3></div>
        <div class="il-motw">
          <div class="il-motw-side">
            ${window.GridIronTitle.html(matchup.away?.name || 'Away', { size: 'sm' })}
          </div>
          <div class="il-motw-mid">
            <div class="vs">VS</div>
            <div class="score">${esc(awayScore)} – ${esc(homeScore)}</div>
            ${board?.live ? '<div class="live-note">LIVE</div>' : ''}
          </div>
          <div class="il-motw-side">
            ${window.GridIronTitle.html(matchup.home?.name || 'Home', { size: 'sm' })}
          </div>
        </div>
      </div>`;
    }

    function motwHtml(league, board) {
      const groups = franchisesByConf(league);
      const matchups = board?.matchups || [];
      if (!groups.length) return `<p class="il-empty">Franchises show here after setup.</p>`;
      const blocks = groups.map(({ conf }) => {
        const slice = matchups.filter((m) => {
          const key = conf.key;
          if (!key || groups.length < 2) return true;
          return m.home?.conferenceKey === key || m.away?.conferenceKey === key;
        });
        return motwBlock(conf, pickMatchupOfWeek(slice.length ? slice : matchups), board);
      });
      return `<div class="il-motw-col">${blocks.join('')}</div>`;
    }

    function hotNotHtml(league, board) {
      const groups = franchisesByConf(league);
      const byId = new Map((board?.standings || []).map((s) => [s.franchiseId, s]));
      if (!groups.length) return '';
      return groups.map(({ conf, teams }, gi) => {
        const ranked = [...teams].map((t) => {
          const s = byId.get(t.id);
          return {
            ...t,
            wins: s?.wins || 0,
            losses: s?.losses || 0,
            pointsFor: Number(s?.pointsFor || s?.total || 0),
            total: Number(s?.total || 0)
          };
        }).sort((a, b) => {
          if (board?.live) return (b.total - a.total) || (b.pointsFor - a.pointsFor);
          return (b.wins - a.wins) || (b.pointsFor - a.pointsFor);
        });
        const hot = ranked[0];
        const cold = ranked.length > 1 ? ranked[ranked.length - 1] : null;
        const color = confColor(conf, gi);
        const rec = (t) => {
          if (!t) return '';
          if (board?.live) return `${Number(t.total || t.pointsFor || 0).toFixed(1)} this week`;
          return `${t.wins}-${t.losses} · ${Number(t.pointsFor || 0).toFixed(1)} PF`;
        };
        return `<div class="il-motw-block">
          <div class="il-conf-head" style="--conf:${esc(color)}"><h3>${esc(conf.shortName || conf.name || conf.key)}</h3></div>
          <div class="il-hotnot">
            <div class="il-hotnot-col hot">
              <div class="label">Who’s Hot</div>
              ${hot ? `<div class="il-hotnot-team">${window.GridIronTitle.html(hot.name, { size: 'sm' })}<div class="sub">${esc(rec(hot))}</div></div>` : ''}
            </div>
            <div class="il-hotnot-col cold">
              <div class="label">Who’s Not</div>
              ${cold ? `<div class="il-hotnot-team">${window.GridIronTitle.html(cold.name, { size: 'sm' })}<div class="sub">${esc(rec(cold))}</div></div>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function paintHomeLive() {
      const league = hqState.league;
      const board = hqState.weekBoard;
      if (!league) return;
      const hero = document.getElementById('il-hq-hero');
      const tag = document.getElementById('il-hero-tag');
      hero?.classList.toggle('is-live', Boolean(board?.live));
      if (tag) tag.innerHTML = heroTagline(league, board);
      const standings = document.getElementById('il-home-standings');
      if (standings) standings.innerHTML = standingsHtml(league, board, { compact: true });
      const motw = document.getElementById('il-home-motw');
      if (motw) motw.innerHTML = motwHtml(league, board);
      const hot = document.getElementById('il-home-hotnot');
      if (hot) hot.innerHTML = hotNotHtml(league, board);
    }

    function leagueCrestHtml(league) {
      const name = league.brand?.name || league.slug;
      const src = league.brand?.logo || league.brand?.crest;
      if (src) {
        return `<img src="${esc(src)}" alt="${esc(name)}" width="320" height="320" decoding="async" />`;
      }
      const initials = String(name).split(/\s+/).filter(Boolean).slice(0, 2)
        .map((w) => w[0]).join('').toUpperCase() || 'L';
      return `<div class="il-lettermark" aria-hidden="true">${esc(initials)}</div>`;
    }

    function draftStatusLabel(league) {
      const s = String(league.draft?.status || 'scheduled').toLowerCase();
      if (s === 'lobby') return 'Lobby';
      if (s === 'live') return 'Live';
      if (s === 'complete') return 'Complete';
      return 'Scheduled';
    }

    function statusBanner(league) {
      if (league.status === 'pending_approval') {
        return `<div class="il-banner is-pending"><strong>Pending approval.</strong> After the site owner approves, open <a href="/create-league">Create a League</a> to set up the league.</div>`;
      }
      if (league.status === 'approved' && league.setupComplete === false) {
        return `<div class="il-banner is-pending"><strong>Approved — setup required.</strong> <a href="/create-league">Set up your league</a>.</div>`;
      }
      if (league.status === 'rejected') {
        return `<div class="il-banner"><strong>Not approved.</strong> ${esc(league.rejectionReason || 'Contact the site owner for details.')}</div>`;
      }
      return '';
    }

    function franchisesByConf(league) {
      const map = new Map();
      for (const c of (league.conferences || [])) map.set(c.key, { conf: c, teams: [] });
      for (const f of (league.franchises || [])) {
        const key = f.conferenceKey || f.conference || '';
        if (!map.has(key)) map.set(key, { conf: { key, name: key }, teams: [] });
        map.get(key).teams.push(f);
      }
      return [...map.values()];
    }

    function standingsHtml(league, weekBoard = null, { compact = false } = {}) {
      const groups = franchisesByConf(league);
      if (!groups.length) return `<p class="il-empty">Franchises show here after league setup.</p>`;
      const byId = new Map((weekBoard?.standings || []).map((s) => [s.franchiseId, s]));
      return `<div class="il-standings${groups.length < 2 ? ' is-one' : ''}">${groups.map(({ conf, teams }, gi) => {
        const ranked = [...teams].sort((a, b) => {
          const sa = byId.get(a.id);
          const sb = byId.get(b.id);
          if (!sa && !sb) return 0;
          if (!sa) return 1;
          if (!sb) return -1;
          return (sb.wins - sa.wins) || (sb.pointsFor - sa.pointsFor);
        });
        const color = confColor(conf, gi);
        return `
        <div class="il-conf" style="--conf:${esc(color)}">
          <div class="il-conf-head">
            ${conf.logo ? `<img src="${esc(conf.logo)}" alt="" width="64" height="64" decoding="async" />` : ''}
            <h3>${esc(conf.shortName || conf.name || conf.key)}</h3>
          </div>
          <table class="il-mini">
            <thead>
              <tr>
                <th></th>
                <th>Team</th>
                ${compact ? '' : '<th>Mgr</th>'}
                <th class="num wl">W-L</th>
                <th class="num pf">PF</th>
                ${compact ? '' : '<th class="num pf">PA</th>'}
              </tr>
            </thead>
            <tbody>
              ${ranked.map((t, i) => {
                const s = byId.get(t.id);
                const record = s
                  ? `${s.wins}-${s.losses}${s.ties ? `-${s.ties}` : ''}`
                  : '0-0';
                const pf = s ? Number(s.pointsFor || 0).toFixed(1) : '0.0';
                return `
                <tr>
                  <td class="rank">${i + 1}</td>
                  <td class="team">
                    <a class="il-team-link" href="${esc(teamPath(t.id, weekBoard?.week))}">${
                      window.GridIronTitle.html(t.name || t.teamName || `Team ${i + 1}`, { size: 'sm', inline: true, owner: t.managerName || t.ownerName })
                    }</a>
                  </td>
                  ${compact ? '' : `<td class="mgr">${esc(t.managerName || t.ownerName || 'Open')}</td>`}
                  <td class="num wl">${esc(record)}</td>
                  <td class="num pf">${esc(pf)}</td>
                  ${compact ? '' : `<td class="num pf">${esc(s ? Number(s.pointsAgainst || 0).toFixed(1) : '0.0')}</td>`}
                </tr>`;
              }).join('') || `<tr><td colspan="${compact ? 4 : 6}" class="il-empty">No teams</td></tr>`}
            </tbody>
          </table>
        </div>`;
      }).join('')}</div>`;
    }

    function formatRuleBody(text) {
      const raw = String(text || '').trim();
      if (!raw) return '<p class="il-empty">No text yet.</p>';
      return `<p class="body">${esc(raw)}</p>`;
    }

    function rulebookHtml(league, viewer = {}) {
      const rb = league.rulebook || {};
      const sections = Array.isArray(rb.sections) && rb.sections.length
        ? rb.sections
        : (Array.isArray(rb.articles) ? rb.articles : []);
      const ownerArticles = sections.filter((a) => a.source === 'owner');
      const settingsArticles = sections.filter((a) => a.source !== 'owner');
      const canEdit = Boolean(viewer?.isOwner || viewer?.isSiteOwner)
        && league.status !== 'pending_approval'
        && league.status !== 'rejected';

      const settingsBlock = `
        <section class="il-panel">
          <h2>From settings</h2>
          <p class="il-meta">These articles update automatically when you change draft, roster, scoring, structure, or payouts in Settings.</p>
          <div style="margin-top:1rem;">
            ${settingsArticles.map((a) => `
              <article class="il-rule-article">
                <h3>${esc(a.title || 'Article')} <span class="il-meta">· settings</span></h3>
                ${formatRuleBody(a.body)}
              </article>`).join('') || '<p class="il-empty">No settings-derived rules yet.</p>'}
          </div>
        </section>`;

      if (canEdit) {
        return `
          ${settingsBlock}
          <section class="il-panel" style="margin-top:1rem;">
            <h2>House rules</h2>
            <p class="il-meta">You write these. Managers see them here with the settings articles above.</p>
            <form class="il-rule-editor" id="il-rulebook-form" style="margin-top:0.85rem;">
              ${ownerArticles.map((a, i) => `
                <div class="il-rule-block">
                  <label>Title
                    <input type="text" name="title-${i}" maxlength="120" value="${esc(a.title || '')}" required />
                  </label>
                  <label>Body
                    <textarea name="body-${i}" maxlength="12000" rows="5">${esc(a.body || '')}</textarea>
                  </label>
                  <input type="hidden" name="id-${i}" value="${esc(a.id || `owner-${i + 1}`)}" />
                </div>`).join('') || '<p class="il-empty">No house-rule slots.</p>'}
              <input type="hidden" name="articleCount" value="${ownerArticles.length}" />
              <div class="il-actions">
                <button type="submit" class="il-btn">Save house rules</button>
                <span class="il-status" id="il-rulebook-status" role="status"></span>
              </div>
              ${rb.updatedAt ? `<p class="il-meta">Last saved ${esc(new Date(rb.updatedAt).toLocaleString())}${rb.updatedByName ? ` by ${esc(rb.updatedByName)}` : ''}</p>` : ''}
            </form>
          </section>`;
      }

      return `
        <section class="il-panel">
          <h2>Rule Book</h2>
          <p class="il-meta">Independent rules for <strong>${esc(league.brand?.name || league.slug)}</strong>. Some articles come from league settings; house rules are written by the owner.</p>
          ${rb.updatedAt ? `<p class="il-meta" style="margin-top:0.35rem;">House rules updated ${esc(new Date(rb.updatedAt).toLocaleString())}${rb.updatedByName ? ` · ${esc(rb.updatedByName)}` : ''}</p>` : ''}
          <div style="margin-top:1rem;">
            ${sections.map((a) => `
              <article class="il-rule-article">
                <h3>${esc(a.title || 'Article')}${a.source === 'settings' ? ' <span class="il-meta">· settings</span>' : ''}</h3>
                ${formatRuleBody(a.body)}
              </article>`).join('') || '<p class="il-empty">No rules published yet.</p>'}
          </div>
        </section>`;
    }

    function toLocalInputValue(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!Number.isFinite(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function keepersAreOn(settings = {}) {
      return settings.keepersEnabled === true && settings.leagueFormat !== 'dynasty';
    }

    function keeperToggleHtml(s = {}, opts = {}) {
      const dynasty = s.leagueFormat === 'dynasty';
      const on = !dynasty && keepersAreOn(s);
      const prefix = opts.namePrefix || '';
      return `
        <fieldset class="il-toggle-row" ${dynasty ? 'disabled' : ''}>
          <legend class="il-meta" style="padding:0;margin:0 0.5rem 0 0;">Keepers</legend>
          <label><input type="radio" name="${prefix}keepersEnabled" value="0" data-keeper-toggle ${on ? '' : 'checked'} /> Off</label>
          <label><input type="radio" name="${prefix}keepersEnabled" value="1" data-keeper-toggle ${on ? 'checked' : ''} /> On</label>
        </fieldset>
        ${dynasty ? '<p class="il-meta">Dynasty keeps the entire roster. Turn league format back to Redraft if you want optional keepers instead.</p>' : ''}
        <div class="il-keeper-fields" ${on ? '' : 'hidden'}>
          <div class="il-form-grid">
            <label>Keepers per team
              <input type="number" name="${prefix}keeperCount" min="1" max="40" value="${esc(s.keeperCount > 0 ? s.keeperCount : 1)}" />
            </label>
            <label>Max seasons you can keep the same player
              <input type="number" name="${prefix}keeperMaxSeasons" min="1" max="20" value="${esc(s.keeperMaxSeasons ?? 3)}" />
            </label>
          </div>
          <label>Keeper draft cost
            <select name="${prefix}keeperCost">
              <option value="none" ${s.keeperCost === 'none' || !s.keeperCost ? 'selected' : ''}>No pick cost — keep the player and still draft that round</option>
              <option value="round" ${s.keeperCost === 'round' ? 'selected' : ''}>Lose that round’s pick next year</option>
              <option value="round-minus-one" ${s.keeperCost === 'round-minus-one' ? 'selected' : ''}>Lose that round, one round earlier each year they are kept</option>
            </select>
          </label>
          <p class="il-meta">“Lose that round” skips that franchise’s pick in that round of next year’s draft. Undrafted keepers cost the last round when a pick cost is on.</p>
        </div>`;
    }

    function wireKeeperToggle(root = document) {
      root.querySelectorAll('[data-keeper-toggle]').forEach((input) => {
        input.addEventListener('change', () => {
          const form = input.closest('form');
          const fields = form?.querySelector('.il-keeper-fields');
          if (fields) fields.hidden = input.value !== '1' || !input.checked;
          if (input.checked && input.value === '0') {
            const hide = form?.querySelector('.il-keeper-fields');
            if (hide) hide.hidden = true;
          }
          if (input.checked && input.value === '1') {
            const show = form?.querySelector('.il-keeper-fields');
            if (show) show.hidden = false;
          }
        });
      });
    }

    function keeperSettingsFromForm(form) {
      const fd = new FormData(form);
      const on = fd.get('keepersEnabled') === '1';
      return {
        keepersEnabled: on,
        keeperCount: Number(fd.get('keeperCount')) || 0,
        keeperMaxSeasons: Number(fd.get('keeperMaxSeasons')) || 1,
        keeperCost: on ? (fd.get('keeperCost') || 'none') : 'none'
      };
    }

    function scoringFieldsHtml(scoring) {
      const num = (key, label, step = '1') => `
        <label>${esc(label)}
