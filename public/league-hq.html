            status.textContent = err.message;
            status.className = 'il-status is-err';
          }
        }
      });
    }

    function wireSettingsUi() {
      const league = hqState.league;

      async function patchSettings(body, statusEl) {
        const res = await fetch(`/api/independent-leagues/${encodeURIComponent(league.id)}/settings`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Save failed');
        hqState.league = data.league;
        if (statusEl) {
          statusEl.textContent = 'Saved.';
          statusEl.className = 'il-status is-ok';
        }
        return data.league;
      }

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('Could not read file'));
          reader.readAsDataURL(file);
        });
      }

      document.querySelectorAll('.il-upload-row[data-asset]').forEach((row) => {
        const input = row.querySelector('input[type="file"]');
        const img = row.querySelector('img');
        const status = document.getElementById('il-logo-status');
        input?.addEventListener('change', async () => {
          const file = input.files && input.files[0];
          if (!file) return;
          try {
            if (status) {
              status.textContent = 'Uploading…';
              status.className = 'il-status';
            }
            const dataUrl = await fileToDataUrl(file);
            const res = await fetch(`/api/independent-leagues/${encodeURIComponent(league.id)}/asset`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ assetType: row.dataset.asset, dataUrl })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Upload failed');
            hqState.league = data.league;
            if (img && data.url) {
              img.src = data.url;
              img.hidden = false;
            }
            if (status) {
              status.textContent = 'Logo saved.';
              status.className = 'il-status is-ok';
            }
          } catch (err) {
            if (status) {
              status.textContent = err.message || 'Upload failed';
              status.className = 'il-status is-err';
            }
          } finally {
            input.value = '';
          }
        });
      });

      document.getElementById('il-settings-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('il-settings-status');
        const fd = new FormData(e.target);
        const draftAtRaw = String(fd.get('draftAt') || '').trim();
        let draftAt = null;
        if (draftAtRaw) {
          const t = Date.parse(draftAtRaw);
          if (!Number.isFinite(t)) {
            if (status) {
              status.textContent = 'Invalid draft date/time';
              status.className = 'il-status is-err';
            }
            return;
          }
          draftAt = new Date(t).toISOString();
        }
        try {
          await patchSettings({
            draftAt,
            draftScope: fd.get('draftScope'),
            draftRounds: Number(fd.get('draftRounds')),
            draftSecondsPerPick: Number(fd.get('draftSecondsPerPick')),
            draftFillEmptySeats: fd.get('draftFillEmptySeats')
          }, status);
        } catch (err) {
          if (status) {
            status.textContent = err.message;
            status.className = 'il-status is-err';
          }
        }
      });

      document.getElementById('il-playoff-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('il-playoff-status');
        const fd = new FormData(e.target);
        const weeksRaw = String(fd.get('playoffWeeks') || '');
        const playoffWeeks = weeksRaw.split(/[,\s]+/).map(Number).filter((n) => Number.isFinite(n) && n >= 1 && n <= 18);
        const confCount = Number(fd.get('conferenceCount')) === 1 ? 1 : 2;
        const confs = [{ name: fd.get('conf0Name'), shortName: fd.get('conf0Short') }];
        if (confCount === 2) confs.push({ name: fd.get('conf1Name'), shortName: fd.get('conf1Short') });
        const teams = Number(fd.get('teamsPerConference')) || 0;
        const playoffPer = Number(fd.get('playoffTeamsPerConference')) || 0;
        try {
          const updated = await patchSettings({
            conferences: confs,
            structure: {
              conferenceCount: confCount,
              teamsPerConference: teams,
              totalTeams: confCount === 1 ? teams : teams * 2,
              playoffFormat: confCount === 1 ? 'league-bracket' : fd.get('playoffFormat'),
              playoffTeamsPerConference: playoffPer,
              playoffTeamCount: confCount === 1 ? playoffPer : playoffPer * 2,
              regularSeasonEndWeek: Number(fd.get('regularSeasonEndWeek')) || 0,
              playoffWeeks
            },
            championship: {
              name: fd.get('championshipName'),
              titleWeek: fd.get('titleWeek') === '' ? null : Number(fd.get('titleWeek')),
              bowlWeek: fd.get('bowlWeek') === '' ? null : Number(fd.get('bowlWeek')),
              format: confCount === 1 || fd.get('playoffFormat') === 'league-bracket' ? 'single-bracket' : 'super-bowl'
            },
            survival: {
              enabled: fd.get('survivalEnabled') === '1',
              name: fd.get('survivalName'),
              week: Number(fd.get('survivalWeek')) || null
            }
          }, status);
          document.getElementById('il-root').innerHTML = settingsHtml(updated, hqState.viewer);
          wireSettingsUi();
          const ok = document.getElementById('il-playoff-status');
          if (ok) {
            ok.textContent = 'Saved.';
            ok.className = 'il-status is-ok';
          }
        } catch (err) {
          if (status) {
            status.textContent = err.message;
            status.className = 'il-status is-err';
          }
        }
      });

      document.getElementById('il-roster-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('il-roster-status');
        const fd = new FormData(e.target);
        const rosterSlots = {};
        for (const pos of ['QB', 'RB', 'WR', 'TE', 'FLEX', 'DST', 'K', 'BN', 'IR']) {
          rosterSlots[pos] = Number(fd.get(`slot-${pos}`));
        }
        try {
          const updated = await patchSettings({
            rosterSlots,
            keepersEnabled: fd.get('keepersEnabled') === '1',
            keeperCount: Number(fd.get('keeperCount')),
            keeperMaxSeasons: Number(fd.get('keeperMaxSeasons'))
          }, status);
          document.getElementById('il-root').innerHTML = settingsHtml(updated, hqState.viewer);
          wireSettingsUi();
          const ok = document.getElementById('il-roster-status');
          if (ok) {
            ok.textContent = 'Saved.';
            ok.className = 'il-status is-ok';
          }
        } catch (err) {
          if (status) {
            status.textContent = err.message;
            status.className = 'il-status is-err';
          }
        }
      });

      document.getElementById('il-scoring-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('il-scoring-status');
        const fd = new FormData(e.target);
        const scoring = {};
        for (const [key, val] of fd.entries()) {
          if (!String(key).startsWith('score-')) continue;
          const field = String(key).slice('score-'.length);
          const n = Number(val);
          if (Number.isFinite(n)) scoring[field] = n;
        }
        try {
          const updated = await patchSettings({
            scoringPreset: fd.get('scoringPreset'),
            scoring
          }, status);
          document.getElementById('il-root').innerHTML = settingsHtml(updated, hqState.viewer);
          wireSettingsUi();
          const ok = document.getElementById('il-scoring-status');
          if (ok) {
            ok.textContent = 'Saved.';
            ok.className = 'il-status is-ok';
          }
        } catch (err) {
          if (status) {
            status.textContent = err.message;
            status.className = 'il-status is-err';
          }
        }
      });

      document.querySelectorAll('[data-claim]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            const res = await fetch(`/api/independent-leagues/${encodeURIComponent(league.id)}/draft`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'claim', franchiseId: btn.getAttribute('data-claim') })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Claim failed');
            hqState.league = data.league;
            document.getElementById('il-root').innerHTML = settingsHtml(data.league, hqState.viewer);
            wireSettingsUi();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    }

    async function wireManageUi() {
      const league = hqState.league;
      if (!league || !(hqState.viewer?.isOwner || hqState.viewer?.isSiteOwner)) return;
      if (league.setupComplete === false) return;

      const inviteList = document.getElementById('il-invite-list');
      const memberList = document.getElementById('il-member-list');
      let members = [];

      async function refreshInvites() {
        if (!inviteList) return;
        try {
          const res = await fetch(`/api/independent-leagues/${encodeURIComponent(league.id)}/invites`, { cache: 'no-store' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load invites');
          const rows = data.invites || [];
          if (!rows.length) {
            inviteList.innerHTML = '<p class="il-empty">No invites yet.</p>';
            return;
          }
          inviteList.innerHTML = rows.map((inv) => `
            <div class="il-invite-row">
              <span>${esc(inv.email)} <span class="il-meta">· ${esc(inv.status)}</span></span>
              <span style="display:flex;gap:0.35rem;">
                ${inv.status === 'pending' || inv.status === 'expired'
                  ? `<button type="button" class="il-btn is-ghost" data-resend="${esc(inv.id)}">Resend</button>
                     <button type="button" class="il-btn is-ghost" data-revoke="${esc(inv.id)}">Revoke</button>`
                  : ''}
              </span>
            </div>`).join('');
          inviteList.querySelectorAll('[data-resend]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              try {
                const res2 = await fetch(
                  `/api/independent-leagues/${encodeURIComponent(league.id)}/invites/${encodeURIComponent(btn.getAttribute('data-resend'))}/resend`,
                  { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }
                );
                const d = await res2.json().catch(() => ({}));
                if (!res2.ok || !d.ok) throw new Error(d.error || 'Resend failed');
                const status = document.getElementById('il-invite-status');
                if (status) {
                  status.textContent = d.sent ? 'Invite resent.' : (d.inviteUrl ? `Copy link: ${d.inviteUrl}` : 'Invite refreshed.');
                  status.className = 'il-status is-ok';
                }
                await refreshInvites();
              } catch (err) {
                alert(err.message);
              }
            });
          });
          inviteList.querySelectorAll('[data-revoke]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              try {
                const res2 = await fetch(
                  `/api/independent-leagues/${encodeURIComponent(league.id)}/invites/${encodeURIComponent(btn.getAttribute('data-revoke'))}`,
                  { method: 'DELETE' }
                );
                const d = await res2.json().catch(() => ({}));
                if (!res2.ok || !d.ok) throw new Error(d.error || 'Revoke failed');
                await refreshInvites();
              } catch (err) {
                alert(err.message);
              }
            });
          });
        } catch (err) {
          inviteList.innerHTML = `<p class="il-empty">${esc(err.message)}</p>`;
        }
      }

      function fillAssignSelects() {
        document.querySelectorAll('[data-assign]').forEach((sel) => {
          const fid = sel.getAttribute('data-assign');
          const franchise = (hqState.league.franchises || []).find((f) => f.id === fid);
          const current = franchise?.managerUserId || '';
          sel.innerHTML = `<option value="">Open seat</option>${members.map((m) =>
            `<option value="${esc(m.id)}" ${m.id === current ? 'selected' : ''}>${esc(m.name || m.loginName)}${m.isOwner ? ' · owner' : ''}</option>`
          ).join('')}`;
        });
      }

      async function refreshMembers() {
        if (!memberList) return;
        try {
          const res = await fetch(`/api/independent-leagues/${encodeURIComponent(league.id)}/members`, { cache: 'no-store' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load members');
          members = data.members || [];
          memberList.innerHTML = members.length
            ? members.map((m) => `
              <div class="il-member-row">
                <span>${esc(m.name || m.loginName)}
                  <span class="il-meta">· ${esc(m.email || '')}${m.isOwner ? ' · owner' : ''}
                  ${m.franchiseName ? ` · ${esc(m.franchiseName)}` : ' · no franchise'}</span>
                </span>
              </div>`).join('')
            : '<p class="il-empty">No members yet — send an invite.</p>';
          fillAssignSelects();
        } catch (err) {
          memberList.innerHTML = `<p class="il-empty">${esc(err.message)}</p>`;
        }
      }

      document.getElementById('il-invite-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('il-invite-status');
        const fd = new FormData(e.target);
        try {
          const res = await fetch(`/api/independent-leagues/${encodeURIComponent(league.id)}/invites`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: String(fd.get('email') || '').trim(),
              franchiseId: String(fd.get('franchiseId') || '').trim() || null
            })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.error || 'Invite failed');
          if (data.league) hqState.league = data.league;
          if (status) {
            let msg = data.message || 'Done.';
            if (!data.attached && data.inviteUrl && !data.sent) msg += ` Link: ${data.inviteUrl}`;
            status.textContent = msg;
            status.className = 'il-status is-ok';
          }
          e.target.reset();
          await refreshInvites();
          await refreshMembers();
          if (data.league) {
            document.getElementById('il-root').innerHTML = manageHtml(data.league, hqState.viewer);
            wireManageUi();
          }
        } catch (err) {
          if (status) {
            status.textContent = err.message;
            status.className = 'il-status is-err';
          }
        }
      });

      document.querySelectorAll('[data-assign]').forEach((sel) => {
        sel.addEventListener('change', async () => {
          try {
            const res = await fetch(`/api/independent-leagues/${encodeURIComponent(league.id)}/franchises/assign`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                franchiseId: sel.getAttribute('data-assign'),
                userId: sel.value || null
              })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Assign failed');
            hqState.league = data.league;
            document.getElementById('il-root').innerHTML = manageHtml(data.league, hqState.viewer);
            wireManageUi();
          } catch (err) {
            alert(err.message);
            await refreshMembers();
          }
        });
      });

      document.querySelectorAll('[data-rename]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const fid = btn.getAttribute('data-rename');
          const input = document.querySelector(`[data-rename-name="${CSS.escape(fid)}"]`);
          try {
            const res = await fetch(`/api/independent-leagues/${encodeURIComponent(league.id)}/franchises/rename`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ franchiseId: fid, name: input?.value || '' })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Rename failed');
            hqState.league = data.league;
            document.getElementById('il-root').innerHTML = manageHtml(data.league, hqState.viewer);
            wireManageUi();
          } catch (err) {
            alert(err.message);
          }
        });
      });

      await refreshInvites();
      await refreshMembers();
    }

    async function boot() {
      const root = document.getElementById('il-root');
      const { slug, section } = parsePath();
      if (!slug) {
        root.innerHTML = `<div class="msg">League not found.</div>`;
        return;
      }
      try {
        const res = await fetch(`/api/independent-hq?slug=${encodeURIComponent(slug)}&section=${encodeURIComponent(section)}`, { cache: 'no-store' });
        if (res.status === 401) {
          window.location.replace('/enter?next=' + encodeURIComponent(location.pathname));
          return;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load league HQ');
        const league = data.league;
        hqState = {
          league,
          viewer: {
            ...(data.viewer || {}),
            id: data.viewer?.id || null
          },
          pages: data.pages || {},
          slug
        };
        // Resolve viewer id from auth if needed for my-roster claims
        try {
          const auth = await fetch('/api/auth', { cache: 'no-store' }).then((r) => r.json());
          if (auth?.user?.id) hqState.viewer.id = auth.user.id;
        } catch { /* ignore */ }

        document.title = `${league.brand?.name || league.slug} · League HQ`;
        document.body.dataset.page = section === 'home' ? 'league-hq' : section;
        if (data.leagueScope && window.GridIronNav?.applyLeagueScope) {
          window.GridIronNav.applyLeagueScope(data.leagueScope);
        }

        if (section === 'draft') {
          await loadDraftBoard();
        } else {
          const needsScores = ['home', 'scoreboard', 'standings', 'team-rosters', 'my-roster', 'team'].includes(section);
          if (needsScores) {
            try {
              const weekParam = new URLSearchParams(location.search || '').get('week');
              await loadWeekBoard(weekParam || undefined);
            } catch (scoreErr) {
              console.warn('[independent] week score', scoreErr.message || scoreErr);
            }
          }
          root.innerHTML = sectionHtml(section === 'home' ? 'home' : section, league, data.pages || {}, hqState.viewer);
          if (section === 'settings') wireSettingsUi();
          if (section === 'manage') wireManageUi();
          if (section === 'rulebook') wireRulebookUi();
          if (section === 'scoreboard') wireScoreboardUi();
          if (section === 'team' || section === 'my-roster') wireTeamWeekUi();
        }
        window.GridIronNav?.setSync(league.brand?.name || 'League HQ', true);
      } catch (err) {
        root.innerHTML = `<div class="msg"><strong>Error</strong> ${esc(err.message)}</div>`;
      }
    }

    window.GridIronNav?.authReady?.then(boot).catch(boot);
  </script>
</body>
</html>
