<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft Order Show · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=144" />
  <link rel="icon" href="/favicon.ico?v=144" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=144" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=144" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=182" />
  <style>
    .dos-layout { display: grid; gap: 1.5rem; }
    .dos-years { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .dos-years button {
      font-family: var(--display);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .dos-years button.active {
      color: var(--text);
      border-color: var(--blue);
      background: rgba(47, 109, 255, 0.12);
    }
    .dos-player {
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
    }
    .dos-player video,
    .dos-player iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      background: #000;
      border: 0;
    }
    .dos-meta { padding: 1rem 1.1rem 1.15rem; }
    .dos-meta h2 {
      margin: 0;
      font-family: var(--page-title);
      font-size: 1.35rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .dos-meta p { margin: 0.4rem 0 0; color: var(--muted); line-height: 1.45; }
    .dos-empty { color: var(--muted); padding: 0.5rem 0 1rem; }
  </style>
</head>
<body data-page="draft-order-show">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Wire</div>
    </div>
  </header>
  <section class="page-hero shell">
    <p class="eyebrow">GridIron 24</p>
    <h1>Draft Order Show</h1>
  </section>
  <main class="page-main shell">
    <div class="dos-layout">
      <div id="dos-years" class="dos-years" hidden></div>
      <div id="dos-stage"><p class="dos-empty">Loading…</p></div>
    </div>
  </main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=184"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    const stage = document.getElementById('dos-stage');
    const yearsEl = document.getElementById('dos-years');
    let videos = [];
    let selectedId = null;

    function selected() {
      return videos.find((v) => v.id === selectedId) || videos[0] || null;
    }

    function renderYears() {
      if (!videos.length) {
        yearsEl.hidden = true;
        yearsEl.innerHTML = '';
        return;
      }
      yearsEl.hidden = false;
      yearsEl.innerHTML = videos.map((v) => (
        `<button type="button" data-id="${esc(v.id)}" class="${v.id === selected()?.id ? 'active' : ''}">${esc(v.year)}</button>`
      )).join('');
    }

    function renderStage() {
      const v = selected();
      if (!v) {
        stage.innerHTML = '<p class="dos-empty">No Draft Order Show is posted yet.</p>';
        return;
      }
      const player = v.kind === 'embed' && v.embedUrl
        ? `<iframe src="${esc(v.embedUrl)}" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
        : `<video controls playsinline preload="metadata" src="${esc(v.mediaUrl)}"></video>`;
      stage.innerHTML = `<article class="dos-player">${player}<div class="dos-meta"><h2>${esc(v.year)} · ${esc(v.title)}</h2>${v.notes ? `<p>${esc(v.notes)}</p>` : ''}</div></article>`;
    }

    async function load() {
      const res = await fetch('/api/draft-order-show', { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not load shows');
      videos = data.videos || [];
      selectedId = videos.some((v) => v.id === selectedId) ? selectedId : (videos[0]?.id || null);
      renderYears();
      renderStage();
    }

    yearsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      selectedId = btn.getAttribute('data-id');
      renderYears();
      renderStage();
    });

    load().catch((err) => {
      stage.innerHTML = `<p class="dos-empty">${esc(err.message)}</p>`;
    });
  </script>
</body>
</html>
