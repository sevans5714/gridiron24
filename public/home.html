<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home · GridIron 24</title>
  <meta name="description" content="GridIron 24 league headquarters." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=62" />
  <style>
    .aaa-portal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 2.35rem;
      height: 2.35rem;
      margin-right: 0.15rem;
      border: 1px solid transparent;
      border-radius: 0;
      text-decoration: none;
      opacity: 0.82;
      transition: opacity 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .aaa-portal:hover,
    .aaa-portal:focus-visible {
      opacity: 1;
      outline: none;
      border-color: rgba(239, 215, 130, 0.45);
      background: rgba(239, 215, 130, 0.08);
    }
    .aaa-portal img {
      width: 1.85rem;
      height: 1.85rem;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
    }
    .topbar-lead {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      flex: 1 1 auto;
    }
    .topbar-lead .nav {
      min-width: 0;
    }

    .hq-hero {
      text-align: center;
      padding: 1.55rem 0 1.35rem;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse 70% 80% at 50% 25%, rgba(47, 109, 255, 0.12), transparent 60%),
        var(--bg);
    }
    .hq-hero img {
      width: min(520px, 82vw);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.75));
    }
    html[data-theme="day"] .hq-hero img {
      filter: drop-shadow(0 10px 22px rgba(20, 24, 31, 0.18));
    }
    .hq-hero .tag {
      margin: 1rem 0 0;
      font-family: var(--display);
      font-size: clamp(1rem, 2.6vw, 1.35rem);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.3;
      color: var(--text);
    }
    .hq-hero .tag .t { color: var(--blue); }
    .hq-hero .tag .d { color: var(--muted); }
    .hq-hero .tag .c {
      color: var(--text);
      font-weight: 700;
    }
    html[data-theme="night"] .hq-hero .tag .c {
      color: #f2f5fa;
      background: linear-gradient(180deg, #ffffff 0%, #c5cedb 52%, #9aa8ba 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hq-hero .tag .sep { color: var(--muted-2); margin: 0 0.3em; }

    .hq-main {
      padding-top: 1.35rem;
      padding-bottom: 2.25rem;
      font-size: 1.12rem;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.85rem;
      margin: 0 0 0.85rem;
    }
    .section-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.25rem, 2.5vw, 1.55rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.1;
    }
    .section-head a,
    .section-head .hint {
      color: #9ec0ff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
    }
    html[data-theme="day"] .section-head a,
    html[data-theme="day"] .section-head .hint {
      color: var(--blue);
    }
    .section-head a:hover { color: var(--nav-hover); }

    .hq-section {
      margin-bottom: 2.15rem;
    }

    .hq-board {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(17rem, 0.78fr);
      gap: 1.75rem 2rem;
      align-items: start;
      margin-bottom: 2.5rem;
    }
    .hq-board-main,
    .hq-board-side {
      min-width: 0;
    }
    .hq-board-side {
      display: grid;
      gap: 1.35rem;
    }
    .hq-board .hq-section {
      margin-bottom: 0;
      padding: 0 0 1.25rem;
      border: 1px solid rgba(47, 109, 255, 0.22);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 42%), var(--panel);
      overflow: hidden;
    }
    .hq-board .hq-section > :not(.section-head) {
      padding-left: 1.2rem;
      padding-right: 1.2rem;
    }
    .hq-board .section-head {
      margin: 0 0 0.9rem;
      min-height: 2.85rem;
      padding: 0.55rem 1.2rem;
      border-bottom: 1px solid rgba(47, 109, 255, 0.28);
      background:
        radial-gradient(ellipse 80% 120% at 8% 0%, rgba(47, 109, 255, 0.28), transparent 55%),
        linear-gradient(180deg, rgba(47, 109, 255, 0.2), rgba(47, 109, 255, 0.06));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
    }
    .hq-board .section-head::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      height: auto;
      transform: none;
      background: var(--blue);
    }

    .standings-preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.35rem 1.5rem;
    }
    .standings-preview .conf-block + .conf-block {
      padding-left: 0;
    }
    @media (min-width: 641px) {
      .standings-preview .conf-block:last-child {
        padding-left: 1.15rem;
        border-left: 1px solid var(--line);
      }
    }

    .conf-block { min-width: 0; }
    .conf-head {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      margin-bottom: 0.7rem;
      padding-bottom: 0.55rem;
      border-bottom: 2px solid var(--line);
    }
    .conf-head.detail { border-bottom-color: rgba(255, 122, 24, 0.55); }
    .conf-head.overtime { border-bottom-color: rgba(226, 35, 42, 0.55); }
    .conf-head-top {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .conf-head img {
      width: 3.25rem;
      height: auto;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .conf-head h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .conf-admin {
      text-align: right;
      padding: 0;
      flex: 0 1 auto;
      min-width: 0;
    }
    .conf-admin-name {
      margin: 0;
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conf-admin-role {
      margin: 0.2rem 0 0;
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .conf-head.detail h3,
    .conf-head.detail .conf-admin-name { color: var(--detail); }
    .conf-head.overtime h3,
    .conf-head.overtime .conf-admin-name { color: var(--overtime); }
    @media (max-width: 520px) {
      .conf-head {
        flex-wrap: wrap;
      }
      .conf-admin {
        width: 100%;
        text-align: right;
      }
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }
    .mini-table th {
      padding: 0.4rem 0.35rem 0.5rem;
      text-align: left;
      font-size: 0.78rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    .mini-table th.num,
    .mini-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .mini-table td {
      padding: 0.42rem 0.35rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      color: var(--text);
    }
    .mini-table tr:last-child td { border-bottom: 0; }
    .mini-table .rank {
      width: 1.35rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .mini-table .team {
      width: 100%;
      overflow: hidden;
      color: var(--text);
      font-weight: 600;
    }
    .mini-table .team-cell {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      max-width: 100%;
      min-width: 0;
      width: 100%;
    }
    .mini-table .team-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-table .team-logo-sm {
      width: 2.5rem;
      height: 2.5rem;
      object-fit: contain;
      flex: 0 0 auto;
      border-radius: 0.4rem;
    }
    .mini-table th.num,
    .mini-table td.num { width: 2.9rem; }
    .mini-table th:nth-child(3),
    .mini-table td.num:nth-child(3) { width: 3.8rem; }
    .mini-table .out td { opacity: 0.72; }
    .mini-table tr.cut-line td {
      padding: 0.45rem 0.35rem;
      border-top: 2px solid rgba(47, 109, 255, 0.7);
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: center;
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8eb6ff;
      opacity: 1;
    }
    .mini-table tr.cut-line.relegation td {
      border-top-color: rgba(196, 90, 48, 0.85);
      color: #e8a078;
    }
    .mini-table .relegation-zone td { opacity: 0.78; }

    .motw-col {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.15rem;
      min-width: 0;
    }
    .motw-block { min-width: 0; }
    .motw {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.45rem;
      align-items: center;
      padding: 0.35rem 0 0;
    }
    .motw-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      text-align: center;
      min-width: 0;
    }
    .motw-side img {
      width: 4.25rem;
      height: 4.25rem;
      object-fit: contain;
      background: transparent;
      border: 0;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .motw-side .nm {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .motw-mid {
      text-align: center;
      font-family: var(--display);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .motw-mid .vs {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    .motw-mid .score {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .motw-mid .proj {
      margin-top: 0.2rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .hotnot-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.15rem;
      margin-bottom: 0;
    }
    .hotnot {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem 1.25rem;
      padding-top: 0.15rem;
    }
    .hotnot-col {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 0;
    }
    .hotnot-col .label {
      font-family: var(--display);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .hotnot-col.hot .label {
      color: #ef4444;
      text-shadow: 0 0 18px rgba(239, 68, 68, 0.35);
    }
    .hotnot-col.cold .label {
      color: #2f6dff;
      text-shadow: 0 0 18px rgba(47, 109, 255, 0.35);
    }
    .hotnot-col.hot {
      border-left: 3px solid #ef4444;
      padding-left: 0.75rem;
    }
    .hotnot-col.cold {
      border-left: 3px solid #2f6dff;
      padding-left: 0.75rem;
    }
    .hotnot-team {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }
    .hotnot-team img {
      width: 3.5rem;
      height: 3.5rem;
      object-fit: contain;
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .hotnot-team .nm {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .hotnot-team .sub {
      margin-top: 0.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .bottom-stack {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding-top: 0.35rem;
      border-top: 1px solid var(--line);
    }
    .news-block,
    .board-block {
      min-width: 0;
      padding: 0 0 1.25rem;
      border: 1px solid rgba(47, 109, 255, 0.22);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 42%), var(--panel);
      overflow: hidden;
    }
    .news-block > :not(.section-head),
    .board-block > :not(.section-head) {
      padding-left: 1.2rem;
      padding-right: 1.2rem;
    }
    .news-block .section-head,
    .board-block .section-head {
      margin: 0 0 0.9rem;
      min-height: 2.85rem;
      padding: 0.55rem 1.2rem;
      border-bottom: 1px solid rgba(47, 109, 255, 0.28);
      background:
        radial-gradient(ellipse 80% 120% at 8% 0%, rgba(47, 109, 255, 0.28), transparent 55%),
        linear-gradient(180deg, rgba(47, 109, 255, 0.2), rgba(47, 109, 255, 0.06));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
    }
    .news-block .section-head::before,
    .board-block .section-head::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      height: auto;
      transform: none;
      background: var(--blue);
    }
    .news-list,
    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .empty {
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.45;
      padding: 0.15rem 0;
    }
    .news-item + .news-item,
    .msg-item + .msg-item {
      margin-top: 0.9rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--line);
    }
    .news-item h4 {
      margin: 0 0 0.3rem;
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.25;
    }
    .news-item p,
    .msg-item p {
      margin: 0;
      color: var(--text);
      font-size: 1.12rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .meta {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .meta button {
      margin-left: 0.4rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    .meta button:hover { color: #fca5a5; }

    .composer {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
    .composer label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .composer textarea {
      width: 100%;
      margin-bottom: 0.55rem;
      padding: 0.65rem 0.75rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: var(--body);
      font-size: 1.05rem;
      line-height: 1.45;
      min-height: 3.5rem;
      resize: vertical;
    }
    .composer textarea:focus {
      outline: none;
      border-bottom-color: var(--text);
    }
    .composer button {
      padding: 0.55rem 1rem;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-family: var(--display);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .composer button:hover:not(:disabled) {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
    }
    .composer button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .composer-err {
      display: none;
      margin: 0 0 0.4rem;
      color: #fca5a5;
      font-size: 0.95rem;
    }
    .composer-err.show { display: block; }

    .msg {
      padding: 0.35rem 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.45;
    }
    .msg strong { display: block; color: var(--text); margin-bottom: 0.2rem; font-size: 1.1rem; }

    footer.shell {
      padding-top: 1rem;
      padding-bottom: 1.35rem;
    }

    @media (max-width: 1100px) {
      .hq-board {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }
    @media (max-width: 900px) {
      .motw-col,
      .hotnot-row,
      .hotnot { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .standings-preview { grid-template-columns: 1fr; }
      .motw-side img { width: 4.75rem; height: 4.75rem; }
      .hotnot-team img { width: 4rem; height: 4rem; }
      .hq-main { font-size: 1.06rem; }
    }
  </style>
</head>
<body data-page="home">
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="topbar-lead">
        <a class="aaa-portal" href="/aaa.html" title="AAA League" aria-label="AAA League portal">
          <img src="/assets/aaa-league.png" alt="" width="32" height="32" decoding="async" />
        </a>
        <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      </div>
      <div class="sync" id="lastUpdated">League HQ</div>
    </div>
  </header>

  <section class="hq-hero shell">
    <img src="/assets/gridiron24-logo.png?v=3" alt="GridIron 24" />
    <p class="tag">
      <span class="t">24 Teams</span><span class="sep">·</span><span class="d">Two Conferences</span><span class="sep">·</span><span class="c">One Champion</span>
    </p>
  </section>

  <main class="hq-main shell">
    <div class="hq-board">
      <div class="hq-board-main">
        <section class="hq-section">
          <div class="section-head">
            <h2>Standings</h2>
          </div>
          <div class="standings-preview" id="standings">
            <div class="msg">Loading standings…</div>
          </div>
        </section>
      </div>

      <div class="hq-board-side">
        <section class="hq-section">
          <div class="section-head">
            <h2>Matchup of the Week</h2>
          </div>
          <div class="motw-col" id="motw">
            <div class="msg">Loading matchups…</div>
          </div>
        </section>

        <section class="hq-section">
          <div class="section-head">
            <h2>Who’s Hot / Who’s Not</h2>
          </div>
          <div class="hotnot-row" id="hotnot">
            <div class="msg">Loading…</div>
          </div>
        </section>
      </div>
    </div>

    <div class="bottom-stack">
      <section class="news-block" id="news-panel">
        <div class="section-head">
          <h2>League News</h2>
        </div>
        <div class="news-list" id="news-list"><div class="empty">Loading news…</div></div>
      </section>

      <section class="board-block" id="board-panel">
        <div class="section-head">
          <h2>Message Board</h2>
        </div>
        <div class="msg-list" id="msg-list"><div class="empty">Loading messages…</div></div>
        <div class="composer" id="msg-composer">
          <div class="composer-err" id="msg-err"></div>
          <label for="msg-body">Say something</label>
          <textarea id="msg-body" maxlength="2000" placeholder="Trash talk welcome. Keep it league-friendly."></textarea>
          <button type="button" id="msg-submit">Post Message</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-brand">GridIron 24</span> created by S.Evans</span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=38"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    let currentUser = null;

    function fmtWhen(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch {
        return '';
      }
    }

    function record(team) {
      const ties = Number(team.ties || 0);
      return ties > 0
        ? `${team.wins}-${team.losses}-${ties}`
        : `${team.wins}-${team.losses}`;
    }

    function teamLogo(team) {
      const src = team?.logo || '/assets/team-logo-placeholder.svg';
      return `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;
    }

    function confHead(conf) {
      const tone = conf?.key === 'overtime' ? 'overtime' : 'detail';
      const admin = conf?.admin
        ? `<div class="conf-admin">
            <div class="conf-admin-name">${esc(conf.admin)}</div>
            <div class="conf-admin-role">Conference Admin</div>
          </div>`
        : '';
      return `
        <div class="conf-head ${tone}">
          <div class="conf-head-top">
            ${conf?.logo ? `<img src="${esc(conf.logo)}" alt="">` : ''}
            <h3>${esc(conf?.shortName || conf?.name || 'Conference')}</h3>
          </div>
          ${admin}
        </div>`;
    }

    function confBoard(conf) {
      if (!conf?.ok) {
        return `
          <div class="conf-block">
            ${confHead(conf)}
            <div class="empty">Unavailable</div>
          </div>`;
      }
      const teams = (conf.teams || []).slice(0, 12);
      const bodyRows = [];
      const lastRank = teams.length;
      teams.forEach((t, i) => {
        const rank = i + 1;
        if (rank === 7) {
          bodyRows.push(`<tr class="cut-line"><td colspan="4">Playoff cut</td></tr>`);
        }
        if (lastRank > 1 && rank === lastRank) {
          bodyRows.push(`<tr class="cut-line relegation"><td colspan="4">Relegation · Toilet Bowl</td></tr>`);
        }
        const zoneClass = [
          rank > 6 ? 'out' : '',
          rank === lastRank ? 'relegation-zone' : ''
        ].filter(Boolean).join(' ');
        bodyRows.push(`
          <tr class="${zoneClass}">
            <td class="rank">${rank}</td>
            <td class="team" title="${esc(t.name)}">
              <span class="team-cell">
                <img class="team-logo-sm" src="${esc(t.logo || '/assets/team-logo-placeholder.svg')}" alt="" width="40" height="40" loading="lazy" referrerpolicy="no-referrer" />
                <span class="team-name">${esc(t.name)}</span>
              </span>
            </td>
            <td class="num">${esc(record(t))}</td>
            <td class="num">${Number(t.pointsFor || 0).toFixed(0)}</td>
          </tr>`);
      });
      return `
        <div class="conf-block">
          ${confHead(conf)}
          <table class="mini-table">
            <thead>
              <tr>
                <th></th>
                <th>Team</th>
                <th class="num">W-L</th>
                <th class="num">PF</th>
              </tr>
            </thead>
            <tbody>
              ${bodyRows.join('')}
            </tbody>
          </table>
        </div>`;
    }

    function pickMatchupOfWeek(matchups) {
      const list = matchups || [];
      if (!list.length) return null;
      return list.slice().sort((a, b) => {
        const aLive = Number(a.home.score || 0) + Number(a.away.score || 0);
        const bLive = Number(b.home.score || 0) + Number(b.away.score || 0);
        if (bLive !== aLive) return bLive - aLive;
        const aProj = Number(a.home.projected || 0) + Number(a.away.projected || 0);
        const bProj = Number(b.home.projected || 0) + Number(b.away.projected || 0);
        return bProj - aProj;
      })[0];
    }

    function motwCard(conf) {
      if (!conf?.ok) {
        return `<div class="motw-block">${confHead(conf)}<div class="empty">Unavailable</div></div>`;
      }
      const m = pickMatchupOfWeek(conf.matchups);
      if (!m) {
        return `<div class="motw-block">${confHead(conf)}<div class="empty">No matchups this week</div></div>`;
      }
      return `
        <div class="motw-block">
          ${confHead({ ...conf, shortName: `${conf.shortName || conf.name} · Week ${conf.week}` })}
          <div class="motw">
            <div class="motw-side">
              ${teamLogo(m.away)}
              <div class="nm" title="${esc(m.away.name)}">${esc(m.away.name)}</div>
            </div>
            <div class="motw-mid">
              <div class="vs">VS</div>
              <div class="score">${Number(m.away.score || 0).toFixed(1)} – ${Number(m.home.score || 0).toFixed(1)}</div>
              <div class="proj">Proj ${Number(m.away.projected || 0).toFixed(1)}–${Number(m.home.projected || 0).toFixed(1)}</div>
            </div>
            <div class="motw-side">
              ${teamLogo(m.home)}
              <div class="nm" title="${esc(m.home.name)}">${esc(m.home.name)}</div>
            </div>
          </div>
        </div>`;
    }

    function streakText(t) {
      const n = Number(t.streakLength || 0);
      if (n <= 0 || !t.streakType || t.streakType === 'NONE') return null;
      if (t.streakType === 'WIN') return `${n}W streak`;
      if (t.streakType === 'LOSS') return `${n}L streak`;
      return null;
    }

    function formSub(t) {
      const parts = [];
      const streak = streakText(t);
      if (streak) parts.push(streak);
      const games = Number(t.gamesPlayed || (t.wins || 0) + (t.losses || 0) + (t.ties || 0));
      const pf = Number(t.pointsFor || 0);
      if (games > 0) {
        const ppg = Number(t.pointsPerGame != null ? t.pointsPerGame : pf / games);
        parts.push(`${ppg.toFixed(1)} PPG`);
        parts.push(`${pf.toFixed(1)} PF`);
      } else {
        parts.push(record(t));
      }
      return parts.join(' · ');
    }

    function heatIndex(t) {
      const winStreak = t.streakType === 'WIN' ? Number(t.streakLength || 0) : 0;
      const lossStreak = t.streakType === 'LOSS' ? Number(t.streakLength || 0) : 0;
      const ppg = Number(t.pointsPerGame || 0);
      const pf = Number(t.pointsFor || 0);
      return winStreak * 55 + ppg * 2.2 + pf * 0.08 - lossStreak * 40;
    }

    function coldIndex(t) {
      const winStreak = t.streakType === 'WIN' ? Number(t.streakLength || 0) : 0;
      const lossStreak = t.streakType === 'LOSS' ? Number(t.streakLength || 0) : 0;
      const ppg = Number(t.pointsPerGame || 0);
      const pf = Number(t.pointsFor || 0);
      return lossStreak * 55 - ppg * 2.2 - pf * 0.08 - winStreak * 40;
    }

    function pickHotNot(teams) {
      const list = (teams || []).slice();
      if (list.length < 2) return { hot: list[0] || null, cold: null, ready: false };
      const byHeat = list.slice().sort((a, b) => heatIndex(b) - heatIndex(a));
      const hot = byHeat[0];
      const byCold = list
        .filter((t) => t.id !== hot.id)
        .sort((a, b) => coldIndex(b) - coldIndex(a));
      return { hot, cold: byCold[0] || byHeat[byHeat.length - 1], ready: true };
    }

    function hotNotCard(conf) {
      if (!conf?.ok) {
        return `<div class="conf-block">${confHead(conf)}<div class="empty">Unavailable</div></div>`;
      }
      const teams = (conf.teams || []).slice();
      if (!teams.length) {
        return `<div class="conf-block">${confHead(conf)}<div class="empty">No teams yet</div></div>`;
      }
      const pick = pickHotNot(teams);
      if (!pick.ready || !pick.hot || !pick.cold) {
        return `<div class="conf-block">${confHead(conf)}</div>`;
      }
      return `
        <div class="conf-block">
          ${confHead(conf)}
          <div class="hotnot">
            <div class="hotnot-col hot">
              <div class="label">Who’s Hot</div>
              <div class="hotnot-team">
                ${teamLogo(pick.hot)}
                <div style="min-width:0">
                  <div class="nm" title="${esc(pick.hot.name)}">${esc(pick.hot.name)}</div>
                  <div class="sub">${esc(formSub(pick.hot))}</div>
                </div>
              </div>
            </div>
            <div class="hotnot-col cold">
              <div class="label">Who’s Not</div>
              <div class="hotnot-team">
                ${teamLogo(pick.cold)}
                <div style="min-width:0">
                  <div class="nm" title="${esc(pick.cold.name)}">${esc(pick.cold.name)}</div>
                  <div class="sub">${esc(formSub(pick.cold))}</div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    async function loadStandings() {
      const el = document.getElementById('standings');
      try {
        const res = await fetch('/api/leagues', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        const detail = (data.conferences || []).find((c) => c.key === 'detail');
        const overtime = (data.conferences || []).find((c) => c.key === 'overtime');
        el.innerHTML = confBoard(detail) + confBoard(overtime);
        document.getElementById('hotnot').innerHTML = hotNotCard(detail) + hotNotCard(overtime);
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        el.innerHTML = `<div class="msg"><strong>Standings unavailable</strong>${esc(err.message)}</div>`;
        document.getElementById('hotnot').innerHTML = `<div class="msg"><strong>Unavailable</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }

    async function loadMatchupOfWeek() {
      const el = document.getElementById('motw');
      try {
        const res = await fetch('/api/schedule', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        const detail = (data.conferences || []).find((c) => c.key === 'detail');
        const overtime = (data.conferences || []).find((c) => c.key === 'overtime');
        el.innerHTML = motwCard(detail) + motwCard(overtime);
      } catch (err) {
        el.innerHTML = `<div class="msg"><strong>Matchups unavailable</strong>${esc(err.message)}</div>`;
      }
    }

    function canDeleteMessage(item) {
      if (!currentUser) return false;
      return currentUser.role === 'commissioner'
        || currentUser.role === 'conference_admin'
        || item.authorId === currentUser.id;
    }

    function renderNews(items) {
      const el = document.getElementById('news-list');
      if (!items.length) {
        el.innerHTML = `<div class="empty">No league news yet.</div>`;
        return;
      }
      el.innerHTML = items.map((n) => `
        <article class="news-item" data-id="${esc(n.id)}">
          <h4>${esc(n.title)}</h4>
          <p>${esc(n.body)}</p>
          <p class="meta">${esc(n.authorName)} · ${esc(fmtWhen(n.createdAt))}</p>
        </article>`).join('');
    }

    function renderMessages(items) {
      const el = document.getElementById('msg-list');
      if (!items.length) {
        el.innerHTML = `<div class="empty">No messages yet. Start the board.</div>`;
        return;
      }
      el.innerHTML = items.map((m) => `
        <article class="msg-item" data-id="${esc(m.id)}">
          <p>${esc(m.body)}</p>
          <p class="meta">
            ${esc(m.authorName)} · ${esc(fmtWhen(m.createdAt))}
            ${canDeleteMessage(m) ? `<button type="button" data-del-msg="${esc(m.id)}">Delete</button>` : ''}
          </p>
        </article>`).join('');
    }

    async function loadNews() {
      const res = await fetch('/api/news', { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load news');
      renderNews(data.news || []);
    }

    async function loadMessages() {
      const res = await fetch('/api/messages', { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load messages');
      renderMessages(data.messages || []);
    }

    function wireComposers() {
      document.getElementById('msg-submit').addEventListener('click', async () => {
        const err = document.getElementById('msg-err');
        const btn = document.getElementById('msg-submit');
        err.classList.remove('show');
        btn.disabled = true;
        try {
          const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ body: document.getElementById('msg-body').value })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not post message');
          document.getElementById('msg-body').value = '';
          await loadMessages();
        } catch (e) {
          err.textContent = e.message;
          err.classList.add('show');
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('msg-list').addEventListener('click', async (e) => {
        const id = e.target?.dataset?.delMsg;
        if (!id) return;
        if (!confirm('Delete this message?')) return;
        await fetch(`/api/messages/${encodeURIComponent(id)}`, { method: 'DELETE' });
        await loadMessages();
      });
    }

    (async () => {
      const auth = await (window.GridIronNav?.authReady || Promise.resolve({ user: null }));
      currentUser = auth.user || null;
      wireComposers();
      await Promise.all([
        loadStandings(),
        loadMatchupOfWeek(),
        loadNews().catch((err) => {
          document.getElementById('news-list').innerHTML = `<div class="empty">${esc(err.message)}</div>`;
        }),
        loadMessages().catch((err) => {
          document.getElementById('msg-list').innerHTML = `<div class="empty">${esc(err.message)}</div>`;
        })
      ]);
    })();
  </script>
</body>
</html>
