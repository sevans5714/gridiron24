<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=62" />
  <style>
    .hist-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: end;
      justify-content: space-between;
      margin: 0.35rem 0 1rem;
    }
    .hist-field label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
      font-family: var(--display);
    }
    .hist-field select {
      min-width: 14rem;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    .hist-note {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 42rem;
      margin: 0;
    }
    .hist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    .hist-grid.single { grid-template-columns: 1fr; max-width: 44rem; }
    .conf-title {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--line);
    }
    .conf-title.detail { border-bottom-color: rgba(255,122,24,0.55); color: var(--detail); }
    .conf-title.overtime { border-bottom-color: rgba(226,35,42,0.55); color: var(--overtime); }
    .conf-title.archive { border-bottom-color: rgba(47,109,255,0.45); color: var(--text); }
    .conf-title img {
      width: 3rem;
      height: auto;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .conf-title h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    .stats-table th {
      text-align: left;
      font-family: var(--display);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.35rem 0.4rem;
      border-bottom: 1px solid var(--line);
    }
    .stats-table th.num,
    .stats-table td.num { text-align: right; }
    .stats-table td {
      padding: 0.45rem 0.4rem;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-size: 0.92rem;
    }
    .stats-table .nm { font-weight: 700; }
    .stats-table .owner {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .draft-link {
      display: inline-block;
      margin-top: 0.75rem;
      color: var(--blue);
      font-family: var(--display);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .draft-link:hover { text-decoration: underline; }
    @media (max-width: 800px) {
      .hist-grid { grid-template-columns: 1fr; }
      .stats-table .owner { display: none; }
    }
  </style>
</head>
<body data-page="history">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">History</div>
    </div>
  </header>
  <section class="page-hero shell">
    <p class="eyebrow">Teams · Archives</p>
    <h1>History</h1>
  </section>
  <main class="page-main shell">
    <div class="hist-toolbar">
      <div class="hist-field">
        <label for="season">Season</label>
        <select id="season"></select>
      </div>
      <p class="hist-note" id="hist-note">Loading seasons…</p>
    </div>
    <div class="hist-grid" id="boards"><div class="msg">Loading history…</div></div>
  </main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-brand">GridIron 24</span> created by S.Evans</span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=42"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');

    function record(t) {
      return Number(t.ties || 0) > 0 ? `${t.wins}-${t.losses}-${t.ties}` : `${t.wins}-${t.losses}`;
    }

    function fmtPf(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return '—';
      return v.toFixed(1);
    }

    function board(conf, season) {
      if (!conf?.ok) {
        return `<div>
          <div class="conf-title ${esc(conf?.key || '')}"><h2>${esc(conf?.name || 'Conference')}</h2></div>
          <div class="msg">${esc(conf?.error || 'Unavailable')}</div>
        </div>`;
      }
      const rows = (conf.teams || [])
        .slice()
        .sort((a, b) => (b.wins - a.wins) || (b.pointsFor - a.pointsFor))
        .map((t, i) => `
          <tr>
            <td class="num">${t.playoffSeed || (i + 1)}</td>
            <td>
              <span class="nm">${esc(t.name)}</span>
              ${t.owner ? `<span class="owner">${esc(t.owner)}</span>` : ''}
            </td>
            <td class="num">${esc(record(t))}</td>
            <td class="num">${esc(fmtPf(t.pointsFor))}</td>
            <td class="num">${esc(fmtPf(t.pointsAgainst))}</td>
          </tr>
        `).join('');
      const draftHref = conf.key === 'archive'
        ? `/draft.html?conference=detail&season=${esc(String(season))}`
        : `/draft.html?conference=${esc(conf.key)}&season=${esc(String(season))}`;
      return `<div>
        <div class="conf-title ${esc(conf.key)}">
          ${conf.logo ? `<img src="${esc(conf.logo)}" alt="" />` : ''}
          <h2>${esc(conf.name)}</h2>
        </div>
        <table class="stats-table">
          <thead>
            <tr>
              <th class="num">#</th>
              <th>Franchise</th>
              <th class="num">W-L</th>
              <th class="num">PF</th>
              <th class="num">PA</th>
            </tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="5">No teams</td></tr>'}</tbody>
        </table>
        <a class="draft-link" href="${draftHref}">View ${esc(String(season))} draft board →</a>
      </div>`;
    }

    async function loadHistory(season) {
      const boards = document.getElementById('boards');
      const note = document.getElementById('hist-note');
      boards.innerHTML = `<div class="msg">Loading history…</div>`;
      try {
        const qs = season ? `?season=${encodeURIComponent(season)}` : '';
        const res = await fetch(`/api/history${qs}`, { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load history');

        const select = document.getElementById('season');
        const seasons = data.seasons || [];
        select.innerHTML = seasons.map((s) => (
          `<option value="${esc(String(s.season))}" ${Number(s.season) === Number(data.season) ? 'selected' : ''}>${esc(s.label || s.season)}</option>`
        )).join('');

        const configuredPrior = seasons.filter((s) => Number(s.season) !== Number(seasons[0]?.season) || !s.inaugural);
        const priorCount = seasons.filter((s) => !String(s.label || '').includes('current')).length;
        if (priorCount === 0) {
          note.innerHTML = 'Archive Years 1–3 under <a href="/league-tools.html#history-admin">League Tools → Season Archive</a>. Past ESPN seasons must be publicly viewable, or set ESPN_SWID / ESPN_S2 on the server.';
        } else if (data.entry?.notes) {
          note.textContent = data.entry.notes;
        } else {
          const label = data.entry?.label || data.season;
          note.textContent = `Showing ${label} standings from ESPN.`;
        }

        const confs = data.conferences || [];
        boards.classList.toggle('single', confs.length <= 1);
        boards.innerHTML = confs.map((c) => board(c, data.season)).join('')
          || `<div class="msg">No standings for this season yet.</div>`;
      } catch (err) {
        boards.innerHTML = `<div class="msg">${esc(err.message || 'Could not load history')}</div>`;
        note.textContent = '';
      }
    }

    document.getElementById('season').addEventListener('change', (e) => {
      const season = e.target.value;
      const url = new URL(location.href);
      url.searchParams.set('season', season);
      history.replaceState({}, '', url);
      loadHistory(season);
    });

    const initial = new URLSearchParams(location.search).get('season');
    loadHistory(initial);
  </script>
</body>
</html>
