<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Site Access · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=98" />
  <link rel="icon" href="/favicon.ico?v=98" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=98" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=98" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=153" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <img class="auth-crest" src="/assets/gridiron24-crest.png?v=10" alt="GridIron 24" />
    <h1 class="auth-title">Site Access</h1>
    <p class="auth-help">One-time password for this GridIron 24 HQ. Does not create an ESPN league — only controls who can make member accounts here.</p>
    <form id="form">
      <label class="field-label" for="leaguePassword">Site access password</label>
      <input class="field" id="leaguePassword" name="leaguePassword" type="password" required autocomplete="new-password" />
      <label class="field-label" for="commissionerLogin">Your login name (commissioner)</label>
      <input class="field" id="commissionerLogin" name="commissionerLogin" required autocomplete="username" value="sevans" />
      <button class="btn" type="submit">Save &amp; Continue</button>
      <p class="status-note" id="msg" role="status"></p>
    </form>
    <p class="auth-links"><a href="/enter">Back to sign in</a></p>
  </div>
  <script>
    const msg = document.getElementById('msg');
    async function boot() {
      const res = await fetch('/api/auth', { cache: 'no-store' });
      const data = await res.json();
      if (data.authConfigured) {
        msg.className = 'status-note show ok';
        msg.textContent = 'Already configured. Redirecting…';
        setTimeout(() => { location.href = '/register'; }, 700);
      }
    }
    boot().catch(() => {});

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'status-note show';
      msg.textContent = 'Saving…';
      const body = {
        leaguePassword: document.getElementById('leaguePassword').value,
        commissionerLogin: document.getElementById('commissionerLogin').value
      };
      try {
        const res = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Setup failed');
        msg.className = 'status-note show ok';
        msg.textContent = 'Saved. Create your account next…';
        setTimeout(() => { location.href = '/register'; }, 600);
      } catch (err) {
        msg.className = 'status-note show err';
        msg.textContent = err.message || 'Setup failed';
      }
    });
  </script>
</body>
</html>
