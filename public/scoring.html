<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoring Matrix · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=5" />
  <style>
    .scoring-wrap {
      max-width: 44rem;
    }
    .matrix {
      width: 100%;
      border-collapse: collapse;
    }
    .matrix tr {
      transition: background 0.15s ease;
    }
    .matrix tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }
    .matrix th, .matrix td {
      padding: 0.72rem 1.15rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: var(--fs-sm);
      line-height: 1.35;
    }
    .matrix thead th {
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: #0a0a0a;
    }
    .matrix th.group {
      background: #141414;
      color: #fff;
      font-family: var(--display);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding-top: 0.85rem;
      padding-bottom: 0.55rem;
    }
    .matrix td {
      font-weight: 500;
      color: #e8e8e8;
    }
    .matrix td.pts {
      text-align: right;
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
      color: #fff;
      white-space: nowrap;
    }
    .section-label {
      margin: 0;
      padding: 0.85rem 1.15rem 0.4rem;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.7rem 1.15rem 1.15rem;
    }
    .chip {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #151515, #0c0c0c);
      padding: 0.4rem 0.7rem;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .chip strong { color: #fff; margin-right: 0.3rem; font-weight: 700; }
    .chip span { color: var(--muted); font-weight: 500; }
    .warn {
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(239, 215, 130, 0.35);
      background: rgba(239, 215, 130, 0.08);
      color: #efd782;
      font-size: var(--fs-sm);
      line-height: 1.45;
    }
  </style>
</head>
<body data-page="scoring">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <p class="eyebrow">Official Rules</p>
    <h1>Scoring Matrix</h1>
    <p>One scoring system for all 24 GridIron franchises across both conferences.</p>
  </section>

  <main class="page-main shell">
    <div class="scoring-wrap" id="content">
      <div class="msg">Loading scoring settings…</div>
    </div>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function fmt(n) {
      const x = Number(n);
      return Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    }

    function scoringSig(conf) {
      return JSON.stringify({
        playerRankType: conf.playerRankType || null,
        scoring: (conf.scoringItems || []).map((i) => [i.statId, i.points]),
        lineup: (conf.lineup || []).map((s) => [s.id, s.count])
      });
    }

    function groupedRows(items) {
      const order = [];
      const buckets = new Map();
      for (const item of items || []) {
        const g = item.group || 'Other';
        if (!buckets.has(g)) {
          buckets.set(g, []);
          order.push(g);
        }
        buckets.get(g).push(item);
      }
      return order.map((group) => {
        const rows = buckets.get(group).map((item) => `
          <tr>
            <td>${esc(item.label)}</td>
            <td class="pts">${fmt(item.points)}</td>
          </tr>`).join('');
        return `<tr><th class="group" colspan="2">${esc(group)}</th></tr>${rows}`;
      }).join('');
    }

    function render(data) {
      const ok = (data.conferences || []).filter((c) => c.ok);
      if (!ok.length) {
        const err = (data.conferences || []).map((c) => c.error).filter(Boolean).join(' · ') || 'No conference settings available.';
        document.getElementById('content').innerHTML = `<div class="msg"><strong>Unavailable</strong>${esc(err)}</div>`;
        return;
      }

      const primary = ok[0];
      const matched = ok.every((c) => scoringSig(c) === scoringSig(primary));
      const warn = matched
        ? ''
        : `<p class="warn">Detail and Overtime settings differ on ESPN. Showing Detail Conference as the GridIron source of truth — fix Overtime so both match.</p>`;

      const rows = groupedRows(primary.scoringItems);
      const lineup = (primary.lineup || []).map((s) => `
        <div class="chip"><strong>${esc(s.label)}</strong><span>×${s.count}</span></div>`).join('');

      document.getElementById('content').innerHTML = `
        ${warn}
        <div class="panel reveal">
          <div class="panel-title bowl">
            <img src="/assets/gridiron-bowl.png" alt="">
            <span>GridIron 24</span>
            <span class="meta">${esc(primary.playerRankType || 'PPR')} · ${(primary.scoringItems || []).length} categories</span>
          </div>
          <table class="matrix">
            <thead><tr><th>Category</th><th style="text-align:right">Points</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="2">No scoring items returned.</td></tr>'}</tbody>
          </table>
          <p class="section-label">Starting Lineup</p>
          <div class="chips">${lineup || '<div class="msg">No lineup data.</div>'}</div>
        </div>`;
    }

    async function load() {
      try {
        const res = await fetch('/api/settings', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        render(data);
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }
    load();
  </script>
</body>
</html>
