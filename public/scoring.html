<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoring · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=31" />
  <style>
    .banner {
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(239, 215, 130, 0.35);
      background: rgba(239, 215, 130, 0.08);
      color: #efd782;
      font-size: var(--fs-sm);
      line-height: 1.45;
    }
    .banner a {
      color: #fff;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .banner.ok {
      border-color: rgba(34, 197, 94, 0.35);
      background: rgba(34, 197, 94, 0.08);
      color: #86efac;
    }
    .sync-pill {
      display: inline-block;
      margin-left: 0.5rem;
      padding: 0.15rem 0.45rem;
      border: 1px solid currentColor;
      font-family: var(--display);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      vertical-align: middle;
    }

    .lineup-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      padding: 1rem 1.15rem;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 4.5rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--line);
      background: #0c0c0c;
      text-align: center;
    }
    .slot .pos {
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #fff;
    }
    .slot .cnt {
      margin-top: 0.15rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .slot.bench {
      opacity: 0.75;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .group-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
    }
    .group-panel h2 {
      margin: 0;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
      font-family: var(--display);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
    }
    .rule {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.92rem;
    }
    .rule:last-child { border-bottom: 0; }
    .rule .label {
      color: #ddd;
      font-weight: 500;
      line-height: 1.3;
    }
    .rule .pts {
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .rules-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="scoring">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <p class="eyebrow">Official Rules</p>
    <h1>Scoring</h1>
    <p>Official scoring and lineup rules for both conferences.</p>
  </section>

  <main class="page-main shell">
    <div id="content"><div class="msg">Loading scoring settings…</div></div>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js?v=17"></script>
  <script src="/js/conference-diff.js?v=4"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    const GROUP_ORDER = [
      'Passing',
      'Rushing',
      'Receiving',
      'Misc. Offense',
      'Kicking',
      'Defense / Special Teams',
      'Other'
    ];

    function groupPanels(items) {
      const buckets = new Map();
      for (const item of items || []) {
        const g = item.group || 'Other';
        if (!buckets.has(g)) buckets.set(g, []);
        buckets.get(g).push(item);
      }
      const order = GROUP_ORDER.filter((g) => buckets.has(g));
      for (const g of buckets.keys()) {
        if (!order.includes(g)) order.push(g);
      }
      return order.map((group) => {
        const rules = buckets.get(group).map((item) => `
          <div class="rule">
            <span class="label">${esc(item.label)}</span>
            <span class="pts">${esc(GridIronDiff.fmtItem(item))}</span>
          </div>`).join('');
        return `
          <section class="group-panel">
            <h2>${esc(group)}</h2>
            ${rules}
          </section>`;
      }).join('');
    }

    function lineupRow(lineup) {
      const starterOrder = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'D/ST', 'K', 'Bench', 'IR'];
      const sorted = [...(lineup || [])].sort((a, b) => {
        const ai = starterOrder.indexOf(a.label);
        const bi = starterOrder.indexOf(b.label);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });
      return sorted.map((s) => `
        <div class="slot ${['Bench', 'IR'].includes(s.label) ? 'bench' : ''}">
          <span class="pos">${esc(s.label)}</span>
          <span class="cnt">×${s.count}</span>
        </div>`).join('');
    }

    function render(data) {
      const rules = data.scoring;
      if (!rules?.ok && !(rules?.scoringItems || []).length) {
        document.getElementById('content').innerHTML = `<div class="msg"><strong>Unavailable</strong>Could not load scoring from ESPN.</div>`;
        return;
      }

      const synced = Boolean(data.synced || data.compare?.matched);
      const source = data.source === 'official' ? 'official' : 'live';
      const updated = data.officialScoring?.updatedAt || data.rulesSync?.checkedAt || data.generatedAt;
      const when = updated
        ? new Date(updated).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
        : '';

      let banner = '';
      if (synced) {
        banner = `<div class="banner ok reveal">Conferences synced<span class="sync-pill">Official</span>${when ? ` · Scoring updated ${esc(when)}` : ''}</div>`;
      } else if (data.compare?.bothOk === false) {
        banner = `<div class="banner reveal">Could not verify both ESPN leagues. Showing Detail Conference rules.</div>`;
      } else {
        const n = data.compare?.diffCount || 0;
        banner = `<div class="banner reveal">Conferences are out of sync on ESPN (${n} difference${n === 1 ? '' : 's'}). Showing Detail as source of truth. See <a href="/league-tools.html#rules-sync">League Tools</a>.</div>`;
      }

      document.getElementById('content').innerHTML = `
        ${banner}
        <div class="lineup-row reveal">${lineupRow(rules.lineup)}</div>
        <div class="rules-grid reveal reveal-delay-1">
          ${groupPanels(rules.scoringItems)}
        </div>
        <p class="msg" style="margin-top:1.25rem;color:#8a8a8a;font-size:0.88rem;">Source: ${source === 'official' ? 'Official synced snapshot (Detail)' : 'Live Detail ESPN settings'}</p>`;
    }

    async function load() {
      try {
        const res = await fetch('/api/scoring', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        render(data);
        const t = new Date(data.generatedAt);
        const label = data.synced ? 'Rules synced' : 'Live ESPN';
        window.GridIronNav?.setSync(`${label} · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }
    load();
  </script>
</body>
</html>
