<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoring Matrix · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=5" />
  <style>
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .matrix {
      width: 100%;
      border-collapse: collapse;
    }
    .matrix tr {
      transition: background 0.15s ease;
    }
    .matrix tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }
    .matrix th, .matrix td {
      padding: 0.72rem 1.15rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: var(--fs-sm);
      line-height: 1.35;
    }
    .matrix th {
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: #0a0a0a;
    }
    .matrix td {
      font-weight: 500;
      color: #e8e8e8;
    }
    .matrix td.pts {
      text-align: right;
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
      color: #fff;
    }
    .section-label {
      margin: 0;
      padding: 0.85rem 1.15rem 0.4rem;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.7rem 1.15rem 1.15rem;
    }
    .chip {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #151515, #0c0c0c);
      padding: 0.4rem 0.7rem;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .chip strong { color: #fff; margin-right: 0.3rem; font-weight: 700; }
    .chip span { color: var(--muted); font-weight: 500; }
    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="scoring">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <p class="eyebrow">Official Rules</p>
    <h1>Scoring Matrix</h1>
    <p>Every point category and starting slot — identical across both conferences.</p>
  </section>

  <main class="page-main shell">
    <div class="grid-2" id="boards">
      <div class="msg">Loading scoring settings…</div>
    </div>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function fmt(n) {
      const x = Number(n);
      return Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    }

    function board(conf, idx) {
      if (!conf.ok) {
        return `<div class="panel reveal reveal-delay-${idx + 1}"><div class="panel-title">${esc(conf.name || 'Conference')}</div><div class="msg"><strong>Unavailable</strong>${esc(conf.error || '')}</div></div>`;
      }
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      const logo = conf.logo ? `<img src="${esc(conf.logo)}" alt="">` : '';
      const rows = (conf.scoringItems || []).map((item) => `
        <tr>
          <td>${esc(item.label)}</td>
          <td class="pts">${fmt(item.points)}</td>
        </tr>`).join('');
      const lineup = (conf.lineup || []).map((s) => `
        <div class="chip"><strong>${esc(s.label)}</strong><span>×${s.count}</span></div>`).join('');
      return `
        <div class="panel reveal reveal-delay-${idx + 1}">
          <div class="panel-title ${tone}">
            ${logo}
            <span>${esc(conf.shortName || conf.name)}</span>
            <span class="meta">${esc(conf.playerRankType || 'PPR')}</span>
          </div>
          <table class="matrix">
            <thead><tr><th>Category</th><th style="text-align:right">Points</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="2">No scoring items returned.</td></tr>'}</tbody>
          </table>
          <p class="section-label">Starting Lineup</p>
          <div class="chips">${lineup || '<div class="msg">No lineup data.</div>'}</div>
        </div>`;
    }

    async function load() {
      try {
        const res = await fetch('/api/settings', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        document.getElementById('boards').innerHTML = data.conferences.map(board).join('');
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }
    load();
  </script>
</body>
</html>
