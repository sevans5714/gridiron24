<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoring Matrix · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    .matrix {
      width: 100%;
      border-collapse: collapse;
    }
    .matrix th, .matrix td {
      padding: 0.55rem 0.9rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 0.9rem;
    }
    .matrix th {
      font-family: var(--display);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: #0c0c0c;
    }
    .matrix td.pts {
      text-align: right;
      font-family: var(--display);
      font-weight: 700;
      font-size: 1rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.85rem 1rem 1rem;
    }
    .chip {
      border: 1px solid var(--line);
      background: #0c0c0c;
      padding: 0.35rem 0.55rem;
      font-family: var(--display);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .chip strong { color: #fff; margin-right: 0.25rem; }
    .chip span { color: var(--muted); }
    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="scoring">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell">
    <h1>Scoring Matrix</h1>
    <p>Official GridIron 24 fantasy scoring pulled from both ESPN conferences.</p>
  </section>

  <main class="page-main shell">
    <div class="grid-2" id="boards">
      <div class="msg">Loading scoring settings…</div>
    </div>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function fmt(n) {
      const x = Number(n);
      return Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    }

    function board(conf) {
      if (!conf.ok) {
        return `<div class="panel"><div class="panel-title">${esc(conf.name || 'Conference')}</div><div class="msg"><strong>Unavailable</strong>${esc(conf.error || '')}</div></div>`;
      }
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      const rows = (conf.scoringItems || []).map((item) => `
        <tr>
          <td>${esc(item.label)}</td>
          <td class="pts">${fmt(item.points)}</td>
        </tr>`).join('');
      const lineup = (conf.lineup || []).map((s) => `
        <div class="chip"><strong>${esc(s.label)}</strong><span>×${s.count}</span></div>`).join('');
      return `
        <div class="panel">
          <div class="panel-title ${tone}">${esc(conf.name)} · ${esc(conf.playerRankType || 'PPR')}</div>
          <table class="matrix">
            <thead><tr><th>Category</th><th style="text-align:right">Points</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="2">No scoring items returned.</td></tr>'}</tbody>
          </table>
          <div class="panel-title" style="border-top:1px solid var(--line)">Starting Lineup</div>
          <div class="chips">${lineup || '<div class="msg">No lineup data.</div>'}</div>
        </div>`;
    }

    async function load() {
      try {
        const res = await fetch('/api/settings', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        document.getElementById('boards').innerHTML = data.conferences.map(board).join('');
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }
    load();
  </script>
</body>
</html>
