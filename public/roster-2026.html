<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Roster · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=146" />
  <link rel="icon" href="/favicon.ico?v=146" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=146" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=146" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=182" />
  <link rel="stylesheet" href="/css/league-roster.css?v=10" />
  <style>
    .roster-lead {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 1.05rem;
    }
  </style>
</head>
<body data-page="roster-2026">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">2026 Roster</div>
    </div>
  </header>
  <section class="page-hero shell">
    <p class="eyebrow">2026</p>
    <h1>League Roster</h1>
  </section>
  <main class="page-main shell">
    <p class="roster-lead" id="roster-lead">GridIron 24 is Detail and Overtime — 12 each — then AAA.</p>
    <div id="boards"><div class="msg">Loading roster…</div></div>
  </main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=189"></script>
  <script src="/js/league-roster-ui.js?v=10"></script>
  <script>
    function spotsLead(league, label) {
      const assigned = Number(league.assigned || 0);
      const cap = Number(league.slotCount || 0);
      const invited = Number(league.invited || 0);
      if (league.holding) return `${label}: ${assigned} waiting`;
      const open = Math.max(0, cap - assigned);
      const inviteBit = invited ? ` · ${invited} invited` : '';
      if (open === 0) return `${label}: FULL (${assigned} of ${cap}${inviteBit})`;
      const noun = open === 1 ? 'spot' : 'spots';
      return `${label}: ${open} ${noun} left (${assigned} of ${cap}${inviteBit})`;
    }
    (async () => {
      const auth = await (window.GridIronNav?.authReady || Promise.resolve({ user: null }));
      const scope = window.GridIronNav?.getLeagueScope?.() || auth.leagueScope || {};
      if (scope.scope === 'independent' || scope.platform === 'independent') {
        window.location.replace(scope.homePath || '/profile.html');
        return;
      }
      const el = document.getElementById('boards');
      try {
        const res = await fetch('/api/league-roster', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        const detail = (data.leagues || []).find((l) => l.key === 'detail');
        const overtime = (data.leagues || []).find((l) => l.key === 'overtime');
        const aaa = (data.leagues || []).find((l) => l.key === 'aaa');
        const lead = document.getElementById('roster-lead');
        if (lead && detail && overtime && aaa) {
          lead.innerHTML = `<strong>${spotsLead(detail, 'Detail')}</strong>
            · <strong>${spotsLead(overtime, 'Overtime')}</strong>
            · <strong>${spotsLead(aaa, 'AAA')}</strong>`;
        }
        window.GridIronRoster.render(el, data, auth.user?.id, { wide: true });
        window.GridIronNav?.setSync(`${data.season || 2026} roster`);
      } catch (err) {
        el.innerHTML = `<div class="msg">${String(err.message || err).replaceAll('<','&lt;')}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    })();
  </script>
</body>
</html>
