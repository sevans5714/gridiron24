<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Roster · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=119" />
  <link rel="icon" href="/favicon.ico?v=119" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=119" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=119" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=153" />
  <link rel="stylesheet" href="/css/league-roster.css?v=4" />
  <style>
    .roster-lead {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 1.05rem;
    }
  </style>
</head>
<body data-page="roster-2026">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">2026 Roster</div>
    </div>
  </header>
  <section class="page-hero shell">
    <p class="eyebrow">2026</p>
    <h1>League Roster</h1>
  </section>
  <main class="page-main shell">
    <p class="roster-lead">Names assigned in GridIron 24 — 24 GridIron slots, then 12 AAA.</p>
    <div id="boards"><div class="msg">Loading roster…</div></div>
  </main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=154"></script>
  <script src="/js/league-roster-ui.js?v=4"></script>
  <script>
    (async () => {
      const auth = await (window.GridIronNav?.authReady || Promise.resolve({ user: null }));
      const el = document.getElementById('boards');
      try {
        const res = await fetch('/api/league-roster', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        window.GridIronRoster.render(el, data, auth.user?.id, { wide: true });
        window.GridIronNav?.setSync(`${data.season || 2026} roster`);
      } catch (err) {
        el.innerHTML = `<div class="msg">${String(err.message || err).replaceAll('<','&lt;')}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    })();
  </script>
</body>
</html>
