<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02060f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Casino · GridIron 24</title>
  <script>
    // Must run before paint so lounge-games/embed CSS treat this as the PWA book.
    document.documentElement.classList.add('is-embed-book');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=170" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #060b16 !important;
    }
    body {
      padding: 0.45rem 0.45rem calc(0.65rem + env(safe-area-inset-bottom, 0px));
    }
    .casino-embed-shell {
      margin: 0;
      min-height: calc(100dvh - 1rem);
    }
    .casino-embed-shell .palace-label,
    .casino-embed-shell .degen-ticket,
    .casino-embed-shell .topbar,
    .casino-embed-shell .site-footer {
      display: none !important;
    }
    #degenerate-book {
      border: 0;
      box-shadow: none;
      background: transparent;
      min-height: calc(100dvh - 1.25rem);
    }
    .degen-layout,
    .degen-layout.is-embed {
      grid-template-columns: 1fr;
      gap: 0;
    }
  </style>
</head>
<body data-page="casino-embed">
  <main class="casino-embed-shell" aria-label="Casala's Palace Casino">
    <div class="palace-header-stats" id="palace-header-stats" aria-label="Your record, earnings, and funds" hidden>
      <span class="palace-stat is-record" title="Wins–Losses">
        <em>Record</em>
        <strong><b class="w" id="palace-record-w">0</b><i>–</i><b class="l" id="palace-record-l">0</b></strong>
      </span>
      <span class="palace-stat is-earn" title="Net winnings and losses">
        <em>Earnings</em>
        <strong id="palace-earnings">$0.00</strong>
      </span>
      <span class="palace-stat is-funds" title="Available funds">
        <em>Funds</em>
        <strong id="palace-funds">$1,000.00</strong>
      </span>
    </div>
    <div id="degenerate-book">
      <div id="degenerate-book-root"><div class="records-empty">Loading casino…</div></div>
      <p class="degen-status" id="degen-status" role="status" hidden></p>
    </div>
  </main>
  <script src="/js/lounge-games.js?v=43"></script>
</body>
</html>
