  <style>
    body[data-page="aaa"] {
      background:
        radial-gradient(ellipse 85% 55% at 50% -8%, rgba(47, 109, 255, 0.22), transparent 58%),
        radial-gradient(ellipse 42% 38% at 8% 72%, rgba(255, 122, 24, 0.12), transparent 52%),
        radial-gradient(ellipse 42% 38% at 92% 68%, rgba(226, 35, 42, 0.11), transparent 52%),
        linear-gradient(180deg, #0b1220 0%, #070b14 32%, #05070e 100%);
    }
    html[data-theme="day"] body[data-page="aaa"] {
      background:
        radial-gradient(ellipse 85% 55% at 50% -8%, rgba(31, 94, 240, 0.14), transparent 58%),
        radial-gradient(ellipse 42% 38% at 8% 72%, rgba(232, 106, 12, 0.08), transparent 52%),
        radial-gradient(ellipse 42% 38% at 92% 68%, rgba(201, 29, 36, 0.07), transparent 52%),
        linear-gradient(180deg, #eef2f8 0%, #e8ecf1 100%);
    }
    body[data-page="aaa"] .topbar {
      border-bottom: 1px solid rgba(142, 182, 255, 0.42);
      background:
        radial-gradient(ellipse 70% 140% at 50% -40%, rgba(47, 109, 255, 0.28), transparent 60%),
        linear-gradient(180deg, #152038 0%, #0c121f 100%);
      box-shadow:
        0 1px 0 rgba(47, 109, 255, 0.55),
        0 10px 28px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(47, 109, 255, 0.1);
    }
    body[data-page="aaa"] .topbar::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #2f6dff 18%, #7ec8ff 50%, #2f6dff 82%, transparent);
      pointer-events: none;
      z-index: 1;
    }
    html[data-theme="day"] body[data-page="aaa"] .topbar {
      border-bottom: 1px solid rgba(31, 94, 240, 0.28);
      background:
        radial-gradient(ellipse 70% 140% at 50% -40%, rgba(31, 94, 240, 0.12), transparent 60%),
        linear-gradient(180deg, #ffffff 0%, #e8eef8 100%);
      box-shadow:
        0 1px 0 rgba(31, 94, 240, 0.2),
        0 8px 22px rgba(20, 24, 31, 0.1);
    }
    html[data-theme="day"] body[data-page="aaa"] .topbar::after {
      background: linear-gradient(90deg, transparent, #1f5ef0 18%, #5b8cff 50%, #1f5ef0 82%, transparent);
      opacity: 0.85;
    }
    body[data-page="aaa"] .ticker-wrap {
      padding-top: 1rem;
    }

    .hq-hero {
      position: relative;
      z-index: 5;
      text-align: center;
      margin-top: 0.35rem;
      padding: 0.85rem 0 1.5rem;
      overflow: visible;
      border-bottom: 1px solid rgba(47, 109, 255, 0.28);
      background:
        radial-gradient(ellipse 75% 90% at 50% 28%, rgba(47, 109, 255, 0.2), transparent 62%),
        radial-gradient(ellipse 50% 60% at 18% 90%, rgba(255, 122, 24, 0.08), transparent 55%),
        radial-gradient(ellipse 50% 60% at 82% 90%, rgba(226, 35, 42, 0.08), transparent 55%),
        transparent;
    }
    .hq-hero img {
      width: min(18rem, 64vw);
      height: auto;
      display: block;
      margin: 0 auto;
      position: relative;
      z-index: 6;
      filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.78));
    }
    html[data-theme="day"] .hq-hero img {
      filter: drop-shadow(0 12px 24px rgba(20, 24, 31, 0.2));
    }
    .hq-hero-title {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .hq-hero .tag {
      margin: 1.25rem 0 0;
      font-family: var(--display);
      font-size: clamp(1.35rem, 3.8vw, 1.95rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.25;
      color: var(--text);
    }
    .hq-hero .tag .t { color: var(--blue); }
    .hq-hero .tag .d {
      color: #c5cedb;
      text-shadow:
        0 0 6px rgba(200, 215, 240, 0.45),
        0 0 14px rgba(170, 190, 220, 0.25);
    }
    html[data-theme="day"] .hq-hero .tag .d {
      color: var(--muted);
      text-shadow: none;
    }
    .hq-hero .tag .c {
      color: var(--text);
      font-weight: 700;
    }
    html[data-theme="night"] .hq-hero .tag .c {
      color: #f2f5fa;
      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #e8eef6 28%,
        #a8b4c4 58%,
        #dde4ee 78%,
        #8e9aab 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 0 6px rgba(230, 240, 255, 0.85))
        drop-shadow(0 0 14px rgba(190, 210, 240, 0.55))
        drop-shadow(0 0 28px rgba(160, 185, 230, 0.35));
    }
    .hq-hero .tag .sep { color: var(--muted-2); margin: 0 0.35em; }

    .hq-main {
      padding-top: 1.5rem;
      padding-bottom: 2.25rem;
      font-size: 1.22rem;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.85rem;
      margin: 0 0 0.85rem;
    }
    .section-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.45rem, 3vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.1;
    }
    .section-head a,
    .section-head .hint {
      color: #9ec0ff;
      font-size: 1.08rem;
      font-weight: 600;
      text-decoration: none;
    }
    html[data-theme="day"] .section-head a,
    html[data-theme="day"] .section-head .hint {
      color: var(--blue);
    }
    .section-head a:hover { color: var(--nav-hover); }

    .hq-section {
      margin-bottom: 2.15rem;
    }

    .hq-board {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(17rem, 0.78fr);
      gap: 1.75rem 2rem;
      align-items: start;
      margin-bottom: 2.5rem;
    }
    .hq-board-main,
    .hq-board-side {
      min-width: 0;
    }
    .hq-board-side {
      display: grid;
      gap: 1.35rem;
    }
    .hq-board .hq-section {
      margin-bottom: 0;
      padding: 0 0 1.25rem;
      border: 1px solid rgba(47, 109, 255, 0.22);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 42%), var(--panel);
      overflow: hidden;
    }
    .hq-board .hq-section > :not(.section-head) {
      padding-left: 1.2rem;
      padding-right: 1.2rem;
    }
    .hq-board .section-head {
      margin: 0 0 0.9rem;
      min-height: 2.85rem;
      padding: 0.55rem 1.2rem;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse 80% 120% at 8% 0%, rgba(47, 109, 255, 0.16), transparent 55%),
        linear-gradient(180deg, rgba(47, 109, 255, 0.12), rgba(47, 109, 255, 0.04));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
    }
    html[data-theme="day"] .hq-board .section-head,
    html[data-theme="day"] .news-block .section-head,
    html[data-theme="day"] .board-block .section-head {
      background:
        radial-gradient(ellipse 80% 120% at 8% 0%, rgba(31, 94, 240, 0.1), transparent 55%),
        linear-gradient(180deg, rgba(31, 94, 240, 0.08), rgba(31, 94, 240, 0.02));
      border-bottom-color: rgba(20, 24, 31, 0.1);
    }
    .hq-board .section-head::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      height: auto;
      transform: none;
      background: var(--blue);
    }
    .hq-board-side .section-head {
      min-height: 0;
      padding: 0.7rem 1rem;
      align-items: flex-start;
    }
    .hq-board-side .section-head h2 {
      font-size: clamp(1.05rem, 2.2vw, 1.28rem);
      letter-spacing: 0.045em;
      line-height: 1.2;
      max-width: 100%;
    }

    .standings-preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.35rem 1.5rem;
    }
    .standings-preview .conf-block + .conf-block {
      padding-left: 0;
    }
    @media (min-width: 641px) {
      .standings-preview .conf-block:last-child {
        padding-left: 1.15rem;
        border-left: 1px solid var(--line);
      }
    }

    .conf-block { min-width: 0; }
    .conf-head {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      margin-bottom: 0.7rem;
      padding-bottom: 0.55rem;
      border-bottom: 2px solid var(--line);
    }
    .conf-head.detail { border-bottom-color: rgba(255, 122, 24, 0.55); }
    .conf-head.overtime { border-bottom-color: rgba(226, 35, 42, 0.55); }
    .conf-head-top {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .conf-title-wrap {
      display: grid;
      gap: 0.12rem;
      min-width: 0;
    }
    .conf-head img {
      width: clamp(3.25rem, 8vw, 4.5rem);
      height: auto;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .conf-head h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .conf-week {
      margin: 0;
      color: var(--muted);
      font-family: var(--display);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .conf-head.is-compact {
      margin-bottom: 0.55rem;
      padding-bottom: 0.4rem;
      justify-content: flex-start;
    }
    .conf-head.is-compact img {
      width: 2.35rem;
      max-width: 2.35rem;
    }
    .conf-head.is-compact h3 {
      font-size: 0.98rem;
      letter-spacing: 0.06em;
    }
    .conf-head.is-compact .conf-week {
      font-size: 0.72rem;
    }
    .hq-board-side .conf-mark::after {
      display: none;
    }
    .conf-admin {
      text-align: right;
      padding: 0;
      flex: 0 1 auto;
      min-width: 0;
    }
    .conf-admin-name {
      margin: 0;
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conf-admin-role {
      margin: 0.2rem 0 0;
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .conf-head.detail h3,
    .conf-head.detail .conf-admin-name { color: var(--detail); }
    .conf-head.overtime h3,
    .conf-head.overtime .conf-admin-name { color: var(--overtime); }
    @media (max-width: 520px) {
      .conf-head {
        flex-wrap: wrap;
      }
      .conf-admin {
        width: 100%;
        text-align: right;
      }
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }
    .mini-table th {
      padding: 0.4rem 0.35rem 0.5rem;
      text-align: left;
      font-size: 0.78rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    .mini-table th.num,
    .mini-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 0.55rem;
    }
    html[data-theme="day"] .mini-table th.num,
    html[data-theme="day"] .mini-table td.num {
      border-left-color: rgba(20, 28, 40, 0.14);
    }
    .mini-table td {
      padding: 0.42rem 0.35rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      color: var(--text);
    }
    .mini-table tr:last-child td { border-bottom: 0; }
    .mini-table .rank {
      width: 1.35rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .mini-table .team {
      width: 100%;
      overflow: hidden;
      color: var(--text);
      font-weight: 600;
    }
    .mini-table .team-cell {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      max-width: 100%;
      min-width: 0;
      width: 100%;
    }
    .mini-table .team-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-table .team-logo-sm {
      width: 2.5rem;
      height: 2.5rem;
      object-fit: contain;
      flex: 0 0 auto;
      border-radius: 0.4rem;
    }
    .mini-table th.num,
    .mini-table td.num { width: 2.9rem; }
    .mini-table th:nth-child(3),
    .mini-table td.num:nth-child(3) { width: 3.8rem; }
    .mini-table .out td { opacity: 0.72; }
    .mini-table tr.cut-line td {
      padding: 0.45rem 0.35rem;
      border-top: 2px solid rgba(47, 109, 255, 0.7);
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: center;
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8eb6ff;
      opacity: 1;
    }
    .mini-table tr.cut-line.relegation td {
      border-top-color: rgba(196, 90, 48, 0.85);
      color: #e8a078;
    }
    .mini-table .relegation-zone td { opacity: 0.78; }

    .motw-col {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.15rem;
      min-width: 0;
    }
    .motw-block { min-width: 0; }
    .motw {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.45rem;
      align-items: center;
      padding: 0.35rem 0 0;
    }
    .motw-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      text-align: center;
      min-width: 0;
    }
    .motw-side img {
      width: 4.25rem;
      height: 4.25rem;
      object-fit: contain;
      background: transparent;
      border: 0;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .motw-side .nm {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .motw-mid {
      text-align: center;
      font-family: var(--display);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .motw-mid .vs {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    .motw-mid .score {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .motw-mid .proj {
      margin-top: 0.2rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .hotnot-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.15rem;
      margin-bottom: 0;
    }
    .hotnot {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem 1.25rem;
      padding-top: 0.15rem;
    }
    .hotnot-col {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 0;
    }
    .hotnot-col .label {
      font-family: var(--display);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .hotnot-col.hot .label {
      color: #ef4444;
      text-shadow: 0 0 18px rgba(239, 68, 68, 0.35);
    }
    .hotnot-col.cold .label {
      color: #2f6dff;
      text-shadow: 0 0 18px rgba(47, 109, 255, 0.35);
    }
    .hotnot-col.hot {
      border-left: 3px solid #ef4444;
      padding-left: 0.75rem;
    }
    .hotnot-col.cold {
      border-left: 3px solid #2f6dff;
      padding-left: 0.75rem;
    }
    .hotnot-team {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }
    .hotnot-team img {
      width: 3.5rem;
      height: 3.5rem;
      object-fit: contain;
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .hotnot-team .nm {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .hotnot-team .sub {
      margin-top: 0.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .bottom-stack {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding-top: 0.35rem;
      border-top: 1px solid var(--line);
    }
    .news-block,
    .board-block {
      min-width: 0;
      padding: 0 0 1.25rem;
      border: 1px solid rgba(47, 109, 255, 0.22);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 42%), var(--panel);
      overflow: hidden;
    }
    .news-block > :not(.section-head),
    .board-block > :not(.section-head) {
      padding-left: 1.2rem;
      padding-right: 1.2rem;
    }
    .news-block .section-head,
    .board-block .section-head {
      margin: 0 0 0.9rem;
      min-height: 2.85rem;
      padding: 0.55rem 1.2rem;
      border-bottom: 1px solid rgba(47, 109, 255, 0.28);
      background:
        radial-gradient(ellipse 80% 120% at 8% 0%, rgba(47, 109, 255, 0.28), transparent 55%),
        linear-gradient(180deg, rgba(47, 109, 255, 0.2), rgba(47, 109, 255, 0.06));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
    }
    .news-block .section-head::before,
    .board-block .section-head::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      height: auto;
      transform: none;
      background: var(--blue);
    }
    .news-list,
    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .empty {
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.45;
      padding: 0.15rem 0;
    }
    .news-item + .news-item,
    .msg-item + .msg-item {
      margin-top: 0.9rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--line);
    }
    .news-item h4 {
      margin: 0 0 0.3rem;
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.25;
    }
    .news-item p,
    .msg-item p {
      margin: 0;
      color: var(--text);
      font-size: 1.12rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .meta {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .meta button {
      margin-left: 0.4rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    .meta button:hover { color: #fca5a5; }

    .polls-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 0.25rem;
    }
    .poll-card {
      padding-bottom: 1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }
    .poll-card h4 {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.3;
    }
    .poll-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.65rem;
      margin: 0 0 0.7rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .poll-tag {
      color: var(--blue);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }
    .poll-tag.is-closed { color: var(--muted); }
    .poll-options {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .poll-option-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font: inherit;
      font-size: 1.02rem;
      cursor: pointer;
    }
    .poll-option-btn:hover:not(:disabled) {
      border-color: rgba(239, 215, 130, 0.55);
      background: rgba(239, 215, 130, 0.1);
    }
    .poll-option-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .poll-option-locked {
      padding: 0.45rem 0.15rem;
      color: var(--text);
      font-size: 1.02rem;
    }
    .poll-result {
      position: relative;
      overflow: hidden;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }
    .poll-result.mine {
      border-color: rgba(239, 215, 130, 0.55);
    }
    .poll-result-bar {
      position: absolute;
      inset: 0 auto 0 0;
      background: rgba(239, 215, 130, 0.18);
      pointer-events: none;
    }
    .poll-result-row {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 1.02rem;
      color: var(--text);
    }
    .poll-result-row .pct {
      color: var(--muted);
      white-space: nowrap;
      font-size: 0.92rem;
    }
    .poll-signin {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .poll-signin a { color: #7ec8ff; }

    .composer {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
    .composer label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .composer textarea {
      width: 100%;
      margin-bottom: 0.55rem;
      padding: 0.65rem 0.75rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: var(--body);
      font-size: 1.05rem;
      line-height: 1.45;
      min-height: 3.5rem;
      resize: vertical;
    }
    .composer textarea:focus {
      outline: none;
      border-bottom-color: var(--text);
    }
    .composer button {
      padding: 0.55rem 1rem;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-family: var(--display);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .composer button:hover:not(:disabled) {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
    }
    .composer button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .composer-err {
      display: none;
      margin: 0 0 0.4rem;
      color: #fca5a5;
      font-size: 0.95rem;
    }
    .composer-err.show { display: block; }

    .msg {
      padding: 0.35rem 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.45;
    }
    .msg strong { display: block; color: var(--text); margin-bottom: 0.2rem; font-size: 1.1rem; }

    .hq-board .section-head a.roster-link { margin-left: auto; font-size: 0.92rem; }


    @media (max-width: 1100px) {
      .hq-board {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }
    @media (max-width: 900px) {
      .motw-col,
      .hotnot-row,
      .hotnot { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .standings-preview { grid-template-columns: 1fr; }
      .motw-side img { width: 4.75rem; height: 4.75rem; }
      .hotnot-team img { width: 4rem; height: 4rem; }
      .hq-main { font-size: 1.12rem; }
      .hq-hero img { width: min(14rem, 68vw); }
      .hq-hero .tag { font-size: clamp(1.2rem, 5.2vw, 1.55rem); }
    }

    body[data-page="aaa"] .standings-preview {
      grid-template-columns: 1fr;
      max-width: 28rem;
    }
    body[data-page="aaa"] .hotnot-row {
      grid-template-columns: 1fr;
    }
    body[data-page="aaa"] .motw-col {
      grid-template-columns: 1fr;
    }
    body[data-page="aaa"] .conf-head.aaa {
      border-left: 0;
      border-bottom-color: rgba(126, 200, 255, 0.55);
    }
    body[data-page="aaa"] .conf-head.aaa h3 {
      color: #7ec8ff;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    body[data-page="aaa"] .conf-head.aaa.is-compact h3 {
      font-size: 0.98rem;
    }
    body[data-page="aaa"] .mini-table tr.promotee-row td {
      background: rgba(126, 200, 255, 0.06);
    }

  </style>
</head>
<body data-page="aaa">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">AAA League</div>
    </div>
  </header>

  <section class="hq-hero shell">
    <img id="aaa-hero-crest" src="/assets/aaa-league.png?v=7" alt="" width="520" height="520" decoding="async" />
    <h1 class="hq-hero-title">Headquarters</h1>
    <p class="tag">
      <span class="t">12 Teams</span><span class="sep">·</span><span class="c">One Promotion</span>
    </p>
  </section>

  <main class="hq-main shell">
    <div class="hq-board">
      <div class="hq-board-main">
        <section class="hq-section">
          <div class="section-head">
            <h2>2026 Roster</h2>
            <a class="roster-link" href="/roster-2026.html">Full board</a>
          </div>
          <div class="league-names" id="league-roster">
            <div class="msg">Loading roster…</div>
          </div>
        </section>
        <section class="hq-section">
          <div class="section-head">
            <h2>Standings</h2>
          </div>
          <div class="standings-preview" id="standings">
            <div class="msg">Loading standings…</div>
          </div>
        </section>
      </div>

      <div class="hq-board-side">
        <section class="hq-section">
          <div class="section-head">
            <h2>Matchup of the Week</h2>
          </div>
          <div class="motw-col" id="motw">
            <div class="msg">Loading matchups…</div>
          </div>
        </section>

        <section class="hq-section">
          <div class="section-head">
            <h2>Who’s Hot / Who’s Not</h2>
          </div>
          <div class="hotnot-row" id="hotnot">
            <div class="msg">Loading…</div>
          </div>
        </section>
      </div>
    </div>

    <div class="bottom-stack">
      <section class="board-block" id="board-panel">
        <div class="section-head">
          <h2>Message Board</h2>
        </div>
        <div class="polls-list" id="polls-list"></div>
        <div class="msg-list" id="msg-list"><div class="empty">Loading messages…</div></div>
        <div class="composer" id="msg-composer">
          <div class="composer-err" id="msg-err"></div>
          <label for="msg-body">Say something</label>
          <textarea id="msg-body" maxlength="2000" placeholder="Trash talk welcome. Keep it league-friendly."></textarea>
          <button type="button" id="msg-submit">Post Message</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=154"></script>
  <script src="/js/league-roster-ui.js?v=3"></script>
  <script>
    const PLACEHOLDER = '/assets/team-logo-placeholder.svg';
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    let currentUser = null;

    function fmtWhen(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch {
        return '';
      }
    }

    function record(team) {
      const ties = Number(team.ties || 0);
      return ties > 0
        ? `${team.wins}-${team.losses}-${ties}`
        : `${team.wins}-${team.losses}`;
    }

    function teamLogo(team) {
      const src = team?.logo || PLACEHOLDER;
      return `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;
    }

    function confHead(conf, { compact = false, showWeek = false } = {}) {
      const title = conf?.name || conf?.shortName || 'AAA League';
      const logoSrc = conf?.logo || '/assets/aaa-league.png?v=7';
      const week = showWeek && conf?.week != null
        ? `<div class="conf-week">Week ${esc(String(conf.week))}</div>`
        : '';
      return `
        <div class="conf-head aaa${compact ? ' is-compact' : ''}">
          <div class="conf-head-top">
            <span class="conf-mark"><img src="${esc(logoSrc)}" alt="" width="92" height="92" decoding="async"></span>
            <div class="conf-title-wrap">
              <h3>${esc(title)}</h3>
              ${week}
            </div>
          </div>
        </div>`;
    }

    function standingsBoard(data) {
      if (!data?.configured) {
        return `
          <div class="conf-block">
            ${confHead(data)}
            <div class="empty">ESPN league ID not set yet. Rules and payouts live in the <a href="/aaa-rulebook.html">AAA Rule Book</a>.</div>
          </div>`;
      }
      if (!data?.ok) {
        return `
          <div class="conf-block">
            ${confHead(data)}
            <div class="empty">${esc(data.error || 'Unavailable')}</div>
          </div>`;
      }
      const teams = data.teams || [];
      if (!teams.length) {
        return `
          <div class="conf-block">
            ${confHead(data)}
            <div class="empty">No teams yet</div>
          </div>`;
      }
      const playoffSlots = Number(data.playoffSlots) || 6;
      const cutRank = Number(data.playoffCutRank) || (playoffSlots + 1);
      const rows = [];
      teams.forEach((t, i) => {
        const rank = i + 1;
        if (rank === cutRank) {
          rows.push(`<tr class="cut-line"><td colspan="4">Playoff cut · top ${playoffSlots} in</td></tr>`);
        }
        const zoneClass = [
          rank === 1 ? 'promotee-row' : '',
          rank > playoffSlots ? 'out' : ''
        ].filter(Boolean).join(' ');
        rows.push(`
        <tr class="${zoneClass}">
          <td class="rank">${rank}</td>
          <td class="team" title="${esc(t.name)}">
            <a class="team-cell" href="/team.html?conference=aaa&teamId=${esc(t.id)}" style="color:inherit;text-decoration:none;">
              <img class="team-logo-sm" src="${esc(t.logo || PLACEHOLDER)}" alt="" width="40" height="40" loading="lazy" referrerpolicy="no-referrer" />
              <span class="team-name">${esc(t.name)}</span>
            </a>
          </td>
          <td class="num">${esc(record(t))}</td>
          <td class="num">${Number(t.pointsFor || 0).toFixed(0)}</td>
        </tr>`);
      });
      return `
        <div class="conf-block">
          ${confHead({ ...data, shortName: data.shortName || 'AAA' })}
          <table class="mini-table">
            <thead>
              <tr>
                <th></th>
                <th>Team</th>
                <th class="num">W-L</th>
                <th class="num">PF</th>
              </tr>
            </thead>
            <tbody>${rows.join('')}</tbody>
          </table>
          <p class="format-note" style="margin:0.65rem 0 0;font-size:0.82rem;color:var(--muted);">
            Playoffs: top ${playoffSlots} of ${teams.length || 12}
            · <a href="/aaa-playoffs.html" style="color:inherit;">Open bracket →</a>
          </p>
        </div>`;
    }

    function pickMatchupOfWeek(matchups) {
      const list = matchups || [];
      if (!list.length) return null;
      return list.slice().sort((a, b) => {
        const aLive = Number(a.home?.score || 0) + Number(a.away?.score || 0);
        const bLive = Number(b.home?.score || 0) + Number(b.away?.score || 0);
        if (bLive !== aLive) return bLive - aLive;
        const aProj = Number(a.home?.projected || 0) + Number(a.away?.projected || 0);
        const bProj = Number(b.home?.projected || 0) + Number(b.away?.projected || 0);
        return bProj - aProj;
      })[0];
    }

    function motwBoard(data) {
      if (!data?.configured) {
        return `<div class="motw-block">${confHead(data, { compact: true })}<div class="empty">Matchups unlock with the AAA ESPN league.</div></div>`;
      }
      if (!data?.ok) {
        return `<div class="motw-block">${confHead(data, { compact: true })}<div class="empty">Unavailable</div></div>`;
      }
      const m = pickMatchupOfWeek(data.matchups);
      if (!m) {
        return `<div class="motw-block">${confHead(data, { compact: true })}<div class="empty">No matchups this week</div></div>`;
      }
      return `
        <div class="motw-block">
          ${confHead(data, { compact: true, showWeek: true })}
          <div class="motw">
            <div class="motw-side">
              ${teamLogo(m.away)}
              <div class="nm" title="${esc(m.away.name)}">${esc(m.away.name)}</div>
            </div>
            <div class="motw-mid">
              <div class="vs">VS</div>
              <div class="score">${Number(m.away.score || 0).toFixed(1)} – ${Number(m.home.score || 0).toFixed(1)}</div>
              <div class="proj">Proj ${Number(m.away.projected || 0).toFixed(1)}–${Number(m.home.projected || 0).toFixed(1)}</div>
            </div>
            <div class="motw-side">
              ${teamLogo(m.home)}
              <div class="nm" title="${esc(m.home.name)}">${esc(m.home.name)}</div>
            </div>
          </div>
        </div>`;
    }

    function streakText(t) {
      const n = Number(t.streakLength || 0);
      if (n <= 0 || !t.streakType || t.streakType === 'NONE') return null;
      if (t.streakType === 'WIN') return `${n}W streak`;
      if (t.streakType === 'LOSS') return `${n}L streak`;
      return null;
    }

    function formSub(t) {
      const parts = [];
      const streak = streakText(t);
      if (streak) parts.push(streak);
      const games = Number(t.gamesPlayed || (t.wins || 0) + (t.losses || 0) + (t.ties || 0));
      const pf = Number(t.pointsFor || 0);
      if (games > 0) {
        const ppg = Number(t.pointsPerGame != null ? t.pointsPerGame : pf / games);
        parts.push(`${ppg.toFixed(1)} PPG`);
        parts.push(`${pf.toFixed(1)} PF`);
      } else {
        parts.push(record(t));
      }
      return parts.join(' · ');
    }

    function hotNotBoard(data) {
      if (!data?.configured || !data?.ok) {
        return `<div class="conf-block">${confHead(data, { compact: true })}<div class="empty">Form unlocks with AAA standings.</div></div>`;
      }
      const hot = data.hot;
      const cold = data.cold;
      if (!hot || !cold) {
        return `<div class="conf-block">${confHead(data, { compact: true })}<div class="empty">Not enough teams yet</div></div>`;
      }
      return `
        <div class="conf-block">
          ${confHead(data, { compact: true, showWeek: true })}
          <div class="hotnot">
            <div class="hotnot-col hot">
              <div class="label">Who’s Hot</div>
              <div class="hotnot-team">
                ${teamLogo(hot)}
                <div style="min-width:0">
                  <div class="nm" title="${esc(hot.name)}">${esc(hot.name)}</div>
                  <div class="sub">${esc(formSub(hot))}</div>
                </div>
              </div>
            </div>
            <div class="hotnot-col cold">
              <div class="label">Who’s Not</div>
              <div class="hotnot-team">
                ${teamLogo(cold)}
                <div style="min-width:0">
                  <div class="nm" title="${esc(cold.name)}">${esc(cold.name)}</div>
                  <div class="sub">${esc(formSub(cold))}</div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    async function loadLeagueRoster() {
      const el = document.getElementById('league-roster');
      if (!el) return;
      try {
        const res = await fetch('/api/league-roster', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        window.GridIronRoster.render(el, data, currentUser?.id);
      } catch (err) {
        el.innerHTML = `<div class="msg">${esc(err.message)}</div>`;
      }
    }

    async function loadAaa() {
      try {
        const res = await fetch('/api/aaa', { cache: 'no-store' });
        const data = await res.json();
        const crest = document.getElementById('aaa-hero-crest');
        if (crest) {
          const nextLogo = data.logo || '/assets/aaa-league.png?v=7';
          if (crest.getAttribute('src') !== nextLogo) crest.src = nextLogo;
        }
        document.getElementById('standings').innerHTML = standingsBoard(data);
        document.getElementById('motw').innerHTML = motwBoard(data);
        document.getElementById('hotnot').innerHTML = hotNotBoard(data);
        if (data.generatedAt) {
          const t = new Date(data.generatedAt);
          window.GridIronNav?.setSync(`AAA sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
        } else {
          window.GridIronNav?.setSync('AAA League');
        }
      } catch (err) {
        const msg = `<div class="msg"><strong>Unavailable</strong>${esc(err.message)}</div>`;
        document.getElementById('standings').innerHTML = msg;
        document.getElementById('motw').innerHTML = msg;
        document.getElementById('hotnot').innerHTML = msg;
        window.GridIronNav?.setSync('AAA sync error', false);
      }
    }

    function canDeleteMessage(item) {
      if (!currentUser) return false;
      return currentUser.role === 'commissioner'
        || currentUser.role === 'conference_admin'
        || currentUser.siteOwner
        || item.authorId === currentUser.id;
    }

    function pollAudienceLabel(key) {
      const map = { detail: 'Detail', overtime: 'Overtime', aaa: 'AAA' };
      return map[String(key || '').toLowerCase()] || key || 'Conference';
    }

    function renderPollCard(p) {
      const tags = [];
      if (p.audience === 'conference') {
        tags.push(`<span class="poll-tag">${esc(pollAudienceLabel(p.audienceConference))} only</span>`);
      }
      if (p.status === 'closed') tags.push(`<span class="poll-tag is-closed">Closed</span>`);
      let body = '';
      if (p.canVote) {
        body = `<div class="poll-options">${(p.options || []).map((o) => `
          <button type="button" class="poll-option-btn" data-poll-id="${esc(p.id)}" data-option-id="${esc(o.id)}">${esc(o.text)}</button>
        `).join('')}</div>`;
      } else if (p.showResults) {
        const total = Number(p.totalVotes || 0);
        body = `<div class="poll-options">${(p.options || []).map((o) => {
          const votes = Number(o.votes || 0);
          const pct = total ? Math.round((votes / total) * 100) : 0;
          const mine = p.myVote === o.id ? ' mine' : '';
          return `
            <div class="poll-result${mine}">
              <div class="poll-result-bar" style="width:${pct}%"></div>
              <div class="poll-result-row">
                <span>${esc(o.text)}</span>
                <span class="pct">${votes} · ${pct}%</span>
              </div>
            </div>`;
        }).join('')}</div>`;
      } else {
        body = `<div class="poll-options">${(p.options || []).map((o) =>
          `<div class="poll-option-locked">${esc(o.text)}</div>`
        ).join('')}</div>
        <p class="poll-signin"><a href="/enter?next=${encodeURIComponent(location.pathname)}">Sign in</a> to vote.</p>`;
      }
      return `
        <article class="poll-card" data-id="${esc(p.id)}">
          <h4>${esc(p.question)}</h4>
          <div class="poll-meta">
            ${tags.join('')}
            <span>${esc(p.createdByName || 'Admin')} · ${esc(fmtWhen(p.createdAt))}</span>
            ${p.myVote && p.status === 'open' ? '<span>You voted</span>' : ''}
          </div>
          ${body}
        </article>`;
    }

    function renderPolls(items) {
      const el = document.getElementById('polls-list');
      if (!el) return;
      if (!items.length) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = items.map(renderPollCard).join('');
    }

    function renderMessages(items) {
      const el = document.getElementById('msg-list');
      if (!items.length) {
        el.innerHTML = `<div class="empty">No messages yet. Start the board.</div>`;
        return;
      }
      el.innerHTML = items.map((m) => `
        <article class="msg-item" data-id="${esc(m.id)}">
          <p>${esc(m.body)}</p>
          <p class="meta">
            ${esc(m.authorName)} · ${esc(fmtWhen(m.createdAt))}
            ${canDeleteMessage(m) ? `<button type="button" data-del-msg="${esc(m.id)}">Delete</button>` : ''}
          </p>
        </article>`).join('');
    }

    async function loadMessages() {
      const res = await fetch('/api/messages', { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load messages');
      renderMessages(data.messages || []);
    }

    async function loadPolls() {
      const res = await fetch('/api/polls', { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load polls');
      renderPolls(data.polls || []);
    }

    function wireBoard() {
      document.getElementById('msg-submit')?.addEventListener('click', async () => {
        const err = document.getElementById('msg-err');
        const btn = document.getElementById('msg-submit');
        err.classList.remove('show');
        btn.disabled = true;
        try {
          const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ body: document.getElementById('msg-body').value })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not post message');
          document.getElementById('msg-body').value = '';
          await loadMessages();
        } catch (e) {
          err.textContent = e.message;
          err.classList.add('show');
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('msg-list')?.addEventListener('click', async (e) => {
        const id = e.target?.dataset?.delMsg;
        if (!id) return;
        if (!confirm('Delete this message?')) return;
        await fetch(`/api/messages/${encodeURIComponent(id)}`, { method: 'DELETE' });
        await loadMessages();
      });

      document.getElementById('polls-list')?.addEventListener('click', async (e) => {
        const btn = e.target?.closest?.('[data-poll-id][data-option-id]');
        if (!btn) return;
        const pollId = btn.dataset.pollId;
        const optionId = btn.dataset.optionId;
        btn.disabled = true;
        try {
          const res = await fetch(`/api/polls/${encodeURIComponent(pollId)}/vote`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ optionId })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not record vote');
          await loadPolls();
        } catch (err) {
          alert(err.message);
          btn.disabled = false;
        }
      });
    }

    (async () => {
      const auth = await (window.GridIronNav?.authReady || Promise.resolve({ user: null }));
      currentUser = auth.user || null;
      wireBoard();
      await Promise.all([
        loadLeagueRoster(),
        loadAaa(),
        loadPolls().catch(() => {
          document.getElementById('polls-list').innerHTML = '';
        }),
        loadMessages().catch((err) => {
          document.getElementById('msg-list').innerHTML = `<div class="empty">${esc(err.message)}</div>`;
        })
      ]);
      setInterval(loadAaa, 60_000);
    })();
  </script>
</body>
</html>
