<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Power Rankings · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=124" />
  <link rel="icon" href="/favicon.ico?v=124" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=124" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=124" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=157" />
  <style>
    .rank-board {
      max-width: 44rem;
    }
    .rank-meta-line {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .rank-notes {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .rank-pending {
      max-width: 36rem;
      margin: 1.5rem 0;
      padding: 1.35rem 1.4rem;
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      background: color-mix(in srgb, var(--surface, #121820) 88%, transparent);
    }
    .rank-pending h2 {
      margin: 0 0 0.55rem;
      font-family: var(--display);
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    .rank-pending p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 1.02rem;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 2.75rem 2.5rem minmax(0, 1fr);
      gap: 0.75rem 0.85rem;
      align-items: center;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--line);
    }
    .rank-num {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #8eb6ff;
      text-align: right;
    }
    .rank-logo {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.4rem;
      object-fit: contain;
      background: transparent;
      border: 0;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .rank-name {
      font-weight: 700;
      color: var(--text);
      font-size: 1.02rem;
      line-height: 1.25;
    }
    .rank-conf {
      margin-top: 0.15rem;
      font-family: var(--display);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .rank-conf.detail { color: var(--detail); }
    .rank-conf.overtime { color: var(--overtime); }
    .rank-note {
      margin-top: 0.3rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .empty { color: var(--muted); }
  </style>
</head>
<body data-page="rankings">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Rankings</div>
    </div>
  </header>
  <section class="page-hero shell">
    <p class="eyebrow">System board</p>
    <h1>Power Rankings</h1>
  </section>
  <main class="page-main shell" id="main"><div class="msg">Loading rankings…</div></main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=163"></script>
  <script>
    const esc = (v='') => String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const PLACEHOLDER = '/assets/team-logo-placeholder.svg';

    function confLabel(key) {
      return key === 'overtime' ? 'Overtime' : 'Detail';
    }

    (async () => {
      try {
        const [rankRes, leagueRes] = await Promise.all([
          fetch('/api/power-rankings', { cache: 'no-store' }),
          fetch('/api/leagues', { cache: 'no-store' })
        ]);
        const data = await rankRes.json();
        const leagues = await leagueRes.json().catch(() => ({}));
        const logoMap = new Map();
        for (const conf of leagues.conferences || []) {
          for (const t of conf.teams || []) {
            logoMap.set(`${conf.key}:${t.id}`, t.logo || PLACEHOLDER);
          }
        }

        const main = document.getElementById('main');
        if (data.mode === 'pre_draft' || (!data.latest && data.message)) {
          main.innerHTML = `
            <div class="rank-pending">
              <h2>Coming after the draft</h2>
              <p>${esc(data.message || 'Power rankings will be displayed after the draft.')}
              Before Week 1 they’ll rank by projected points; once games start, record, scoring, and point differential take over.</p>
            </div>`;
          window.GridIronNav?.setSync('After draft', true);
          return;
        }

        const latest = data.latest;
        if (!latest || !(latest.ranks || []).length) {
          main.innerHTML = `<div class="empty">${esc(data.message || 'Power rankings are unavailable right now.')}</div>`;
          return;
        }

        const ranks = (latest.ranks || []).slice().sort((a, b) => a.rank - b.rank);
        const modeLabel = latest.mode === 'preseason' ? 'Preseason · Week 1 projections' : `Week ${latest.week}`;
        main.innerHTML = `
          <div class="rank-board">
            <p class="rank-meta-line">${esc(modeLabel)} · ${esc(ranks.length)} teams · System</p>
            ${latest.notes ? `<p class="rank-notes">${esc(latest.notes)}</p>` : ''}
            ${ranks.map((r) => {
              const logo = r.logo || logoMap.get(`${r.conferenceKey}:${r.teamId}`) || PLACEHOLDER;
              const conf = r.conferenceKey === 'overtime' ? 'overtime' : 'detail';
              return `
                <div class="rank-row">
                  <div class="rank-num">${esc(r.rank)}</div>
                  <img class="rank-logo" src="${esc(logo)}" alt="" width="40" height="40" loading="lazy" referrerpolicy="no-referrer" />
                  <div>
                    <div class="rank-name">${esc(r.teamName)}</div>
                    <div class="rank-conf ${conf}">${esc(confLabel(conf))}</div>
                    ${r.note ? `<div class="rank-note">${esc(r.note)}</div>` : ''}
                  </div>
                </div>`;
            }).join('')}
          </div>`;
        window.GridIronNav?.setSync(modeLabel, true);
      } catch (err) {
        document.getElementById('main').innerHTML = `<div class="msg">${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
