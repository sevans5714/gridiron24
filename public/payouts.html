<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payouts · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=30" />
  <style>
    .pool-line {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: var(--fs-md);
      line-height: 1.45;
    }
    .pool-line strong {
      color: #fff;
      font-weight: 600;
    }

    .payout-table {
      width: 100%;
      max-width: 44rem;
      border-collapse: collapse;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .payout-table thead th {
      padding: 0.7rem 1rem;
      text-align: left;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: #0c0c0c;
      border-bottom: 1px solid var(--line);
    }
    .payout-table thead th:last-child {
      text-align: right;
    }

    .payout-table tbody tr:nth-child(odd) {
      background: #111111;
    }
    .payout-table tbody tr:nth-child(even) {
      background: #171717;
    }
    .payout-table tbody tr:hover {
      background: #1c1c1c;
    }

    .payout-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .payout-table tr:last-child td {
      border-bottom: 0;
    }

    .payout-table td.award {
      width: 100%;
    }

    .award-cell {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
    }

    .award-cell img {
      width: 2.75rem;
      height: 2.75rem;
      object-fit: contain;
      flex: 0 0 2.75rem;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));
    }

    .award-cell span {
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.3;
      color: #eee;
    }

    .payout-table td.amount {
      text-align: right;
      white-space: nowrap;
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      padding-left: 1.5rem;
    }

    .payout-table tr.total-row td {
      background: #0c0c0c;
      border-top: 2px solid rgba(255,255,255,0.16);
      font-weight: 700;
    }
    .payout-table tr.total-row .award-cell span {
      color: #fff;
      font-family: var(--display);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }
    .payout-table tr.total-row td.amount {
      color: #efd782;
    }

    .note {
      margin-top: 1rem;
      max-width: 44rem;
      color: var(--muted);
      font-size: var(--fs-sm);
      line-height: 1.55;
    }
  </style>
</head>
<body data-page="payouts">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <p class="eyebrow">Prize Money</p>
    <h1>Payout Schedule</h1>
    <p>Entry fees from all 24 franchises fund the season prize pool.</p>
  </section>

  <main class="page-main shell">
    <div id="content"><div class="msg">Loading payouts…</div></div>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js?v=17"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function money(amount, currency = 'USD') {
      if (amount == null || amount === '') return 'TBD';
      try {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency,
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(amount));
      } catch {
        return `$${Number(amount).toFixed(2)}`;
      }
    }

    function prizeLogo(label = '') {
      const l = label.toLowerCase();
      if ((l.includes('third') || l.includes('3rd')) && l.includes('detail')) return '/assets/detail-3rd-place.png';
      if ((l.includes('third') || l.includes('3rd')) && l.includes('overtime')) return '/assets/overtime-3rd-place.png';
      if (l.includes('third') || l.includes('3rd')) return '/assets/detail-3rd-place.png';
      if (l.includes('winner') || l.includes('bowl') || (l.includes('gridiron') && !l.includes('conference'))) {
        return '/assets/gridiron-bowl.png';
      }
      if (l.includes('detail') && (l.includes('championship') || l.includes('2nd') || l.includes('most'))) {
        return '/assets/detail-conference.png';
      }
      if (l.includes('overtime') && (l.includes('championship') || l.includes('2nd') || l.includes('most'))) {
        return '/assets/overtime-conference.png';
      }
      if (l.includes('detail')) return '/assets/detail-conference.png';
      if (l.includes('overtime')) return '/assets/overtime-conference.png';
      return '/assets/gridiron-bowl.png';
    }

    function render(data) {
      const p = data.payouts || {};
      const currency = p.currency || 'USD';
      const prizes = p.prizes || [];
      const buyIn = money(p.buyInPerTeam, currency);
      const poolAmount = p.buyInPerTeam != null && p.teamCount
        ? Number(p.buyInPerTeam) * Number(p.teamCount)
        : null;
      const pool = poolAmount != null ? money(poolAmount, currency) : 'TBD';
      const prizesTotal = prizes.reduce((sum, prize) => sum + Number(prize.amount || 0), 0);

      const rows = prizes.map((prize) => `
        <tr>
          <td class="award">
            <div class="award-cell">
              <img src="${esc(prizeLogo(prize.label))}" alt="" />
              <span>${esc(prize.label)}</span>
            </div>
          </td>
          <td class="amount">${money(prize.amount, currency)}</td>
        </tr>`).join('');

      document.getElementById('content').innerHTML = `
        <p class="pool-line reveal">
          <strong>${buyIn}</strong> buy-in · <strong>${pool}</strong> total prize pool · ${esc(p.seasonLabel || data.season)}
        </p>
        <table class="payout-table reveal reveal-delay-1">
          <thead>
            <tr><th>Award</th><th>Payout</th></tr>
          </thead>
          <tbody>
            ${rows || '<tr><td colspan="2">No payouts configured.</td></tr>'}
            <tr class="total-row">
              <td class="award"><div class="award-cell"><span>Total</span></div></td>
              <td class="amount">${money(prizesTotal, currency)}</td>
            </tr>
          </tbody>
        </table>
        <p class="note reveal reveal-delay-2">${esc(p.notes || '')}</p>`;
    }

    async function load() {
      try {
        const res = await fetch('/api/payouts', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        render(data);
        window.GridIronNav?.setSync(data.payouts?.seasonLabel || 'Payouts', true);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }
    load();
  </script>
</body>
</html>
