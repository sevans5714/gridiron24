<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payouts · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=135" />
  <link rel="icon" href="/favicon.ico?v=135" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=135" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=135" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=180" />
  <style>
    body[data-page="payouts"] .page-hero {
      text-align: center;
      align-items: center;
    }
    body[data-page="payouts"] .page-hero::before {
      left: 50%;
      top: 0;
      bottom: auto;
      width: min(12rem, 40%);
      height: 3px;
      transform: translateX(-50%);
    }
    body[data-page="payouts"] .page-hero h1 {
      font-size: clamp(2.4rem, 6vw, 3.6rem);
    }

    .payout-board {
      width: min(52rem, 100%);
      margin: 0 auto;
      text-align: center;
    }

    .pool-line {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      line-height: 1.45;
    }
    .pool-line strong {
      color: var(--text);
      font-weight: 600;
    }

    .payout-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid rgba(34, 197, 94, 0.28);
      background: var(--panel);
      text-align: left;
    }

    .payout-table thead th {
      padding: 1rem 1.35rem;
      text-align: left;
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }
    .payout-table thead th:last-child {
      text-align: right;
    }

    .payout-table tbody tr:nth-child(odd) {
      background: var(--panel);
    }
    .payout-table tbody tr:nth-child(even) {
      background: #171717;
    }
    .payout-table tbody tr:hover {
      background: #1c1c1c;
    }

    .payout-table td {
      padding: 1.15rem 1.35rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .payout-table tr:last-child td {
      border-bottom: 0;
    }

    .payout-table td.award {
      width: 100%;
    }

    .award-cell {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      min-width: 0;
    }

    .award-cell img {
      width: 3.75rem;
      height: 3.75rem;
      object-fit: contain;
      flex: 0 0 3.75rem;
      filter: none;

      box-shadow: var(--logo-lift);
    }

    .award-cell span {
      font-size: clamp(1.1rem, 2.4vw, 1.35rem);
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }

    .payout-table td.amount {
      text-align: right;
      white-space: nowrap;
      font-family: var(--display);
      font-size: clamp(1.55rem, 3.2vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
      padding-left: 1.5rem;
    }

    .payout-table tr.total-row td {
      background: var(--panel-2);
      border-top: 2px solid rgba(255,255,255,0.16);
      font-weight: 700;
    }
    .payout-table tr.total-row .award-cell span {
      color: var(--text);
      font-family: var(--display);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
    }
    .payout-table tr.total-row td.amount {
      color: #efd782;
    }

    @media (max-width: 560px) {
      body[data-page="payouts"] .page-hero h1 {
        font-size: clamp(1.85rem, 9vw, 2.6rem);
      }
      .pool-line {
        font-size: 0.98rem;
      }
      .payout-table thead th,
      .payout-table td {
        padding: 0.85rem 0.85rem;
      }
      .award-cell {
        gap: 0.75rem;
      }
      .award-cell img {
        width: 2.75rem;
        height: 2.75rem;
        flex-basis: 2.75rem;
      }
      .award-cell span {
        font-size: 1rem;
      }
      .payout-table td.amount {
        font-size: 1.35rem;
        padding-left: 0.75rem;
      }
    }
  </style>
</head>
<body data-page="payouts">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <h1>Payout Schedule</h1>
  </section>

  <main class="page-main shell">
    <div id="content"><div class="msg">Loading payouts…</div></div>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=181"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function money(amount, currency = 'USD') {
      if (amount == null || amount === '') return 'TBD';
      try {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency,
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(amount));
      } catch {
        return `$${Number(amount).toFixed(2)}`;
      }
    }

    function prizeLogo(label = '') {
      const l = label.toLowerCase();
      if (l.includes('mayor') || l.includes("mayor's cup") || l.includes('mayors cup') || l.includes('relegation')) {
        return '/assets/mayors-cup.png?v=7';
      }
      if ((l.includes('third') || l.includes('3rd')) && l.includes('detail')) return '/assets/detail-3rd-place.png?v=2';
      if ((l.includes('third') || l.includes('3rd')) && l.includes('overtime')) return '/assets/overtime-3rd-place.png?v=2';
      if (l.includes('third') || l.includes('3rd')) return '/assets/detail-3rd-place.png?v=2';
      if (l.includes('winner') || l.includes('bowl') || (l.includes('gridiron') && !l.includes('conference'))) {
        return '/assets/gridiron-bowl.png?v=7';
      }
      if (l.includes('detail') && (l.includes('championship') || l.includes('2nd') || l.includes('most'))) {
        return '/assets/detail-conference.png';
      }
      if (l.includes('overtime') && (l.includes('championship') || l.includes('2nd') || l.includes('most'))) {
        return '/assets/overtime-conference.png';
      }
      if (l.includes('detail')) return '/assets/detail-conference.png';
      if (l.includes('overtime')) return '/assets/overtime-conference.png';
      return '/assets/gridiron-bowl.png?v=7';
    }

    function render(data) {
      const p = data.payouts || {};
      const currency = p.currency || 'USD';
      const prizes = p.prizes || [];
      const buyIn = money(p.buyInPerTeam, currency);
      const poolAmount = p.buyInPerTeam != null && p.teamCount
        ? Number(p.buyInPerTeam) * Number(p.teamCount)
        : null;
      const pool = poolAmount != null ? money(poolAmount, currency) : 'TBD';
      const prizesTotal = prizes.reduce((sum, prize) => sum + Number(prize.amount || 0), 0);

      const rows = prizes.map((prize) => `
        <tr>
          <td class="award">
            <div class="award-cell">
              <img src="${esc(prizeLogo(prize.label))}" alt="" />
              <span>${esc(prize.label)}</span>
            </div>
          </td>
          <td class="amount">${money(prize.amount, currency)}</td>
        </tr>`).join('');

      document.getElementById('content').innerHTML = `
        <div class="payout-board">
          <p class="pool-line reveal">
            <strong>${buyIn}</strong> buy-in · <strong>${pool}</strong> total prize pool
          </p>
          <div class="table-scroll">
          <table class="payout-table reveal reveal-delay-1">
            <thead>
              <tr><th>Award</th><th>Payout</th></tr>
            </thead>
            <tbody>
              ${rows || '<tr><td colspan="2">No payouts configured.</td></tr>'}
              <tr class="total-row">
                <td class="award"><div class="award-cell"><span>Total</span></div></td>
                <td class="amount">${money(prizesTotal, currency)}</td>
              </tr>
            </tbody>
          </table>
          </div>
        </div>`;
    }

    async function load() {
      try {
        const res = await fetch('/api/payouts', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        render(data);
        window.GridIronNav?.setSync(data.payouts?.seasonLabel || 'Payouts', true);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }
    load();
  </script>
</body>
</html>
