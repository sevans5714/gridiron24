<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>League Payouts · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=4" />
  <style>
    .summary {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .stat {
      position: relative;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 50%),
        var(--panel);
      padding: 1.1rem 1.15rem;
      overflow: hidden;
    }
    .stat.pool {
      border-color: rgba(239, 215, 130, 0.35);
      background:
        radial-gradient(ellipse at 20% 0%, rgba(239, 215, 130, 0.14), transparent 55%),
        linear-gradient(180deg, #18160f, #111111);
    }
    .stat span {
      display: block;
      font-family: var(--display);
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stat strong {
      display: block;
      margin-top: 0.45rem;
      font-family: var(--display);
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }
    .stat.pool strong { color: var(--gold); }

    .ladder {
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
    }
    .ladder-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      padding: 0.75rem 1.15rem;
      border-bottom: 1px solid var(--line);
      background: #0a0a0a;
      font-family: var(--display);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .ladder-head .amt { text-align: right; }

    .prize {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--line);
      transition: background 0.15s ease;
    }
    .prize:last-child { border-bottom: 0; }
    .prize:hover { background: rgba(255,255,255,0.03); }

    .prize.champ {
      background:
        linear-gradient(90deg, rgba(239, 215, 130, 0.12), transparent 55%),
        #14120c;
      border-bottom-color: rgba(239, 215, 130, 0.18);
    }
    .prize.runner {
      background:
        linear-gradient(90deg, rgba(47, 109, 255, 0.1), transparent 50%),
        transparent;
    }
    .prize.detail-tone {
      box-shadow: inset 3px 0 0 var(--detail);
    }
    .prize.overtime-tone {
      box-shadow: inset 3px 0 0 var(--overtime);
    }

    .prize .label {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.01em;
    }

    .prize .amount {
      font-family: var(--display);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: right;
      white-space: nowrap;
    }
    .prize.champ .amount { color: var(--gold); }

    .bar-wrap {
      grid-column: 1 / -1;
      height: 3px;
      background: rgba(255,255,255,0.06);
      margin-top: 0.55rem;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--blue));
      transform-origin: left;
      animation: fill-bar 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .prize.champ .bar { background: var(--gold); }
    .prize.runner .bar { background: var(--blue); }
    .prize.detail-tone .bar { background: var(--detail); }
    .prize.overtime-tone .bar { background: var(--overtime); }

    @keyframes fill-bar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .note {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 48rem;
    }

    @media (max-width: 800px) {
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="payouts">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <p class="eyebrow">Prize Money</p>
    <h1>League Payouts</h1>
    <p>$100 buy-in. $2,400 on the line. Finish matters.</p>
  </section>

  <main class="page-main shell">
    <div id="content"><div class="msg">Loading payouts…</div></div>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function money(amount, currency = 'USD') {
      if (amount == null || amount === '') return 'TBD';
      try {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency,
          maximumFractionDigits: 0
        }).format(Number(amount));
      } catch {
        return `$${amount}`;
      }
    }

    function toneClass(label = '', idx = 0) {
      if (idx === 0) return 'champ';
      if (idx === 1) return 'runner';
      const l = label.toLowerCase();
      if (l.includes('detail')) return 'detail-tone';
      if (l.includes('overtime')) return 'overtime-tone';
      return '';
    }

    function render(data) {
      const p = data.payouts || {};
      const currency = p.currency || 'USD';
      const buyIn = money(p.buyInPerTeam, currency);
      const poolNum = p.buyInPerTeam != null && p.teamCount
        ? Number(p.buyInPerTeam) * Number(p.teamCount)
        : null;
      const pool = poolNum != null ? money(poolNum, currency) : 'TBD';
      const maxAmt = Math.max(1, ...(p.prizes || []).map((x) => Number(x.amount) || 0));

      const rows = (p.prizes || []).map((prize, idx) => {
        const amt = Number(prize.amount) || 0;
        const pct = Math.max(8, Math.round((amt / maxAmt) * 100));
        const tone = toneClass(prize.label, idx);
        return `
          <div class="prize ${tone} reveal reveal-delay-${Math.min(idx + 1, 4)}">
            <div class="place">${esc(prize.place ?? idx + 1)}</div>
            <div class="label">${esc(prize.label)}</div>
            <div class="amount">${money(prize.amount, currency)}</div>
            <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
          </div>`;
      }).join('');

      document.getElementById('content').innerHTML = `
        <div class="summary reveal">
          <div class="stat pool"><span>Total Prize Pool</span><strong>${pool}</strong></div>
          <div class="stat"><span>Buy-In / Team</span><strong>${buyIn}</strong></div>
          <div class="stat"><span>Season</span><strong>${esc(p.seasonLabel || data.season)}</strong></div>
        </div>
        <div class="ladder reveal reveal-delay-1">
          <div class="ladder-head"><span>#</span><span>Award</span><span class="amt">Payout</span></div>
          ${rows || '<div class="msg">No payouts configured.</div>'}
        </div>
        <p class="note reveal reveal-delay-2">${esc(p.notes || '')}</p>`;
    }

    async function load() {
      try {
        const res = await fetch('/api/payouts', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        render(data);
        window.GridIronNav?.setSync(data.payouts?.seasonLabel || 'Payouts', true);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }
    load();
  </script>
</body>
</html>
