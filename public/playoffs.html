<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playoff Bracket · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=137" />
  <style>
    .tree {
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .trees-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: stretch;
    }

    .conf-tree {
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 35%),
        var(--panel);
      overflow: hidden;
      min-width: 0;
    }

    .conf-tree.detail {
      border-top: 3px solid var(--detail);
      box-shadow: inset 0 0 60px rgba(255, 122, 24, 0.05);
    }
    .conf-tree.overtime {
      border-top: 3px solid var(--overtime);
      box-shadow: inset 0 0 60px rgba(226, 35, 42, 0.05);
    }

    .conf-head {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
      font-family: var(--display);
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-weight: 600;
      line-height: 1.2;
    }
    .conf-tree.detail .conf-head { color: var(--detail); }
    .conf-tree.overtime .conf-head { color: var(--overtime); }
    .conf-head img {
      width: clamp(4.5rem, 12vw, 6rem);
      height: auto;
      filter: none;

      box-shadow: var(--logo-lift);
    }
    .conf-head .wk {
      margin-left: auto;
      color: var(--muted);
      font-family: var(--body);
      font-size: var(--fs-xs);
      letter-spacing: 0.02em;
      font-weight: 500;
      text-transform: none;
      white-space: nowrap;
    }

    .rounds {
      display: grid;
      grid-template-columns: 1.15fr 1fr 0.95fr;
      gap: 0;
      padding: 1.35rem 0.55rem 1.2rem;
      min-height: 30rem;
    }

    /* Mirror Overtime so it feeds the Bowl from the right */
    .conf-tree.overtime .rounds {
      direction: rtl;
    }
    .conf-tree.overtime .round-col {
      direction: ltr;
    }

    .round-col {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 0.65rem;
      padding: 0 0.4rem;
      position: relative;
    }

    .round-col + .round-col {
      border-left: 1px dashed rgba(255,255,255,0.08);
    }
    .conf-tree.overtime .round-col + .round-col {
      border-left: 0;
      border-right: 1px dashed rgba(255,255,255,0.08);
    }

    .round-label {
      position: absolute;
      top: -0.2rem;
      left: 0.35rem;
      right: 0.35rem;
      text-align: center;
      font-family: var(--body);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.25;
    }

    .slot {
      border: 1px solid var(--line);
      background:
        linear-gradient(165deg, rgba(255,255,255,0.05), transparent 42%),
        linear-gradient(180deg, var(--panel-2), var(--panel));
      padding: 0.45rem 0.5rem;
      position: relative;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .slot:hover {
      border-color: var(--chip-border-active);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }
    .slot.is-live {
      border-color: rgba(61, 220, 132, 0.4);
      box-shadow: 0 0 0 1px rgba(61, 220, 132, 0.12), 0 0 22px rgba(61, 220, 132, 0.1);
    }
    .slot.is-final {
      border-color: rgba(255, 255, 255, 0.16);
    }

    .slot.bye {
      border-style: dashed;
      opacity: 0.88;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 60%),
        transparent;
    }

    .slot.title-slot,
    .slot.third-slot {
      border: 0;
      background: transparent;
      padding: 0.25rem 0.15rem;
      text-align: center;
      box-shadow: none;
    }
    .slot.title-slot:hover,
    .slot.third-slot:hover {
      box-shadow: none;
      border-color: transparent;
    }

    .trophy-mark {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 0.45rem;
      padding: 0;
      width: 100%;
      max-width: 10.5rem;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .slot.third-slot .trophy-mark {
      max-width: 9rem;
      background: transparent;
    }
    .conf-tree.detail .slot.title-slot .trophy-mark,
    .conf-tree.overtime .slot.title-slot .trophy-mark {
      background: transparent;
    }
    .trophy-mark img {
      width: 100%;
      height: auto;
      display: block;
      background: transparent;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.5));
    }

    .slot.title-slot .sr-only,
    .slot.third-slot .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .round-col.finale-col {
      justify-content: center;
      gap: 1.1rem;
    }

    .slot.winner-line::after {
      content: "";
      position: absolute;
      right: -0.55rem;
      top: 50%;
      width: 0.55rem;
      height: 1px;
      background: rgba(255,255,255,0.28);
    }
    .conf-tree.overtime .slot.winner-line::after {
      right: auto;
      left: -0.55rem;
    }

    /* Matchup rows inside bracket slots */
    .mu {
      display: grid;
      gap: 0.2rem;
    }
    .mu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-bottom: 0.15rem;
      padding: 0 0.1rem;
    }
    .mu-label {
      font-family: var(--body);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.2;
    }
    .mu-status {
      font-family: var(--body);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1;
    }
    .mu-status.is-live {
      color: #3ddc84;
      text-shadow: 0 0 10px rgba(61, 220, 132, 0.35);
    }
    .mu-status.is-final { color: var(--text); opacity: 0.72; }

    .mu-row {
      display: grid;
      grid-template-columns: 1.35rem 1.7rem minmax(0, 1fr) auto;
      gap: 0.4rem;
      align-items: center;
      min-height: 2.05rem;
      padding: 0.28rem 0.35rem;
      border-radius: 0.35rem;
      background: color-mix(in srgb, var(--panel-2) 88%, transparent);
    }
    .mu-row.is-winner {
      background: linear-gradient(90deg, rgba(61, 220, 132, 0.16), rgba(61, 220, 132, 0.04));
      box-shadow: inset 2px 0 0 #3ddc84;
    }
    .mu-row.is-loser {
      opacity: 0.48;
    }
    .mu-row.is-bye {
      background: color-mix(in srgb, var(--panel) 70%, transparent);
    }

    .mu-seed {
      font-family: var(--display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-align: center;
      line-height: 1;
    }
    .mu-row.is-winner .mu-seed { color: var(--text); }

    .mu-logo {
      width: 1.7rem;
      height: 1.7rem;
      object-fit: cover;
      object-position: center;
      background: transparent;
      border-radius: 50%;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.28));
      mix-blend-mode: lighten;
    }

    .mu-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--body);
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.2;
      color: var(--text);
    }

    .mu-score {
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
      min-width: 2.4rem;
      text-align: right;
    }
    .mu-score.is-empty { color: var(--muted); font-size: 0.8rem; }

    .mu-await {
      padding: 0.55rem 0.4rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.35;
    }
    .mu-await strong {
      display: block;
      margin-bottom: 0.15rem;
      font-family: var(--display);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
    }

    .mid {
      display: grid;
      grid-template-columns: 1fr;
      width: 100%;
      max-width: min(68rem, 100%);
      margin: 1.25rem auto 0;
      gap: 0.85rem;
    }
    .finale-stage-label {
      margin: 0;
      text-align: center;
      font-family: var(--display);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .finale-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
      align-items: stretch;
    }

    .bowl {
      position: relative;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
      padding: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: visible;
      box-shadow: none;
    }
    .bowl .eyebrow { display: none; }

    .bowl-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.85rem 1rem;
      align-items: center;
      padding: 0.35rem 0.15rem 0.55rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
    }
    .bowl-mark {
      width: clamp(5.5rem, 14vw, 7.5rem);
      margin: 0;
      padding: 0;
      background: transparent;
      flex: 0 0 auto;
    }
    .bowl-mark img {
      width: 100%;
      height: auto;
      max-height: 6.5rem;
      object-fit: contain;
      object-position: center;
      display: block;
      background: transparent;
      filter: drop-shadow(0 10px 24px rgba(20, 80, 200, 0.4));
    }
    .bowl-head-copy { min-width: 0; }
    .bowl-kicker {
      margin: 0 0 0.15rem;
      font-family: var(--body);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8eb6ff;
    }
    .bowl-head-copy h3 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.35rem, 2.4vw, 1.75rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.05;
      color: var(--text);
    }
    .bowl-head-copy p.bowl-sub {
      margin: 0.28rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .bowl-scoreboard {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 1rem 0.9rem 1.05rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 0.65rem 0.85rem;
      align-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      flex: 1 1 auto;
    }
    .bowl-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
      padding: 0.55rem 0.4rem;
      border-radius: 0.2rem;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .bowl-side.is-lead {
      background: rgba(47, 109, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(47, 109, 255, 0.32);
    }
    .bowl-side .conf-chip {
      font-family: var(--body);
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
      padding: 0.22rem 0.45rem;
      border: 1px solid transparent;
    }
    .bowl-side.detail .conf-chip {
      color: var(--detail);
      border-color: rgba(255, 122, 24, 0.35);
      background: rgba(255, 122, 24, 0.1);
    }
    .bowl-side.overtime .conf-chip {
      color: var(--overtime);
      border-color: rgba(226, 35, 42, 0.35);
      background: rgba(226, 35, 42, 0.1);
    }
    .bowl-side img,
    .bowl-side img.bowl-logo {
      width: 3.1rem;
      height: 3.1rem;
      object-fit: cover;
      object-position: center;
      flex: 0 0 auto;
      background: transparent;
      border-radius: 50%;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.28));
      mix-blend-mode: lighten;
    }
    .bowl-side .nm {
      font-family: var(--display);
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
      color: var(--text);
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: anywhere;
      display: block;
      text-align: center;
    }
    .bowl-side.detail .nm { color: var(--detail); }
    .bowl-side.overtime .nm { color: var(--overtime); }
    .bowl-side.is-lead .nm {
      text-shadow: 0 0 14px rgba(47, 109, 255, 0.4);
    }
    .bowl-side .pts {
      font-family: var(--display);
      font-size: clamp(1.55rem, 2.8vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
      min-height: 1.1em;
    }
    .bowl-side .pts:empty::before {
      content: "—";
      color: var(--muted);
      font-size: 0.85em;
    }
    .bowl-mid {
      text-align: center;
      font-family: var(--display);
      min-width: 3.5rem;
      padding: 0 0.1rem;
    }
    .bowl-mid .vs {
      font-size: clamp(1.05rem, 1.8vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8eb6ff;
      line-height: 1;
    }
    .bowl-mid .bowl-score { display: none; }
    .bowl.survival {
      border: 0;
      background: transparent;
    }
    .bowl.survival .bowl-kicker { color: #9ec4ff; }
    .bowl.survival .bowl-mid .vs { color: #9ec4ff; }
    .bowl.survival .bowl-side.is-lead {
      background: rgba(80, 160, 255, 0.1);
      box-shadow: inset 0 0 0 1px rgba(80, 160, 255, 0.28);
    }

    html[data-theme="day"] .slot {
      background:
        linear-gradient(165deg, rgba(255,255,255,0.65), transparent 42%),
        linear-gradient(180deg, var(--panel-2), var(--panel));
    }
    html[data-theme="day"] .mu-row {
      background: rgba(20, 28, 40, 0.04);
    }
    html[data-theme="day"] .mu-row.is-winner {
      background: linear-gradient(90deg, rgba(22, 163, 74, 0.14), rgba(22, 163, 74, 0.03));
      box-shadow: inset 2px 0 0 #16a34a;
    }
    html[data-theme="day"] .mu-logo,
    html[data-theme="day"] .bowl-side img,
    html[data-theme="day"] .bowl-side img.bowl-logo {
      mix-blend-mode: normal;
      background: transparent;
      filter: drop-shadow(0 2px 6px rgba(20, 28, 40, 0.14));
    }
    html[data-theme="day"] .mu-status.is-live { color: #15803d; text-shadow: none; }
    html[data-theme="day"] .bowl,
    html[data-theme="day"] .bowl.survival {
      background: transparent;
      box-shadow: none;
    }
    html[data-theme="day"] .bowl-head {
      background: transparent;
      border-bottom-color: rgba(20, 28, 40, 0.1);
    }
    html[data-theme="day"] .finale-stage-label { color: #5a6a80; }
    html[data-theme="day"] .bowl-kicker { color: #2f6dff; }
    html[data-theme="day"] .bowl-mid .vs { color: #2f6dff; }
    html[data-theme="day"] .bowl-scoreboard {
      border-color: transparent;
      background: transparent;
    }
    html[data-theme="day"] .trophy-mark {
      background: transparent;
    }
    html[data-theme="day"] .bowl-mark {
      background: transparent;
    }

    @media (max-width: 1100px) {
      .rounds { grid-template-columns: 1fr; min-height: 0; }
      .conf-tree.overtime .rounds {
        direction: ltr;
        grid-template-columns: 1fr;
      }
      .conf-tree.overtime .round-col + .round-col {
        border-right: 0;
      }
      .round-col {
        border-left: 0 !important;
        border-top: 1px dashed rgba(255,255,255,0.08);
        padding-top: 1.5rem;
      }
      .round-col:first-child { border-top: 0; }
      .slot.winner-line::after { display: none; }
      .trees-row { grid-template-columns: 1fr; }
      .finale-grid { grid-template-columns: 1fr; }
      .bowl-scoreboard {
        grid-template-columns: 1fr;
        gap: 0.55rem;
      }
      .bowl-mid { order: 0; padding: 0.15rem 0; }
      .bowl-side.detail { order: -1; }
      .bowl-side.overtime { order: 1; }
      .bowl-side {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "chip chip chip"
          "logo name pts";
        align-items: center;
        justify-items: start;
        text-align: left;
        gap: 0.25rem 0.75rem;
        width: 100%;
      }
      .bowl-side .conf-chip { grid-area: chip; justify-self: start; }
      .bowl-side img.bowl-logo { grid-area: logo; width: 2.5rem; height: 2.5rem; }
      .bowl-side .nm { grid-area: name; text-align: left; }
      .bowl-side .pts { grid-area: pts; justify-self: end; }
    }
  </style>
</head>
<body data-page="playoffs">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated"><span class="live">●</span>2026 format</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <h1>Playoff Bracket</h1>
  </section>

  <main class="page-main shell">
    <div class="tree" id="live-tree">
      <div class="msg" style="grid-column:1/-1;">Loading live bracket…</div>
    </div>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=1" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=96"></script>
  <script>
    const PLACEHOLDER = '/assets/team-logo-placeholder.svg';
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function fmt(n) {
      if (n == null || Number.isNaN(Number(n))) return '—';
      return Number(n).toFixed(1);
    }

    function seedName(s) {
      if (!s) return 'TBD';
      return s.provisional ? `${s.name}` : s.name;
    }

    function statusLabel(status) {
      if (status === 'final') return 'Final';
      if (status === 'live') return 'Live';
      return 'Upcoming';
    }

    function teamRow(side, opts = {}) {
      const winner = opts.winner;
      const decided = winner === 'HOME' || winner === 'AWAY';
      const isAway = opts.role === 'away';
      const isWinner = decided && ((isAway && winner === 'AWAY') || (!isAway && winner === 'HOME'));
      const isLoser = decided && !isWinner;
      const seed = side?.seed || opts.seed || null;
      const score = side?.score;
      const hasScore = score != null && !(Number(score) === 0 && opts.status === 'upcoming');
      const cls = [
        'mu-row',
        opts.bye ? 'is-bye' : '',
        isWinner ? 'is-winner' : '',
        isLoser ? 'is-loser' : ''
      ].filter(Boolean).join(' ');
      return `
        <div class="${cls}">
          <span class="mu-seed">${seed ? `#${esc(seed)}` : '·'}</span>
          <img class="mu-logo" src="${esc(side?.logo || PLACEHOLDER)}" alt="" loading="lazy" referrerpolicy="no-referrer" />
          <span class="mu-name">${esc(side?.name || opts.fallbackName || 'TBD')}</span>
          <span class="mu-score${hasScore ? '' : ' is-empty'}">${hasScore ? fmt(score) : '—'}</span>
        </div>`;
    }

    function gameSlot(game, fallback) {
      if (!game?.home && !game?.away) {
        return `
          <div class="slot winner-line">
            <div class="mu">
              <div class="mu-await"><strong>${esc(fallback)}</strong>Awaiting matchup</div>
            </div>
          </div>`;
      }
      const status = game.status || 'upcoming';
      const slotCls = [
        'slot',
        'winner-line',
        status === 'live' ? 'is-live' : '',
        status === 'final' ? 'is-final' : ''
      ].filter(Boolean).join(' ');
      return `
        <div class="${slotCls}">
          <div class="mu">
            <div class="mu-head">
              <span class="mu-label">${esc(game.label || fallback)}</span>
              <span class="mu-status ${status === 'live' ? 'is-live' : status === 'final' ? 'is-final' : ''}">${esc(statusLabel(status))}</span>
            </div>
            ${teamRow(game.away, { role: 'away', winner: game.winner, status })}
            ${teamRow(game.home, { role: 'home', winner: game.winner, status })}
          </div>
        </div>`;
    }

    function byeSlot(seed) {
      return `
        <div class="slot bye">
          <div class="mu">
            <div class="mu-head">
              <span class="mu-label">Bye</span>
              <span class="mu-status">Week 14</span>
            </div>
            ${teamRow(seed, { bye: true, seed: seed?.seed, fallbackName: seedName(seed), status: 'upcoming' })}
          </div>
        </div>`;
    }

    function trophyGame(game, imgSrc, alt, slotClass) {
      const hasTeams = Boolean(game?.home || game?.away);
      const status = game?.status || 'upcoming';
      return `
        <div class="slot ${slotClass}">
          <div class="trophy-mark">
            <img src="${esc(imgSrc)}" alt="${esc(alt)}" />
          </div>
          <span class="sr-only">${esc(alt)}</span>
          ${hasTeams ? `
            <div class="mu">
              <div class="mu-head">
                <span class="mu-label">${esc(game.label || alt)}</span>
                <span class="mu-status ${status === 'live' ? 'is-live' : status === 'final' ? 'is-final' : ''}">${esc(statusLabel(status))}</span>
              </div>
              ${teamRow(game.away, { role: 'away', winner: game.winner, status })}
              ${teamRow(game.home, { role: 'home', winner: game.winner, status })}
            </div>` : ''}
        </div>`;
    }

    function confTree(conf) {
      const tone = conf.key === 'overtime' ? 'overtime' : 'detail';
      const titleImg = tone === 'detail' ? '/assets/detail-conf-champ.png?v=2' : '/assets/overtime-conf-champ.png?v=2';
      const thirdImg = tone === 'detail' ? '/assets/detail-3rd-place.png?v=2' : '/assets/overtime-3rd-place.png?v=2';
      const wc = conf.rounds?.wildCard || {};
      const semis = conf.rounds?.semifinals?.games || [];
      const finals = conf.rounds?.finals || {};
      return `
        <section class="conf-tree ${tone}">
          <div class="conf-head">
            ${conf.logo ? `<span class="conf-mark"><img src="${esc(conf.logo)}" alt="" /></span>` : ''}
            ${esc(conf.name)}
            <span class="wk">Weeks 14–16</span>
          </div>
          <div class="rounds">
            <div class="round-col">
              <div class="round-label">Week 14 · Wild Card</div>
              ${byeSlot(wc.bye1)}
              ${gameSlot(wc.game45, '#4 vs #5')}
              ${gameSlot(wc.game36, '#3 vs #6')}
              ${byeSlot(wc.bye2)}
            </div>
            <div class="round-col">
              <div class="round-label">Week 15 · Semifinals</div>
              ${gameSlot(semis[0], '#1 vs Lower Seed')}
              ${gameSlot(semis[1], '#2 vs Highest Seed')}
            </div>
            <div class="round-col finale-col">
              <div class="round-label">Week 16 · Title + 3rd</div>
              ${trophyGame(finals.title, titleImg, `${conf.shortName || conf.name} Championship`, 'title-slot')}
              ${trophyGame(finals.third, thirdImg, `${conf.shortName || conf.name} 3rd Place`, 'third-slot')}
            </div>
          </div>
        </section>`;
    }

    function bowlBlock() {
      return `
        <div class="mid" aria-label="Week 17 championship stage">
          <p class="finale-stage-label">Week 17 · Championship Stage</p>
          <div class="finale-grid">
            <div class="bowl" id="bowl-card">
              <header class="bowl-head">
                <div class="bowl-mark">
                  <img src="/assets/gridiron-bowl.png?v=7" alt="" width="1024" height="682" />
                </div>
                <div class="bowl-head-copy">
                  <p class="bowl-kicker">Title game</p>
                  <h3>GridIron Bowl</h3>
                  <p class="bowl-sub">Conference champions · Week 17</p>
                </div>
              </header>
              <div class="bowl-scoreboard" id="bowl-scoreboard">
                <div class="bowl-side detail">
                  <span class="conf-chip">Detail</span>
                  <img class="bowl-logo" id="bowl-detail-logo" src="/assets/team-logo-placeholder.svg" alt="" />
                  <div class="nm" id="bowl-detail-name">Detail Champion</div>
                  <div class="pts" id="bowl-detail-pts"></div>
                </div>
                <div class="bowl-mid">
                  <div class="vs" id="bowl-vs">VS</div>
                  <div class="bowl-score" id="bowl-scoreline"></div>
                </div>
                <div class="bowl-side overtime">
                  <span class="conf-chip">Overtime</span>
                  <img class="bowl-logo" id="bowl-overtime-logo" src="/assets/team-logo-placeholder.svg" alt="" />
                  <div class="nm" id="bowl-overtime-name">Overtime Champion</div>
                  <div class="pts" id="bowl-overtime-pts"></div>
                </div>
              </div>
            </div>
            <div class="bowl survival" id="survival-card">
              <header class="bowl-head">
                <div class="bowl-mark">
                  <img src="/assets/mayors-cup.png?v=7" alt="" width="1024" height="768" />
                </div>
                <div class="bowl-head-copy">
                  <p class="bowl-kicker">Relegation</p>
                  <h3>Mayor's Cup</h3>
                  <p class="bowl-sub">Last place · winner stays</p>
                </div>
              </header>
              <div class="bowl-scoreboard" id="survival-scoreboard" data-week-label="Week 17 · Mayor's Cup">
                <div class="bowl-side detail">
                  <span class="conf-chip">Detail</span>
                  <img class="bowl-logo" id="survival-detail-logo" src="/assets/team-logo-placeholder.svg" alt="" />
                  <div class="nm" id="survival-detail-name">Detail Last Place</div>
                  <div class="pts" id="survival-detail-pts"></div>
                </div>
                <div class="bowl-mid">
                  <div class="vs" id="survival-vs">VS</div>
                  <div class="bowl-score" id="survival-scoreline"></div>
                </div>
                <div class="bowl-side overtime">
                  <span class="conf-chip">Overtime</span>
                  <img class="bowl-logo" id="survival-overtime-logo" src="/assets/team-logo-placeholder.svg" alt="" />
                  <div class="nm" id="survival-overtime-name">Overtime Last Place</div>
                  <div class="pts" id="survival-overtime-pts"></div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function fillChampSide(prefix, side, isLead) {
      const nameEl = document.getElementById(`bowl-${prefix}-name`);
      if (!nameEl) return;
      const wrap = nameEl.closest('.bowl-side');
      wrap.classList.toggle('is-lead', Boolean(isLead));
      nameEl.textContent = side?.champion?.name
        || (prefix === 'detail' ? 'Detail Champion' : 'Overtime Champion');
      const img = document.getElementById(`bowl-${prefix}-logo`) || wrap.querySelector('img.bowl-logo');
      if (img) img.src = side?.champion?.logo || PLACEHOLDER;
      const pts = document.getElementById(`bowl-${prefix}-pts`);
      if (pts) pts.textContent = side?.score != null ? fmt(side.score) : '';
    }

    function fillSurvivalSide(prefix, side, isLead) {
      const nameEl = document.getElementById(`survival-${prefix}-name`);
      if (!nameEl) return;
      const wrap = nameEl.closest('.bowl-side');
      wrap.classList.toggle('is-lead', Boolean(isLead));
      nameEl.textContent = side?.team?.name
        || (prefix === 'detail' ? 'Detail Last Place' : 'Overtime Last Place');
      const img = document.getElementById(`survival-${prefix}-logo`) || wrap.querySelector('img.bowl-logo');
      if (img) img.src = side?.team?.logo || PLACEHOLDER;
      const pts = document.getElementById(`survival-${prefix}-pts`);
      if (pts) pts.textContent = side?.score != null ? fmt(side.score) : '';
    }

    function applyBowl(data) {
      if (!data) return;
      fillChampSide('detail', data.detail, data.leader === 'detail' || data.leader === 'tie');
      fillChampSide('overtime', data.overtime, data.leader === 'overtime' || data.leader === 'tie');
    }

    function applySurvival(data) {
      const card = document.getElementById('survival-card');
      if (!data || data.enabled === false) {
        if (card) card.hidden = true;
        return;
      }
      if (card) card.hidden = false;
      const logo = card.querySelector('.bowl-mark img');
      if (logo && data.name) logo.alt = data.name;
      const title = card.querySelector('.bowl-head-copy h3');
      if (title && data.name) title.textContent = data.name;
      fillSurvivalSide('detail', data.detail, data.leader === 'detail' || data.leader === 'tie');
      fillSurvivalSide('overtime', data.overtime, data.leader === 'overtime' || data.leader === 'tie');
    }

    async function loadPlayoffs() {
      try {
        const res = await fetch('/api/playoffs', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        const detail = (data.conferences || []).find((c) => c.key === 'detail');
        const overtime = (data.conferences || []).find((c) => c.key === 'overtime');
        document.getElementById('live-tree').innerHTML = `
          <div class="trees-row">
            ${confTree(detail || { key: 'detail', name: 'Detail Conference', rounds: {} })}
            ${confTree(overtime || { key: 'overtime', name: 'Overtime Conference', rounds: {} })}
          </div>
          ${bowlBlock()}`;
        applyBowl(data.bowl);
        applySurvival(data.survival);
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`Bracket sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('live-tree').innerHTML = `<div class="msg" style="grid-column:1/-1;">${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Bracket sync error', false);
      }
    }

    loadPlayoffs();
    setInterval(loadPlayoffs, 30_000);
  </script>
</body>
</html>
