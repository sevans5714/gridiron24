<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playoffs · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=61" />
  <style>
    .tree {
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .trees-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: stretch;
    }

    .conf-tree {
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 35%),
        var(--panel);
      overflow: hidden;
      min-width: 0;
    }

    .conf-tree.detail {
      border-top: 3px solid var(--detail);
      box-shadow: inset 0 0 60px rgba(255, 122, 24, 0.05);
    }
    .conf-tree.overtime {
      border-top: 3px solid var(--overtime);
      box-shadow: inset 0 0 60px rgba(226, 35, 42, 0.05);
    }

    .conf-head {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
      font-family: var(--display);
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-weight: 600;
      line-height: 1.2;
    }
    .conf-tree.detail .conf-head { color: var(--detail); }
    .conf-tree.overtime .conf-head { color: var(--overtime); }
    .conf-head img {
      width: 3rem;
      height: auto;
      filter: none;

      box-shadow: var(--logo-lift);
    }
    .conf-head .wk {
      margin-left: auto;
      color: var(--muted);
      font-family: var(--body);
      font-size: var(--fs-xs);
      letter-spacing: 0.02em;
      font-weight: 500;
      text-transform: none;
      white-space: nowrap;
    }

    .rounds {
      display: grid;
      grid-template-columns: 1.1fr 1fr 0.9fr;
      gap: 0;
      padding: 1.1rem 0.55rem 1.15rem;
      min-height: 28rem;
    }

    /* Mirror Overtime so it feeds the Bowl from the right */
    .conf-tree.overtime .rounds {
      direction: rtl;
    }
    .conf-tree.overtime .round-col {
      direction: ltr;
    }

    .round-col {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 0.75rem;
      padding: 0 0.4rem;
      position: relative;
    }

    .round-col + .round-col {
      border-left: 1px dashed rgba(255,255,255,0.08);
    }
    .conf-tree.overtime .round-col + .round-col {
      border-left: 0;
      border-right: 1px dashed rgba(255,255,255,0.08);
    }

    .round-label {
      position: absolute;
      top: -0.15rem;
      left: 0.35rem;
      right: 0.35rem;
      text-align: center;
      font-family: var(--body);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.25;
    }

    .slot {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      padding: 0.65rem 0.7rem;
      position: relative;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .slot:hover {
      border-color: var(--chip-border-active);
      transform: translateX(2px);
    }
    .conf-tree.overtime .slot:hover { transform: translateX(-2px); }

    .slot.bye {
      border-style: dashed;
      opacity: 0.78;
      background: transparent;
    }

    .slot.title-slot {
      border: 0;
      background: transparent;
      padding: 0.35rem 0.25rem;
      text-align: center;
      box-shadow: none;
    }
    .conf-tree.detail .slot.title-slot,
    .conf-tree.overtime .slot.title-slot {
      border-color: transparent;
      box-shadow: none;
    }
    .slot.title-slot img {
      width: min(100%, 9.5rem);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: none;

      box-shadow: var(--logo-lift);
    }
    .slot.title-slot .sr-only,
    .slot.third-slot .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .slot.third-slot {
      border: 0;
      background: transparent;
      padding: 0.35rem 0.25rem;
      text-align: center;
      box-shadow: none;
    }
    .slot.third-slot img {
      width: min(100%, 8.55rem);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: none;

      box-shadow: var(--logo-lift);
    }

    .round-col.finale-col {
      justify-content: center;
      gap: 1rem;
    }

    .slot .seed {
      font-family: var(--display);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      line-height: 1.25;
    }

    .slot .sub {
      margin-top: 0.2rem;
      color: var(--muted);
      font-family: var(--body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.3;
      text-transform: none;
    }

    .slot.winner-line::after {
      content: "";
      position: absolute;
      right: -0.55rem;
      top: 50%;
      width: 0.55rem;
      height: 1px;
      background: rgba(255,255,255,0.28);
    }
    .conf-tree.overtime .slot.winner-line::after {
      right: auto;
      left: -0.55rem;
    }

    .mid {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 48rem;
      margin: 0 auto;
    }

    .bowl {
      position: relative;
      border: 1px solid rgba(47, 109, 255, 0.45);
      background:
        radial-gradient(ellipse at 50% 40%, rgba(47,109,255,0.22), transparent 65%),
        linear-gradient(180deg, var(--panel-2), var(--panel));
      text-align: center;
      padding: 1.35rem 1.35rem 1.5rem;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: visible;
      animation: bowl-glow 3.5s ease-in-out infinite;
    }

    @keyframes bowl-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(47,109,255,0.15), inset 0 0 40px rgba(47,109,255,0.08); }
      50% { box-shadow: 0 0 28px 0 rgba(47,109,255,0.28), inset 0 0 50px rgba(47,109,255,0.14); }
    }

    .bowl .eyebrow {
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    .bowl > img {
      width: min(100%, 14rem);
      height: auto;
      display: block;
      filter: none;

      box-shadow: var(--logo-lift);
    }

    .bowl-scoreboard {
      width: 100%;
      margin-top: 1.15rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 1rem 1.5rem;
      align-items: center;
    }
    .bowl-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      padding: 0.25rem;
    }
    .bowl-side img,
    .bowl-side img.bowl-logo {
      width: 5.25rem;
      height: 5.25rem;
      object-fit: contain;
      flex: 0 0 auto;
      filter: none;

      box-shadow: var(--logo-lift);
    }
    .bowl-side .nm {
      font-family: var(--display);
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.25;
      color: var(--text);
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: anywhere;
      display: block;
      overflow: visible;
    }
    .bowl-side.detail .nm { color: var(--detail); }
    .bowl-side.overtime .nm { color: var(--overtime); }
    .bowl-side.is-lead .nm {
      text-shadow: 0 0 12px rgba(47, 109, 255, 0.45);
    }
    .bowl-mid {
      text-align: center;
      font-family: var(--display);
      min-width: 5.5rem;
      padding: 0 0.25rem;
    }
    .bowl-mid .vs {
      font-size: clamp(1.4rem, 2.4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1;
    }

    .third-place {
      border: 1px solid rgba(239, 215, 130, 0.35);
      background:
        radial-gradient(ellipse at 50% 30%, rgba(239,215,130,0.12), transparent 70%),
        linear-gradient(180deg, #14110a, #0a0906);
      text-align: center;
      padding: 0.95rem 0.75rem 1.05rem;
    }
    .third-place .eyebrow {
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    .third-place h3 {
      margin: 0 0 0.55rem;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #efd782;
    }
    .third-place .vs {
      font-family: var(--display);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.4;
    }
    .third-place .vs .d { color: var(--detail); }
    .third-place .vs .o { color: var(--overtime); }
    .third-place .vs .mid-vs {
      display: block;
      margin: 0.15rem 0;
      color: var(--muted);
      font-family: var(--body);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .third-place .prize {
      margin-top: 0.55rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      line-height: 1.35;
    }
    .third-place .prize strong { color: #efd782; font-weight: 700; }

    .notes {
      margin-top: 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .note {
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%),
        var(--panel);
      padding: 1.1rem 1.15rem;
    }

    .note h3 {
      margin: 0 0 0.45rem;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .note p {
      margin: 0;
      color: var(--muted);
      font-size: var(--fs-sm);
      font-weight: 400;
      line-height: 1.55;
    }

    @media (max-width: 1100px) {
      .rounds { grid-template-columns: 1fr; min-height: 0; }
      .conf-tree.overtime .rounds {
        direction: ltr;
        grid-template-columns: 1fr;
      }
      .conf-tree.overtime .round-col + .round-col {
        border-right: 0;
      }
      .round-col {
        border-left: 0 !important;
        border-top: 1px dashed rgba(255,255,255,0.08);
        padding-top: 1.5rem;
      }
      .round-col:first-child { border-top: 0; }
      .slot.winner-line::after { display: none; }
      .slot:hover, .conf-tree.overtime .slot:hover { transform: none; }
    }

    @media (max-width: 900px) {
      .trees-row { grid-template-columns: 1fr; }
      .bowl-scoreboard {
        grid-template-columns: 1fr;
        gap: 0.85rem;
      }
      .bowl-mid { order: 0; }
      .bowl-side.detail { order: -1; }
      .bowl-side.overtime { order: 1; }
      .notes { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="playoffs">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated"><span class="live">●</span>2026 format</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <h1>Playoffs</h1>
  </section>

  <main class="page-main shell">
    <div class="tree" id="live-tree">
      <div class="msg" style="grid-column:1/-1;">Loading live bracket…</div>
    </div>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-brand">GridIron 24</span> created by S.Evans</span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=36"></script>
  <script>
    const PLACEHOLDER = '/assets/team-logo-placeholder.svg';
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function fmt(n) {
      if (n == null || Number.isNaN(Number(n))) return '—';
      return Number(n).toFixed(1);
    }

    function seedName(s) {
      if (!s) return 'TBD';
      return s.provisional ? `${s.name}` : s.name;
    }

    function gameSlot(game, fallback) {
      if (!game?.home && !game?.away) {
        return `<div class="slot winner-line"><div class="seed">${esc(fallback)}</div><div class="sub">Awaiting matchup</div></div>`;
      }
      const status = game.status === 'final' ? 'Final' : game.status === 'live' ? 'Live' : 'Upcoming';
      const line = `${esc(game.away?.name || 'TBD')} ${fmt(game.away?.score)} – ${fmt(game.home?.score)} ${esc(game.home?.name || 'TBD')}`;
      return `<div class="slot winner-line"><div class="seed">${line}</div><div class="sub">${status}</div></div>`;
    }

    function byeSlot(seed) {
      return `<div class="slot bye"><div class="seed">${esc(seedName(seed))}</div><div class="sub">#${esc(seed?.seed || '—')} Bye</div></div>`;
    }

    function confTree(conf) {
      const tone = conf.key === 'overtime' ? 'overtime' : 'detail';
      const titleImg = tone === 'detail' ? '/assets/detail-conf-champ.png' : '/assets/overtime-conf-champ.png';
      const thirdImg = tone === 'detail' ? '/assets/detail-3rd-place.png' : '/assets/overtime-3rd-place.png';
      const wc = conf.rounds?.wildCard || {};
      const semis = conf.rounds?.semifinals?.games || [];
      const finals = conf.rounds?.finals || {};
      return `
        <section class="conf-tree ${tone}">
          <div class="conf-head">
            ${conf.logo ? `<img src="${esc(conf.logo)}" alt="" />` : ''}
            ${esc(conf.name)}
            <span class="wk">Weeks 14–16</span>
          </div>
          <div class="rounds">
            <div class="round-col">
              <div class="round-label">Week 14 · Wild Card</div>
              ${byeSlot(wc.bye1)}
              ${gameSlot(wc.game45, '#4 vs #5')}
              ${gameSlot(wc.game36, '#3 vs #6')}
              ${byeSlot(wc.bye2)}
            </div>
            <div class="round-col">
              <div class="round-label">Week 15 · Semifinals</div>
              ${gameSlot(semis[0], '#1 vs Lower Seed')}
              ${gameSlot(semis[1], '#2 vs Highest Seed')}
            </div>
            <div class="round-col finale-col">
              <div class="round-label">Week 16 · Title + 3rd</div>
              <div class="slot title-slot">
                <img src="${titleImg}" alt="${esc(conf.shortName)} Championship" />
                ${finals.title?.home ? `<div class="sub" style="margin-top:0.45rem;color:#ddd;">${esc(finals.title.away?.name||'')} ${fmt(finals.title.away?.score)} – ${fmt(finals.title.home?.score)} ${esc(finals.title.home?.name||'')}</div>` : ''}
              </div>
              <div class="slot third-slot">
                <img src="${thirdImg}" alt="${esc(conf.shortName)} 3rd Place" />
                ${finals.third?.home ? `<div class="sub" style="margin-top:0.45rem;color:#ddd;">${esc(finals.third.away?.name||'')} ${fmt(finals.third.away?.score)} – ${fmt(finals.third.home?.score)} ${esc(finals.third.home?.name||'')}</div>` : ''}
              </div>
            </div>
          </div>
        </section>`;
    }

    function bowlBlock() {
      return `
        <div class="mid">
          <div class="bowl" id="bowl-card">
            <div class="eyebrow">Week 17</div>
            <img src="/assets/gridiron-bowl.png" alt="GridIron Bowl I" />
            <div class="bowl-scoreboard" id="bowl-scoreboard">
              <div class="bowl-side detail">
                <div class="nm" id="bowl-detail-name">Detail Champion</div>
              </div>
              <div class="bowl-mid">
                <div class="vs" id="bowl-vs">VS</div>
              </div>
              <div class="bowl-side overtime">
                <div class="nm" id="bowl-overtime-name">Overtime Champion</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function fillSide(prefix, side, isLead) {
      const nameEl = document.getElementById(`bowl-${prefix}-name`);
      if (!nameEl) return;
      const wrap = nameEl.closest('.bowl-side');
      wrap.classList.toggle('is-lead', Boolean(isLead));
      nameEl.textContent = side?.champion?.name
        || (prefix === 'detail' ? 'Detail Champion' : 'Overtime Champion');
      let img = wrap.querySelector('img.bowl-logo');
      if (!img) {
        img = document.createElement('img');
        img.className = 'bowl-logo';
        img.alt = '';
        wrap.insertBefore(img, nameEl);
      }
      img.src = side?.champion?.logo || PLACEHOLDER;
    }

    function applyBowl(data) {
      if (!data) return;
      fillSide('detail', data.detail, data.leader === 'detail' || data.leader === 'tie');
      fillSide('overtime', data.overtime, data.leader === 'overtime' || data.leader === 'tie');
    }

    async function loadPlayoffs() {
      try {
        const res = await fetch('/api/playoffs', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        const detail = (data.conferences || []).find((c) => c.key === 'detail');
        const overtime = (data.conferences || []).find((c) => c.key === 'overtime');
        document.getElementById('live-tree').innerHTML = `
          <div class="trees-row">
            ${confTree(detail || { key: 'detail', name: 'Detail Conference', rounds: {} })}
            ${confTree(overtime || { key: 'overtime', name: 'Overtime Conference', rounds: {} })}
          </div>
          ${bowlBlock()}`;
        applyBowl(data.bowl);
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`Playoffs sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('live-tree').innerHTML = `<div class="msg" style="grid-column:1/-1;">${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Playoffs sync error', false);
      }
    }

    loadPlayoffs();
    setInterval(loadPlayoffs, 30_000);
  </script>
</body>
</html>
