<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schedules · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .toolbar label {
      font-family: var(--display);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 0.45rem;
    }
    .toolbar select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 0.45rem 0.65rem;
      font-family: var(--display);
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    .matchups { padding: 0.65rem; display: grid; gap: 0.55rem; }
    .matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.5rem;
      align-items: center;
      border: 1px solid var(--line);
      background: #0c0c0c;
      padding: 0.75rem;
    }
    .side {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .side.away { justify-content: flex-start; }
    .side.home { justify-content: flex-end; text-align: right; }
    .side img, .side .fb {
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 2px;
      object-fit: contain;
      background: #f3f3f3;
      border: 1px solid var(--line);
      flex: 0 0 1.7rem;
    }
    .side .fb {
      display: grid;
      place-items: center;
      background: #1a1a1a;
      color: var(--muted);
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 700;
    }
    .side .nm {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.88rem;
      font-weight: 700;
    }
    .score {
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: center;
      min-width: 4.5rem;
    }
    .score small {
      display: block;
      margin-top: 0.1rem;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="schedules">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell">
    <h1>Schedules</h1>
    <p>Weekly matchups across Detail and Overtime conferences.</p>
  </section>

  <main class="page-main shell">
    <div class="toolbar">
      <div>
        <label for="week">Week</label>
        <select id="week"></select>
      </div>
    </div>
    <div class="grid-2" id="boards">
      <div class="msg">Loading schedules…</div>
    </div>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function logo(team) {
      if (team.logo) return `<img src="${esc(team.logo)}" alt="" loading="lazy">`;
      return `<div class="fb">24</div>`;
    }

    function side(team, align) {
      const score = Number(team.score || 0).toFixed(1);
      const name = `<div class="nm" title="${esc(team.name)}">${esc(team.name)}</div>`;
      if (align === 'home') {
        return `<div class="side home">${name}${logo(team)}</div>`;
      }
      return `<div class="side away">${logo(team)}${name}</div>`;
    }

    function board(conf) {
      if (!conf.ok) {
        return `<div class="panel"><div class="panel-title">${esc(conf.name || 'Conference')}</div><div class="msg"><strong>Unavailable</strong>${esc(conf.error || '')}</div></div>`;
      }
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      const cards = (conf.matchups || []).map((m) => `
        <div class="matchup">
          ${side(m.away, 'away')}
          <div class="score">${Number(m.away.score || 0).toFixed(1)}-${Number(m.home.score || 0).toFixed(1)}<small>PROJ ${Number(m.away.projected || 0).toFixed(1)}-${Number(m.home.projected || 0).toFixed(1)}</small></div>
          ${side(m.home, 'home')}
        </div>`).join('');
      return `
        <div class="panel">
          <div class="panel-title ${tone}">${esc(conf.name)} · Week ${conf.week}</div>
          <div class="matchups">${cards || '<div class="msg">No matchups scheduled for this week.</div>'}</div>
        </div>`;
    }

    function fillWeeks(current) {
      const sel = document.getElementById('week');
      sel.innerHTML = Array.from({ length: 17 }, (_, i) => {
        const w = i + 1;
        return `<option value="${w}" ${w === current ? 'selected' : ''}>Week ${w}</option>`;
      }).join('');
    }

    async function load(week) {
      document.getElementById('boards').innerHTML = '<div class="msg">Loading schedules…</div>';
      try {
        const qs = week ? `?week=${week}` : '';
        const res = await fetch(`/api/schedule${qs}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        if (!document.getElementById('week').options.length) fillWeeks(data.week);
        document.getElementById('week').value = String(data.week);
        document.getElementById('boards').innerHTML = data.conferences.map(board).join('');
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }

    document.getElementById('week').addEventListener('change', (e) => load(e.target.value));
    load();
  </script>
</body>
</html>
