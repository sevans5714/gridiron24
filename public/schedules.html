<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schedules · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=126" />
  <link rel="icon" href="/favicon.ico?v=126" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=126" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=126" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=170" />
  <style>
    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }
    .week-control label {
      display: block;
      margin-bottom: 0.4rem;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .week-control select {
      appearance: none;
      color: var(--text);
      border: 1px solid rgba(47, 109, 255, 0.4);
      padding: 0.65rem 2.4rem 0.65rem 1rem;
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      box-shadow: 0 0 0 1px rgba(47, 109, 255, 0.1), inset 0 1px 0 rgba(255,255,255,0.04);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--blue) 50%),
        linear-gradient(135deg, var(--blue) 50%, transparent 50%),
        linear-gradient(180deg, var(--panel-2), var(--panel));
      background-position:
        calc(100% - 1.15rem) calc(50% - 0.18rem),
        calc(100% - 0.85rem) calc(50% - 0.18rem),
        0 0;
      background-size: 6px 6px, 6px 6px, 100% 100%;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .week-control select:focus {
      outline: none;
      border-color: var(--blue);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .grid-2:has(> :only-child) {
      grid-template-columns: 1fr;
      max-width: 40rem;
    }
    .special-slot {
      margin-top: 1rem;
    }
    .mayor-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem 1.25rem;
      align-items: center;
      padding: 1.1rem 1.2rem 1.2rem;
      border: 1px solid rgba(126, 200, 255, 0.35);
      background:
        radial-gradient(ellipse 70% 90% at 12% 40%, rgba(47, 109, 255, 0.2), transparent 60%),
        linear-gradient(180deg, var(--panel-2), var(--panel));
      overflow: hidden;
    }
    .mayor-card .mark {
      width: clamp(5.5rem, 14vw, 7.5rem);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.45));
    }
    .mayor-card .eyebrow {
      margin: 0 0 0.25rem;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .mayor-card h2 {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }
    .mayor-card .blurb {
      margin: 0 0 0.85rem;
      color: var(--muted);
      line-height: 1.45;
      max-width: 38rem;
    }
    .mayor-score {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.75rem;
      align-items: center;
      max-width: 36rem;
    }
    .mayor-side {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }
    .mayor-side.home { flex-direction: row-reverse; text-align: right; }
    .mayor-side img {
      width: 2.75rem;
      height: 2.75rem;
      object-fit: contain;
      flex: 0 0 auto;
    }
    .mayor-side .nm {
      font-weight: 700;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mayor-mid {
      text-align: center;
      font-family: var(--display);
      letter-spacing: 0.06em;
    }
    .mayor-mid .vs {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .mayor-mid .pts {
      font-size: 1.35rem;
      font-weight: 700;
    }
    .mayor-card .playoffs-link {
      display: inline-flex;
      margin-top: 0.85rem;
      color: #9ec0ff;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.92rem;
    }
    .mayor-card .playoffs-link:hover { color: #fff; }
    @media (max-width: 720px) {
      .mayor-card {
        grid-template-columns: 1fr;
        text-align: center;
        justify-items: center;
      }
      .mayor-score { width: 100%; }
    }
    .matchups {
      padding: 0.75rem;
      display: grid;
      gap: 0.55rem;
    }
    .matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.55rem;
      align-items: center;
      border: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.02), transparent 30%, transparent 70%, rgba(255,255,255,0.02)), var(--panel);
      padding: 0.85rem 0.9rem;
      transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    }
    .matchup:hover {
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-1px);
      background:
        linear-gradient(90deg, rgba(47,109,255,0.06), transparent 35%, transparent 65%, rgba(47,109,255,0.06)), var(--panel-2);
    }
    .side {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .side.away { justify-content: flex-start; }
    .side.home { justify-content: flex-end; text-align: right; }
    .side .team-logo,
    .side .team-logo-fallback {
      width: 3.25rem;
      height: 3.25rem;
      flex: 0 0 auto;
      object-fit: contain;
      border-radius: 0.45rem;
      background: transparent;
      border: 0;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .side .team-logo-fallback {
      display: inline-block;
      background: transparent;
    }
    .side .nm {
      min-width: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .score {
      font-family: var(--display);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
      min-width: 5.2rem;
      line-height: 1.1;
    }
    .score .vs {
      display: block;
      margin: 0.25rem 0;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--blue);
    }
    .score small {
      display: block;
      margin-top: 0.3rem;
      color: var(--muted);
      font-family: var(--body);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }


    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
      .matchup {
        grid-template-columns: 1fr;
        gap: 0.4rem;
        text-align: center;
      }
      .side { justify-content: center; }
    }
  </style>
</head>
<body data-page="schedules">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <p class="eyebrow">Game Day</p>
    <h1>Schedules</h1>
  </section>

  <main class="page-main shell">
    <div class="toolbar reveal reveal-delay-1">
      <div class="week-control">
        <label for="week">Select Week</label>
        <select id="week"></select>
      </div>
    </div>
    <div class="grid-2" id="boards">
      <div class="msg">Loading schedules…</div>
    </div>
    <div class="special-slot" id="special-slot" hidden></div>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=170"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function side(team, align) {
      const name = window.GridIronTitle.html(team?.name || 'TBD', { size: 'sm', owner: team?.owner });
      return `<div class="side ${align}">${name}</div>`;
    }

    function mayorSide(side, align) {
      if (!side) return `<div class="mayor-side ${align}">${window.GridIronTitle.html('TBD', { size: 'sm' })}</div>`;
      const team = side.team || side.champion || {};
      const name = team.name || side.conferenceName || 'TBD';
      return `
        <div class="mayor-side ${align}">
          ${window.GridIronTitle.html(name, { size: 'sm', owner: team.owner })}
        </div>`;
    }

    function mayorCardHtml(survival) {
      if (!survival || survival.enabled === false) return '';
      const d = survival.detail;
      const o = survival.overtime;
      const dScore = d?.score;
      const oScore = o?.score;
      const scoreline = (dScore != null && oScore != null)
        ? `<div class="pts">${Number(dScore).toFixed(1)} – ${Number(oScore).toFixed(1)}</div>`
        : `<div class="vs">VS</div>`;
      return `
        <div class="mayor-card">
          <img class="mark" src="/assets/mayors-cup.png?v=7" alt="Mayor's Cup" width="1024" height="768" decoding="async" />
          <div>
            <p class="eyebrow">Week ${esc(String(survival.week || 17))} · Season finale</p>
            <h2>${esc(survival.name || "Mayor's Cup")}</h2>
            <p class="blurb">${esc(survival.message || 'Last place in each conference. Winner stays in GridIron 24; loser leaves.')}</p>
            <div class="mayor-score">
              ${mayorSide(d, 'away')}
              <div class="mayor-mid">${scoreline}</div>
              ${mayorSide(o, 'home')}
            </div>
            <a class="playoffs-link" href="/playoffs.html">Open playoff bracket →</a>
          </div>
        </div>`;
    }

    function board(conf, idx) {
      if (!conf.ok) {
        return `<div class="panel reveal reveal-delay-${idx + 1}"><div class="panel-title">${esc(conf.name || 'Conference')}</div><div class="msg"><strong>Unavailable</strong>${esc(conf.error || '')}</div></div>`;
      }
      const tone = conf.key === 'detail' ? 'detail' : (conf.key === 'overtime' ? 'overtime' : 'aaa');
      const logoSrc = conf.logo || (tone === 'aaa' ? '/assets/aaa-league.png?v=7' : '');
      const logoImg = logoSrc ? `<span class="conf-mark"><img src="${esc(logoSrc)}" alt=""></span>` : '';
      const boardTitle = tone === 'aaa'
        ? (conf.name || conf.shortName || 'AAA League')
        : (conf.shortName || conf.name);
      const cards = (conf.matchups || []).map((m) => `
        <div class="matchup">
          ${side(m.away, 'away')}
          <div class="score">
            ${Number(m.away.score || 0).toFixed(1)}
            <span class="vs">VS</span>
            ${Number(m.home.score || 0).toFixed(1)}
            <small>PROJ ${Number(m.away.projected || 0).toFixed(1)}–${Number(m.home.projected || 0).toFixed(1)}</small>
          </div>
          ${side(m.home, 'home')}
        </div>`).join('');
      return `
        <div class="panel reveal reveal-delay-${idx + 1}">
          <div class="panel-title ${tone}">
            ${logoImg}
            <span>${esc(boardTitle)}</span>
            <span class="meta">Week ${conf.week}</span>
          </div>
          <div class="matchups">${cards || '<div class="msg">No matchups scheduled for this week.</div>'}</div>
        </div>`;
    }

    function fillWeeks(current) {
      const sel = document.getElementById('week');
      sel.innerHTML = Array.from({ length: 17 }, (_, i) => {
        const w = i + 1;
        return `<option value="${w}" ${w === current ? 'selected' : ''}>Week ${w}</option>`;
      }).join('');
    }

    async function loadSpecial(week) {
      const slot = document.getElementById('special-slot');
      if (!slot) return;
      const w = Number(week);
      if (!Number.isFinite(w) || w < 17) {
        slot.hidden = true;
        slot.innerHTML = '';
        return;
      }
      try {
        const res = await fetch('/api/survival', { cache: 'no-store' });
        if (!res.ok) throw new Error(`survival ${res.status}`);
        const survival = await res.json();
        const html = mayorCardHtml(survival);
        if (!html) {
          slot.hidden = true;
          slot.innerHTML = '';
          return;
        }
        slot.innerHTML = html;
        slot.hidden = false;
      } catch {
        slot.hidden = true;
        slot.innerHTML = '';
      }
    }

    async function load(week) {
      document.getElementById('boards').innerHTML = '<div class="msg">Loading schedules…</div>';
      try {
        const qs = week ? `?week=${week}` : '';
        const res = await fetch(`/api/schedule${qs}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        if (!document.getElementById('week').options.length) fillWeeks(data.week);
        document.getElementById('week').value = String(data.week);
        const confs = data.conferences || [];
        document.getElementById('boards').innerHTML = confs.map(board).join('');
        const isAaa = data.leagueScope?.scope === 'aaa'
          || (confs.length === 1 && confs[0]?.key === 'aaa');
        if (isAaa) {
          document.getElementById('special-slot').hidden = true;
          document.getElementById('special-slot').innerHTML = '';
        } else {
          await loadSpecial(data.week);
        }
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`Updated · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        document.getElementById('special-slot').hidden = true;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }

    document.getElementById('week').addEventListener('change', (e) => load(e.target.value));
    load();
  </script>
</body>
</html>
