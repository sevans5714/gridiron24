<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schedules · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=56" />
  <style>
    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }
    .week-control label {
      display: block;
      margin-bottom: 0.4rem;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .week-control select {
      appearance: none;
      color: var(--text);
      border: 1px solid rgba(47, 109, 255, 0.4);
      padding: 0.65rem 2.4rem 0.65rem 1rem;
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      box-shadow: 0 0 0 1px rgba(47, 109, 255, 0.1), inset 0 1px 0 rgba(255,255,255,0.04);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--blue) 50%),
        linear-gradient(135deg, var(--blue) 50%, transparent 50%),
        linear-gradient(180deg, var(--panel-2), var(--panel));
      background-position:
        calc(100% - 1.15rem) calc(50% - 0.18rem),
        calc(100% - 0.85rem) calc(50% - 0.18rem),
        0 0;
      background-size: 6px 6px, 6px 6px, 100% 100%;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .week-control select:focus {
      outline: none;
      border-color: var(--blue);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .matchups {
      padding: 0.75rem;
      display: grid;
      gap: 0.55rem;
    }
    .matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.55rem;
      align-items: center;
      border: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.02), transparent 30%, transparent 70%, rgba(255,255,255,0.02)), var(--panel);
      padding: 0.85rem 0.9rem;
      transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    }
    .matchup:hover {
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-1px);
      background:
        linear-gradient(90deg, rgba(47,109,255,0.06), transparent 35%, transparent 65%, rgba(47,109,255,0.06)), var(--panel-2);
    }
    .side {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .side.away { justify-content: flex-start; }
    .side.home { justify-content: flex-end; text-align: right; }
    .side .team-logo,
    .side .team-logo-fallback {
      width: 3.25rem;
      height: 3.25rem;
      flex: 0 0 auto;
      object-fit: contain;
      border-radius: 0.45rem;
      background: var(--logo-tile-bg);
      border: 1px solid var(--logo-tile-border);
      filter: var(--logo-shadow);
    }
    .side .team-logo-fallback {
      display: inline-block;
      background: var(--logo-tile-bg);
    }
      filter: none;
    }
    .side .nm {
      min-width: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .score {
      font-family: var(--display);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
      min-width: 5.2rem;
      line-height: 1.1;
    }
    .score .vs {
      display: block;
      margin: 0.25rem 0;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--blue);
    }
    .score small {
      display: block;
      margin-top: 0.3rem;
      color: var(--muted);
      font-family: var(--body);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }


    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .matchup {
        grid-template-columns: 1fr;
        gap: 0.4rem;
        text-align: center;
      }
      .side { justify-content: center; }
    }
  </style>
</head>
<body data-page="schedules">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <p class="eyebrow">Game Day</p>
    <h1>Schedules</h1>
  </section>

  <main class="page-main shell">
    <div class="toolbar reveal reveal-delay-1">
      <div class="week-control">
        <label for="week">Select Week</label>
        <select id="week"></select>
      </div>
    </div>
    <div class="grid-2" id="boards">
      <div class="msg">Loading schedules…</div>
    </div>
  </main>

  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js?v=32"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function teamLogo(team) {
      const src = team?.logo || '/assets/team-logo-placeholder.svg';
      return `<img class="team-logo" src="${esc(src)}" alt="" width="52" height="52" loading="lazy" referrerpolicy="no-referrer">`;
    }

    function side(team, align) {
      const logo = teamLogo(team);
      const name = `<div class="nm" title="${esc(team.name)}">${esc(team.name)}</div>`;
      if (align === 'home') {
        return `<div class="side home">${name}${logo}</div>`;
      }
      return `<div class="side away">${logo}${name}</div>`;
    }

    function board(conf, idx) {
      if (!conf.ok) {
        return `<div class="panel reveal reveal-delay-${idx + 1}"><div class="panel-title">${esc(conf.name || 'Conference')}</div><div class="msg"><strong>Unavailable</strong>${esc(conf.error || '')}</div></div>`;
      }
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      const logoImg = conf.logo ? `<img src="${esc(conf.logo)}" alt="">` : '';
      const cards = (conf.matchups || []).map((m) => `
        <div class="matchup">
          ${side(m.away, 'away')}
          <div class="score">
            ${Number(m.away.score || 0).toFixed(1)}
            <span class="vs">VS</span>
            ${Number(m.home.score || 0).toFixed(1)}
            <small>PROJ ${Number(m.away.projected || 0).toFixed(1)}–${Number(m.home.projected || 0).toFixed(1)}</small>
          </div>
          ${side(m.home, 'home')}
        </div>`).join('');
      return `
        <div class="panel reveal reveal-delay-${idx + 1}">
          <div class="panel-title ${tone}">
            ${logoImg}
            <span>${esc(conf.shortName || conf.name)}</span>
            <span class="meta">Week ${conf.week}</span>
          </div>
          <div class="matchups">${cards || '<div class="msg">No matchups scheduled for this week.</div>'}</div>
        </div>`;
    }

    function fillWeeks(current) {
      const sel = document.getElementById('week');
      sel.innerHTML = Array.from({ length: 17 }, (_, i) => {
        const w = i + 1;
        return `<option value="${w}" ${w === current ? 'selected' : ''}>Week ${w}</option>`;
      }).join('');
    }

    async function load(week) {
      document.getElementById('boards').innerHTML = '<div class="msg">Loading schedules…</div>';
      try {
        const qs = week ? `?week=${week}` : '';
        const res = await fetch(`/api/schedule${qs}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        if (!document.getElementById('week').options.length) fillWeeks(data.week);
        document.getElementById('week').value = String(data.week);
        document.getElementById('boards').innerHTML = data.conferences.map(board).join('');
        const t = new Date(data.generatedAt);
        window.GridIronNav?.setSync(`ESPN sync · ${t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="msg"><strong>Error</strong>${esc(err.message)}</div>`;
        window.GridIronNav?.setSync('Connection error', false);
      }
    }

    document.getElementById('week').addEventListener('change', (e) => load(e.target.value));
    load();
  </script>
</body>
</html>
