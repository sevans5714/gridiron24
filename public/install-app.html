<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Install the GridIron 24 App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=98" />
  <link rel="icon" href="/favicon.ico?v=98" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=98" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=98" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=153" />
  <style>
    body[data-page="install-app"] .page-hero { padding-bottom: 0.35rem; }
    body[data-page="install-app"] .page-hero::before,
    body[data-page="install-app"] .page-hero::after { display: none; }
    .install-lead {
      max-width: 40rem;
      margin: 0 auto 1.25rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
      text-align: center;
    }
    .install-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
      margin: 0 0 1.75rem;
    }
    .install-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .install-card {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .install-card-head {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(47, 109, 255, 0.12), transparent);
    }
    .install-card.is-android .install-card-head {
      background: linear-gradient(180deg, rgba(61, 220, 132, 0.12), transparent);
    }
    .install-platform-icon {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 0.7rem;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
    }
    .install-card.is-apple .install-platform-icon {
      background: #111;
      color: #fff;
      border-color: rgba(255,255,255,0.12);
    }
    .install-card.is-android .install-platform-icon {
      background: #102418;
      color: #3ddc84;
      border-color: rgba(61, 220, 132, 0.35);
    }
    html[data-theme="day"] .install-card.is-android .install-platform-icon {
      background: #e8f8ef;
      color: #1b8a4c;
    }
    .install-platform-icon svg {
      width: 1.35rem;
      height: 1.35rem;
      display: block;
    }
    .install-card-kicker {
      margin: 0;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .install-card h2 {
      margin: 0.15rem 0 0;
      font-family: var(--display);
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .install-card-body {
      padding: 1.05rem 1.15rem 1.2rem;
      flex: 1;
    }
    .install-card ol {
      margin: 0;
      padding: 0 0 0 1.15rem;
      color: var(--text);
      line-height: 1.5;
    }
    .install-card li { margin: 0.4rem 0; }
    .install-tips {
      margin: 1rem 0 0;
      padding: 0.8rem 0.9rem;
      border-left: 3px solid var(--blue);
      background: rgba(47, 109, 255, 0.08);
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .install-card.is-android .install-tips {
      border-left-color: #3ddc84;
      background: rgba(61, 220, 132, 0.08);
    }
    .install-tips strong {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--text);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .install-tips ul { margin: 0; padding-left: 1.1rem; }
    .install-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .install-panel h2 {
      margin: 0 0 0.55rem;
      font-family: var(--display);
      font-size: 1.25rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .install-panel ul { margin: 0; padding-left: 1.15rem; line-height: 1.5; }
    .install-panel li { margin: 0.3rem 0; }
    .install-meta {
      margin: 1.25rem 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }
    @media (max-width: 800px) {
      .install-grid { grid-template-columns: 1fr; }
    }
    @media print {
      .site-nav, .install-actions, .tools-back, .ticker-wrap { display: none !important; }
      .install-card, .install-panel { break-inside: avoid; box-shadow: none; }
      body { background: #fff; color: #111; }
    }
  </style>
</head>
<body data-page="install-app">
  <div id="nav"></div>
  <script src="/js/nav.js?v=153"></script>

  <section class="page-hero shell">
    <p class="eyebrow">Mobile app</p>
    <h1>Install GridIron 24</h1>
  </section>

  <main class="page-main shell" id="install-main">
    <p class="install-lead">Loading guide…</p>
  </main>

  <script>
    const APPLE_ICON = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.7 13.3c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.9 2.7-2c.8-1.2 1.1-2.3 1.1-2.4-.1 0-2.2-.8-2.2-3.5zM14.7 5.7c.6-.8 1.1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.8-.9 2.9 1 .1 2-.5 2.6-1.3z"/></svg>`;
    const ANDROID_ICON = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 9.5l1.4-2.4c.1-.2 0-.4-.2-.5-.2-.1-.4 0-.5.2l-1.4 2.5c-1.1-.5-2.4-.8-3.9-.8s-2.8.3-3.9.8L7.7 6.8c-.1-.2-.3-.3-.5-.2-.2.1-.3.3-.2.5l1.4 2.4C6.3 10.6 5 12.6 5 15v.5h14V15c0-2.4-1.3-4.4-3.4-5.5zM9.2 13.2c-.4 0-.8-.4-.8-.8s.4-.8.8-.8.8.4.8.8-.4.8-.8.8zm5.6 0c-.4 0-.8-.4-.8-.8s.4-.8.8-.8.8.4.8.8-.4.8-.8.8zM5 16.2h14v1.6c0 1.1-.9 2-2 2h-.5v2.2c0 .4-.3.7-.7.7s-.7-.3-.7-.7v-2.2H9v2.2c0 .4-.3.7-.7.7s-.7-.3-.7-.7v-2.2H7c-1.1 0-2-.9-2-2v-1.6z"/></svg>`;

    async function boot() {
      const main = document.getElementById('install-main');
      try {
        const res = await fetch('/api/docs/pwa-install', { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load guide');
        const g = data.guide;
        const esc = (s) => String(s || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        main.innerHTML = `
          <p class="install-lead">${(g.intro || []).map(esc).join('<br/><br/>')}</p>
          <div class="install-actions">
            <a class="btn" href="${esc(g.enterUrl)}">Sign in</a>
            <a class="btn btn-ghost" href="/docs/gridiron24-app-install.pdf" download>Download PDF</a>
            <button type="button" class="btn btn-ghost" id="install-print">Print / Save as PDF</button>
          </div>
          <div class="install-panel">
            <h2>Before you start</h2>
            <ul>${(g.beforeYouStart || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
          </div>
          <div class="install-grid">
            <section class="install-card is-apple">
              <div class="install-card-head">
                <span class="install-platform-icon" aria-hidden="true">${APPLE_ICON}</span>
                <div>
                  <p class="install-card-kicker">Apple</p>
                  <h2>${esc(g.apple.title)}</h2>
                </div>
              </div>
              <div class="install-card-body">
                <ol>${(g.apple.steps || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
                <div class="install-tips">
                  <strong>Tips</strong>
                  <ul>${(g.apple.tips || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
                </div>
              </div>
            </section>
            <section class="install-card is-android">
              <div class="install-card-head">
                <span class="install-platform-icon" aria-hidden="true">${ANDROID_ICON}</span>
                <div>
                  <p class="install-card-kicker">Google</p>
                  <h2>${esc(g.android.title)}</h2>
                </div>
              </div>
              <div class="install-card-body">
                <ol>${(g.android.steps || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
                <div class="install-tips">
                  <strong>Tips</strong>
                  <ul>${(g.android.tips || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
                </div>
              </div>
            </section>
          </div>
          <div class="install-panel">
            <h2>${esc(g.afterInstall.title)}</h2>
            <ul>${(g.afterInstall.bullets || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
          </div>
          <div class="install-panel">
            <h2>${esc(g.help.title)}</h2>
            <p style="margin:0;line-height:1.5;color:var(--muted);">${esc(g.help.body)}</p>
          </div>
          <p class="install-meta">${esc(g.siteUrl)} · ${esc(g.updatedLabel)}</p>`;
        document.getElementById('install-print')?.addEventListener('click', () => window.print());
      } catch (err) {
        main.innerHTML = `<p class="install-lead">${String(err.message || err)}</p>`;
      }
    }
    boot();
  </script>
</body>
</html>
