<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teams · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=21" />
  <style>
    .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 0.5rem; }
    .team-list { display: grid; gap: 0.55rem; }
    .team-row {
      display: grid;
      grid-template-columns: 2.2rem 2.5rem 1fr auto;
      gap: 0.65rem;
      align-items: center;
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: inherit;
      text-decoration: none;
    }
    .team-row:hover .nm { color: #fff; }
    .team-row img { width: 2.5rem; height: 2.5rem; object-fit: contain; }
    .team-row .seed { color: #8a8a8a; font-variant-numeric: tabular-nums; font-weight: 600; }
    .team-row .nm { font-weight: 700; color: #eee; }
    .team-row .rec { color: #9a9a9a; font-variant-numeric: tabular-nums; }
    .conf-title { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 2px solid rgba(255,255,255,0.12); }
    .conf-title.detail { border-bottom-color: rgba(255,122,24,0.55); color: var(--detail); }
    .conf-title.overtime { border-bottom-color: rgba(226,35,42,0.55); color: var(--overtime); }
    .conf-title img { width: 3rem; height: auto; }
    .conf-title h2 { margin: 0; font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.05em; text-transform: uppercase; }
    @media (max-width: 800px) { .teams-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-page="teams">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Teams</div>
    </div>
  </header>
  <section class="page-hero shell">
    <p class="eyebrow">Franchises</p>
    <h1>Teams</h1>
    <p>Every roster across Detail and Overtime.</p>
  </section>
  <main class="page-main shell">
    <div class="teams-grid" id="boards"><div class="msg">Loading teams…</div></div>
  </main>
  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js?v=12"></script>
  <script>
    const esc = (v = '') => String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    function record(t) {
      return Number(t.ties||0) > 0 ? `${t.wins}-${t.losses}-${t.ties}` : `${t.wins}-${t.losses}`;
    }
    function board(conf) {
      if (!conf?.ok) return `<div><div class="conf-title"><h2>${esc(conf?.name||'Conference')}</h2></div><div class="msg">Unavailable</div></div>`;
      const rows = (conf.teams||[]).map((t,i) => `
        <a class="team-row" href="/team.html?conference=${esc(conf.key)}&teamId=${esc(t.id)}">
          <span class="seed">${t.playoffSeed || (i+1)}</span>
          <img src="${esc(t.logo||'/assets/team-logo-placeholder.svg')}" alt="" />
          <span class="nm">${esc(t.name)}</span>
          <span class="rec">${esc(record(t))}</span>
        </a>`).join('');
      return `
        <section>
          <div class="conf-title ${esc(conf.key)}">
            ${conf.logo ? `<img src="${esc(conf.logo)}" alt="">` : ''}
            <h2>${esc(conf.shortName||conf.name)}</h2>
          </div>
          <div class="team-list">${rows}</div>
        </section>`;
    }
    (async () => {
      try {
        const res = await fetch('/api/leagues', { cache: 'no-store' });
        const data = await res.json();
        const detail = (data.conferences||[]).find(c => c.key==='detail');
        const overtime = (data.conferences||[]).find(c => c.key==='overtime');
        document.getElementById('boards').innerHTML = board(detail) + board(overtime);
        window.GridIronNav?.setSync(`ESPN sync · ${new Date(data.generatedAt).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`);
      } catch (err) {
        document.getElementById('boards').innerHTML = `<div class="msg">${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
