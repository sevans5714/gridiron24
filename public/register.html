<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Create Account · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=17" />
</head>
<body class="auth-page">
  <form class="auth-card" id="form" autocomplete="on">
    <img class="auth-crest" src="/assets/login-crest.png" alt="GridIron 24" width="1024" height="1024" />
    <h1 class="auth-title">Create Account</h1>
    <div class="status-note err" id="err" role="alert"></div>

    <label class="field-label" for="name">Full Name</label>
    <input class="field" id="name" name="name" type="text" required autofocus autocomplete="name" />

    <label class="field-label" for="email">Email</label>
    <input class="field" id="email" name="email" type="email" required autocomplete="email" />

    <div class="auth-section" id="access-section">Site access</div>
    <div id="access-fields">
      <label class="field-label" for="leaguePassword">Access password</label>
      <input class="field" id="leaguePassword" name="leaguePassword" type="password" autocomplete="off" />
    </div>
    <p class="auth-section" id="invite-banner" hidden style="color:var(--good); border-color:rgba(34,197,94,0.25);">You're invited — no access password needed</p>

    <div class="auth-section">Your login</div>
    <label class="field-label" for="loginName">Login Name</label>
    <input class="field" id="loginName" name="loginName" type="text" required autocomplete="username" />
    <label class="field-label" for="password">Password</label>
    <input class="field" id="password" name="password" type="password" required minlength="6" autocomplete="new-password" />
    <label class="field-label" for="confirmPassword">Confirm Password</label>
    <input class="field" id="confirmPassword" name="confirmPassword" type="password" required minlength="6" autocomplete="new-password" />

    <button class="btn" type="submit" id="submit">Create Account</button>
    <p class="auth-links">Already have an account? <a href="/enter">Sign in</a></p>
  </form>
  <script>
    const form = document.getElementById('form');
    const errEl = document.getElementById('err');
    const submit = document.getElementById('submit');
    const next = new URLSearchParams(window.location.search).get('next') || '/home.html';
    const inviteToken = new URLSearchParams(window.location.search).get('invite') || '';

    async function boot() {
      const auth = await fetch('/api/auth', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({}));
      if (!inviteToken) {
        if (auth.authConfigured) {
          document.getElementById('leaguePassword').required = true;
        } else {
          document.getElementById('access-section').hidden = true;
          document.getElementById('access-fields').hidden = true;
        }
        return;
      }
      const peek = await fetch(`/api/invites/peek?token=${encodeURIComponent(inviteToken)}`, { cache: 'no-store' })
        .then((r) => r.json()).catch(() => ({}));
      if (!peek.ok) {
        errEl.textContent = peek.error || 'Invite link is invalid or expired';
        errEl.classList.add('show');
        return;
      }
      document.getElementById('email').value = peek.email || '';
      document.getElementById('email').readOnly = true;
      document.getElementById('access-section').hidden = true;
      document.getElementById('access-fields').hidden = true;
      document.getElementById('invite-banner').hidden = false;
    }
    boot().catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.remove('show');
      submit.disabled = true;
      const body = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        leaguePassword: document.getElementById('leaguePassword').value,
        loginName: document.getElementById('loginName').value.trim(),
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value,
        inviteToken: inviteToken || undefined
      };
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create account');
        window.location.href = next;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
