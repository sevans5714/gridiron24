<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft Results · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=137" />
  <link rel="icon" href="/favicon.ico?v=137" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=137" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=137" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=182" />
  <link rel="stylesheet" href="/css/draft-desk.css?v=12" />
  <style>
    .draft-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin: 0.5rem 0 1rem;
    }
    .draft-tabs {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }
    .draft-tabs button {
      font-family: var(--display);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .draft-tabs button.active {
      color: var(--text);
      border-color: var(--blue);
      background: rgba(47, 109, 255, 0.12);
    }
    .draft-meta {
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body data-page="draft">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Draft</div>
    </div>
  </header>
  <section class="page-hero shell">
    <p class="eyebrow">League · Draft</p>
    <h1>Draft Results</h1>
  </section>
  <main class="page-main shell">
    <div class="draft-toolbar">
      <div class="draft-tabs" id="conf-tabs" role="tablist" aria-label="Conference"></div>
      <p class="draft-meta" id="draft-meta">Loading…</p>
    </div>
    <div id="draft-mount"><div class="msg">Loading draft board…</div></div>
  </main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=183"></script>
  <script>
    const esc = (v = '') => String(v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    const GI_CONFS = [
      { key: 'detail', label: 'Detail' },
      { key: 'overtime', label: 'Overtime' }
    ];
    let CONFS = GI_CONFS.slice();
    let activeConf = new URLSearchParams(location.search).get('conference') || 'detail';
    let activeSeason = new URLSearchParams(location.search).get('season') || '';

    function renderTabs() {
      const tabs = document.getElementById('conf-tabs');
      if (!tabs) return;
      if (CONFS.length <= 1) {
        tabs.innerHTML = CONFS.map((c) => (
          `<button type="button" class="active" data-conf="${esc(c.key)}" disabled>${esc(c.label)}</button>`
        )).join('');
        return;
      }
      tabs.innerHTML = CONFS.map((c) => (
        `<button type="button" class="${c.key === activeConf ? 'active' : ''}" data-conf="${esc(c.key)}">${esc(c.label)}</button>`
      )).join('');
      document.querySelectorAll('#conf-tabs button').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeConf = btn.dataset.conf;
          const url = new URL(location.href);
          url.searchParams.set('conference', activeConf);
          if (activeSeason) url.searchParams.set('season', activeSeason);
          history.replaceState({}, '', url);
          loadDraft();
          renderTabs();
        });
      });
    }

    function posKey(pos) {
      const raw = String(pos || '').trim().toUpperCase();
      if (raw === 'DST' || raw === 'D/ST' || raw === 'DEF') return 'D/ST';
      return raw || '—';
    }

    function nflLogoSrc(team) {
      const abbr = String(team || '').trim().toUpperCase();
      const canon = abbr === 'ARZ' ? 'ARI' : (abbr === 'WSH' || abbr === 'WASH' ? 'WAS' : abbr);
      if (!canon || canon === 'FA' || canon.length > 3) return '';
      const slug = canon === 'WAS' ? 'wsh' : canon.toLowerCase();
      return `https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png`;
    }

    function magnetHtml(pick) {
      if (!pick?.filled) return '<span class="last is-empty"></span>';
      const pos = posKey(pick.position);
      const nfl = String(pick.proTeam || '').toUpperCase();
      const logo = nflLogoSrc(nfl);
      const first = pick.firstName
        ? `<span class="pick-first">${esc(pick.firstName)}</span>`
        : '<span class="pick-first"></span>';
      const team = logo
        ? `<img class="pick-nfl-logo" src="${esc(logo)}" alt="${esc(nfl)}" width="16" height="16" loading="lazy" referrerpolicy="no-referrer" />`
        : (nfl && nfl !== 'FA' ? `<span class="pick-nfl-abbr">${esc(nfl)}</span>` : '<span class="pick-nfl-abbr"></span>');
      const bye = pick.byeWeek != null && String(pick.byeWeek).trim() !== ''
        ? `<span class="pick-bye">Bye ${esc(String(pick.byeWeek))}</span>`
        : '';
      return `<span class="last" data-pos="${esc(pos)}"><span class="pick-meta"><span class="pick-pos">${esc(pos)}</span>${first}${team}</span><span class="pick-last">${esc(pick.lastName || '')}</span>${bye}</span>`;
    }

    function fitMagnetLastName(root) {
      const scope = root && root.querySelectorAll ? root : document;
      scope.querySelectorAll('.last:not(.is-empty) .pick-last').forEach((el) => {
        el.style.fontSize = '';
        el.style.letterSpacing = '';
        el.style.transform = '';
        const avail = el.clientWidth;
        if (avail < 8) return;
        const used = el.scrollWidth;
        if (used <= avail) return;
        const current = Number.parseFloat(getComputedStyle(el).fontSize) || 16;
        const next = Math.max(9, current * ((avail - 2) / Math.max(used, 1)));
        el.style.fontSize = `${next.toFixed(2)}px`;
        el.style.letterSpacing = '0';
        if (el.scrollWidth > avail) {
          const squeeze = Math.max(0.62, avail / Math.max(el.scrollWidth, 1));
          el.style.transform = `scaleX(${squeeze.toFixed(3)})`;
          el.style.transformOrigin = 'center';
        }
      });
    }

    function renderBoard(data) {
      const mount = document.getElementById('draft-mount');
      const meta = document.getElementById('draft-meta');
      if (!data.ok) {
        mount.innerHTML = `<div class="msg">${esc(data.error || 'Draft unavailable')}</div>`;
        meta.textContent = '';
        return;
      }

      const d = data.draft || {};
      if (!d.visible) {
        mount.innerHTML = `<div class="msg">Draft board unlocks once the ${esc(String(data.season))} draft starts or completes on ESPN.</div>`;
        meta.textContent = `${data.conference?.name || ''} · ${d.type || 'SNAKE'} · not started`;
        return;
      }

      const cols = data.columns || [];
      const rows = data.board || [];
      meta.textContent = [
        data.conference?.name || '',
        d.type || 'SNAKE',
        d.inProgress ? 'in progress' : (d.drafted ? 'complete' : 'partial'),
        `${d.filledCount || 0}/${d.totalSlots || 0} picks`
      ].filter(Boolean).join(' · ');

      const heads = cols.map((t, i) => {
        const label = t?.abbreviation || t?.name || `Team ${i + 1}`;
        const title = [t?.name, t?.owner].filter(Boolean).join(' · ');
        return `<div class="cpu-recap-head${i % 2 ? ' is-alt' : ''}" title="${esc(title || label)}"><span class="cpu-recap-num">${i + 1}</span></div>`;
      }).join('');

      const body = rows.map((row) => {
        const cells = (row.cells || []).map((pick) => `<div class="cpu-recap-cell">${magnetHtml(pick)}</div>`).join('');
        return `<div class="cpu-recap-row"><div class="cpu-recap-rn">${esc(String(row.round))}</div>${cells}</div>`;
      }).join('');

      mount.innerHTML = `
        <section class="official-draft-desk lounge-section is-mock draft-results-page" aria-label="Draft results">
          <div class="cpu-recap-title">Fantasy Draft Board</div>
          <div class="cpu-recap-board" style="--mock-seats:${cols.length}">
            <div class="cpu-recap-row is-head">
              <div class="cpu-recap-rn" aria-hidden="true"></div>
              ${heads}
            </div>
            ${body}
          </div>
        </section>`;
      requestAnimationFrame(() => fitMagnetLastName(mount));
    }

    window.addEventListener('resize', () => {
      fitMagnetLastName(document.getElementById('draft-mount'));
    });

    async function loadDraft() {
      const mount = document.getElementById('draft-mount');
      mount.innerHTML = `<div class="msg">Loading draft board…</div>`;
      try {
        const qs = new URLSearchParams({ conference: activeConf });
        if (activeSeason) qs.set('season', activeSeason);
        const res = await fetch(`/api/draft?${qs}`, { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not load draft');
        if (data.season) activeSeason = String(data.season);
        renderBoard(data);
      } catch (err) {
        renderBoard({ ok: false, error: err.message || 'Could not load draft' });
      }
    }

    async function bootDraft() {
      try {
        const authRes = await fetch('/api/auth', { cache: 'no-store', credentials: 'same-origin' });
        const auth = await authRes.json().catch(() => ({}));
        if (auth?.leagueScope?.scope === 'aaa' || activeConf === 'aaa') {
          CONFS = [{ key: 'aaa', label: 'AAA' }];
          activeConf = 'aaa';
          const url = new URL(location.href);
          url.searchParams.set('conference', 'aaa');
          history.replaceState({}, '', url);
        } else if (!GI_CONFS.some((c) => c.key === activeConf)) {
          activeConf = 'detail';
        }
      } catch {
        if (!GI_CONFS.some((c) => c.key === activeConf) && activeConf !== 'aaa') {
          activeConf = 'detail';
        }
      }
      renderTabs();
      await loadDraft();
    }

    bootDraft();
  </script>
</body>
</html>
