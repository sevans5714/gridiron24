<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Forgot Password · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=10" />
  <style>
    body.login-page {
      min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #000;
    }
    .card {
      width: min(100%, 18rem); padding: 1rem; animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    h1 {
      margin: 0 0 0.4rem; font-family: var(--display); font-size: 1.1rem; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .sub { margin: 0 0 1rem; color: rgba(255,255,255,0.55); font-size: 0.85rem; line-height: 1.4; }
    label {
      display: block; margin-bottom: 0.28rem; font-family: var(--display); font-size: 0.68rem;
      font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.72);
    }
    input {
      width: 100%; padding: 0.45rem 0.65rem; border: 1px solid rgba(255,255,255,0.18);
      background: #0d0d0d; color: #fff; font-size: 0.88rem; margin-bottom: 0.75rem;
    }
    input:focus { outline: none; border-color: rgba(255,255,255,0.4); }
    button {
      width: 100%; padding: 0.55rem; border: 1px solid #fff; background: #fff; color: #050505;
      font-family: var(--display); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer;
    }
    button:hover:not(:disabled) { background: transparent; color: #fff; }
    button:disabled { opacity: 0.55; }
    .msg, .err {
      display: none; margin: 0 0 0.7rem; padding: 0.45rem 0.6rem; font-size: 0.78rem; line-height: 1.35;
    }
    .msg { border: 1px solid rgba(34,197,94,0.35); background: rgba(34,197,94,0.08); color: #86efac; }
    .err { border: 1px solid rgba(239,68,68,0.35); background: rgba(239,68,68,0.08); color: #fca5a5; }
    .msg.show, .err.show { display: block; }
    .links { margin-top: 0.9rem; text-align: center; font-size: 0.78rem; color: rgba(255,255,255,0.55); }
    .links a { color: rgba(255,255,255,0.85); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="login-page">
  <form class="card" id="form">
    <h1>Forgot Password</h1>
    <p class="sub">Enter the email on your account. We’ll send a reset link if it matches.</p>
    <div class="err" id="err" role="alert"></div>
    <div class="msg" id="msg" role="status"></div>
    <label for="email">Email</label>
    <input id="email" type="email" required autofocus autocomplete="email" />
    <button type="submit" id="submit">Send Reset Link</button>
    <p class="links"><a href="/enter">Back to sign in</a></p>
  </form>
  <script>
    const form = document.getElementById('form');
    const errEl = document.getElementById('err');
    const msgEl = document.getElementById('msg');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.remove('show');
      msgEl.classList.remove('show');
      submit.disabled = true;
      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Request failed');
        let text = data.message || 'Check your email for a reset link.';
        if (data.devResetUrl) text += ` Dev link: ${data.devResetUrl}`;
        msgEl.textContent = text;
        msgEl.classList.add('show');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
