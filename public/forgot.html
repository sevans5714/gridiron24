<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Forgot Password · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=146" />
  <link rel="icon" href="/favicon.ico?v=146" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=146" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=146" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=183" />
</head>
<body class="auth-page">
  <img class="auth-crest" src="/assets/gridiron24-crest.png?v=10" alt="GridIron 24" width="1024" height="1024" />
  <form class="auth-card" id="form">
    <h1 class="auth-title">Forgot Password</h1>
    <p class="auth-help">Enter your login name or the email on your account. We’ll send a reset link to that email. The link expires in one hour.</p>
    <div class="status-note err" id="err" role="alert"></div>
    <div class="status-note ok" id="msg" role="status"></div>
    <label class="field-label" for="identifier">Login name or email</label>
    <input class="field" id="identifier" type="text" required autofocus autocomplete="username" />
    <button class="btn" type="submit" id="submit">Send Reset Link</button>
    <p class="auth-links"><a href="/enter">Back to sign in</a></p>
  </form>
  <p class="auth-legal">
    <strong>GridIron 24</strong> is an independent fantasy football league headquarters.
    Not affiliated with the NFL, ESPN, or any professional sports league.
  </p>
  <script>
    const form = document.getElementById('form');
    const errEl = document.getElementById('err');
    const msgEl = document.getElementById('msg');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.remove('show');
      msgEl.classList.remove('show');
      submit.disabled = true;
      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: document.getElementById('identifier').value.trim() })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Request failed');
        let text = data.message || 'Check your email for a reset link.';
        if (data.devResetUrl) text += ` Dev link: ${data.devResetUrl}`;
        msgEl.textContent = text;
        msgEl.classList.add('show');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
