<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=135" />
  <link rel="icon" href="/favicon.ico?v=135" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=135" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=135" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=180" />
  <style>
    .team-hero { margin-bottom: 1.5rem; }
    .team-hero h1 { margin: 0; }
    .team-hero .meta { margin-top: 0.35rem; color: var(--muted); }
    .layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 2rem; }
    .section-head h2 { margin: 0 0 0.75rem; font-family: var(--display); letter-spacing: 0.06em; text-transform: uppercase; font-size: 1.1rem; }
    :root {
      --mock-qb: #ff6b6b;
      --mock-rb: #3dd68c;
      --mock-wr: #5b9dff;
      --mock-te: #c084fc;
      --mock-k: #f5b942;
      --mock-dst: #94a3b8;
      --mock-flex: #2dd4bf;
      --mock-bn: #64748b;
    }
    .slot-roster { list-style: none; margin: 0; padding: 0; }
    .slot-roster-divider {
      margin: 1rem 0 0.45rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--line);
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .slot-roster-row {
      display: grid;
      grid-template-columns: 2.75rem minmax(0, 1fr) auto;
      gap: 0.65rem 0.85rem;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--line);
    }
    .slot-roster-row:last-child { border-bottom: 0; }
    .slot-roster-row .slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.35rem;
      padding: 0.2rem 0.35rem;
      border-radius: 0.3rem;
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #061018;
      background: var(--mock-bn);
    }
    .slot-roster-row .slot[data-pos="QB"] { background: var(--mock-qb); }
    .slot-roster-row .slot[data-pos="RB"] { background: var(--mock-rb); }
    .slot-roster-row .slot[data-pos="WR"] { background: var(--mock-wr); }
    .slot-roster-row .slot[data-pos="TE"] { background: var(--mock-te); }
    .slot-roster-row .slot[data-pos="K"] { background: var(--mock-k); }
    .slot-roster-row .slot[data-pos="D/ST"],
    .slot-roster-row .slot[data-pos="DST"] { background: var(--mock-dst); color: #0b1220; }
    .slot-roster-row .slot[data-pos="FLEX"] { background: var(--mock-flex); }
    .slot-roster-row .slot[data-pos="BN"],
    .slot-roster-row .slot[data-pos="IR"] { background: var(--mock-bn); color: #e8eef8; }
    .slot-roster-row .nm { min-width: 0; font-weight: 600; }
    .slot-roster-row .nm .pro {
      display: block;
      margin-top: 0.15rem;
      font-weight: 500;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .slot-roster-row.is-empty .nm { color: var(--muted); font-weight: 500; }
    .slot-roster-row.row-bad { background: rgba(196, 90, 48, 0.08); }
    .slot-roster-row.row-keeper {
      background: rgba(239, 215, 130, 0.1);
      box-shadow: inset 3px 0 0 #efd782;
      padding-left: 0.55rem;
    }
    .inj {
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .inj.bad { color: #e8a078; }
    .inj.ok { color: var(--muted); }
    .keeper-tag {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.12rem 0.4rem;
      border: 1px solid rgba(239, 215, 130, 0.55);
      color: #efd782;
      font-family: var(--display);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      vertical-align: middle;
    }
    .empty { color: var(--muted); padding: 0.5rem 0; }
    .game { padding: 0.55rem 0; border-bottom: 1px solid var(--line); color: var(--text); }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } .team-hero img { width: 4.5rem; height: 4.5rem; } }
  </style>
</head>
<body data-page="teams">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Team</div>
    </div>
  </header>
  <main class="page-main shell" id="main"><div class="msg">Loading team…</div></main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=180"></script>
  <script>
    const esc = (v = '') => String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const params = new URLSearchParams(location.search);
    const conference = params.get('conference');
    const teamId = params.get('teamId');
    function record(t) {
      return Number(t.ties||0) > 0 ? `${t.wins}-${t.losses}-${t.ties}` : `${t.wins}-${t.losses}`;
    }
    (async () => {
      const main = document.getElementById('main');
      if (!conference || !teamId) {
        main.innerHTML = `<div class="msg">Missing team. <a href="/teams.html">Back to teams</a></div>`;
        return;
      }
      try {
        const res = await fetch(`/api/team?conference=${encodeURIComponent(conference)}&teamId=${encodeURIComponent(teamId)}`, { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load team');
        const t = data.team;
        const roster = t.roster || [];
        const lineup = (t.lineup && t.lineup.length)
          ? t.lineup
          : roster.filter((p) => p.empty || !['Bench', 'IR', 'IR/Covid', 'IR/COVID'].includes(String(p.slot || '')));
        const bench = (t.bench && t.bench.length)
          ? t.bench
          : roster.filter((p) => p.name && ['Bench', 'IR', 'IR/Covid', 'IR/COVID'].includes(String(p.slot || '')));
        const keeperId = data.keeper ? Number(data.keeper.playerId) : null;
        document.title = conference === 'aaa'
          ? `${t.name} · AAA League`
          : `${t.name} · GridIron 24`;
        const backHref = '/team-rosters.html';
        const backLabel = 'Team Rosters';
        const slotPosLabel = (slot) => {
          const s = String(slot || '');
          if (s === 'Bench') return 'BN';
          if (s.startsWith('IR')) return 'IR';
          return s || '—';
        };
        const injClass = (status, slot) => {
          const s = String(status || '').toUpperCase();
          const starter = !['Bench', 'IR', 'IR/Covid', 'IR/COVID'].includes(String(slot || ''));
          if (!s || s === 'ACTIVE') return starter ? 'ok' : 'ok';
          if (['OUT', 'DOUBTFUL', 'IR', 'INJURY_RESERVE', 'INJURED_RESERVE'].includes(s)) return 'bad';
          return 'ok';
        };
        const rowHtml = (p) => {
          const empty = p.empty || !p.name;
          const status = empty ? '—' : (p.injuryStatus || '—');
          const isKeeper = !empty && keeperId != null && Number(p.id) === keeperId;
          const bad = !empty && injClass(p.injuryStatus, p.slot) === 'bad' && !['Bench', 'IR', 'IR/Covid', 'IR/COVID'].includes(String(p.slot || ''));
          const pos = slotPosLabel(p.slot);
          const rowClass = [empty ? 'is-empty' : '', bad ? 'row-bad' : '', isKeeper ? 'row-keeper' : ''].filter(Boolean).join(' ');
          return `<li class="slot-roster-row ${rowClass}">
            <span class="slot" data-pos="${esc(pos)}">${esc(pos)}</span>
            <span class="nm">${empty ? '—' : esc(p.name)}${isKeeper ? '<span class="keeper-tag">Keeper</span>' : ''}
              ${empty ? '' : `<span class="pro">${esc(p.position || '—')}</span>`}
            </span>
            <span class="inj ${bad ? 'bad' : 'ok'}">${esc(status)}</span>
          </li>`;
        };
        const keeperNote = data.keeper
          ? `<p class="empty" style="margin:0 0 0.75rem;color:#efd782;">${esc(String(data.keeperWindow?.forSeason || ''))} keeper: ${esc(data.keeper.playerName)} · costs Round ${esc(String(data.keeper.costRound))}</p>`
          : '';
        main.innerHTML = `
          <p style="margin:0 0 0.75rem;"><a href="${esc(backHref)}" style="color:#8eb6ff;text-decoration:none;">← ${esc(backLabel)}</a></p>
          <div class="team-hero">
            <div>
              <h1>${window.GridIronTitle.html(t.name, { size: 'xl' })}</h1>
              <div class="meta">${esc(data.conference.shortName)} · ${esc(record(t))} · PF ${Number(t.pointsFor||0).toFixed(1)}${t.playoffSeed ? ` · Seed #${t.playoffSeed}` : ''}</div>
              <div class="meta">Manager: ${esc(t.owner||'—')}</div>
            </div>
          </div>
          <div class="layout">
            <section>
              <div class="section-head"><h2>Roster</h2></div>
              ${keeperNote}
              <ul class="slot-roster" role="list">
                ${lineup.map(rowHtml).join('')}
                ${bench.length ? `<li class="slot-roster-divider" aria-hidden="true">Bench / IR</li>${bench.map(rowHtml).join('')}` : ''}
              </ul>
            </section>
            <section>
              <div class="section-head"><h2>Recent matchups</h2></div>
              ${(data.recentMatchups||[]).length ? data.recentMatchups.map(m => `
                <div class="game">Wk ${esc(m.week)} · ${esc(m.away?.name)} ${Number(m.away?.score||0).toFixed(1)} – ${Number(m.home?.score||0).toFixed(1)} ${esc(m.home?.name)}</div>
              `).join('') : `<div class="empty">No scored matchups yet.</div>`}
            </section>
          </div>`;
        window.GridIronNav?.setSync(`Updated · ${new Date(data.generatedAt).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`);
      } catch (err) {
        main.innerHTML = `<div class="msg">${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
