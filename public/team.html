<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=61" />
  <style>
    .team-hero { display: flex; align-items: center; gap: 1.1rem; margin-bottom: 1.5rem; }
    .team-hero img {
      width: 6rem;
      height: 6rem;
      object-fit: contain;
      background: transparent;
      border: 0;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .team-hero h1 { margin: 0; font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.3rem); letter-spacing: 0.04em; text-transform: uppercase; }
    .team-hero .meta { margin-top: 0.35rem; color: var(--muted); }
    .layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 2rem; }
    .section-head h2 { margin: 0 0 0.75rem; font-family: var(--display); letter-spacing: 0.06em; text-transform: uppercase; font-size: 1.1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.45rem 0.35rem; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase; }
    .slot { color: #8eb6ff; font-weight: 700; font-size: 0.82rem; width: 3.5rem; }
    .inj {
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .inj.bad { color: #e8a078; }
    .inj.ok { color: var(--muted); }
    .row-bad td { background: rgba(196, 90, 48, 0.08); }
    .empty { color: var(--muted); padding: 0.5rem 0; }
    .game { padding: 0.55rem 0; border-bottom: 1px solid var(--line); color: var(--text); }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } .team-hero img { width: 4.5rem; height: 4.5rem; } }
  </style>
</head>
<body data-page="teams">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Team</div>
    </div>
  </header>
  <main class="page-main shell" id="main"><div class="msg">Loading team…</div></main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-brand">GridIron 24</span> created by S.Evans</span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=37"></script>
  <script>
    const esc = (v = '') => String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const params = new URLSearchParams(location.search);
    const conference = params.get('conference');
    const teamId = params.get('teamId');
    function record(t) {
      return Number(t.ties||0) > 0 ? `${t.wins}-${t.losses}-${t.ties}` : `${t.wins}-${t.losses}`;
    }
    (async () => {
      const main = document.getElementById('main');
      if (!conference || !teamId) {
        main.innerHTML = `<div class="msg">Missing team. <a href="/teams.html">Back to teams</a></div>`;
        return;
      }
      try {
        const res = await fetch(`/api/team?conference=${encodeURIComponent(conference)}&teamId=${encodeURIComponent(teamId)}`, { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load team');
        const t = data.team;
        document.title = `${t.name} · GridIron 24`;
        const roster = (t.roster||[]);
        const injClass = (status, slot) => {
          const s = String(status || '').toUpperCase();
          const starter = !['Bench', 'IR'].includes(slot);
          if (!s || s === 'ACTIVE') return starter ? 'ok' : 'ok';
          if (['OUT', 'DOUBTFUL', 'IR', 'INJURY_RESERVE', 'INJURED_RESERVE'].includes(s)) return 'bad';
          return 'ok';
        };
        main.innerHTML = `
          <p style="margin:0 0 0.75rem;"><a href="/teams.html" style="color:#8eb6ff;text-decoration:none;">← All teams</a></p>
          <div class="team-hero">
            <img src="${esc(t.logo||'/assets/team-logo-placeholder.svg')}" alt="" />
            <div>
              <h1>${esc(t.name)}</h1>
              <div class="meta">${esc(data.conference.shortName)} · ${esc(record(t))} · PF ${Number(t.pointsFor||0).toFixed(1)}${t.playoffSeed ? ` · Seed #${t.playoffSeed}` : ''}</div>
              <div class="meta">Manager: ${esc(t.owner||'—')}</div>
            </div>
          </div>
          <div class="layout">
            <section>
              <div class="section-head"><h2>Roster</h2></div>
              ${roster.length ? `<table><thead><tr><th>Slot</th><th>Player</th><th>Pos</th><th>Status</th></tr></thead><tbody>
                ${roster.map(p => {
                  const status = p.injuryStatus || '—';
                  const bad = injClass(p.injuryStatus, p.slot) === 'bad' && !['Bench', 'IR'].includes(p.slot);
                  return `<tr class="${bad ? 'row-bad' : ''}"><td class="slot">${esc(p.slot)}</td><td>${esc(p.name)}</td><td>${esc(p.position)}</td><td class="inj ${bad ? 'bad' : 'ok'}">${esc(status)}</td></tr>`;
                }).join('')}
              </tbody></table>` : `<div class="empty">No roster yet — opens after the draft.</div>`}
            </section>
            <section>
              <div class="section-head"><h2>Recent matchups</h2></div>
              ${(data.recentMatchups||[]).length ? data.recentMatchups.map(m => `
                <div class="game">Wk ${esc(m.week)} · ${esc(m.away?.name)} ${Number(m.away?.score||0).toFixed(1)} – ${Number(m.home?.score||0).toFixed(1)} ${esc(m.home?.name)}</div>
              `).join('') : `<div class="empty">No scored matchups yet.</div>`}
            </section>
          </div>`;
        window.GridIronNav?.setSync(`ESPN sync · ${new Date(data.generatedAt).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`);
      } catch (err) {
        main.innerHTML = `<div class="msg">${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
