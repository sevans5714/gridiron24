<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Sign In · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=55" />
</head>
<body class="auth-page">
  <form class="auth-card wide" id="login-form" autocomplete="on">
    <img class="auth-crest hero" src="/assets/login-crest.png" alt="GridIron 24" width="1024" height="1024" />
    <div class="auth-fields">
      <div class="status-note err" id="err" role="alert"></div>
      <label class="field-label" for="loginName">Login Name</label>
      <input class="field" id="loginName" name="loginName" type="text" required autofocus autocomplete="username" />
      <label class="field-label" for="password">Password</label>
      <input class="field" id="password" name="password" type="password" required autocomplete="current-password" />
      <label class="auth-remember">
        <input id="remember" type="checkbox" />
        <span>Save credentials</span>
      </label>
      <button class="btn" type="submit" id="submit">Sign In</button>
      <p class="auth-links">
        <a href="/register">Need an invite to join</a><br />
        <a href="/forgot">Forgot password?</a><br />
        <a href="/register-league">Register a new league</a>
      </p>
    </div>
  </form>
  <p class="auth-legal">
    <strong>GridIron 24</strong> is an independent fantasy football league headquarters.
    Not affiliated with the NFL, ESPN, or any professional sports league.
    All team names and logos are property of their respective owners.
  </p>
  <script>
    const STORAGE_KEY = 'gi24.savedLogin';
    const errEl = document.getElementById('err');
    const form = document.getElementById('login-form');
    const submit = document.getElementById('submit');
    const rememberInput = document.getElementById('remember');
    const loginInput = document.getElementById('loginName');
    const passwordInput = document.getElementById('password');
    const next = new URLSearchParams(window.location.search).get('next') || '/home.html';

    function showErr(msg) {
      errEl.textContent = msg || '';
      errEl.classList.toggle('show', Boolean(msg));
    }
    function setBusy(on) {
      submit.disabled = on;
      loginInput.disabled = on;
      passwordInput.disabled = on;
      rememberInput.disabled = on;
    }
    function readSaved() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data?.loginName || !data?.password) return null;
        return data;
      } catch { return null; }
    }
    function writeSaved(loginName, password) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ loginName, password }));
    }
    function clearSaved() { localStorage.removeItem(STORAGE_KEY); }

    async function login(loginName, password) {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ loginName, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || 'Sign in failed');
      return data;
    }
    async function checkExisting() {
      const res = await fetch('/api/auth', { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (data.authenticated) {
        window.location.replace(next);
        return true;
      }
      return false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showErr('');
      const loginName = loginInput.value.trim();
      const password = passwordInput.value;
      setBusy(true);
      try {
        await login(loginName, password);
        if (rememberInput.checked) writeSaved(loginName, password);
        else clearSaved();
        window.location.href = next;
      } catch (err) {
        showErr(err.message);
        setBusy(false);
      }
    });

    (async () => {
      // Fresh logout: never auto-sign back in from saved credentials.
      const params = new URLSearchParams(window.location.search);
      if (params.get('logout') === '1') {
        clearSaved();
        rememberInput.checked = false;
        params.delete('logout');
        const clean = params.toString();
        history.replaceState({}, '', clean ? `/enter?${clean}` : '/enter');
      }

      if (await checkExisting()) return;
      const saved = readSaved();
      if (!saved) return;
      // Prefill only — do not auto-login (that made Log Out bounce straight back in).
      loginInput.value = saved.loginName;
      passwordInput.value = saved.password;
      rememberInput.checked = true;
    })();
  </script>
</body>
</html>
