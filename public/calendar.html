<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar · GridIron 24 &amp; AAA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=135" />
  <link rel="icon" href="/favicon.ico?v=135" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png?v=135" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=135" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=180" />
  <style>
    .event { display:grid; grid-template-columns: 7.5rem 1fr; gap: 1rem; padding: 0.95rem 0; border-bottom: 1px solid var(--line); }
    .when { font-family: var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: #8eb6ff; }
    .title { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .title-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .title-row img {
      width: 2.75rem;
      height: auto;
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }
    .type { display:inline-block; margin-top:0.25rem; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color: var(--muted); }
    .notes { margin-top: 0.35rem; color: var(--muted); line-height: 1.45; }
    @media (max-width: 560px) { .event { grid-template-columns: 1fr; gap: 0.35rem; } }
  </style>
</head>
<body data-page="calendar">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Calendar</div>
    </div>
  </header>
  <section class="page-hero shell">
    <h1>Calendar</h1>
    <p style="margin:0.35rem 0 0;color:var(--muted);max-width:36rem;line-height:1.45;">One calendar for GridIron 24 and AAA League.</p>
  </section>
  <main class="page-main shell" id="list"><div class="msg">Loading calendar…</div></main>
  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-logo"><img class="site-footer-mark" src="/assets/gridiron24-brand.png?v=3" alt="GridIron 24" width="64" height="64" decoding="async" /></span><span class="site-footer-by"><span class="site-footer-label">Created by</span><span class="site-footer-author">S.EVANS</span></span></span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>
  <script src="/js/nav.js?v=180"></script>
  <script>
    const esc = (v='') => String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    function eventMark(e) {
      const type = String(e.type || '').toLowerCase();
      const title = String(e.title || '').toLowerCase();
      if (type === 'survival' || title.includes('mayor')) {
        return `<img src="/assets/mayors-cup.png?v=7" alt="" width="1024" height="768" />`;
      }
      if (type === 'bowl' || (title.includes('bowl') && !title.includes('aaa'))) {
        return `<img src="/assets/gridiron-bowl.png?v=7" alt="" />`;
      }
      if (type === 'aaa' || title.includes('aaa')) {
        return `<img src="/assets/aaa-league.png?v=7" alt="" width="256" height="256" />`;
      }
      return '';
    }
    function fmtDate(d) {
      if (!d) return 'TBD';
      try { return new Date(d+'T12:00:00').toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' }); }
      catch { return d; }
    }
    (async () => {
      try {
        const res = await fetch('/api/calendar', { cache: 'no-store' });
        const data = await res.json();
        const events = data.events || [];
        document.getElementById('list').innerHTML = events.length ? events.map(e => `
          <article class="event">
            <div class="when">${esc(fmtDate(e.date))}</div>
            <div>
              <div class="title-row">
                ${eventMark(e)}
                <div class="title">${esc(e.title)}</div>
              </div>
              <div class="type">${esc(e.type)}</div>
              ${e.notes ? `<div class="notes">${esc(e.notes)}</div>` : ''}
            </div>
          </article>`).join('') : `<div class="msg">No events yet.</div>`;
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="msg">${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
