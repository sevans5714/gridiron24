<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar · GridIron 24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=20" />
  <style>
    .event { display:grid; grid-template-columns: 7.5rem 1fr; gap: 1rem; padding: 0.95rem 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .when { font-family: var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: #8eb6ff; }
    .title { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .type { display:inline-block; margin-top:0.25rem; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:#9a9a9a; }
    .notes { margin-top: 0.35rem; color: #b0b0b0; line-height: 1.45; }
    @media (max-width: 560px) { .event { grid-template-columns: 1fr; gap: 0.35rem; } }
  </style>
</head>
<body data-page="calendar">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Calendar</div>
    </div>
  </header>
  <section class="page-hero shell">
    <p class="eyebrow">Season roadmap</p>
    <h1>Calendar</h1>
    <p>Draft, dues, deadlines, and GridIron Bowl I.</p>
  </section>
  <main class="page-main shell" id="list"><div class="msg">Loading calendar…</div></main>
  <footer class="shell">ESPN remains the system of record for drafts, rosters, scoring, and transactions.</footer>
  <script src="/js/nav.js?v=11"></script>
  <script>
    const esc = (v='') => String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    function fmtDate(d) {
      if (!d) return 'TBD';
      try { return new Date(d+'T12:00:00').toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' }); }
      catch { return d; }
    }
    (async () => {
      try {
        const res = await fetch('/api/calendar', { cache: 'no-store' });
        const data = await res.json();
        const events = data.events || [];
        document.getElementById('list').innerHTML = events.length ? events.map(e => `
          <article class="event">
            <div class="when">${esc(fmtDate(e.date))}</div>
            <div>
              <div class="title">${esc(e.title)}</div>
              <div class="type">${esc(e.type)}</div>
              ${e.notes ? `<div class="notes">${esc(e.notes)}</div>` : ''}
            </div>
          </article>`).join('') : `<div class="msg">No events yet.</div>`;
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="msg">${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
