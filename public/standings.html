<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Standings · GridIron 24</title>
  <meta name="description" content="24 Teams. Two Conferences. One Champion. GridIron 24 fantasy football league headquarters." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/site.css?v=61" />
  <style>
    .section {
      padding: 1.75rem 0 0;
    }

    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .board {
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .board-head {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.55rem;
      padding: 0.75rem 1rem 0.7rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .board-head.detail { border-left: 4px solid var(--detail); }
    .board-head.overtime { border-left: 4px solid var(--overtime); }

    .board-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .conf-logo {
      width: clamp(3.5rem, 8vw, 5rem);
      height: auto;
      display: block;
      flex: 0 0 auto;
      filter: none;
      box-shadow: var(--logo-lift);
    }

    .board-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .board-head.detail h2,
    .board-head.detail .board-admin-name { color: var(--detail); }
    .board-head.overtime h2,
    .board-head.overtime .board-admin-name { color: var(--overtime); }

    .board-admin {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.55rem;
      align-self: center;
      max-width: 100%;
      margin: 0 auto;
      padding: 0.15rem 0.15rem 0.15rem 0.75rem;
      border-left: 2px solid transparent;
      text-align: left;
    }
    .board-head.detail .board-admin {
      border-left-color: rgba(255, 122, 24, 0.7);
    }
    .board-head.overtime .board-admin {
      border-left-color: rgba(226, 35, 42, 0.7);
    }
    .board-admin-name {
      margin: 0;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .board-admin-role {
      margin: 0;
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .board-head .meta {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 500;
      letter-spacing: 0;
    }

    .standings { width: 100%; }

    .row {
      display: grid;
      grid-template-columns:
        1.75rem
        minmax(0, 2.8fr)
        minmax(0, 0.75fr)
        1.85rem
        1.85rem
        1.85rem
        minmax(2.4rem, 0.32fr)
        minmax(2.4rem, 0.32fr);
      gap: 0.35rem 0.5rem;
      align-items: center;
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }

    .row:last-child { border-bottom: 0; }

    .row.head {
      background: var(--panel-2);
      color: var(--muted);
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .row.body:hover { background: var(--row-hover); }
    .row.out { opacity: 0.72; }

    .cut-line {
      display: grid;
      grid-template-columns: 1fr;
      padding: 0.35rem 0.9rem;
      border-top: 2px solid rgba(47, 109, 255, 0.75);
      border-bottom: 1px solid var(--line);
      background: rgba(47, 109, 255, 0.08);
      font-family: var(--display);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8eb6ff;
      text-align: center;
    }
    .cut-line.relegation {
      border-top-color: rgba(196, 90, 48, 0.85);
      background: rgba(196, 90, 48, 0.1);
      color: #e8a078;
    }
    .row.body.relegation-zone { opacity: 0.78; }

    .row .num { text-align: right; }
    .row .center { text-align: center; }

    .rank {
      text-align: center;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 600;
      color: #cfcfcf;
      letter-spacing: 0;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .standings .team-logo-sm {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.4rem;
    }

    .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0;
      flex: 1;
    }

    .owner {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 400;
    }

    .wl {
      font-family: var(--display);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .pts {
      font-family: var(--display);
      font-size: 0.88rem;
      font-weight: 600;
      color: #d0d0d0;
      letter-spacing: 0;
    }

    @media (max-width: 1100px) {
      .row {
        grid-template-columns:
          1.7rem
          minmax(0, 1fr)
          1.85rem
          1.85rem
          1.85rem
          minmax(2.4rem, 0.35fr)
          minmax(2.4rem, 0.35fr);
      }
      .col-owner { display: none; }
    }

    @media (max-width: 980px) {
      .boards { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns:
          1.4rem
          minmax(0, 1fr)
          1.6rem
          1.6rem
          minmax(2.1rem, 0.35fr);
        padding: 0.55rem 0.55rem;
        gap: 0.3rem 0.35rem;
      }
      .standings .team-logo-sm { width: 2rem; height: 2rem; }
      .col-owner,
      .col-ties,
      .col-pa { display: none; }
      .board-head h2 { font-size: 1.1rem; }
      .conf-logo { width: 3.25rem; }
    }

    .aaa-divider {
      margin: 2.75rem 0 0;
      padding: 2.25rem 0 0;
      border-top: 1px solid var(--line);
      position: relative;
    }
    .aaa-divider::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: min(12rem, 40%);
      height: 3px;
      background: linear-gradient(90deg, transparent, #efd782, transparent);
    }
    .aaa-intro {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 1.25rem 1.5rem;
      align-items: center;
      margin: 0 0 1.35rem;
      max-width: 48rem;
    }
    .aaa-crest {
      width: clamp(5.5rem, 14vw, 7.5rem);
      height: auto;
      display: block;
      background: transparent;
      filter: none;
      box-shadow: var(--logo-lift);
    }
    .aaa-intro .eyebrow {
      margin: 0 0 0.25rem;
      font-family: var(--body);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .aaa-intro h2 {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #efd782;
    }
    .aaa-intro p {
      margin: 0;
      color: var(--muted);
      font-size: var(--fs-sm);
      line-height: 1.45;
      max-width: 36rem;
    }
    .aaa-promotee {
      margin: 0 0 1rem;
      padding: 0.95rem 1.1rem;
      border: 1px solid rgba(239, 215, 130, 0.35);
      background:
        radial-gradient(ellipse at 15% 30%, rgba(239,215,130,0.12), transparent 65%),
        var(--panel);
      max-width: 48rem;
    }
    .aaa-promotee .label {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #efd782;
    }
    .aaa-promotee .who {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .aaa-promotee img {
      width: 2.75rem;
      height: 2.75rem;
      object-fit: contain;
      box-shadow: var(--logo-lift);
    }
    .aaa-promotee .nm {
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .board.aaa .board-head {
      border-left: 4px solid #efd782;
    }
    .board.aaa .board-head h2 { color: #efd782; }
    .board.aaa .conf-logo {
      background: transparent;
    }
    .aaa-payouts {
      margin-top: 1rem;
      max-width: 48rem;
      color: var(--muted);
      font-size: var(--fs-sm);
      line-height: 1.5;
    }
    .aaa-payouts strong { color: var(--text); }
    .aaa-prize-list {
      margin: 0.55rem 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.25rem;
    }
    .aaa-prize-list li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--line);
    }
    .aaa-prize-list li:last-child { border-bottom: 0; }
    .aaa-prize-list .amt {
      font-family: var(--display);
      font-weight: 700;
      color: #efd782;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .aaa-intro {
        grid-template-columns: 1fr;
        justify-items: start;
      }
    }
  </style>
</head>
<body data-page="standings">
  <header class="topbar">
    <div class="shell topbar-inner">
      <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      <div class="sync" id="lastUpdated">Connecting to ESPN…</div>
    </div>
  </header>

  <section class="page-hero shell reveal">
    <p class="eyebrow">Live Boards</p>
    <h1>Standings</h1>
  </section>

  <main class="page-main shell">
    <section class="section" style="padding-top:0">
      <div class="boards">
        <div class="board" id="detail"></div>
        <div class="board" id="overtime"></div>
      </div>

      <section class="aaa-divider" id="aaa" aria-labelledby="aaa-heading">
        <div class="aaa-intro">
          <img class="aaa-crest" src="/assets/aaa-league.png" alt="AAA Fantasy Football League" width="120" height="120" decoding="async" />
          <div>
            <p class="eyebrow">Feeder League</p>
            <h2 id="aaa-heading">AAA League</h2>
            <p>Affiliated standings and next-season promotee. Roster size is set by interest (10–14 teams). Not a third GridIron 24 conference.</p>
          </div>
        </div>
        <div id="aaa-promotee"></div>
        <div class="boards" style="grid-template-columns: minmax(0, 48rem);">
          <div class="board aaa" id="aaa-board"><div class="msg">Loading AAA League…</div></div>
        </div>
        <div id="aaa-payouts" class="aaa-payouts"></div>
      </section>
    </section>
  </main>

  <footer class="shell site-footer">
    <span class="site-footer-credit"><span class="site-footer-brand">GridIron 24</span> created by S.Evans</span>
    <span class="site-footer-build" id="site-build">Build …</span>
  </footer>

  <script src="/js/nav.js?v=38"></script>
  <script>
    const escapeHtml = (value = '') => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    function fmtPts(value) {
      return Number(value || 0).toFixed(1);
    }

    function money(amount, currency = 'USD') {
      if (amount == null || amount === '') return 'TBD';
      try {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency,
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(amount));
      } catch {
        return `$${Number(amount).toFixed(2)}`;
      }
    }

    function confLogo(key, name) {
      const src = key === 'detail'
        ? '/assets/detail-conference.png'
        : '/assets/overtime-conference.png';
      return `<img class="conf-logo" src="${src}" alt="${escapeHtml(name)}" width="80" height="80" decoding="async" />`;
    }

    function boardHead(conf) {
      const tone = conf.key === 'detail' ? 'detail' : 'overtime';
      const week = conf.currentMatchupPeriod != null ? ` · Week ${conf.currentMatchupPeriod}` : '';
      const admin = conf.admin
        ? `<div class="board-admin">
            <div class="board-admin-name">${escapeHtml(conf.admin)}</div>
            <div class="board-admin-role">Conference Admin</div>
          </div>`
        : '';
      return `
        <div class="board-head ${tone}">
          <div class="board-brand">
            ${confLogo(conf.key, conf.name)}
            <div>
              <h2>${escapeHtml(conf.name)}</h2>
              <div class="meta">ESPN ${conf.leagueId}${week}</div>
            </div>
          </div>
          ${admin}
        </div>`;
    }

    function conferenceMarkup(conf) {
      if (!conf.ok) {
        return `
          ${boardHead(conf)}
          <div class="msg">
            <strong>ESPN connection failed</strong>
            ${escapeHtml(conf.error || 'Unknown error')}
          </div>`;
      }

      const teams = conf.teams || [];
      if (!teams.length) {
        return `
          ${boardHead(conf)}
          <div class="msg">No teams have joined this conference yet.</div>`;
      }

      const rows = [];
      const lastRank = teams.length;
      teams.forEach((team, index) => {
        const rank = index + 1;
        if (rank === 7) {
          rows.push(`<div class="cut-line">Playoff cut · places 7–12 out · tiebreaker: points for</div>`);
        }
        if (lastRank > 1 && rank === lastRank) {
          rows.push(`<div class="cut-line relegation">Relegation line · last place (PF tiebreaker) → Toilet Bowl</div>`);
        }
        const zoneClass = [
          rank > 6 ? 'out' : '',
          rank === lastRank ? 'relegation-zone' : ''
        ].filter(Boolean).join(' ');
        rows.push(`
          <div class="row body ${zoneClass}">
            <div class="rank">${rank}</div>
            <div class="team">
              <img class="team-logo-sm" src="${escapeHtml(team.logo || '/assets/team-logo-placeholder.svg')}" alt="" width="40" height="40" loading="lazy" referrerpolicy="no-referrer" />
              <div class="name" title="${escapeHtml(team.name)}">${escapeHtml(team.name)}</div>
            </div>
            <div class="owner col-owner" title="${escapeHtml(team.owner)}">${escapeHtml(team.owner)}</div>
            <div class="num wl">${team.wins || 0}</div>
            <div class="num wl">${team.losses || 0}</div>
            <div class="num wl col-ties">${team.ties || 0}</div>
            <div class="num pts">${fmtPts(team.pointsFor)}</div>
            <div class="num pts col-pa">${fmtPts(team.pointsAgainst)}</div>
          </div>`);
      });
      const rowsHtml = rows.join('');

      return `
        ${boardHead(conf)}
        <div class="standings">
          <div class="row head">
            <div class="center">#</div>
            <div>Team</div>
            <div class="col-owner">Owner</div>
            <div class="num">W</div>
            <div class="num">L</div>
            <div class="num col-ties">T</div>
            <div class="num">PF</div>
            <div class="num col-pa">PA</div>
          </div>
          ${rowsHtml}
        </div>`;
    }

    function renderAaa(data) {
      const board = document.getElementById('aaa-board');
      const promoteeMount = document.getElementById('aaa-promotee');
      const payoutsMount = document.getElementById('aaa-payouts');
      const crest = document.querySelector('.aaa-crest');
      if (crest && data.logo) crest.src = data.logo;

      const champ = data.champion || data.promotee;
      promoteeMount.innerHTML = champ
        ? `<div class="aaa-promotee">
            <p class="label">Promotes to GridIron 24 next season</p>
            <div class="who">
              <img src="${escapeHtml(champ.logo || '/assets/team-logo-placeholder.svg')}" alt="" />
              <div class="nm">${escapeHtml(champ.name)}</div>
            </div>
          </div>`
        : '';

      const p = data.payouts;
      if (p) {
        const prizes = (p.prizes || []).map((prize) => `
          <li><span>${escapeHtml(prize.label)}</span><span class="amt">${money(prize.amount, p.currency)}</span></li>`).join('');
        const rosterLabel = escapeHtml(p.teamCountLabel || (p.teamCount != null ? String(p.teamCount) : '10–14 (interest)'));
        const poolLabel = p.pool != null
          ? money(p.pool, p.currency)
          : `${money(p.poolMin, p.currency)}–${money(p.poolMax, p.currency)}`;
        payoutsMount.innerHTML = `
          <p><strong>${money(p.buyInPerTeam, p.currency)}</strong> buy-in · <strong>${rosterLabel}</strong> teams ·
          <strong>${poolLabel}</strong> prize pool</p>
          ${prizes ? `<ul class="aaa-prize-list">${prizes}</ul>` : ''}
          ${p.notes ? `<p style="margin-top:0.65rem;">${escapeHtml(p.notes)}</p>` : ''}`;
      } else {
        payoutsMount.innerHTML = '';
      }

      if (!data.configured) {
        board.innerHTML = `
          <div class="board-head aaa">
            <div class="board-brand">
              <img class="conf-logo" src="${escapeHtml(data.logo || '/assets/aaa-league.png')}" alt="AAA League" width="80" height="80" decoding="async" />
              <div>
                <h2>${escapeHtml(data.name || 'AAA League')}</h2>
                <div class="meta">Feeder league · ESPN ID pending</div>
              </div>
            </div>
          </div>
          <div class="msg">${escapeHtml(data.message || 'AAA standings unlock when the ESPN league ID is configured.')}</div>`;
        return;
      }

      if (!data.ok) {
        board.innerHTML = `
          <div class="board-head aaa">
            <div class="board-brand">
              <img class="conf-logo" src="${escapeHtml(data.logo || '/assets/aaa-league.png')}" alt="AAA League" width="80" height="80" decoding="async" />
              <div>
                <h2>${escapeHtml(data.name || 'AAA League')}</h2>
                <div class="meta">ESPN ${escapeHtml(String(data.espnLeagueId || '—'))}</div>
              </div>
            </div>
          </div>
          <div class="msg"><strong>ESPN connection failed</strong>${escapeHtml(data.error || 'Unknown error')}</div>`;
        return;
      }

      const teams = data.teams || [];
      const rows = teams.map((team, index) => `
        <div class="row body">
          <div class="rank">${index + 1}</div>
          <div class="team">
            <img class="team-logo-sm" src="${escapeHtml(team.logo || '/assets/team-logo-placeholder.svg')}" alt="" width="40" height="40" loading="lazy" referrerpolicy="no-referrer" />
            <div class="name" title="${escapeHtml(team.name)}">${escapeHtml(team.name)}</div>
          </div>
          <div class="owner col-owner" title="${escapeHtml(team.owner || '')}">${escapeHtml(team.owner || '—')}</div>
          <div class="num wl">${team.wins || 0}</div>
          <div class="num wl">${team.losses || 0}</div>
          <div class="num wl col-ties">${team.ties || 0}</div>
          <div class="num pts">${fmtPts(team.pointsFor)}</div>
          <div class="num pts col-pa">${fmtPts(team.pointsAgainst)}</div>
        </div>`).join('');

      board.innerHTML = `
        <div class="board-head aaa">
          <div class="board-brand">
            <img class="conf-logo" src="${escapeHtml(data.logo || '/assets/aaa-league.png')}" alt="AAA League" width="80" height="80" decoding="async" />
            <div>
              <h2>${escapeHtml(data.name || 'AAA League')}</h2>
              <div class="meta">${escapeHtml(data.espnLeagueName || `ESPN ${data.espnLeagueId || ''}`)}${data.teamCount ? ` · ${data.teamCount} teams` : ''}</div>
            </div>
          </div>
        </div>
        <div class="standings">
          <div class="row head">
            <div class="center">#</div>
            <div>Team</div>
            <div class="col-owner">Owner</div>
            <div class="num">W</div>
            <div class="num">L</div>
            <div class="num col-ties">T</div>
            <div class="num">PF</div>
            <div class="num col-pa">PA</div>
          </div>
          ${rows || '<div class="msg">No teams yet.</div>'}
        </div>`;
    }

    async function loadAaa() {
      try {
        const res = await fetch('/api/aaa', { cache: 'no-store' });
        const data = await res.json();
        renderAaa(data);
      } catch (error) {
        document.getElementById('aaa-board').innerHTML =
          `<div class="msg"><strong>AAA error</strong>${escapeHtml(error.message)}</div>`;
      }
    }

    async function load() {
      document.getElementById('detail').innerHTML = '<div class="msg">Loading Detail Conference…</div>';
      document.getElementById('overtime').innerHTML = '<div class="msg">Loading Overtime Conference…</div>';

      try {
        const response = await fetch('/api/leagues', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        const data = await response.json();

        for (const conf of data.conferences) {
          const target = document.getElementById(conf.key);
          if (target) target.innerHTML = conferenceMarkup(conf);
        }

        const time = new Date(data.generatedAt);
        if (window.GridIronNav) {
          window.GridIronNav.setSync(`ESPN sync · ${time.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
        } else {
          document.getElementById('lastUpdated').innerHTML =
            `<span class="live">●</span>ESPN sync · ${time.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
        }
      } catch (error) {
        if (window.GridIronNav) window.GridIronNav.setSync('Connection error', false);
        else document.getElementById('lastUpdated').textContent = 'Connection error';
        const msg = `<div class="msg"><strong>Dashboard error</strong>${escapeHtml(error.message)}</div>`;
        document.getElementById('detail').innerHTML = msg;
        document.getElementById('overtime').innerHTML = msg;
      }

      await loadAaa();
    }

    load();
    setInterval(load, 60_000);
  </script>
</body>
</html>
