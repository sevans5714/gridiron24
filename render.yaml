services:
  - type: web
    name: gridiron24
    runtime: node
    # Starter required for persistent disk (accounts, news, calendar, rankings).
    plan: starter
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: gridiron24-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: "/var/data"
      - key: COMMISSIONER_LOGIN
        value: "sevans"
      - key: COMMISSIONER_EMAIL
        value: "sevans5714@gmail.com"
      - key: AAA_ADMIN_LOGIN
        value: "sevans-aaa"
      - key: AAA_ADMIN_EMAIL
        value: "sevans5714+aaa@gmail.com"
      - key: APP_BASE_URL
        value: "https://www.gridiron24.com"
      - key: COMMISSIONER_PASSWORD
        sync: false
      - key: AAA_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WRAP_EMAIL_MODE
        value: "all"

  # Sportsbook settle runs in-process on the web service (every 3 min).
  # Do not add a Render cron for it — failed ticks emailed "server crashed"
  # every 5 minutes.

  - type: cron
    name: gridiron24-weekly-wrap
    runtime: node
    plan: starter
    region: ohio
    schedule: "0 14 * * 2"
    buildCommand: npm install
    startCommand: node scripts/run-cron.js /api/cron/weekly-wrap
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_BASE_URL
        value: "https://gridiron24.onrender.com"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: gridiron24-rules-sync
    runtime: node
    plan: starter
    region: ohio
    # Mondays and Thursdays at 14:00 UTC (~10am ET)
    schedule: "0 14 * * 1,4"
    buildCommand: npm install
    startCommand: node scripts/run-cron.js /api/cron/rules-sync
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_BASE_URL
        value: "https://gridiron24.onrender.com"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: gridiron24-roster-violations
    runtime: node
    plan: starter
    region: ohio
    # Daily 14:00 UTC (~10am ET) — pre-kickoff scan of injured starters
    schedule: "0 14 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron.js /api/cron/roster-violations
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_BASE_URL
        value: "https://gridiron24.onrender.com"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: gridiron24-death-pool-news
    runtime: node
    plan: starter
    region: ohio
    # Daily 13:00 UTC (~9am ET) — celebrity / sports / pop / politics death headlines
    schedule: "0 13 * * *"
    buildCommand: npm install
    startCommand: "node scripts/run-cron.js /api/cron/death-pool-news?force=1"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_BASE_URL
        value: "https://gridiron24.onrender.com"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: gridiron24-roster-violations-q1
    runtime: node
    plan: starter
    region: ohio
    # Every 10 min during NFL game windows (UTC): Sun slate, SNF, MNF, TNF.
    # Endpoint no-ops unless at least one NFL game is in the 1st quarter.
    schedule: "*/10 0-3,16-23 * * 0,1,2,4,5"
    buildCommand: npm install
    startCommand: "node scripts/run-cron.js /api/cron/roster-violations?when=first-quarter"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_BASE_URL
        value: "https://gridiron24.onrender.com"
      - key: CRON_SECRET
        sync: false
