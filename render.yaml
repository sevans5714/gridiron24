services:
  - type: web
    name: gridiron24
    runtime: node
    # Starter required for persistent disk (accounts, news, calendar, rankings).
    plan: starter
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: gridiron24-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: "/var/data"
      - key: COMMISSIONER_LOGIN
        value: "sevans"
      - key: COMMISSIONER_EMAIL
        value: "sevans5714@gmail.com"
      - key: AAA_ADMIN_LOGIN
        value: "sevans-aaa"
      - key: AAA_ADMIN_EMAIL
        value: "sevans5714+aaa@gmail.com"
      - key: APP_BASE_URL
        value: "https://www.gridiron24.com"
      - key: COMMISSIONER_PASSWORD
        sync: false
      - key: AAA_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WRAP_EMAIL_MODE
        value: "all"

  # Scheduled jobs (weekly wrap, rules sync, roster violations, death-pool
  # news) run in-process on the web service. Do not add Render cron jobs —
  # a failed tick emails "Exited with status 1" even when the site is up.
