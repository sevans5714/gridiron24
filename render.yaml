services:
  - type: web
    name: gridiron24
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: COMMISSIONER_LOGIN
        value: "sevans"
      - key: COMMISSIONER_EMAIL
        value: "sevans5714@gmail.com"
      - key: APP_BASE_URL
        value: "https://www.gridiron24.com"
      # Optional: set in the Render Dashboard so the commissioner account survives free-tier wipes.
      - key: COMMISSIONER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
