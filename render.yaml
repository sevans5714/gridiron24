services:
  - type: web
    name: gridiron24
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LEAGUE_NAME
        value: "4to12"
      - key: COMMISSIONER_LOGIN
        value: "sevans"
      - key: COMMISSIONER_EMAIL
        value: "sevans5714@gmail.com"
      - key: APP_BASE_URL
        value: "https://www.gridiron24.com"
      # Optional overrides in the Render Dashboard. Bootstraps recreate after free-tier wipes.
      - key: LEAGUE_PASSWORD
        sync: false
      - key: COMMISSIONER_PASSWORD
        sync: false
